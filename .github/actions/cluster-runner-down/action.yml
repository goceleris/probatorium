name: Cluster runner down
description: >-
  Mints a removal-token from the GitHub API, joins the tailnet as an
  ephemeral Tailscale node, then SSH-driven ansible: (0) COLLECTS
  post-hoc host forensics and the host-sampler series into an uploaded
  artifact, before anything is reclaimed; (0b) RESCUES the in-flight
  results off tmpfs to persistent storage so a lost run can still be
  resumed, and turns the purge below OFF when it cannot; (1) drives
  cleanup.yml to reclaim ALL cluster host state — docker containers +
  their anonymous volumes, bench/results dirs, and the manifest
  ownership lock; (2)
  kills every Runner.Listener, de-registers from GitHub, and rm -rf's
  /tmp/actions-runner-<host>/; (3) sweeps orphan offline runner
  registrations. Pristine.

  Pair with cluster-runner-up/. Designed to run as a teardown job
  with `if: always()` so cluster state is cleaned up even when the
  middle (matrix) job failed, was cancelled, or the SUT runner DIED
  with the host (the in-band `mage Cleanup` cannot run in that case —
  this off-cluster job is the host-failure-survivable reclamation
  path). Every reclamation step is `if: always()` so one failing step
  does not skip the others.

inputs:
  tailscale-oauth-client-id:
    description: Tailscale OAuth client ID.
    required: true
  tailscale-oauth-secret:
    description: Tailscale OAuth client secret.
    required: true
  tailscale-tags:
    description: Tailscale tags applied to the ephemeral node.
    required: false
    default: tag:ci
  gh-runner-pat:
    description: GitHub PAT used to mint the removal token.
    required: true
  repo-url:
    description: Repository URL the runner registered with.
    required: false
    default: https://github.com/${{ github.repository }}
  repo-owner-and-name:
    description: owner/repo for the removal-token API call.
    required: false
    default: ${{ github.repository }}
  inventory-path:
    description: Path to the ansible inventory.
    required: false
    default: ansible/inventory.yml
  forensics-reason:
    description: >-
      Free-form label recorded in the forensics capture, normally the
      outcome of the matrix job (`needs.matrix.result`). It is what tells
      a later reader whether they are looking at the aftermath of a clean
      run or of a lost runner.
    required: false
    default: unspecified
  forensics-window-hours:
    description: >-
      How far back the journal captures reach. The default is 6h because
      a lost runner is noticed within minutes and a whole-boot kernel log
      is both uninformative and too large to upload.
    required: false
    default: "6"
  collect-forensics:
    description: >-
      Set to "false" to skip the forensics capture entirely. Provided as
      an escape hatch; there is no reason to use it on a tier run.
    required: false
    default: "true"
  rescue-results:
    description: >-
      Set to "false" to skip the results rescue and purge results_root the
      way the teardown did before probatorium#376. Provided as an escape
      hatch; there is no reason to use it on a tier run.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Join tailnet (ephemeral)
      uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
      with:
        oauth-client-id: ${{ inputs.tailscale-oauth-client-id }}
        oauth-secret:    ${{ inputs.tailscale-oauth-secret }}
        tags:            ${{ inputs.tailscale-tags }}
        version:         latest

    - name: Install ansible-core + ansible.posix collection
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends ansible-core
        # cleanup.yml (driven below) uses ansible.posix.sysctl, which ansible-core
        # does NOT bundle. Provision it explicitly so the off-cluster reclamation
        # is deterministic regardless of what the runner image happens to ship.
        # This is NOT the self-hosted runners' provisioning: runner-setup.yml pins
        # ansible.posix, caches it and falls back to its GitHub source. This is a
        # plain install on the GitHub-hosted image, which carries ansible.posix.
        # Installs to ~/.ansible/collections, already on ansible's default path.
        ansible-galaxy collection install ansible.posix

    - name: Configure SSH
      shell: bash
      env:
        SSH_KEY: ${{ env.CLUSTER_SSH_KEY }}
      run: |
        if [ -z "${SSH_KEY}" ]; then
          echo "::error::CLUSTER_SSH_KEY env var is empty — set it in the calling workflow"
          exit 1
        fi
        mkdir -p ~/.ssh
        printf '%s\n' "${SSH_KEY}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H msa2-server msa2-client msr1 >> ~/.ssh/known_hosts 2>/dev/null || true

    - name: Mint removal token
      id: remtoken
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-runner-pat }}
        REPO: ${{ inputs.repo-owner-and-name }}
      run: |
        TOKEN=$(gh api -X POST "/repos/${REPO}/actions/runners/remove-token" --jq .token)
        if [ -z "${TOKEN}" ] || [ "${TOKEN}" = "null" ]; then
          echo "::warning::Failed to mint removal token; teardown will skip the de-register step"
          TOKEN=""
        fi
        echo "::add-mask::${TOKEN}"
        echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

    # ------------------------------------------------------------------
    # FORENSICS FIRST (probatorium#354). This MUST precede both reclamation
    # steps below, because each destroys exactly what it collects:
    #
    #   cleanup.yml --extra-vars purge_results=true  rm -rf's results_root
    #   runner-teardown.yml                          rm -rf's the runner dir,
    #                                                taking runner.stdout,
    #                                                runner.stderr and _diag/
    #
    # The 24 h soak 34736980002 died at 20 h 05 m with "the self-hosted runner
    # lost communication with the server", and every in-band step died with
    # it. This job is the only thing that still ran — so this is the only
    # place the evidence can be taken from.
    #
    # It cannot disturb a run: ansible/forensics.yml and the script it drives
    # contain no kill, no signal, no systemctl start/stop/restart, no docker
    # and no rm, and the kernel ring buffer is only ever read.
    #
    # It cannot hang the job: the play bounds every SSH connect at 10 s and
    # every remote command at 90 s, the script bounds each command it runs
    # with `timeout`, and the outer `timeout 600` here is the backstop for
    # all of that.
    #
    # It cannot mask the real failure: the step never fails (the matrix job's
    # failure is the one that must stand), but nothing is swallowed either —
    # the exit status is annotated as a ::warning:: AND written into
    # collection-status.txt inside the artifact, next to ansible's own log.
    - name: Collect post-hoc host forensics (read-only, before any reclamation)
      if: always() && inputs.collect-forensics != 'false'
      shell: bash
      env:
        ANSIBLE_HOST_KEY_CHECKING: "False"
        FORENSICS_REASON: ${{ inputs.forensics-reason }}
        FORENSICS_WINDOW_HOURS: ${{ inputs.forensics-window-hours }}
        INVENTORY_PATH: ${{ inputs.inventory-path }}
      run: |
        mkdir -p forensics
        # The vars go in as a JSON file, not as `key=value` strings.
        # `--extra-vars "k=v"` is split on WHITESPACE, so a reason like
        # "matrix=failure (lost runner)" silently truncates to
        # "matrix=failure" and the rest is parsed as further variables.
        # Caught by the end-to-end simulation of this step; the file also
        # lands in the artifact, so what was asked for is on the record.
        python3 - <<'PY'
        import json, os
        json.dump({
            "forensics_local_dir": os.path.join(os.getcwd(), "forensics"),
            "forensics_window_hours": os.environ.get("FORENSICS_WINDOW_HOURS", "6"),
            "forensics_reason": os.environ.get("FORENSICS_REASON", "unspecified"),
        }, open("forensics/extra-vars.json", "w"), indent=2)
        PY
        set +e
        timeout -k 30 600 ansible-playbook \
          -i "${INVENTORY_PATH}" \
          ansible/forensics.yml \
          --extra-vars "@${PWD}/forensics/extra-vars.json" \
          > forensics/ansible-forensics.log 2>&1
        rc=$?
        set -e
        {
          echo "ansible-playbook ansible/forensics.yml"
          echo "rc: ${rc}"
          echo "reason: ${FORENSICS_REASON}"
          echo "window_hours: ${FORENSICS_WINDOW_HOURS}"
          echo "collected_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        } > forensics/collection-status.txt
        if [ "${rc}" -ne 0 ]; then
          echo "::warning::forensics collection exited ${rc} (a host may be unreachable); see the cluster-forensics artifact. Teardown continues."
        fi
        echo "--- collected ---"
        find forensics -type f -printf '%10s  %p\n' 2>/dev/null || ls -lR forensics

    - name: Upload cluster forensics
      if: always() && inputs.collect-forensics != 'false'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: cluster-forensics-${{ github.run_id }}-${{ github.run_attempt }}
        path: forensics/
        retention-days: 90
        # The whole point is the run where the matrix job produced nothing.
        # An empty capture must be a visible warning, never a failure that
        # displaces the real one.
        if-no-files-found: warn

    # RESCUE BEFORE THE PURGE (probatorium#376). The step below drives
    # cleanup.yml with purge_results=true, whose last task is `rm -rf
    # results_root` on every reachable host. results_root is tmpfs and holds
    # the ONLY thing a resumed run can read: the validate-results.json the
    # validator rewrites after every cell.
    #
    # That is what made the 20 h loss in probatorium#354 total. The forensics
    # capture above now lists those directories — and, until this step, the
    # same job deleted them a step later.
    #
    # It copies; it does not move. ops/rescue/celeris-rescue-results writes
    # only under rescue_root (real storage, because a reboot is one of the
    # hypotheses) and never touches results_root. When it cannot rescue a
    # reachable host, the playbook exits nonzero and the purge below is
    # turned OFF: a few MB left on a tmpfs is the cheaper mistake.
    - name: Rescue in-flight results off tmpfs (before anything is purged)
      id: rescue
      if: always() && inputs.rescue-results != 'false'
      shell: bash
      env:
        ANSIBLE_HOST_KEY_CHECKING: "False"
        RESCUE_LABEL: ${{ inputs.forensics-reason }}
        INVENTORY_PATH: ${{ inputs.inventory-path }}
      run: |
        mkdir -p rescued-results
        # Same reason as the forensics step: `--extra-vars "k=v"` splits on
        # whitespace, and the label carries spaces and parentheses.
        python3 - <<'PY'
        import json, os
        json.dump({
            "rescue_local_dir": os.path.join(os.getcwd(), "rescued-results"),
            "rescue_label": os.environ.get("RESCUE_LABEL", "unspecified"),
        }, open("rescued-results/extra-vars.json", "w"), indent=2)
        PY
        set +e
        timeout -k 30 900 ansible-playbook \
          -i "${INVENTORY_PATH}" \
          ansible/rescue-results.yml \
          --extra-vars "@${PWD}/rescued-results/extra-vars.json" \
          > rescued-results/ansible-rescue.log 2>&1
        rc=$?
        set -e
        {
          echo "ansible-playbook ansible/rescue-results.yml"
          echo "rc: ${rc}"
          echo "label: ${RESCUE_LABEL}"
          echo "rescued_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        } > rescued-results/rescue-status.txt
        if [ "${rc}" -ne 0 ]; then
          echo "purge_results=false" >> "$GITHUB_OUTPUT"
          echo "::warning::results rescue exited ${rc}; results_root will NOT be purged so the partial run survives on the host. See the cluster-rescued-results artifact."
        else
          echo "purge_results=true" >> "$GITHUB_OUTPUT"
        fi
        # The paths to hand back as `resume_from`, where a human will look.
        {
          echo "### Resume candidates"
          echo
          echo "Pass one of these as the tier workflow's \`resume_from\` input."
          echo
          echo '```'
          cat rescued-results/*/last-resume-from.txt 2>/dev/null || echo "(none — nothing resumable was rescued)"
          echo '```'
        } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
        echo "--- rescued ---"
        find rescued-results -type f -printf '%10s  %p\n' 2>/dev/null || ls -lR rescued-results

    - name: Upload rescued results
      if: always() && inputs.rescue-results != 'false'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: cluster-rescued-results-${{ github.run_id }}-${{ github.run_attempt }}
        path: rescued-results/
        retention-days: 90
        # On a run that finished normally there is nothing to rescue, and an
        # empty capture must be a visible warning rather than a failure that
        # displaces the real one.
        if-no-files-found: warn

    # KEYSTONE (2026-07-11 incident): reclaim ALL cluster host state — docker
    # volumes, bench_root, results, and the manifest ownership lock — from this
    # OFF-CLUSTER, always-run teardown job. The in-band `mage Cleanup` step runs
    # on the SUT runner and DIES WITH IT on a host wedge / SIGBUS / hard-cancel,
    # so it cannot be the only place reclamation happens. cleanup.yml is
    # idempotent ("safe to run any number of times").
    #
    # purge_results used to be an unconditional `true`, on the reasoning that
    # per-run results are already tar+fetched as CI artefacts. That holds only
    # when the matrix job finished: the run this teardown exists for is the one
    # where it did not, and where nothing was uploaded (probatorium#354). It is
    # now gated on the rescue above having copied results_root somewhere the
    # purge cannot reach.
    - name: Reclaim cluster host state (docker volumes / bench dirs / manifest)
      if: always()
      shell: bash
      env:
        ANSIBLE_HOST_KEY_CHECKING: "False"
        # purge_results is no longer an unconditional `true` (probatorium#376):
        # it is on only once the rescue step has copied results_root somewhere
        # the purge cannot reach. A skipped rescue (the escape hatch) keeps the
        # old behaviour; a FAILED one leaves the partial run on the host.
        PURGE_RESULTS: ${{ (inputs.rescue-results == 'false' && 'true') || steps.rescue.outputs.purge_results }}
      run: |
        ansible-playbook \
          -i ${{ inputs.inventory-path }} \
          ansible/cleanup.yml \
          --extra-vars "purge_results=${PURGE_RESULTS:-false}" \
          || echo "::warning::off-cluster cleanup.yml returned non-zero (a host may be unreachable); continuing teardown"

    - name: Run ansible runner-teardown
      if: always()
      shell: bash
      env:
        ANSIBLE_HOST_KEY_CHECKING: "False"
      run: |
        ansible-playbook \
          -i ${{ inputs.inventory-path }} \
          ansible/runner-teardown.yml \
          --extra-vars "gh_repo_url=${{ inputs.repo-url }}" \
          --extra-vars "gh_runner_remove_token=${{ steps.remtoken.outputs.token }}"

    - name: Sweep any orphan runner registrations
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-runner-pat }}
        REPO: ${{ inputs.repo-owner-and-name }}
      run: |
        # If a runner crashed before reaching the de-register step,
        # GH leaves it as "offline" in the API. Delete all
        # celeris-cluster runners that are offline so the next
        # cluster-runner-up starts from a clean slate.
        gh api "/repos/${REPO}/actions/runners" \
          --jq '.runners[] | select(.status=="offline" and (.labels | map(.name) | index("celeris-cluster"))) | .id' \
          | while read -r id; do
              echo "Sweeping orphan runner id=${id}"
              gh api -X DELETE "/repos/${REPO}/actions/runners/${id}" || true
            done
