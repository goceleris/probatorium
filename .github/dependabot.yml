version: 2
updates:
  # ----- Go modules -----
  # `directories:` (plural) lets a single ecosystem entry watch every
  # go.mod in the repo: root + every per-adapter sub-module under
  # servers/. Combined with `groups.*.patterns: "*"` all gomod bumps
  # collapse into ONE pull request per scheduled run — a daily x/net
  # bump produces a single PR touching every module instead of nine
  # racing PRs. Add a path here whenever a new go.mod lands in the
  # tree (run `find . -name go.mod` to verify coverage); the one
  # exception is .github/tools, which has its own entry below.
  - package-ecosystem: gomod
    directories:
      - /
      - /servers/celeris
      - /servers/chi
      - /servers/echo
      - /servers/fasthttp
      - /servers/fiber
      - /servers/gin
      - /servers/gnet
      - /servers/gorilla_ws
      - /servers/hertz
      - /servers/iris
      - /servers/nbio
      - /servers/stdhttp
      - /validation/properties/fieldguard
      - /validation/refapp/auth_jwt_csrf
      - /validation/refapp/auth_session_ratelimit
      - /validation/refapp/driver_memcached
      - /validation/refapp/driver_postgres
      - /validation/refapp/driver_redis
      - /validation/refapp/internal/debugvars
      - /validation/refapp/kitchen_sink
      - /validation/refapp/observability
      - /validation/refapp/static_swagger_proxy
    schedule:
      interval: daily
    groups:
      all-go-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps"

  # ----- CI tools module -----
  # .github/tools pins the mage and actionlint that the workflows run,
  # through its go.sum (probatorium#458). Go records every requirement
  # of a module that only holds `tool` directives as `// indirect`, the
  # two tool modules included. Version updates cover direct dependencies
  # only unless `allow` says otherwise, so without the rules below this
  # entry would never move the pins. The rules name each tool's module
  # with `dependency-type: all`. Dependabot then bumps it with `go get`,
  # which raises the other requirements only as far as the new release
  # itself requires. A bare `dependency-type: all` would also bump each
  # tool's dependencies past what its release was built with: today it
  # proposes go.yaml.in/yaml/v4 v4.0.0-rc.6, and actionlint v1.7.12 does
  # not compile against it. A new `tool` directive needs its module added
  # to this list. The rules are on this entry alone, so the modules above
  # keep the direct-only default.
  - package-ecosystem: gomod
    directory: /.github/tools
    allow:
      - dependency-name: github.com/magefile/mage
        dependency-type: all
      - dependency-name: github.com/rhysd/actionlint
        dependency-type: all
    schedule:
      interval: daily
    groups:
      ci-tools:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps"

  # ----- GitHub Actions -----
  # `/` covers every workflow under .github/workflows plus an action.yml
  # at the repository ROOT only — Dependabot does not descend into
  # .github/actions/ from there, so each composite action needs its own
  # path here or its SHA pin never moves (both composites sat unwatched
  # until 2026-09-06). Add a path whenever a new composite action lands
  # (run `ls .github/actions` to verify coverage). Group all action
  # version bumps into ONE PR per scheduled run.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/cluster-runner-up
      - /.github/actions/cluster-runner-down
    schedule:
      interval: daily
    groups:
      all-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "ci"

  # ----- Cargo (Rust adapters) -----
  # One entry per Cargo.toml; the `groups` block still collapses all
  # rust dep updates across the crates into ONE PR per run.
  # Competitor lockfiles are COMMITTED and installs are frozen, so these
  # PRs are the ONLY way an upstream competitor version reaches the bench
  # hosts. `major` is included deliberately: the bench is meant to track
  # upstream as-is, and with the lock in place a major bump arrives as a
  # reviewable PR that CI builds — instead of landing unannounced at
  # deploy time the way it did before 2026-08-13.
  - package-ecosystem: cargo
    directories:
      - /servers/actix
      - /servers/axum
      - /servers/hyper
      - /servers/ntex
    schedule:
      interval: daily
    groups:
      all-cargo-deps:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
    commit-message:
      prefix: "deps(cargo)"

  # ----- npm / bun adapters -----
  # Bun has no first-class dependabot ecosystem yet, but `npm` reads
  # the same package.json so the bumps land cleanly. The launchers run
  # under bun at execution time — this only touches the dependency
  # graph dependabot can already see.
  - package-ecosystem: npm
    directories:
      - /servers/bunraw
      - /servers/elysia
      - /servers/express
      - /servers/fastify
      - /servers/hono
      - /servers/uws
    schedule:
      interval: daily
    groups:
      all-js-deps:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
    commit-message:
      prefix: "deps(js)"

  # ----- Maven (JVM adapters) -----
  # Both poms already carry exact version pins and nothing bumps them at
  # deploy time, but until 2026-08-13 they were entirely unwatched — so a
  # pinned-and-forgotten version was the failure mode rather than an
  # unreviewed bump. Dependabot follows the ${vertx.version} / ${netty.version}
  # property indirection and also bumps BOM imports and plugin versions.
  - package-ecosystem: maven
    directories:
      - /servers/netty
      - /servers/vertx
    schedule:
      interval: daily
    groups:
      all-maven-deps:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
    commit-message:
      prefix: "deps(maven)"

  # ----- Manually-pinned upstreams (no Dependabot ecosystem exists) -----
  # These are pinned in-repo and bumped BY HAND — there is no manager for a
  # git clone inside an ansible task, for CMake, or for the .NET SDK:
  #   ansible/roles/cpp/defaults/main.yml   drogon_version + drogon_commit
  #   ansible/roles/c/defaults/main.yml     h2o_commit
  #   servers/lithium/CMakeLists.txt        LITHIUM_COMMIT + LITHIUM_SHA256
  #   ansible/roles/dotnet/                 .NET SDK channel (still floating)
  # servers/httpzig/build.zig.zon already pins by URL + content hash and
  # `zig build` fails on mismatch, so zig needs no entry.

  # ----- pip (Python adapters) -----
  # Both adapters pin via a hash-verified requirements.lock generated from
  # pyproject.toml; dependabot bumps the pyproject floors and the lock.
  - package-ecosystem: pip
    directories:
      - /servers/fastapi
      - /servers/starlette
    schedule:
      interval: daily
    groups:
      all-pip-deps:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
    commit-message:
      prefix: "deps(pip)"
