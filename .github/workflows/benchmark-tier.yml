name: Benchmark Tier

# Curated benchmark sweep on the cluster within a 24h budget
# (probatorium#172/#166/#167). Runs AFTER the Weekend Soak completes so it
# never contends for the cluster, plus a manual workflow_dispatch.
#
# Job graph: gate -> detect -> setup -> matrix -> teardown.
#   - gate:     only proceed after a SUCCESSFUL soak (workflow_run fires on
#               success AND failure); manual dispatch always passes.
#   - detect:   is the go.mod celeris pin newer than the newest benchmarked
#               version in the docs index.json? Cheap, ubuntu, no cluster.
#   - setup:    provision FRESH ephemeral cluster runners.
#   - matrix:   deploy -> mage BenchTier (curated matrix, both arches, xN
#               back-to-back when new release, publish run-1..run-N).
#   - teardown: retire the runners.
#
# Concurrency: shares the matrix-tier-cluster group with the PR / nightly /
# weekend tiers and cancel-in-progress:false, so it QUEUES behind the soak
# and never overlaps the cluster. (workflow_run also fires only after the
# soak fully completes, so the shared group is the real serialization
# guarantee; the trigger ordering is belt-and-braces.)
#
# Schedule / maintainer-owned: no cluster-ok label gate (the PR tier needs
# one; this never runs from an untrusted PR surface).

on:
  workflow_run:
    workflows: ["Weekend Soak"]
    types: [completed]
  workflow_dispatch:
    inputs:
      profile:
        description: "full | headline (default: full — every server × every scenario, capability-gated. headline is the ~3h smoke-test opt-in, never the silent default, because users asked repeatedly for \"no missing tests\" and got the curated subset instead.)"
        required: false
        type: string
        default: full
      force_new_release:
        description: force the N back-to-back release runs ("true"/"false")
        required: false
        type: string
        default: "false"

permissions:
  contents: read

concurrency:
  group: matrix-tier-cluster
  cancel-in-progress: false

env:
  CLUSTER_SSH_KEY: ${{ secrets.CLUSTER_SSH_KEY }}

jobs:
  gate:
    name: gate (soak success or manual)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Log trigger
        run: |
          echo "trigger=${{ github.event_name }}"
          echo "soak_conclusion=${{ github.event.workflow_run.conclusion }}"

  detect:
    name: detect new release
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is_new_release: ${{ steps.d.outputs.is_new_release }}
      version: ${{ steps.d.outputs.version }}
      newest_benchmarked: ${{ steps.d.outputs.newest_benchmarked }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          cache: true

      - name: Install mage
        run: |
          go install github.com/magefile/mage@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Detect release (go.mod pin vs docs index.json)
        id: d
        env:
          DOCS_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: mage DetectRelease >> "$GITHUB_OUTPUT"

  setup:
    name: bootstrap cluster runners
    needs: [gate, detect]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/cluster-runner-up
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          gh-runner-pat:             ${{ secrets.RUNNER_PAT }}
          wait-for-manifest-clear:   "true"
          # The soak just finished; give the cluster generous drain time.
          wait-timeout-seconds:      "3600"

  matrix:
    name: benchmark tier (amd64)
    needs: [detect, setup]
    runs-on: [self-hosted, celeris-cluster]
    # 72h ceiling: the full profile on one arch is ~58h, plus Deploy +
    # Cleanup. Well under GitHub's 5-day self-hosted job hard limit. This is
    # only a ceiling — the weekly headline run finishes in hours and exits
    # early. BENCH_BUDGET (below) is the real fail-loud projection gate.
    timeout-minutes: 4320
    env:
      BENCH_PROFILE: ${{ github.event.inputs.profile || 'full' }}
      IS_NEW_RELEASE: ${{ needs.detect.outputs.is_new_release }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          cache: true

      - name: Install mage
        # mage isn't in the root go.mod; install it into GOPATH/bin ahead
        # of every mage invocation. Cheap (~5s) and avoids `go run` which
        # needs mage in go.mod.
        run: |
          go install github.com/magefile/mage@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Use bootstrap-provisioned ansible
        # runner-setup.yml provisioned an ansible-core venv + collections
        # path under /tmp/actions-runner-<host>/. Writing GITHUB_PATH +
        # GITHUB_ENV here guarantees subsequent shells find ansible-playbook
        # and the collections it needs.
        run: |
          RUNNER_ROOT="/tmp/actions-runner-$(hostname -s)"
          echo "${RUNNER_ROOT}/ansible-venv/bin" >> "$GITHUB_PATH"
          echo "ANSIBLE_COLLECTIONS_PATH=${RUNNER_ROOT}/ansible-collections" >> "$GITHUB_ENV"

      - name: Configure cluster SSH
        # CLUSTER_USE_LAN=1 routes through the LACP fabric; the
        # CLUSTER_SSH_KEY private half lets ansible reach peer hosts;
        # PROBATORIUM_LOCAL_HOST switches inventory_hostname == self to
        # ansible_connection=local. See matrix-pr-tier.yml for the full
        # rationale.
        env:
          CLUSTER_SSH_KEY: ${{ secrets.CLUSTER_SSH_KEY }}
        run: |
          RUNNER_ROOT="/tmp/actions-runner-$(hostname -s)"
          mkdir -p "${RUNNER_ROOT}/.ssh"
          chmod 700 "${RUNNER_ROOT}/.ssh"
          printf '%s\n' "$CLUSTER_SSH_KEY" > "${RUNNER_ROOT}/.ssh/id_ed25519"
          chmod 600 "${RUNNER_ROOT}/.ssh/id_ed25519"
          {
            echo "ANSIBLE_PRIVATE_KEY_FILE=${RUNNER_ROOT}/.ssh/id_ed25519"
            echo "PROBATORIUM_LOCAL_HOST=$(hostname -s)"
            echo "CLUSTER_USE_LAN=1"
          } >> "$GITHUB_ENV"

      - name: mage Deploy (competitors + db services for the profile)
        env:
          # Bench needs the competitor binaries staged.
          DEPLOY_COMPETITORS: all
          # driver-* cells in the profile need postgres/redis/memcached.
          DEPLOY_NEEDS_DBSERVICES: "1"
        run: mage Deploy

      - name: mage BenchTier (curated matrix, both arches, xN, publish each run)
        env:
          CLUSTER_USE_LAN: "1"
          # amd64 only: msr1 (arm64) has a firmware bug that makes it
          # unusable as a BENCH target right now (validation still uses it).
          # Restore "both" once the arm64 host is fixed (and #168 ArchParallel
          # lands, or the budget/timeout below is re-checked for two arches).
          BENCH_TARGET: msa2-server
          # Manual full-matrix dispatch runs ~58h on one arch — raise the fit
          # budget above the 24h weekly default so BenchTier doesn't refuse it
          # (must stay under the job timeout-minutes above). The weekly
          # auto-run (workflow_run) leaves this unset and stays gated at 24h.
          BENCH_BUDGET: ${{ github.event_name == 'workflow_dispatch' && '70h' || '' }}
          DOCS_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          # N back-to-back run-K cells, each published. The AUTOMATIC
          # weekend trigger (workflow_run) does the full 3-pass release
          # protocol when a new release is detected. A MANUAL dispatch
          # defaults to a SINGLE published pass — so an operator can
          # de-risk the durable cluster path and review one pass before
          # committing to the multi-day run — and only goes 3-pass when
          # force_new_release=true explicitly asks for it. (Publishing is
          # NOT gated on pass count; every pass publishes either way.)
          # Orthogonal to BENCH_RUNS (the per-cell median basis).
          BENCH_BACK_TO_BACK: >-
            ${{ ((github.event_name == 'workflow_run' &&
                  needs.detect.outputs.is_new_release == 'true') ||
                 github.event.inputs.force_new_release == 'true') && '3' || '1' }}
        run: mage BenchTier

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-tier-results-${{ github.run_id }}
          path: results/
          retention-days: 90

      - name: mage Cleanup
        if: always()
        run: mage Cleanup

  teardown:
    name: teardown cluster runners
    needs: [setup, matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/cluster-runner-down
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          gh-runner-pat:             ${{ secrets.RUNNER_PAT }}
