name: Benchmark Tier

# Curated benchmark sweep on the cluster within a budget
# (probatorium#172/#166). Runs weekly on a schedule (Wednesday, the
# "headline" RATED profile) and on manual dispatch — e.g. the owner
# dispatching a release-grade `full` run. The bench ALWAYS runs exactly ONE
# pass; the multi-pass / back-to-back machinery and the new-release
# auto-trigger (workflow_run on "Weekend Soak") were removed. If more passes
# are wanted, more benchmarks are dispatched.
#
# PUBLISH POLICY (probatorium#229): only RATED profiles publish. `fast` is
# saturation-only and is pinned to BENCH_PUBLISH=0 — it exists for
# development and PR approval, never for the public dataset.
#
# Job graph: setup -> matrix -> teardown.
#   - setup:    provision FRESH ephemeral cluster runners.
#   - matrix:   deploy -> mage BenchTier (curated matrix, amd64, single
#               pass, publish run-1).
#   - teardown: retire the runners.
#
# Concurrency: shares the matrix-tier-cluster group with the PR / nightly /
# weekend tiers and cancel-in-progress:false, so it QUEUES behind any
# in-flight cluster job and never overlaps the cluster.
#
# Maintainer-owned: no cluster-ok label gate (the PR tier needs one; this
# never runs from an untrusted PR surface).

on:
  # PAUSED 2026-09-15 for the v1.6.0 release: the cluster is reserved
  # for release validation, and a scheduled run would evict or delay it
  # (every tier shares the matrix-tier-cluster concurrency group, which
  # keeps only ONE pending run). workflow_dispatch is deliberately left
  # working so the release sequence can still drive each tier by hand.
  # RESTORE by uncommenting the schedule block below. NOTE: a scheduled run has
  # no inputs, so every fallback applies: BENCH_PROFILE falls back to `full`
  # (not the `headline` the comment below describes), target=both, and the
  # default arch policy `all`: restoring the schedule would start a ~102h full
  # run every week. Set the profile for the schedule explicitly when restoring.
  #schedule:
  #  # Weekly RATED bench (the "headline" profile: full grid WITH the rated/SLO
  #  # sweep, 40s/12s → ~16.7h, fits the 24h cluster slot). Wednesday 04:00 UTC
  #  # keeps it clear of the weekend soak; the matrix-tier-cluster concurrency
  #  # group serializes anyway.
  #  #
  #  # Was the "fast" profile until 2026-08-13. fast is saturation-ONLY, so the
  #  # weekly kept publishing datasets with zero rated_mode_p99 / latency_at_slo
  #  # over the rated release data (v1.5.8: 20260716 rated vs 20260722/29/0805
  #  # fast) — progressively shadowing the very metric the rated mode exists to
  #  # produce. Published results must always carry rated data; see the publish
  #  # policy on BENCH_PUBLISH below.
  #  - cron: "0 4 * * 3"

  workflow_dispatch:
    inputs:
      profile:
        description: "headline (DEFAULT): the whole grid at a 40s/12s window plus the rated sweep on budget.RatedScenarios, projected ~30h on one arch (it measured ~53h before probatorium#418); on target=both under the default arch policy 'all' the arches take turns and it projects ~60h. | full: same grid at the exhaustive 90s/20s window, projected ~51h on one arch (it measured ~69h while every clean cell was rated, probatorium#418); on target=both under the default 'all' it projects ~102h. headline and full PUBLISH unless publish=false, but probatorium#441 and #442 gate any rated publish: until both land, dispatch them with publish=false. | fast: saturation-ONLY (rated OFF), 35s/10s — DEVELOPMENT / PR use only, NEVER publishes (forced BENCH_PUBLISH=0 regardless of the publish input)."
        required: false
        type: string
        default: headline
      target:
        description: "Bench SUT (BENCH_TARGET): 'both' (DEFAULT — msa2-server amd64 AND msr1 arm64, driven IN PARALLEL by the one msa2-client loadgen, under the arch lock of probatorium#442: by default the two arches take turns on the client, see arch_exclusive) | 'msa2-server' | 'msr1'."
        required: false
        type: string
        default: both

      competitors:
        description: "Adapter columns to BENCH (BENCH_COMPETITORS). 'all' (DEFAULT) runs the full grid; a CSV of registry slugs (e.g. 'httpzig,drogon,aspnet-h2') runs ONLY those columns — used to re-run the subset that DNF'd in a prior run without paying for the whole grid. Names must match servers.Registry."
        required: false
        type: string
        default: all
      deploy_competitors:
        description: "Binary set to BUILD+DEPLOY (DEPLOY_COMPETITORS). 'all' (DEFAULT). For a subset re-run set this to the underlying BINARY names — h2 columns share their h1 sibling's binary, so 'aspnet-h2' needs binary 'aspnet' (e.g. 'httpzig,drogon,aspnet,axum'). Must be the deploy-side names (nativeBuildSpecs/servers dirs), not column slugs."
        required: false
        type: string
        default: all
      publish:
        description: "Push results to the docs repo (BENCH_PUBLISH). 'true' (DEFAULT) publishes; 'false' produces data only (no docs push, no integrity gate) — use for a subset re-run that you compose + publish manually. Until probatorium#441 (per-pass achieved rate) and #442 (arch overlap) land, set 'false': no rated number can yet tell a slow server from load that was never sent. IGNORED when profile=fast: saturation-only data is never published."
        required: false
        type: string
        default: "true"
      baseline:
        description: "Also BENCH the celeris v1.5.11 RELEASE as same-run baseline columns (BENCH_BASELINE). 'false' (DEFAULT): the grid, the budget and the published set are exactly what they were. 'true': adds 8 columns baseline-celeris-v1511-<engine> for the engines epoll-h1-sync, epoll-h1-async, epoll-auto+upg-async, iouring-h1-sync, iouring-h1-async, iouring-auto+upg-async, adaptive-h1-async, adaptive-auto+upg-async (servers/celeris_v1511, celeris pinned at v1.5.11, same engine variants and capabilities as the celeris-* twins; no std-h1): +222 saturation cells and +120 rated cells per arch, about +14.5 h projected (+8.5 h headline), and the BENCH_BUDGET gate is raised (one arch: headline 48h, full 80h; under the arch policies the job's budget table has its own entries, and full with the baseline on both arches under 'all' is refused: 130h55m). With competitors=all the columns join the sweep, each one run directly beside its celeris-* twin (one column block, about 1.8 h, apart; the pair order alternates) rather than in the sorted block of names; with a CSV competitors/deploy_competitors, name the columns and the module celeris_v1511. Published rows carry framework 'celeris-baseline' / framework_version 'v1.5.11'."
        required: false
        type: string
        default: "false"
      sut_env:
        description: "SUT process environment overrides (BENCH_SUT_ENV): KEY=VALUE[,KEY=VALUE], e.g. 'CELERIS_IOURING_SEND_ZC=off' for a celeris#585 A/B arm. Merged OVER the harness's own PROBATORIUM_*/DOTNET_* vars on the bench target, echoed as the first line of every cell's server.log ('[sut-env] {...}') and recorded in results.json environment.sut_env. Keys [A-Za-z_][A-Za-z0-9_]*, values [A-Za-z0-9_./:@+=-]* (no quotes/whitespace); PATH and LD_* are refused. Default '' = no overrides."
        required: false
        type: string
        default: ""
      cells:
        description: "Cell glob(s) to bench (BENCH_CELLS) over '<scenario>/<competitor>', comma-separated, '!' prefix excludes — e.g. 'ws-large-echo/*,ws-echo/*,get-json/*' runs only those three scenarios on the columns `competitors` selects. Default '' = the profile's own full glob. NOTE: the budget projection still counts the profile's full grid (a scoped run passes it trivially), and one column pass still runs ONE mpstat/observer for all matched scenarios — read benchmarks[].scenario_resources (per-scenario window) rather than resources (column-wide mean) for per-cell CPU."
        required: false
        type: string
        default: ""
      rated_cells:
        description: "Cells that get the rated sweep (BENCH_RATED_CELLS): a glob over '<scenario>/<competitor>', comma-separated, '!' prefix excludes — e.g. 'ws-large-echo/*,post-4k/*'. Default '' = the budget model's rated cells (budget.RatedScenarios). Only matters when the profile rates (headline, full). Lets a scoped run rate a row the model does not, such as ws-large-echo for the probatorium#442 validation, without a throwaway branch."
        required: false
        type: string
        default: ""
      arch_exclusive:
        description: "Arch exclusion on target=both (BENCH_ARCH_EXCLUSIVE, probatorium#442): 'all' (DEFAULT when empty) = the arches never overlap (about twice the wall-clock: profile=full projects 101h55m, headline 59h41m; the validation read of 2026-10-21 found the heavy exemption of the light rows did not hold on arm64, docs/ARCH-EXCLUSION-VALIDATION.md; full with baseline=true projects 130h55m, above the 7200 minute job limit, and is refused by the setup job: run it as two single-arch dispatches, target=msa2-server and then target=msr1) | 'heavy' = a heavy cell of one arch never overlaps a heavy cell of the other (about +14% wall-clock; the previous default, which failed P6 on arm64: its documents are refused for publication, so it needs publish=false) | 'off' = the pre-fix concurrency, a control arm only: the publish gate refuses its documents. Ignored for a single-arch target."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: matrix-tier-cluster
  cancel-in-progress: false

jobs:
  setup:
    name: bootstrap cluster runners
    runs-on: ubuntu-latest
    # 25, not 15: the bootstrap fetches a 215 MiB actions-runner
    # tarball per host on a cold cache, and a slow-network day took
    # 13m05s of a 15-minute budget and cancelled the nightly
    # (probatorium#387). The cache added there removes the fetch from
    # every later run; this is the headroom for the first one.
    timeout-minutes: 25
    steps:
      - name: Validate dispatch inputs (before any runner is provisioned)
        # The budget and timeout tables below are indexed by these inputs; an
        # unknown or padded value (' all', 'Full', target=amd64) indexes nothing,
        # which GitHub renders as an empty timeout and BENCH_BUDGET, and would
        # also step around the refusal that follows. mage trims whitespace, the
        # tables do not, so a value must be exactly one of the allowed ones.
        # A policy heavy or off document is refused at publish (heavy: the validation
        # read of 2026-10-21, P6 failed on arm64; off: the arches overlap), so a
        # dispatch that would publish one fails here, not after the run: they need
        # publish=false (or a fast
        # profile, which never publishes, or a single-arch target, which ignores
        # the policy). workflow_arch_budget_test.go runs this script.
        env:
          IN_PROFILE: ${{ github.event.inputs.profile }}
          IN_TARGET: ${{ github.event.inputs.target }}
          IN_ARCH: ${{ github.event.inputs.arch_exclusive }}
          IN_BASELINE: ${{ github.event.inputs.baseline }}
          IN_PUBLISH: ${{ github.event.inputs.publish }}
        run: |
          fail=0
          check() {
            name=$1; val=$2; shift 2
            [ -z "$val" ] && return 0
            for ok in "$@"; do [ "$val" = "$ok" ] && return 0; done
            echo "::error::input $name=\"$val\" is not one of: $*"
            fail=1
          }
          check profile "$IN_PROFILE" fast headline full
          check target "$IN_TARGET" both msa2-server msr1
          check arch_exclusive "$IN_ARCH" all heavy off
          check baseline "$IN_BASELINE" true false
          publishes=1
          [ "${IN_PROFILE:-full}" = fast ] && publishes=0
          [ "$IN_PUBLISH" = false ] && publishes=0
          if { [ "$IN_ARCH" = heavy ] || [ "$IN_ARCH" = off ]; } && [ "${IN_TARGET:-both}" = both ] && [ "$publishes" = 1 ]; then
            echo "::error::arch_exclusive=$IN_ARCH on target=both would publish documents the publish gate refuses (policy heavy failed P6 on arm64, policy off lets the arches overlap; docs/ARCH-EXCLUSION-VALIDATION.md). Dispatch with publish=false, or use the default policy."
            fail=1
          fi
          [ "$fail" = 0 ] || exit 1

      - name: Refuse a grid the job cannot hold (full + baseline + both arches + policy all)
        # 130h55m projected (budget.FitWithin; the planner says 128.0h), above the
        # 7200 minute (5 day) job limit before Deploy and Cleanup: no BENCH_BUDGET
        # admits it and the job would be killed near the end of the run. FitWithin
        # refuses it too, but only after mage Deploy has built the baseline module.
        # This step is in the setup job, so it fails before any runner is
        # provisioned (the run itself has already entered the workflow's
        # matrix-tier-cluster concurrency group, so it may have queued behind a
        # running one). workflow_arch_budget_test.go keeps this condition equal
        # to the set the table cannot hold. Run it as two single-arch dispatches
        # (target=msa2-server, then target=msr1; 65h27m each). arch_exclusive=heavy
        # (74h37m) is not an alternative for a published run: heavy documents are
        # refused at publish.
        if: ${{ (github.event.inputs.target || 'both') == 'both' && (github.event.inputs.arch_exclusive || 'all') == 'all' && github.event.inputs.baseline == 'true' && (github.event.inputs.profile || 'full') == 'full' }}
        run: |
          echo "::error::profile=full with baseline=true on target=both under arch_exclusive=all projects 130h55m, above the 7200 minute job limit. Dispatch it as two single-arch runs: target=msa2-server, then target=msr1 (65h27m each)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cluster-runner-up
        # The composite reads env.CLUSTER_SSH_KEY to write the private
        # key for ansible. Scoped to this step (not the workflow) so no
        # other step's process tree ever sees the cluster key.
        env:
          CLUSTER_SSH_KEY: ${{ secrets.CLUSTER_SSH_KEY }}
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          gh-runner-pat:             ${{ secrets.RUNNER_PAT }}
          wait-for-manifest-clear:   "true"
          # Give any in-flight cluster job generous drain time.
          wait-timeout-seconds:      "3600"

  matrix:
    name: benchmark tier (amd64)
    needs: [setup]
    # Orchestrate from msr1 specifically: the ansible control loop + result
    # aggregation must NOT share a host with the SUT (bench_target=msa2-server)
    # or the loadgen (msa2-client), or its CPU/IO steals from the measurement.
    # msr1 (arm64) is BOTH the conductor and an arm64 SUT. The two arch passes
    # run IN PARALLEL (#168): distinct SUT hosts, every artefact keyed by
    # bench_target, sharing only the deliberately-oversized msa2-client loadgen
    # (measured ~40%/core of 32 and ~1.2 of 14 Gbit/s driving a single arch, so
    # far from the bottleneck that would contaminate either measurement).
    runs-on: [self-hosted, celeris-cluster, msr1]
    # Job ceiling, plus Deploy + Cleanup. Every full run up to v1.5.8 measured
    # ~69h single-pass because the runner rated every clean cell (~770 of 813,
    # probatorium#418); with the rated sweep scoped to the model's 401 cells the
    # full profile projects ~51h and headline ~30h. Well under GitHub's 5-day
    # self-hosted job hard limit. This is only a ceiling. BENCH_BUDGET (below)
    # is the real fail-loud projection gate.
    # The default arch policy is `all` (probatorium#442, the arches take turns):
    # profile=full projects ~102h, which no 6600 min (110h) ceiling holds, so
    # `all` gets 7080 min (118h), under the 7200 min (5 day) limit. Keyed by the
    # policy like BENCH_BUDGET (below); a single-arch target takes no lock and
    # indexes `single`, never a policy (workflow_arch_budget_test.go).
    timeout-minutes: ${{ fromJSON('{"heavy":6600,"off":6600,"single":6600,"all":7080}')[(github.event.inputs.target || 'both') != 'both' && 'single' || github.event.inputs.arch_exclusive || 'all'] }}
    env:
      BENCH_PROFILE: ${{ github.event.inputs.profile || 'full' }}
      # Job-level so BOTH `mage Deploy` and `mage BenchTier` see it. Deploy uses
      # it to scope its ansible --limit; without that an amd64-only bench still
      # CONNECTED to the arm64 host, and unrelated maintenance there aborted a
      # 34h run at 63% (2026-08-27). Both arches run in parallel (#168).
      BENCH_TARGET: ${{ github.event.inputs.target || 'both' }}
      # Column subset to BENCH for a targeted re-run; 'all' on schedule/default.
      BENCH_COMPETITORS: ${{ github.event.inputs.competitors || 'all' }}
      # Rated scope and arch exclusion (probatorium#442). Empty = the defaults
      # (the model's rated cells; the default policy all). Job-level like BENCH_TARGET.
      BENCH_RATED_CELLS: ${{ github.event.inputs.rated_cells || '' }}
      BENCH_ARCH_EXCLUSIVE: ${{ github.event.inputs.arch_exclusive || '' }}
      # Binary/module set to BUILD+DEPLOY. MUST be job-level (not just the
      # Deploy step): BenchTier runs an internal auto-deploy when no manifest
      # is present (always true right after the prior run's Cleanup), and that
      # auto-deploy falls back to BENCH_COMPETITORS — which is column slugs
      # (e.g. 'aspnet-h2') that Deploy rejects. Pinning the module names here
      # (e.g. 'aspnet') makes both the explicit Deploy step AND the auto-deploy
      # use them. h2 columns reuse their h1 sibling's binary, so this set
      # differs from BENCH_COMPETITORS.
      DEPLOY_COMPETITORS: ${{ github.event.inputs.deploy_competitors || 'all' }}
      # Opt-in same-run baseline: the celeris v1.5.11 release as extra columns
      # (servers/baseline.go). Job-level so BOTH `mage Deploy` (builds the
      # celeris_v1511 module only when on) and `mage BenchTier` (column set and
      # budget projection) see it. Empty = off = the routine grid.
      BENCH_BASELINE: ${{ github.event.inputs.baseline == 'true' && '1' || '' }}
      # SUT environment overrides for an A/B arm (celeris#585). Empty on
      # schedule and by default; mage Bench validates the format and forwards
      # it to ansible as bench_sut_env, run_bench_cell.yml merges it into the
      # server process and echoes it into server.log.
      BENCH_SUT_ENV: ${{ github.event.inputs.sut_env || '' }}
      # Cell-glob restriction (celeris#585). Empty = the profile's own glob
      # (mage_tier.go setBenchEnvFromProfile honours a non-blank preset the
      # same way it honours BENCH_DURATION / BENCH_WARMUP).
      BENCH_CELLS: ${{ github.event.inputs.cells || '' }}
      # PUBLISH POLICY. Two rules, in order:
      #
      #   1. profile=fast NEVER publishes — full stop, regardless of the
      #      `publish` input. fast is saturation-only (rated OFF), so its
      #      datasets carry no rated_mode_p99 / latency_at_slo. Publishing
      #      them shadowed the rated release data on the docs site with
      #      strictly-less-informative numbers (v1.5.8: the rated 20260716
      #      run was followed by three fast 2026-07-22/29 + 08-05 runs that
      #      had ZERO rated entries). fast exists for development and PR
      #      approval, and its output stays off the public site.
      #   2. Otherwise honour the input: 'false' => data-only (no docs push,
      #      no integrity gate); anything else publishes.
      #
      # Enforced here rather than by convention so a stray manual dispatch
      # (or a future scheduled tier) cannot publish saturation-only data.
      BENCH_PUBLISH: ${{ (github.event.inputs.profile || 'full') == 'fast' && '0' || (github.event.inputs.publish == 'false' && '0' || '1') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: true

      - name: Install mage
        # mage isn't in the root go.mod; install it into GOPATH/bin
        # ahead of every mage invocation, at the version the CI tools
        # module names and its go.sum hashes (.github/tools; Dependabot
        # bumps it), so a mage release cannot change a tier run
        # (probatorium#458). `tool` installs every tool that module
        # lists (mage, actionlint).
        run: |
          go install -modfile="$GITHUB_WORKSPACE/.github/tools/go.mod" tool
          "$(go env GOPATH)/bin/mage" -version
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Use bootstrap-provisioned ansible
        # runner-setup.yml provisioned an ansible-core venv + collections
        # path under /tmp/actions-runner-<host>/. Writing GITHUB_PATH +
        # GITHUB_ENV here guarantees subsequent shells find ansible-playbook
        # and the collections it needs.
        run: |
          RUNNER_ROOT="/tmp/actions-runner-$(hostname -s)"
          echo "${RUNNER_ROOT}/ansible-venv/bin" >> "$GITHUB_PATH"
          echo "ANSIBLE_COLLECTIONS_PATH=${RUNNER_ROOT}/ansible-collections" >> "$GITHUB_ENV"

      - name: Configure cluster SSH
        # CLUSTER_USE_LAN=1 routes through the LACP fabric; the
        # CLUSTER_SSH_KEY private half lets ansible reach peer hosts;
        # PROBATORIUM_LOCAL_HOST switches inventory_hostname == self to
        # ansible_connection=local. See matrix-pr-tier.yml for the full
        # rationale.
        env:
          CLUSTER_SSH_KEY: ${{ secrets.CLUSTER_SSH_KEY }}
        run: |
          RUNNER_ROOT="/tmp/actions-runner-$(hostname -s)"
          mkdir -p "${RUNNER_ROOT}/.ssh"
          chmod 700 "${RUNNER_ROOT}/.ssh"
          printf '%s\n' "$CLUSTER_SSH_KEY" > "${RUNNER_ROOT}/.ssh/id_ed25519"
          chmod 600 "${RUNNER_ROOT}/.ssh/id_ed25519"
          {
            echo "ANSIBLE_PRIVATE_KEY_FILE=${RUNNER_ROOT}/.ssh/id_ed25519"
            echo "PROBATORIUM_LOCAL_HOST=$(hostname -s)"
            echo "CLUSTER_USE_LAN=1"
            echo "CLUSTER_KNOWN_HOSTS=${RUNNER_ROOT}/.ssh/known_hosts"
          } >> "$GITHUB_ENV"
          # Rebuild the cluster host-key file for THIS run. Without it, a node
          # that has been reinstalled presents a new key, accept-new refuses the
          # change, and ansible reports UNREACHABLE — a healthy machine that
          # looks dead. See the script header.
          bash .github/scripts/refresh-cluster-known-hosts.sh \
            ansible/inventory.yml "${RUNNER_ROOT}/.ssh/known_hosts"

      - name: Publish preflight (fail fast on missing docs token)
        # When this run will publish (BENCH_PUBLISH != 0), refuse to start the
        # multi-hour bench unless the docs token is present. The DOCS_DISPATCH_TOKEN
        # secret MUST be set (a PAT with repo scope on goceleris/docs) — without it
        # the final `mage Publish` falls back to `gh auth token`, which fails on the
        # self-hosted runner (no gh in PATH). The v1.5.5 run completed all 813 cells
        # and then lost the publish here after ~69h; this guard turns that into a
        # minute-0 failure. (mage BenchTier also runs an in-process publishPreflight
        # after Deploy as a second line of defence.)
        if: env.BENCH_PUBLISH != '0'
        env:
          DOCS_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DOCS_TOKEN" ]; then
            echo "::error::BENCH_PUBLISH is on but the DOCS_DISPATCH_TOKEN secret is empty/unset. Set it (a PAT with repo scope on goceleris/docs) or dispatch with publish=false for a data-only run. Aborting before the multi-hour bench."
            exit 1
          fi
          echo "docs publish token present — preflight OK"

      - name: mage Deploy (competitors + db services for the profile)
        env:
          # DEPLOY_COMPETITORS is set at the job level (above) so the BenchTier
          # auto-deploy inherits it too.
          # driver-* cells in the profile need postgres/redis/memcached.
          DEPLOY_NEEDS_DBSERVICES: "1"
        run: mage Deploy

      - name: mage BenchTier (curated matrix, amd64, single pass, publish run-1)
        env:
          CLUSTER_USE_LAN: "1"
          # BENCH_TARGET is set at JOB level (above) so mage Deploy sees it too.
          # Restore "both" once the arm64 host is fixed (celeris#312) and #168
          # ArchParallel lands, or the budget/timeout is re-checked for 2 arches.
          # fast/headline fit the 24h cluster slot, so the budget asserts <24h
          # (FitWithin fails loudly if the grid ever grows past it). Only the
          # rated "full" deep-dive needs the raised ceiling (it runs the rated
          # sweep on the whole grid — many hours); both stay under the job
          # timeout-minutes above.
          # PROJECTED by budget.FitWithin for 2 parallel arches (probatorium#418):
          #   headline 29h50m = 813 x 1m9s saturation + 401 rated cells x 2m8s
          #   full     50h58m = 813 x 2m7s saturation + 401 rated cells x 3m20s
          # a target=both run adds the client lock of probatorium#442 on top
          # (budget.ArchLockOverheadHeavy, 14%): headline ~34h, full ~58h; the
          # budgets below are raised to keep the same 18-21% margin.
          # BENCH_BUDGET is a table of profile x baseline x arch policy, because
          # both move the projection (workflow_arch_budget_test.go checks every
          # entry against FitWithin and the job timeout above). The policy key
          # is `single` for a single-arch target (no lock), else the input
          # (default `all`); the baseline key is BENCH_BASELINE's predicate.
          # Projected for target=both without the baseline columns:
          #   `all`: fast 28h, headline 59h41m, full 101h55m (twice one arch):
          #   budgets 34h / 72h keep the 20% margin; full gets 108h (6% over the
          #   model) because 122h would not fit under the 5 day job limit (7200
          #   min). The model ran 7% HIGH against bench-full 38431303162, so
          #   ~95h is the expectation, but that is one run: a default full
          #   dispatch has the thinnest margin of any entry.
          #   `heavy`: fast 15h58m, headline 34h01m, full 58h06m (24h / 40h / 69h).
          # With baseline=true the grid gains 222 saturation + 120 rated cells
          # (budget.BaselineRealizedCells, +14.5 h on full, +8.5 h on headline):
          #   one arch / off: fast 17h50m, headline 38h22m (48h), full 65h27m (80h)
          #   heavy:          fast 20h19m (24h), headline 43h44m (52h), full 74h37m (90h)
          #   all:            fast 35h39m (43h), headline 76h43m (92h), full 130h55m
          # full + baseline + all (130h55m, the planner says 128.0h) is above the
          # 7200 min job limit even before Deploy: no budget admits it. Its entry is
          # the most the job could hold (112h) and the step "Refuse a grid the job
          # cannot hold" stops the dispatch in the setup job, before Deploy builds the
          # baseline module. Run it as two single-arch dispatches (65h27m each).
          # (a rated cell adds 4 passes x (saturation warmup + rated window)).
          # The runs before #418 measured ~53h (headline) and ~69h (full)
          # against projections of 26h35m and 44h31m. Per-cell overhead was
          # not the gap: the runner rated every clean cell (~770, not the 388
          # the model then planned) at 30s passes, and each pass re-ran the
          # saturation warmup, which the projection did not count. The
          # saturation part over-counts if anything (fast measures 11.34h
          # against a 14.0h projection). The budgets leave ~18-21% over the
          # projection, so a grid that grows past them fails before the run
          # rather than overrunning it.
          BENCH_BUDGET: ${{ fromJSON('{"fast":{"false":{"heavy":"24h","off":"24h","single":"24h","all":"34h"},"true":{"heavy":"24h","off":"24h","single":"24h","all":"43h"}},"headline":{"false":{"heavy":"40h","off":"36h","single":"36h","all":"72h"},"true":{"heavy":"52h","off":"48h","single":"48h","all":"92h"}},"full":{"false":{"heavy":"69h","off":"60h","single":"60h","all":"108h"},"true":{"heavy":"90h","off":"80h","single":"80h","all":"112h"}}}')[github.event.inputs.profile || 'full'][github.event.inputs.baseline == 'true' && 'true' || 'false'][(github.event.inputs.target || 'both') != 'both' && 'single' || github.event.inputs.arch_exclusive || 'all'] }}
          DOCS_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: mage BenchTier

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-tier-results-${{ github.run_id }}
          path: results/
          retention-days: 90

      - name: mage Cleanup
        if: always()
        run: mage Cleanup

  teardown:
    name: teardown cluster runners
    needs: [setup, matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cluster-runner-down
        # The composite reads env.CLUSTER_SSH_KEY to write the private
        # key for ansible. Scoped to this step (not the workflow) so no
        # other step's process tree ever sees the cluster key.
        env:
          CLUSTER_SSH_KEY: ${{ secrets.CLUSTER_SSH_KEY }}
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          gh-runner-pat:             ${{ secrets.RUNNER_PAT }}
