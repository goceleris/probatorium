name: Celeris Stress

# Runs celeris tests many times, x86 and arm64, so a flake and its rate can be
# measured in minutes instead of hours on a laptop. A local timing is not the
# runner's timing: for a CI flake the runner is the truth.
# How to dispatch it, with examples: docs/STRESS.md.
#
# target github (the default): GitHub-hosted runners. celeris is public, so
# these runners (arm64 included) cost nothing. Nothing in this file names a
# self-hosted label, a cluster host or a cluster composite.
#
# target cluster: the bare-metal cluster, msa2-server (x86) and msr1 (arm64),
# native io_uring, through ONE job (`cluster`) that calls
# celeris-stress-cluster.yml and holds the matrix-tier-cluster concurrency
# group while it runs, like every tier. That group keeps one running and one
# pending run, and a run queued into it cancels the pending one, so
# `cluster-guard` first lists every open run and refuses this one if anything
# is pending there (tools/stresstally guard). Only a dispatch reaches the
# cluster; the pull_request self-test never does. mode timing (cluster only)
# runs pre-registered A/B timings: arms named in celeris_ref, one process per
# observation, the arm order counterbalanced by the plan.
#
#   plan     validates every input (tools/stresstally plan) and resolves the
#            celeris ref to ONE commit, so every shard tests the same code
#            even if the branch moves during the run.
#   shard    github: one job per shard per arch: go test -v -count=N
#            -shuffle=<seed> in the requested memlock shape; the raw log is
#            the artifact.
#   cluster-guard, cluster
#            cluster: the guard above, then bootstrap, one job per host
#            running every shard of its arch in turn (one go test process
#            each, the same log per shard), and a teardown that always runs.
#   summary  tallies every log (tools/stresstally summarize): per test and
#            arch, the per-process fail rate with an exact 95% interval and
#            the PASS/FAIL/SKIP iteration counts, and a shard that did not
#            finish cleanly as its own class.
#
# Security: inputs reach steps only through env:, never through ${{ }} in a
# run: script; every action is pinned by commit sha; the token is read-only.
# A shard runs the celeris code under test, which may be anyone's pull
# request, and code a job runs holds that job's runtime token. So:
#   - cache-mode: none (workflow and shard job) gives every job's token no
#     Actions cache access at all, neither restore nor save. GitHub enforces
#     it with scoped cache tokens, so it holds against the code under test,
#     not only against well-behaved actions. No job here needs a cache
#     (setup-go runs with cache: false, and nothing uses actions/cache):
#     a shard restoring what an earlier run's code under test saved could
#     have its test binary, and so its verdicts, forged.
#   - plan refuses a dispatch on the default branch, and the shard job keeps
#     the same rule: defence in depth. If cache-mode were ever dropped, a
#     run elsewhere could still reach only its own branch's cache scope, and
#     no run on main is ever the code under test's. Dispatch from a standing
#     branch such as stress/runs (docs/STRESS.md).
#
# goceleris is on the Free plan: 20 GitHub-hosted jobs run at once across
# the WHOLE organization, celeris and probatorium CI included. max-parallel
# keeps one run to 4 shard jobs, so the base-vs-branch pair docs/STRESS.md
# describes holds at most 8 slots and leaves at least 12. A push to a celeris
# pull request is 11 jobs (ci.yml: 8 Linux, 1 macOS; CodeQL default setup:
# actions, go), a push to its main 12 (Scorecard): either still starts at
# once. A pull request that touches celeris's driver paths adds drivers.yml's
# 24 jobs and queues on its own, with or without a pair running.
#
# The cluster path adds, on top of the walls above: a pull ref (anyone's
# fork) is refused for the cluster, and the plan job proves every commit a
# cluster run tests is reachable from a goceleris/celeris branch or tag,
# because a cluster shard runs on bare metal as a user with sudo; the four
# secrets the cluster composites need are passed by name to the cluster
# workflow, where only its hosted bootstrap and teardown jobs read them, never
# the host job that runs the code under test; that job keeps cache-mode: none
# and keeps Go's caches under its own RUNNER_TEMP.
#
# The pull_request trigger is the workflow's self-test. A pull request that
# changes this file or the tool runs a fixed set of cases (selfTests in
# tools/stresstally/plan.go), each written as dispatch inputs and planned by
# the dispatch code, with fixed expected outcomes: a clean run must PASS,
# and a failing test, a run of only skips, a go test timeout and a -run that
# matches nothing must each be reported as exactly that. The run is green
# only when every case comes out as expected.

# The run's title names the target and mode: the cluster guard reads it to
# tell a github dispatch (which never joins matrix-tier-cluster) from one that
# may (TestStressWorkflowRunNameIsWhatTheGuardReads).
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
  && format('Celeris Stress [{0}/{1}] {2}', inputs.target, inputs.mode, inputs.celeris_ref)
  || format('Celeris Stress self-test #{0}', github.event.pull_request.number) }}

on:
  workflow_dispatch:
    inputs:
      celeris_ref:
        description: "celeris branch, tag, full commit sha or refs/pull/N/head (github only); mode timing: 2-4 arms as NAME=REF NAME=REF"
        type: string
        default: main
      packages:
        description: "Package patterns under the celeris module, space-separated (. ./internal/engine/iouring ./internal/adaptive/...); a ref from before celeris#443 runs ./internal/P as ./P"
        type: string
        default: ./internal/engine/iouring
      run:
        description: "go test -run regexp (empty runs every test in the packages)"
        type: string
        default: ""
      count:
        description: "go test -count per shard (1-1000): iterations inside ONE process per package"
        type: string
        default: "10"
      shards:
        description: "Shards per arch (1-20); one job and one process per package each, each with its own -shuffle seed"
        type: string
        default: "5"
      arches:
        description: "Architectures"
        type: choice
        options: [both, x86, arm64]
        default: both
      memlock:
        description: "RLIMIT_MEMLOCK for go test; default = the target's shape: github 8m (celeris CI's unit job), cluster unlimited (native io_uring)"
        type: choice
        options: [default, 8m, 128m, unlimited]
        default: default
      race:
        description: "go test -race"
        type: boolean
        default: false
      timeout:
        description: "go test -timeout, which applies to EACH test binary (one per package), 1s to 5h30m"
        type: string
        default: 30m
      extra:
        description: "Allow-listed only: -short -failfast -cpu=N[,N] -parallel=N -skip=RE -tags=LIST -shuffle=off|N, and NAME=V for a variable celeris tests read (CELERIS_*, GOTEST_BACKPRESSURE, WS484_CONNS, ...)"
        type: string
        default: ""
      target:
        description: "github: GitHub-hosted runners. cluster: the bare-metal cluster, one host per arch, native io_uring (refused while another cluster run is pending)"
        type: choice
        options: [github, cluster]
        default: github
      mode:
        description: "stress: repetitions and their fail rates. timing (cluster only): pre-registered A/B timing of the arms named in celeris_ref"
        type: choice
        options: [stress, timing]
        default: stress
      timing:
        description: "mode timing only: cpus=N (CPUs each observation is pinned to, default 4) pmu=required|optional (default optional)"
        type: string
        default: ""
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/celeris-stress.yml
      - .github/workflows/celeris-stress-cluster.yml
      - tools/stresstally/**

permissions:
  contents: read

cache-mode: none

# Dispatched runs never cancel each other (a base run and a branch run are
# meant to run side by side); a pull request's newer push cancels its older
# self-test.
concurrency:
  group: celeris-stress-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      matrix: ${{ steps.plan.outputs.matrix }}
      celeris_ref: ${{ steps.plan.outputs.celeris_ref }}
      celeris_sha: ${{ steps.resolve.outputs.celeris_sha }}
      target: ${{ steps.plan.outputs.target }}
      mode: ${{ steps.plan.outputs.mode }}
      refs: ${{ steps.plan.outputs.refs }}
      case_shas: ${{ steps.cases.outputs.case_shas }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The same path for both events: the default-branch refusal, then
      # planDispatch on IN_* inputs (the self-test's are fixed in the tool).
      - name: Validate the inputs and plan the shards
        id: plan
        shell: bash
        env:
          STRESS_EVENT: ${{ github.event_name }}
          STRESS_RUN_ID: ${{ github.run_id }}
          STRESS_REF: ${{ github.ref }}
          STRESS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # The probatorium commit this run's workflow and tool come from,
          # recorded in the plan: compare refuses two arms that differ in it.
          STRESS_PROBATORIUM_SHA: ${{ github.sha }}
          IN_CELERIS_REF: ${{ inputs.celeris_ref }}
          IN_PACKAGES: ${{ inputs.packages }}
          IN_RUN: ${{ inputs.run }}
          IN_COUNT: ${{ inputs.count }}
          IN_SHARDS: ${{ inputs.shards }}
          IN_ARCHES: ${{ inputs.arches }}
          IN_MEMLOCK: ${{ inputs.memlock }}
          IN_RACE: ${{ inputs.race }}
          IN_TIMEOUT: ${{ inputs.timeout }}
          IN_EXTRA: ${{ inputs.extra }}
          IN_TARGET: ${{ inputs.target }}
          IN_MODE: ${{ inputs.mode }}
          IN_TIMING: ${{ inputs.timing }}
        run: go run ./tools/stresstally plan
      # The ref was validated above (a branch, tag, full sha or pull ref that
      # cannot be read as an option). Fetching it here pins the run to one
      # commit; every shard checks out that sha and records it in its log.
      - name: Resolve the celeris ref to one commit
        id: resolve
        shell: bash
        env:
          CELERIS_REF: ${{ steps.plan.outputs.celeris_ref }}
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/celeris-ref"
          git init -q "$repo"
          git -C "$repo" fetch -q --depth=1 --no-tags https://github.com/goceleris/celeris.git "$CELERIS_REF"
          sha=$(git -C "$repo" rev-parse --verify 'FETCH_HEAD^{commit}')
          if ! [[ $sha =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::celeris ref $CELERIS_REF resolved to '$sha', not a commit"
            exit 1
          fi
          echo "celeris $CELERIS_REF is $sha"
          echo "celeris_sha=$sha" >>"$GITHUB_OUTPUT"
      # The cluster: every case's ref (one for stress, one per arm for a
      # timing) pinned to one commit, and each commit proven reachable from a
      # goceleris/celeris branch or tag, so bare metal runs only code a
      # celeris maintainer pushed.
      - name: Resolve every case's commit and prove where it came from (cluster)
        id: cases
        if: ${{ steps.plan.outputs.target == 'cluster' }}
        shell: bash
        env:
          REFS: ${{ steps.plan.outputs.refs }}
        run: bash tools/stresstally/resolve-cases.sh

  shard:
    name: ${{ matrix.case }} ${{ matrix.arch }} ${{ matrix.shard }}
    needs: plan
    # plan already refuses this; the job keeps the rule on its own, since it
    # is the job that runs the celeris code under test. A cluster plan's
    # matrix is its host jobs, which the cluster workflow runs.
    if: ${{ needs.plan.outputs.target == 'github' && (github.event_name == 'pull_request' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}
    # The runner is chosen HERE, not by the plan (celeris#864). On
    # pull_request the plan is the pull request's own tools/stresstally,
    # which is outside .github/, so a runner label it returned would put the
    # pull request's code on whatever runner that label names, the cluster
    # hosts' runners included, with no change under .github/ for a
    # maintainer to see before "Approve and run". runs-on is always one of
    # the two GitHub-hosted labels written here, never the plan's own text
    # (== ignores case, as contains() does; plan.go's runners map names the
    # same two labels, so change both together). Anything outside the list
    # runs on ubuntu-24.04, and the first step fails the shard, naming what
    # the plan asked for.
    runs-on: ${{ matrix.runner == 'ubuntu-24.04-arm' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    # Stated again on the job that runs the code under test, so an edit of
    # the workflow-level key cannot give this job's token cache access.
    cache-mode: none
    # The job limit allows one go test -timeout per package (jobMinutes in
    # tools/stresstally/plan.go): -timeout bounds each test binary.
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      # 4 of the organization's 20 concurrent hosted jobs per run (see the
      # header): a base-vs-branch pair never holds more than 8.
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Refuse a runner this workflow does not allow
        if: ${{ !contains(fromJSON('["ubuntu-24.04","ubuntu-24.04-arm"]'), matrix.runner) }}
        shell: bash
        env:
          PLANNED_RUNNER: ${{ toJSON(matrix.runner) }}
        run: |
          echo "::error::the plan asked for runner $PLANNED_RUNNER; this workflow runs shards only on ubuntu-24.04 and ubuntu-24.04-arm (celeris#864)"
          exit 1
      - name: Check out the shard script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: probatorium
          sparse-checkout: tools/stresstally
      - name: Check out celeris at the planned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: goceleris/celeris
          ref: ${{ needs.plan.outputs.celeris_sha }}
          path: celeris
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: celeris/go.mod
          cache: false
      # shard.sh sets memlock with `sudo prlimit` on its own shell, as celeris
      # ci.yml does, records the machine, the memlock in force and the commit
      # in the log header, refuses to run in any other shape, and exits 0
      # whenever go test ran: the summary is the verdict.
      - name: go test
        shell: bash
        env:
          STRESS_LOG: ${{ runner.temp }}/stress/${{ matrix.case }}__${{ matrix.arch }}__${{ matrix.shard }}.log
          STRESS_CASE: ${{ matrix.case }}
          STRESS_ARCH: ${{ matrix.arch }}
          STRESS_RUNNER: ${{ matrix.runner }}
          STRESS_SHARD: ${{ matrix.shard }}
          STRESS_SHUFFLE: ${{ matrix.shuffle }}
          STRESS_PACKAGES: ${{ matrix.packages }}
          STRESS_RUN: ${{ matrix.run }}
          STRESS_COUNT: ${{ matrix.count }}
          STRESS_MEMLOCK: ${{ matrix.memlock }}
          STRESS_MEMLOCK_LIMIT: ${{ matrix.memlock_limit }}
          STRESS_RACE: ${{ matrix.race }}
          STRESS_TIMEOUT: ${{ matrix.timeout }}
          STRESS_JOB_TIMEOUT: ${{ matrix.job_timeout }}
          STRESS_FLAGS: ${{ matrix.flags }}
          STRESS_ENV: ${{ matrix.env }}
          STRESS_CELERIS_REF: ${{ needs.plan.outputs.celeris_ref }}
          STRESS_CELERIS_SHA: ${{ needs.plan.outputs.celeris_sha }}
          STRESS_CELERIS_DIR: celeris
        run: bash probatorium/tools/stresstally/shard.sh
      - name: Upload the log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stress-log-${{ matrix.case }}-${{ matrix.arch }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/stress/
          if-no-files-found: warn
          retention-days: 30

  # Outside matrix-tier-cluster, just before entering it: refuse this run if
  # any run is pending in the group, since entering would cancel it. Lists
  # every open run (and the jobs of other stress runs) with this run's
  # read-only token and judges them with tools/stresstally guard; the lists
  # and the decision are the stress-cluster-guard artifact.
  cluster-guard:
    name: cluster-guard
    needs: plan
    if: ${{ github.event_name == 'workflow_dispatch' && needs.plan.outputs.target == 'cluster' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      checked_at: ${{ steps.guard.outputs.checked_at }}
      # The attempt this verdict belongs to: the cluster job enters the group
      # only on a verdict from its own attempt (see the cluster job).
      attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/stresstally
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Refuse if a run is pending in the cluster group
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          GUARD_DIR: ${{ runner.temp }}/guard
        # Built first, so the look (guard.sh) and the verdict are seconds
        # apart, not a cold compile apart.
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/stresstally" ./tools/stresstally
          bash tools/stresstally/guard.sh
          "$RUNNER_TEMP/stresstally" guard -dir "$GUARD_DIR" -self "$RUN_ID"
      - name: Upload the guard's evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stress-cluster-guard
          path: ${{ runner.temp }}/guard/
          if-no-files-found: warn
          retention-days: 30

  # The cluster run, inside matrix-tier-cluster for its whole length
  # (bootstrap, host jobs, teardown), as every tier is. The called workflow
  # declares no group of its own: this job holds it.
  #
  # A re-run never re-enters the group on an old verdict. "Re-run failed
  # jobs" re-runs this job (and its dependents) but reuses the result and
  # outputs of a cluster-guard that succeeded, which may be hours old; this
  # job would then cancel whatever is pending in the group now. So it runs
  # only when cluster-guard ran in this same attempt; otherwise it is skipped
  # and the summary says why. "Re-run all jobs" runs the guard again and is
  # allowed. Never re-run a cluster run: dispatch a new one (docs/STRESS.md).
  cluster:
    name: cluster
    needs: [plan, cluster-guard]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.plan.outputs.target == 'cluster' && needs.cluster-guard.result == 'success' && needs.cluster-guard.outputs.attempt == github.run_attempt && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
    concurrency:
      group: matrix-tier-cluster
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/celeris-stress-cluster.yml
    with:
      matrix: ${{ needs.plan.outputs.matrix }}
      case_shas: ${{ needs.plan.outputs.case_shas }}
      refs: ${{ needs.plan.outputs.refs }}
      guard_checked_at: ${{ needs.cluster-guard.outputs.checked_at }}
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      RUNNER_PAT: ${{ secrets.RUNNER_PAT }}
      CLUSTER_SSH_KEY: ${{ secrets.CLUSTER_SSH_KEY }}

  summary:
    name: summary
    needs: [plan, shard, cluster-guard, cluster]
    # Runs when shards failed too (their logs are the evidence), but not when
    # the plan itself was refused, the cluster guard refused the run, or the
    # run was cancelled.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.target == 'github' || needs.cluster-guard.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # A cluster job skipped although the guard allowed the run can only be
      # a re-run on an earlier attempt's guard (see the cluster job): nothing
      # ran on the cluster in this attempt, so there is nothing new to judge.
      - name: Refuse a re-run that skipped the cluster
        if: ${{ needs.plan.outputs.target == 'cluster' && needs.cluster.result == 'skipped' }}
        shell: bash
        env:
          ATTEMPT: ${{ github.run_attempt }}
          GUARD_ATTEMPT: ${{ needs.cluster-guard.outputs.attempt }}
        run: |
          echo "::error::attempt $ATTEMPT re-runs a cluster run whose guard ran in attempt ${GUARD_ATTEMPT:-?}. The cluster job did not run: a re-run never enters the cluster's concurrency group on an old guard verdict, and its host jobs never wait for runners the first attempt's teardown removed. Nothing was measured again. Dispatch a new run."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Download every shard log
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: stress-log-*
          merge-multiple: true
          path: ${{ runner.temp }}/logs
      # A shard with no log is MISSING, not skipped: the plan says which
      # shards must be there.
      - name: Tally and judge every case
        shell: bash
        env:
          STRESS_PLAN: ${{ needs.plan.outputs.plan }}
          STRESS_CELERIS_SHA: ${{ needs.plan.outputs.celeris_sha }}
          # The cluster's per-case commits (CASE=SHA), which its shards tested.
          STRESS_CASE_SHAS: ${{ needs.plan.outputs.case_shas }}
          LOGS: ${{ runner.temp }}/logs
          OUT: ${{ runner.temp }}/summary
        run: |
          set -u
          rc=0
          go run ./tools/stresstally summarize -logs "$LOGS" -out "$OUT" || rc=$?
          if [ -f "$OUT/summary.md" ]; then
            cat "$OUT/summary.md" >>"$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"
      - name: Upload the summary
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stress-summary
          path: ${{ runner.temp }}/summary/
          if-no-files-found: warn
          retention-days: 30
