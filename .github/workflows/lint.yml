name: Lint

# Always-latest policy: setup-go uses `stable`, actions are pinned to a
# major tag so dependabot can bump us to the latest minor/patch without
# us having to touch the workflow.
#
# Includes actionlint as a workflow-level lint so this repo's own GH
# Actions YAML is sanity-checked on every PR (catches script-injection
# vectors, unknown runner labels, malformed shell, etc.). Custom
# self-hosted labels declared in .github/actionlint.yaml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: go vet + golangci-lint + gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"
          cache: true
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          args: --timeout=5m
      # gofmt -l prints offending files and emits no output on success.
      # Fail the job if anything appears on stdout — preserves the
      # "any drift breaks the build" invariant the SDD calls out.
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          actionlint -color
