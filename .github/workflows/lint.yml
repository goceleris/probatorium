name: Lint

# Always-latest policy: every third-party action is pinned to a full
# commit SHA (with the resolved release tag in a trailing comment) so a
# retagged or compromised upstream tag cannot change what runs here.
# Dependabot's github-actions entry keeps the SHAs and version comments
# current for every directory it lists in .github/dependabot.yml — the
# workflows via `/` and each composite action under .github/actions/ by
# its own path (a root-only entry never sees the composites).
#
# Includes actionlint as a workflow-level lint so this repo's own GH
# Actions YAML is sanity-checked on every PR (catches script-injection
# vectors, unknown runner labels, malformed shell, etc.). Custom
# self-hosted labels declared in .github/actionlint.yaml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: go vet + golangci-lint + gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache: true
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13
          args: --timeout=5m
      # gofmt -l prints offending files and emits no output on success.
      # Fail the job if anything appears on stdout — preserves the
      # "any drift breaks the build" invariant the SDD calls out.
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi
      # Magefiles carry `//go:build mage`, so `go vet ./...`, `go build` and
      # `go test` ALL skip them — only mage itself compiles them. A magefile
      # that stopped compiling therefore reached main green and only surfaced
      # when the nightly ran `mage Deploy` on the cluster (an undefined symbol
      # left behind by a dead-code removal). Compile them here instead.
      - name: Install mage
        run: |
          go install github.com/magefile/mage@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: mage compiles
        run: mage -compile /tmp/mage-compile-check

      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          actionlint -color
