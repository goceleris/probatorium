name: Matrix Tier — Nightly

# Nightly matrix-mode validate run: every refapp × every engine, 1h
# budget. Catches slow regressions the 10-minute PR tier doesn't
# have time to surface (heap drift, goroutine creep, the 99th-
# percentile invariant violations that need volume).
#
# Three-stage flow with cluster-runner bootstrap (see
# matrix-pr-tier.yml for the architecture comment).

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: per-tier-total duration (default 1h)
        required: false
        type: string
        default: 1h

permissions:
  contents: read

concurrency:
  group: matrix-tier-cluster
  cancel-in-progress: false

env:
  CLUSTER_SSH_KEY: ${{ secrets.CLUSTER_SSH_KEY }}

jobs:
  setup:
    name: bootstrap cluster runners
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/cluster-runner-up
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          gh-runner-pat:             ${{ secrets.RUNNER_PAT }}
          wait-for-manifest-clear:   "true"
          wait-timeout-seconds:      "1800"

  matrix:
    name: matrix validate (nightly tier)
    needs: setup
    runs-on: [self-hosted, celeris-cluster]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: Install mage
        # mage isn't in the root go.mod; install it into GOPATH/bin
        # ahead of every mage invocation. Cheap (~5s) and avoids
        # `go run github.com/magefile/mage` which needs mage in
        # go.mod.
        run: |
          go install github.com/magefile/mage@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Use bootstrap-provisioned ansible
        # runner-setup.yml provisioned an ansible-core venv at
        # /tmp/actions-runner-<host>/ansible-venv/. The runner-side
        # PATH export in nohup ./run.sh covers it, but writing
        # GITHUB_PATH here is the explicit belt-and-braces guarantee
        # that subsequent steps' shells find ansible-playbook.
        run: |
          echo "/tmp/actions-runner-$(hostname -s)/ansible-venv/bin" >> "$GITHUB_PATH"

      - name: mage Deploy (stage refapps + validator)
        env:
          DEPLOY_COMPETITORS: none
        run: mage Deploy

      - name: mage Validate (matrix mode, both archs)
        env:
          VALIDATE_DURATION: ${{ inputs.duration || '1h' }}
          VALIDATE_TARGET: both
          VALIDATE_MATRIX: "1"
        run: mage Validate

      - name: mage ValidateDiff (cross-engine + cross-arch gate)
        if: success()
        run: mage ValidateDiff

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-nightly-results-${{ github.run_id }}
          path: results/
          retention-days: 30

      - name: mage Cleanup
        if: always()
        run: mage Cleanup

  teardown:
    name: teardown cluster runners
    needs: [setup, matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/cluster-runner-down
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          gh-runner-pat:             ${{ secrets.RUNNER_PAT }}
