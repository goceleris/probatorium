name: Matrix Tier — PR

# PR-tier matrix-mode validate run: every refapp × every engine,
# 10-minute budget, ~200 Tier-3 seeds. Acts as the merge gate for
# regressions in the validator + refapp surface against the current
# celeris version.
#
# Triggered on PRs that touch refapp / validator / mage / ansible
# code; bypasses doc-only PRs to keep cluster minutes from going to
# waste on README tweaks. workflow_dispatch lets a human run it
# against any branch.
#
# Per probatorium#114. The longer-cadence tiers (nightly, weekend)
# live in matrix-nightly-tier.yml + matrix-weekend-tier.yml; this is
# the fast one.

on:
  pull_request:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'validation/**'
      - 'report/**'
      - 'services/**'
      - 'mage_*.go'
      - 'magefile.go'
      - 'ansible/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/matrix-pr-tier.yml'
  workflow_dispatch:
    inputs:
      duration:
        description: per-tier-total duration (default 10m)
        required: false
        type: string
        default: 10m

permissions:
  contents: read

jobs:
  matrix:
    name: matrix validate (PR tier)
    runs-on: [self-hosted, celeris-cluster]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: mage Deploy (stage refapps + validator)
        env:
          DEPLOY_COMPETITORS: none
        run: go run github.com/magefile/mage Deploy

      - name: mage Validate (matrix mode)
        env:
          VALIDATE_DURATION: ${{ inputs.duration || '10m' }}
          VALIDATE_TARGET: msa2-server
          VALIDATE_MATRIX: "1"
        run: go run github.com/magefile/mage Validate

      - name: mage ValidateDiff (cross-engine + cross-arch gate)
        if: success()
        run: go run github.com/magefile/mage ValidateDiff

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-pr-results-${{ github.run_id }}
          path: results/
          retention-days: 7

      - name: mage Cleanup
        if: always()
        run: go run github.com/magefile/mage Cleanup
