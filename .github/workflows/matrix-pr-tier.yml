name: PR Validation

# PR-tier matrix-mode validate run: every refapp × every engine,
# 10-minute budget. Acts as the merge gate for regressions in the
# validator + refapp surface against the current celeris version.
#
# Three-stage flow:
#   1. setup     — ubuntu-latest + Tailscale + ansible. Provisions
#                  ephemeral GH Actions runners on all three cluster
#                  hosts (msa2-server, msa2-client, msr1). Mints a
#                  short-lived registration token; runners self-
#                  deregister after one job (--ephemeral).
#   2. matrix    — self-hosted celeris-cluster. Drives mage Validate
#                  with VALIDATE_MATRIX=1 against the cluster.
#   3. teardown  — ubuntu-latest + Tailscale + ansible. Kills any
#                  Runner.Listener still alive, de-registers
#                  whatever the matrix job didn't auto-clear, and
#                  rm -rf's /tmp/actions-runner-<host>/. Runs
#                  `if: always()` so cleanup happens even on cancel.
#
# Concurrency: matrix-tier-cluster groups every tier workflow so
# they serialize on the shared cluster. cancel-in-progress=false
# queues incoming PR-tier runs behind any in-flight nightly/weekend
# run — explicitly required: wait if other cluster work is in
# progress.
#
# Security gate (cluster-ok label): self-hosted runners on
# pull_request would let any contributor with write access (or any
# future collaborator) execute arbitrary code on the cluster hosts.
# This workflow ONLY runs when a maintainer explicitly adds the
# `cluster-ok` label to the PR (or kicks it via workflow_dispatch).
# The label must be re-added after every push the maintainer wants
# to re-validate — there is no `synchronize` trigger by design.

on:
  pull_request:
    types: [labeled]
    branches: [main]
    paths:
      - 'cmd/**'
      - 'validation/**'
      - 'report/**'
      - 'services/**'
      - 'mage_*.go'
      - 'magefile.go'
      - 'ansible/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/matrix-pr-tier.yml'
      - '.github/actions/cluster-runner-up/**'
      - '.github/actions/cluster-runner-down/**'
  workflow_dispatch:
    inputs:
      duration:
        description: per-tier-total duration (default 10m)
        required: false
        type: string
        default: 10m

permissions:
  contents: read

# All cluster-touching workflows share the same group so they run
# strictly in series. Queued runs wait, they're never cancelled.
concurrency:
  group: matrix-tier-cluster
  cancel-in-progress: false

env:
  CLUSTER_SSH_KEY: ${{ secrets.CLUSTER_SSH_KEY }}

jobs:
  guard:
    # Label gate. Runs the cluster ONLY if a maintainer added the
    # `cluster-ok` label (or kicked the workflow manually). All
    # downstream jobs need this — if the gate is skipped/fails, the
    # cluster-touching jobs do not run and no secrets are exposed.
    name: cluster-ok label gate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'cluster-ok')
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Approved
        env:
          EVENT: ${{ github.event_name }}
          LABEL: ${{ github.event.label.name }}
        run: |
          echo "approved by event=$EVENT label=${LABEL:-none}"

  setup:
    name: bootstrap cluster runners
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/cluster-runner-up
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          gh-runner-pat:             ${{ secrets.RUNNER_PAT }}
          wait-for-manifest-clear:   "true"
          wait-timeout-seconds:      "1800"

  matrix:
    name: matrix validate (PR tier)
    needs: [guard, setup]
    runs-on: [self-hosted, celeris-cluster]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true

      - name: Install mage
        # mage isn't in the root go.mod; install it into GOPATH/bin
        # ahead of every mage invocation. Cheap (~5s) and avoids
        # `go run github.com/magefile/mage` which needs mage in
        # go.mod.
        run: |
          go install github.com/magefile/mage@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Use bootstrap-provisioned ansible
        # runner-setup.yml provisioned an ansible-core venv at
        # /tmp/actions-runner-<host>/ansible-venv/ and a collections
        # path with ansible.posix at .../ansible-collections/. The
        # runner-side env exports in nohup ./run.sh cover both, but
        # writing GITHUB_PATH + GITHUB_ENV here is the explicit
        # belt-and-braces guarantee that subsequent steps' shells
        # find ansible-playbook + the collections it needs.
        run: |
          RUNNER_ROOT="/tmp/actions-runner-$(hostname -s)"
          echo "${RUNNER_ROOT}/ansible-venv/bin" >> "$GITHUB_PATH"
          echo "ANSIBLE_COLLECTIONS_PATH=${RUNNER_ROOT}/ansible-collections" >> "$GITHUB_ENV"

      - name: Configure cluster SSH
        # The matrix job runs ON one of the cluster hosts. ansible
        # needs three things to reach the inventory hosts from there:
        #   1. CLUSTER_USE_LAN=1 — route through the 20G LACP fabric
        #      using lan_ip from inventory.yml. Avoids the Tailscale
        #      SSH tag:cluster → tag:cluster ACL we'd otherwise need.
        #   2. The CLUSTER_SSH_KEY private half on disk + ANSIBLE_PRIVATE_KEY_FILE
        #      so ansible authenticates to peer cluster hosts (the
        #      public half is already in mini's authorized_keys on
        #      each host per the README setup).
        #   3. PROBATORIUM_LOCAL_HOST=$(hostname -s) — inventory.yml
        #      flips ansible_connection=local for the matching host,
        #      so we don't try to SSH from msa2-server to msa2-server.
        env:
          CLUSTER_SSH_KEY: ${{ secrets.CLUSTER_SSH_KEY }}
        run: |
          RUNNER_ROOT="/tmp/actions-runner-$(hostname -s)"
          mkdir -p "${RUNNER_ROOT}/.ssh"
          chmod 700 "${RUNNER_ROOT}/.ssh"
          printf '%s\n' "$CLUSTER_SSH_KEY" > "${RUNNER_ROOT}/.ssh/id_ed25519"
          chmod 600 "${RUNNER_ROOT}/.ssh/id_ed25519"
          {
            echo "ANSIBLE_PRIVATE_KEY_FILE=${RUNNER_ROOT}/.ssh/id_ed25519"
            echo "PROBATORIUM_LOCAL_HOST=$(hostname -s)"
            echo "CLUSTER_USE_LAN=1"
            echo "CLUSTER_KNOWN_HOSTS=${RUNNER_ROOT}/.ssh/known_hosts"
          } >> "$GITHUB_ENV"
          # Rebuild the cluster host-key file for THIS run. Without it, a node
          # that has been reinstalled presents a new key, accept-new refuses the
          # change, and ansible reports UNREACHABLE — a healthy machine that
          # looks dead. See the script header.
          bash .github/scripts/refresh-cluster-known-hosts.sh \
            ansible/inventory.yml "${RUNNER_ROOT}/.ssh/known_hosts"

      - name: mage Deploy (stage refapps + validator)
        env:
          DEPLOY_COMPETITORS: none
        run: mage Deploy

      - name: mage Validate (matrix mode)
        env:
          VALIDATE_DURATION: ${{ inputs.duration || '10m' }}
          VALIDATE_TARGET: msa2-server
          VALIDATE_MATRIX: "1"
        run: mage Validate

      - name: mage ValidateDiff (cross-engine + cross-arch gate)
        if: success()
        run: mage ValidateDiff

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matrix-pr-results-${{ github.run_id }}
          path: results/
          retention-days: 7

      - name: mage Cleanup
        if: always()
        run: mage Cleanup

  teardown:
    name: teardown cluster runners
    needs: [guard, setup, matrix]
    # always() but only if the gate let the run start in the first place
    if: always() && needs.guard.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/cluster-runner-down
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          gh-runner-pat:             ${{ secrets.RUNNER_PAT }}
