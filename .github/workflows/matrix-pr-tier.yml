name: PR Validation

# PR-tier matrix-mode validate run: every refapp × every engine,
# 10-minute budget. Acts as the merge gate for regressions in the
# validator + refapp surface against the current celeris version.
#
# Three-stage flow:
#   1. setup     — ubuntu-latest + Tailscale + ansible. Provisions
#                  ephemeral GH Actions runners on all three cluster
#                  hosts (msa2-server, msa2-client, msr1). Mints a
#                  short-lived registration token; runners self-
#                  deregister after one job (--ephemeral).
#   2. matrix    — self-hosted celeris-cluster. Drives mage Validate
#                  with VALIDATE_MATRIX=1 against the cluster.
#   (Run 34903656367 is the first job this workflow has executed since
#   2026-05-30, and it passed all four stages.)
#
#   3. teardown  — ubuntu-latest + Tailscale + ansible. Kills any
#                  Runner.Listener still alive, de-registers
#                  whatever the matrix job didn't auto-clear, and
#                  rm -rf's /tmp/actions-runner-<host>/. Runs
#                  `if: always()` so cleanup happens even on cancel.
#
# Concurrency: matrix-tier-cluster groups every tier workflow so
# they serialize on the shared cluster. cancel-in-progress=false
# queues incoming PR-tier runs behind any in-flight nightly/weekend
# run — explicitly required: wait if other cluster work is in
# progress.
#
# Security gate (cluster-ok label): self-hosted runners on
# pull_request would let any contributor with write access (or any
# future collaborator) execute arbitrary code on the cluster hosts.
# This workflow ONLY runs when a maintainer explicitly adds the
# `cluster-ok` label to the PR (or kicks it via workflow_dispatch),
# AND the head branch lives in this repository — the label gates who
# approves, the head-repo check gates whose code runs. A fork PR never
# reaches the cluster, labelled or not.
#
# It also re-validates on `synchronize` while the label is still
# present (probatorium#360). Requiring the label to be re-applied by
# hand after every push meant nobody ever did: of the last 100 runs,
# 56 skipped and 44 were cancelled, with zero successes and zero
# failures since 2026-05-30. Every harness change in that window --
# the 64-cell adaptive matrix, the hang capture, the WebSocket echo
# walker, the per-scenario CPU windows -- reached main on unit tests
# alone, while the checks list implied a cluster safety net that did
# not exist.
#
# This grants no new capability. The head-repo check already confines
# every cluster-touching run to a branch in this repository, which
# requires write access; anyone who can push such a branch can already
# add the label. What changes is only how often a maintainer has to
# re-apply it, which was the whole reason the gate went unused.

on:
  pull_request:
    types: [labeled, synchronize]
    branches: [main]
    paths:
      - 'cmd/**'
      - 'validation/**'
      - 'report/**'
      - 'services/**'
      - 'mage_*.go'
      - 'magefile.go'
      - 'ansible/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/matrix-pr-tier.yml'
      - '.github/actions/cluster-runner-up/**'
      - '.github/actions/cluster-runner-down/**'
  workflow_dispatch:
    inputs:
      duration:
        description: per-tier-total duration (default 10m)
        required: false
        type: string
        default: 10m

permissions:
  contents: read

# All cluster-touching workflows share the same group so they run
# strictly in series. Queued runs wait, they're never cancelled.
#
# The group is claimed CONDITIONALLY (probatorium#288): `pull_request:
# labeled` fires for EVERY label on a PR touching the watched paths, and
# a run whose guard job will skip (wrong label) must not sit in
# matrix-tier-cluster — GitHub keeps only one pending run per group, so
# such a no-op run displaced a queued nightly/soak/bench. Runs that
# cannot reach the cluster get a private per-run group instead.
#
# The claim condition must match the guard's `if` exactly, INCLUDING the
# head-repo check: a fork PR carrying the label would otherwise claim the
# shared group and then skip, displacing a queued nightly or soak -- the
# same displacement #288 fixed for the wrong-label case.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && ((github.event.action == 'labeled' && github.event.label.name == 'cluster-ok') || (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'cluster-ok'))))) && 'matrix-tier-cluster' || format('matrix-pr-tier-noop-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  guard:
    # Label gate. Runs the cluster ONLY if a maintainer added the
    # `cluster-ok` label (or kicked the workflow manually). All
    # downstream jobs need this — if the gate is skipped/fails, the
    # cluster-touching jobs do not run and no secrets are exposed.
    #
    # The pull_request path additionally requires the head branch to
    # live in THIS repository: a fork PR must never reach the
    # self-hosted cluster, even if the label is applied — the label
    # gates who approves, this gates whose code runs.
    #
    # `labeled` fires for EVERY label, so it is matched on the label
    # that was actually added; `synchronize` has no such field and is
    # matched on the label set the PR carries at push time. Keeping the
    # two actions separate is what stops an unrelated label on an
    # already-approved PR from spending a cluster window.
    name: cluster-ok label gate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       ((github.event.action == 'labeled' &&
         github.event.label.name == 'cluster-ok') ||
        (github.event.action == 'synchronize' &&
         contains(github.event.pull_request.labels.*.name, 'cluster-ok'))))
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Approved
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
        run: |
          echo "approved by event=$EVENT action=${ACTION:-none} label=${LABEL:-none}"

  setup:
    name: bootstrap cluster runners
    needs: guard
    runs-on: ubuntu-latest
    # 25, not 15: the bootstrap fetches a 215 MiB actions-runner
    # tarball per host on a cold cache, and a slow-network day took
    # 13m05s of a 15-minute budget and cancelled the nightly
    # (probatorium#387). The cache added there removes the fetch from
    # every later run; this is the headroom for the first one.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cluster-runner-up
        # The composite reads env.CLUSTER_SSH_KEY to write the private
        # key for ansible. Scoped to this step (not the workflow) so no
        # other step's process tree ever sees the cluster key.
        env:
          CLUSTER_SSH_KEY: ${{ secrets.CLUSTER_SSH_KEY }}
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          gh-runner-pat:             ${{ secrets.RUNNER_PAT }}
          wait-for-manifest-clear:   "true"
          wait-timeout-seconds:      "1800"

  matrix:
    name: matrix validate (PR tier)
    needs: [guard, setup]
    runs-on: [self-hosted, celeris-cluster]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache: true

      - name: Install mage
        # mage isn't in the root go.mod; install it into GOPATH/bin
        # ahead of every mage invocation. Cheap (~5s) and avoids
        # `go run github.com/magefile/mage` which needs mage in
        # go.mod.
        run: |
          go install github.com/magefile/mage@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Use bootstrap-provisioned ansible
        # runner-setup.yml provisioned an ansible-core venv at
        # /tmp/actions-runner-<host>/ansible-venv/ and a collections
        # path with ansible.posix at .../ansible-collections/. The
        # runner-side env exports in nohup ./run.sh cover both, but
        # writing GITHUB_PATH + GITHUB_ENV here is the explicit
        # belt-and-braces guarantee that subsequent steps' shells
        # find ansible-playbook + the collections it needs.
        run: |
          RUNNER_ROOT="/tmp/actions-runner-$(hostname -s)"
          echo "${RUNNER_ROOT}/ansible-venv/bin" >> "$GITHUB_PATH"
          echo "ANSIBLE_COLLECTIONS_PATH=${RUNNER_ROOT}/ansible-collections" >> "$GITHUB_ENV"

      - name: Configure cluster SSH
        # The matrix job runs ON one of the cluster hosts. ansible
        # needs three things to reach the inventory hosts from there:
        #   1. CLUSTER_USE_LAN=1 — route through the 20G LACP fabric
        #      using lan_ip from inventory.yml. Avoids the Tailscale
        #      SSH tag:cluster → tag:cluster ACL we'd otherwise need.
        #   2. The CLUSTER_SSH_KEY private half on disk + ANSIBLE_PRIVATE_KEY_FILE
        #      so ansible authenticates to peer cluster hosts (the
        #      public half is already in mini's authorized_keys on
        #      each host per the README setup).
        #   3. PROBATORIUM_LOCAL_HOST=$(hostname -s) — inventory.yml
        #      flips ansible_connection=local for the matching host,
        #      so we don't try to SSH from msa2-server to msa2-server.
        env:
          CLUSTER_SSH_KEY: ${{ secrets.CLUSTER_SSH_KEY }}
        run: |
          RUNNER_ROOT="/tmp/actions-runner-$(hostname -s)"
          mkdir -p "${RUNNER_ROOT}/.ssh"
          chmod 700 "${RUNNER_ROOT}/.ssh"
          printf '%s\n' "$CLUSTER_SSH_KEY" > "${RUNNER_ROOT}/.ssh/id_ed25519"
          chmod 600 "${RUNNER_ROOT}/.ssh/id_ed25519"
          {
            echo "ANSIBLE_PRIVATE_KEY_FILE=${RUNNER_ROOT}/.ssh/id_ed25519"
            echo "PROBATORIUM_LOCAL_HOST=$(hostname -s)"
            echo "CLUSTER_USE_LAN=1"
            echo "CLUSTER_KNOWN_HOSTS=${RUNNER_ROOT}/.ssh/known_hosts"
          } >> "$GITHUB_ENV"
          # Rebuild the cluster host-key file for THIS run. Without it, a node
          # that has been reinstalled presents a new key, accept-new refuses the
          # change, and ansible reports UNREACHABLE — a healthy machine that
          # looks dead. See the script header.
          bash .github/scripts/refresh-cluster-known-hosts.sh \
            ansible/inventory.yml "${RUNNER_ROOT}/.ssh/known_hosts"

      - name: mage Deploy (stage refapps + validator)
        env:
          DEPLOY_COMPETITORS: none
          # Pull postgres/redis/memcached so the validate step below can
          # start them for the driver_* refapps. Without this the PR tier
          # is the ONLY tier that cannot run them: every dbservices task,
          # and the validator's own -seed-services flag, is gated on
          # VALIDATE_DBSERVICES, so the run logged
          # "dbservices | start postgres *** skipping" and twelve of
          # thirty-two cells produced no requests and no property verdicts
          # (probatorium#372). Pull-only here; containers start in
          # validate.yml. The images are cached per host, so the cost lands
          # once rather than on every ten-minute gate.
          DEPLOY_NEEDS_DBSERVICES: "1"
        run: mage Deploy

      - name: mage Validate (matrix mode)
        env:
          VALIDATE_DURATION: ${{ inputs.duration || '10m' }}
          VALIDATE_TARGET: msa2-server
          VALIDATE_MATRIX: "1"
          # See DEPLOY_NEEDS_DBSERVICES above. This is the half that
          # actually starts the containers and passes -seed-services.
          VALIDATE_DBSERVICES: "1"
        run: mage Validate

      - name: mage ValidateDiff (cross-engine + cross-arch gate)
        # NOT success(): the runs worth judging are the ones that found
        # something. mage Validate exits non-zero when any cell failed, and
        # gating the judges on success() skipped them exactly then --
        # nightly 34818888908 produced 64 complete cells, 8 of them bad, and
        # adjudicated none of it (probatorium#359). A skipped step cannot
        # turn a red run green: the failed Validate step already fails the
        # job, and this gate fails it again on the cells themselves.
        if: '!cancelled()'
        env:
          # MED divergences fail too. Without this the severity is permanently
          # advisory: 3 of the 7 invariant counters are MED and 1 is LOW, so
          # over half the table could never fail a build (probatorium#259).
          # This gate is the arch-parity check -- arm64 and x86 are required to
          # behave identically -- and a parity check that cannot fail is not a
          # check.
          VALIDATE_DIFF_STRICT: "1"
        run: mage ValidateDiff

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: matrix-pr-results-${{ github.run_id }}
          path: results/
          retention-days: 7

      - name: mage Cleanup
        if: always()
        run: mage Cleanup

  teardown:
    name: teardown cluster runners
    needs: [guard, setup, matrix]
    # always() but only if the gate let the run start in the first place
    if: always() && needs.guard.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cluster-runner-down
        # The composite reads env.CLUSTER_SSH_KEY to write the private
        # key for ansible. Scoped to this step (not the workflow) so no
        # other step's process tree ever sees the cluster key.
        env:
          CLUSTER_SSH_KEY: ${{ secrets.CLUSTER_SSH_KEY }}
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          gh-runner-pat:             ${{ secrets.RUNNER_PAT }}
