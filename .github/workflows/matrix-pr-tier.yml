name: Matrix Tier — PR

# PR-tier matrix-mode validate run: every refapp × every engine,
# 10-minute budget. Acts as the merge gate for regressions in the
# validator + refapp surface against the current celeris version.
#
# Three-stage flow:
#   1. setup     — ubuntu-latest + Tailscale + ansible. Provisions
#                  ephemeral GH Actions runners on all three cluster
#                  hosts (msa2-server, msa2-client, msr1). Mints a
#                  short-lived registration token; runners self-
#                  deregister after one job (--ephemeral).
#   2. matrix    — self-hosted celeris-cluster. Drives mage Validate
#                  with VALIDATE_MATRIX=1 against the cluster.
#   3. teardown  — ubuntu-latest + Tailscale + ansible. Kills any
#                  Runner.Listener still alive, de-registers
#                  whatever the matrix job didn't auto-clear, and
#                  rm -rf's /tmp/actions-runner-<host>/. Runs
#                  `if: always()` so cleanup happens even on cancel.
#
# Concurrency: matrix-tier-cluster groups every tier workflow so
# they serialize on the shared cluster. cancel-in-progress=false
# queues incoming PR-tier runs behind any in-flight nightly/weekend
# run — explicitly required: wait if other cluster work is in
# progress.

on:
  pull_request:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'validation/**'
      - 'report/**'
      - 'services/**'
      - 'mage_*.go'
      - 'magefile.go'
      - 'ansible/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/matrix-pr-tier.yml'
      - '.github/actions/cluster-runner-up/**'
      - '.github/actions/cluster-runner-down/**'
  workflow_dispatch:
    inputs:
      duration:
        description: per-tier-total duration (default 10m)
        required: false
        type: string
        default: 10m

permissions:
  contents: read

# All cluster-touching workflows share the same group so they run
# strictly in series. Queued runs wait, they're never cancelled.
concurrency:
  group: matrix-tier-cluster
  cancel-in-progress: false

env:
  CLUSTER_SSH_KEY: ${{ secrets.CLUSTER_SSH_KEY }}

jobs:
  setup:
    name: bootstrap cluster runners
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/cluster-runner-up
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          gh-runner-pat:             ${{ secrets.RUNNER_PAT }}
          wait-for-manifest-clear:   "true"
          wait-timeout-seconds:      "1800"

  matrix:
    name: matrix validate (PR tier)
    needs: setup
    runs-on: [self-hosted, celeris-cluster]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: Install mage
        # mage isn't in the root go.mod; install it into GOPATH/bin
        # ahead of every mage invocation. Cheap (~5s) and avoids
        # `go run github.com/magefile/mage` which needs mage in
        # go.mod.
        run: |
          go install github.com/magefile/mage@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Use bootstrap-provisioned ansible
        # runner-setup.yml provisioned an ansible-core venv at
        # /tmp/actions-runner-<host>/ansible-venv/. The runner-side
        # PATH export in nohup ./run.sh covers it, but writing
        # GITHUB_PATH here is the explicit belt-and-braces guarantee
        # that subsequent steps' shells find ansible-playbook.
        run: |
          echo "/tmp/actions-runner-$(hostname -s)/ansible-venv/bin" >> "$GITHUB_PATH"

      - name: mage Deploy (stage refapps + validator)
        env:
          DEPLOY_COMPETITORS: none
        run: mage Deploy

      - name: mage Validate (matrix mode)
        env:
          VALIDATE_DURATION: ${{ inputs.duration || '10m' }}
          VALIDATE_TARGET: msa2-server
          VALIDATE_MATRIX: "1"
        run: mage Validate

      - name: mage ValidateDiff (cross-engine + cross-arch gate)
        if: success()
        run: mage ValidateDiff

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-pr-results-${{ github.run_id }}
          path: results/
          retention-days: 7

      - name: mage Cleanup
        if: always()
        run: mage Cleanup

  teardown:
    name: teardown cluster runners
    needs: [setup, matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/cluster-runner-down
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          gh-runner-pat:             ${{ secrets.RUNNER_PAT }}
