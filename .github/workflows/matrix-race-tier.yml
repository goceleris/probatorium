name: Race Validation

# Nightly matrix-mode validate run: every refapp × every engine, 80m
# budget. Catches slow regressions the 10-minute PR tier doesn't
# have time to surface (heap drift, goroutine creep, the 99th-
# percentile invariant violations that need volume).
#
# Three-stage flow with cluster-runner bootstrap (see
# matrix-pr-tier.yml for the architecture comment).

on:
  workflow_dispatch:
    inputs:
      refapps:
        description: "Which refapps to build with the race detector (BUILD_RACE_REFAPPS): 'all', or a csv of slugs. Default all eight."
        required: false
        type: string
        default: all
      resume_from:
        description: >-
          Resume an interrupted run instead of starting a fresh matrix.
          Pass the PATH the teardown's "Resume candidates" job summary
          printed (the rescued copy under /var/lib/celeris-rescue, not the
          tmpfs original, which the purge removes). The cells already final
          there are skipped and carried into this run's document, so the
          gate still judges the whole matrix. A missing, truncated or
          wrong-arch document aborts the run in the first seconds rather
          than quietly re-running everything (probatorium#376).
          "auto" is KNOWN BROKEN (probatorium#377) — it selects the empty
          directory the run has just created, and now fails loudly instead
          of silently running the full matrix. Empty (default) runs the
          full matrix.
        required: false
        default: ""
        type: string
      duration:
        description: per-tier-total duration (default 80m)
        required: false
        type: string
        default: 1h
      stall_capture:
        description: >-
          celeris#588 stall capture with no injected fault: every refapp
          serves /debug/pprof on a side listener, and a walker read that
          waits past its stall threshold (h2c 3 s, WS 1 s) takes a
          record-only dossier inside the stall (ss snapshot and a
          side-listener goroutine dump). Off (default) on routine and
          scheduled runs; the release soak is dispatched with it on
          (celeris#588's release criterion). The dossiers are not gated:
          the gates judge the run as usual. The race tier does not need it for
          its ws_echo tolerance: the validator's -race-tier arms the ws_echo
          capture by itself (a SLOW_CLASS timeout is recorded, not failed).
          With it on, a ws_echo fire that
          times out is held open, its sender stopped, and the walker keeps
          reading while ss -tmi of both ends, the echo counters, the refapp's
          per-thread CPU masks and its GOMAXPROCS and engine counters are
          taken at t0 and t0+3 s: an I-WS-ECHO-STALL dossier whose
          ws-echo-diag.txt starts with a WS_ECHO_VERDICT= line
          (SLOW_CLASS, WEDGE_CLASS or INDETERMINATE; probatorium#481).
        required: false
        default: false
        type: boolean
      refapp_cpus:
        description: >-
          Experiment arm A (probatorium#481), off by default: confine every
          refapp on msa2-server (amd64) to this CPU list, taskset -c syntax
          (for example 2-5), at least 2 CPUs. msr1 is not touched and stays
          the control. Empty runs the refapp unconfined, as today. The arm is
          read back per cell from refapp_sched.txt (thread masks, GOMAXPROCS),
          not from this input.
        required: false
        default: ""
        type: string
      refapp_workload_hint:
        description: >-
          Experiment arm B (probatorium#481), off by default: the refapps set
          celeris.Config.WorkloadHint on msa2-server. high starts the adaptive
          engine on io_uring instead of epoll-then-switch. low is identical to
          empty at the pinned celeris sha (both start on epoll), so it is a
          no-op, not an arm. high is silently ignored when io_uring is not
          viable, for H2C and when CELERIS_ADAPTIVE_START is set, so the
          effect is read back per cell (REFAPP_IOURING in refapp_sched.txt:
          the refapp holds an io_uring instance at ready), not from this
          input. Empty runs as today. Under high the gate no longer expects
          each adaptive cell to switch (a cell started on io_uring has no
          switch to count), for the whole run including the msr1 control
          cells; under low or empty it still does.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: matrix-tier-cluster
  cancel-in-progress: false

jobs:
  setup:
    name: bootstrap cluster runners
    runs-on: ubuntu-latest
    # 25, not 15: the bootstrap fetches a 215 MiB actions-runner
    # tarball per host on a cold cache, and a slow-network day took
    # 13m05s of a 15-minute budget and cancelled the nightly
    # (probatorium#387). The cache added there removes the fetch from
    # every later run; this is the headroom for the first one.
    timeout-minutes: 25
    steps:
      - name: Refuse a malformed experiment arm before any host is touched
        # probatorium#481. mage Validate refuses the same values later; this
        # is the cheap early copy, so a typo costs seconds, not a bootstrap.
        env:
          REFAPP_CPUS: ${{ inputs.refapp_cpus }}
          REFAPP_WORKLOAD_HINT: ${{ inputs.refapp_workload_hint }}
        run: |
          set -eu
          case "$REFAPP_WORKLOAD_HINT" in
            ""|high|low) ;;
            *) echo "refapp_workload_hint must be high, low or empty, got: $REFAPP_WORKLOAD_HINT" >&2; exit 1 ;;
          esac
          if [ -n "$REFAPP_CPUS" ]; then
            # grep matches line by line: refuse a multi-line value outright.
            if [ "$(printf '%s' "$REFAPP_CPUS" | wc -l)" -ne 0 ] || ! printf '%s' "$REFAPP_CPUS" | grep -Eq '^[0-9]+(-[0-9]+)?(,[0-9]+(-[0-9]+)?)*$'; then
              echo "refapp_cpus must be a taskset -c list such as 2-5 or 0,2,4, got: $REFAPP_CPUS" >&2
              exit 1
            fi
            n=0
            for tok in $(printf '%s' "$REFAPP_CPUS" | tr ',' ' '); do
              case "$tok" in
                *-*) lo=${tok%-*}; hi=${tok#*-}
                     if [ "$hi" -lt "$lo" ]; then echo "descending range $tok in refapp_cpus" >&2; exit 1; fi
                     n=$((n + hi - lo + 1)) ;;
                *) n=$((n + 1)) ;;
              esac
            done
            if [ "$n" -lt 2 ]; then
              echo "refapp_cpus must name at least 2 CPUs, got: $REFAPP_CPUS" >&2
              exit 1
            fi
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cluster-runner-up
        # The composite reads env.CLUSTER_SSH_KEY to write the private
        # key for ansible. Scoped to this step (not the workflow) so no
        # other step's process tree ever sees the cluster key.
        env:
          CLUSTER_SSH_KEY: ${{ secrets.CLUSTER_SSH_KEY }}
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          gh-runner-pat:             ${{ secrets.RUNNER_PAT }}
          wait-for-manifest-clear:   "true"
          wait-timeout-seconds:      "1800"

  build:
    name: build -race refapps (GitHub-hosted, both arches)
    # The race runtime is cgo. The cluster nodes have no Go and each has
    # only its own C compiler, so the variants are built here, where an
    # apt install of the aarch64 cross compiler is cheap and ephemeral,
    # and shipped to the cluster as an artifact. glibc: the binaries link
    # against ubuntu-latest's, older than the nodes' 2.43, so they run.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: true
      - name: Install the aarch64 cross C compiler and its libc headers
        # libc6-dev-arm64-cross is only a Recommends of the compiler package,
        # so --no-install-recommends left the cross gcc reading the HOST's
        # /usr/include and runtime/cgo failed on bits/libc-header-start.h
        # (run 34727620439). Naming the headers keeps the install minimal
        # and makes the cross build work; proven in an ubuntu:24.04
        # container with and without the package.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Install mage
        run: |
          go install -modfile="$GITHUB_WORKSPACE/.github/tools/go.mod" tool
          "$(go env GOPATH)/bin/mage" -version
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: mage BuildRaceRefapps
        env:
          BUILD_RACE_REFAPPS: ${{ inputs.refapps || 'all' }}
          BUILD_RACE_OUT: race-refapps
        run: mage BuildRaceRefapps
      - name: Upload -race refapps
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: race-refapps-${{ github.run_id }}
          path: race-refapps/
          if-no-files-found: error
          retention-days: 3

  matrix:
    name: matrix validate (race tier)
    needs: [setup, build]
    runs-on: [self-hosted, celeris-cluster]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: true

      - name: Install mage
        # mage isn't in the root go.mod; install it into GOPATH/bin
        # ahead of every mage invocation, at the version the CI tools
        # module names and its go.sum hashes (.github/tools; Dependabot
        # bumps it), so a mage release cannot change a tier run
        # (probatorium#458). `tool` installs every tool that module
        # lists (mage, actionlint).
        run: |
          go install -modfile="$GITHUB_WORKSPACE/.github/tools/go.mod" tool
          "$(go env GOPATH)/bin/mage" -version
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Use bootstrap-provisioned ansible
        # runner-setup.yml provisioned an ansible-core venv at
        # /tmp/actions-runner-<host>/ansible-venv/ and a collections
        # path with ansible.posix at .../ansible-collections/. The
        # runner-side env exports in nohup ./run.sh cover both, but
        # writing GITHUB_PATH + GITHUB_ENV here is the explicit
        # belt-and-braces guarantee that subsequent steps' shells
        # find ansible-playbook + the collections it needs.
        run: |
          RUNNER_ROOT="/tmp/actions-runner-$(hostname -s)"
          echo "${RUNNER_ROOT}/ansible-venv/bin" >> "$GITHUB_PATH"
          echo "ANSIBLE_COLLECTIONS_PATH=${RUNNER_ROOT}/ansible-collections" >> "$GITHUB_ENV"

      - name: Configure cluster SSH
        # See matrix-pr-tier.yml for the full rationale. tl;dr:
        # CLUSTER_USE_LAN=1 routes through the LACP fabric, the
        # CLUSTER_SSH_KEY private half lets ansible reach peer hosts,
        # PROBATORIUM_LOCAL_HOST switches inventory_hostname == self
        # to ansible_connection=local.
        env:
          CLUSTER_SSH_KEY: ${{ secrets.CLUSTER_SSH_KEY }}
        run: |
          RUNNER_ROOT="/tmp/actions-runner-$(hostname -s)"
          mkdir -p "${RUNNER_ROOT}/.ssh"
          chmod 700 "${RUNNER_ROOT}/.ssh"
          printf '%s\n' "$CLUSTER_SSH_KEY" > "${RUNNER_ROOT}/.ssh/id_ed25519"
          chmod 600 "${RUNNER_ROOT}/.ssh/id_ed25519"
          {
            echo "ANSIBLE_PRIVATE_KEY_FILE=${RUNNER_ROOT}/.ssh/id_ed25519"
            echo "PROBATORIUM_LOCAL_HOST=$(hostname -s)"
            echo "CLUSTER_USE_LAN=1"
            echo "CLUSTER_KNOWN_HOSTS=${RUNNER_ROOT}/.ssh/known_hosts"
          } >> "$GITHUB_ENV"
          # Rebuild the cluster host-key file for THIS run. Without it, a node
          # that has been reinstalled presents a new key, accept-new refuses the
          # change, and ansible reports UNREACHABLE — a healthy machine that
          # looks dead. See the script header.
          bash .github/scripts/refresh-cluster-known-hosts.sh \
            ansible/inventory.yml "${RUNNER_ROOT}/.ssh/known_hosts"

      - name: Download -race refapps
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: race-refapps-${{ github.run_id }}
          path: race-refapps

      - name: mage Deploy (stage refapps + validator)
        env:
          DEPLOY_COMPETITORS: none
          # Stage the -race refapp set built by the build job. Deployed to
          # refapps-race/ alongside the normal set, never in its place.
          DEPLOY_PREBUILT_RACE_DIR: race-refapps
          # Provision docker + pull postgres/redis/memcached images so
          # the validate step (below) can start them for driver_*
          # refapps. Pull-only — containers start in validate.yml.
          DEPLOY_NEEDS_DBSERVICES: "1"
        run: mage Deploy

      - name: mage Validate (matrix mode, both archs)
        env:
          VALIDATE_DURATION: ${{ inputs.duration || '80m' }}
          VALIDATE_TARGET: both
          VALIDATE_MATRIX: "1"
          # Run the cells from refapps-race/ instead of refapps/. Those
          # refapps are -race builds: they publish celeris.race_build and
          # declare I-RACE, and the validator counts the detector's
          # "WARNING: DATA RACE" reports on their stderr. So
          # the gate judges it here and nowhere else.
          VALIDATE_RACE: "1"
          VALIDATE_RESUME_FROM: ${{ inputs.resume_from || '' }}
          # The two bench_targets (msa2-server amd64, msr1 arm64) are
          # independent hosts driven by separate validator instances
          # on msa2-client — they have no shared state. Run them in
          # parallel so the per-tier wall-clock matches inputs.duration
          # instead of 2× it.
          VALIDATE_PARALLEL: "1"
          # Per-cell budget in matrix mode is ~150s (80m / 32 cells),
          # which the duration-tiered default treats as "short smoke
          # run" → concurrency=1. That leaves the h2c / ws / sse
          # walker slices DORMANT (thresholds 10/20/20). Override to
          # 30 so all five slices fire on every cell:
          #   adv=6, h2c=3, ws=1, sse=1, markov=19.
          VALIDATE_CONCURRENCY: "30"
          # io_uring refapp worker count (celeris Workers) for the matrix.
          # Was capped to "4": at GOMAXPROCS the heaviest refapp
          # (kitchen_sink) couldn't pin 16 io_uring rings alongside its
          # heap on the 28GB amd64 host -> io_uring_setup ENOMEM at
          # startup (the 60GB arm64 host at 12 workers already survived
          # unconstrained). msa2-server's RAM upgrade (1x32GB -> 64GB
          # dual-channel, more than double msr1's already-safe headroom)
          # removes that ceiling, so this is unset (0 = leave the
          # GOMAXPROCS default, matching msr1's existing behavior) rather
          # than raised to a new guessed number. If a future host regains
          # this constraint, re-add the override with its own host-specific
          # reasoning rather than reusing this comment.
          VALIDATE_REFAPP_WORKERS: "0"
          # Start postgres / redis / memcached containers on fixed
          # ports so the driver_* refapps in matrix mode can connect
          # to real backends. Without this, driver_postgres /
          # driver_redis / driver_memcached cells produce 100% Tier 3
          # errored (refapp exits before ready).
          VALIDATE_DBSERVICES: "1"
          # celeris#588 stall capture (dispatch input stall_capture); empty
          # on a scheduled run and on a routine dispatch.
          PROBATORIUM_STALL_CAPTURE: ${{ inputs.stall_capture && '1' || '' }}
          # probatorium#481 experiment arms (dispatch inputs refapp_cpus and
          # refapp_workload_hint); empty on a scheduled run and a routine
          # dispatch. mage carries them to msa2-server only.
          PROBATORIUM_REFAPP_CPUS: ${{ inputs.refapp_cpus }}
          PROBATORIUM_REFAPP_WORKLOAD_HINT: ${{ inputs.refapp_workload_hint }}
        run: mage Validate

      - name: mage ValidateGate (absolute zero-signal gate)
        # Fails on ANY nonzero true-signal counter in ANY cell (unexpected 5xx,
        # transport errors, invariant hits, h2c hangs/crashes, adversarial
        # wrong-accepts, WS bad frames/hangs, SSE failures, tier-3 seed
        # failures, soak leaks) and on any dead or missing cell. ValidateDiff
        # below is RELATIVE (cross-engine/arch) and cannot see a defect that
        # is present on every engine; this gate can. probatorium#274.
        # NOT success(): the runs worth judging are the ones that found
        # something. mage Validate exits non-zero when any cell failed, and
        # gating the judges on success() skipped them exactly then --
        # nightly 34818888908 produced 64 complete cells, 8 of them bad, and
        # adjudicated none of it (probatorium#359). A skipped step cannot
        # turn a red run green: the failed Validate step already fails the
        # job, and this gate fails it again on the cells themselves.
        if: '!cancelled()'
        env:
          # 8 refapps x 4 engines x 2 archs when refapps=all. A csv selection
          # runs fewer; the gate still requires every planned cell to report.
          VALIDATE_GATE_EXPECT_CELLS: ${{ (inputs.refapps == '' || inputs.refapps == 'all') && '64' || '' }}
          # Every adaptive cell must promote epoll -> io_uring at least once;
          # the matrix sizes those cells so the controller's threshold is
          # reachable, and this proves it was (celeris#580).
          # Not under arm B (refapp_workload_hint high): a cell started on
          # io_uring has no epoll -> io_uring switch to count. low starts on
          # epoll like empty and still switches, so it keeps the check. The
          # check is run-wide, so under high the msr1 control cells lose it too.
          VALIDATE_GATE_EXPECT_ADAPTIVE_SWITCH: ${{ inputs.refapp_workload_hint != 'high' && '1' || '' }}
          # Every cell of this tier is a -race build and must have declared
          # I-RACE; a refapp that silently lost the detector would otherwise
          # hide behind the waiver.
          VALIDATE_GATE_EXPECT_INSTRUMENTED: "I-RACE"
          # The race tier judges liveness and records latency
          # (probatorium#481, celeris#871): a ws_echo timeout whose two-instant
          # capture said SLOW_CLASS (the server read and wrote in the window,
          # only late) is booked as ws_echo_timeout_slow and does not fail the
          # gate, up to 3 per cell and only in a cell that shows a -race build.
          # WEDGE_CLASS, INDETERMINATE (a fire with no capture included) and
          # every other violation still fail. No other tier sets this, so
          # nightly, soak, weekend and checkptr keep failing on a ws_echo
          # timeout. The validator's side is -race-tier (ansible/validate.yml,
          # on validate_race).
          VALIDATE_GATE_TOLERATE_WS_ECHO_SLOW: "1"
        run: mage ValidateGate

      - name: mage ValidateDiff (cross-engine + cross-arch gate)
        # NOT success(): the runs worth judging are the ones that found
        # something. mage Validate exits non-zero when any cell failed, and
        # gating the judges on success() skipped them exactly then --
        # nightly 34818888908 produced 64 complete cells, 8 of them bad, and
        # adjudicated none of it (probatorium#359). A skipped step cannot
        # turn a red run green: the failed Validate step already fails the
        # job, and this gate fails it again on the cells themselves.
        if: '!cancelled()'
        env:
          # MED divergences fail too. Without this the severity is permanently
          # advisory: 3 of the 7 invariant counters are MED and 1 is LOW, so
          # over half the table could never fail a build (probatorium#259).
          # This gate is the arch-parity check -- arm64 and x86 are required to
          # behave identically -- and a parity check that cannot fail is not a
          # check.
          VALIDATE_DIFF_STRICT: "1"
        run: mage ValidateDiff

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix-race-results-${{ github.run_id }}
          path: results/
          retention-days: 30

      - name: mage Cleanup
        if: always()
        run: mage Cleanup

  teardown:
    name: teardown cluster runners
    needs: [setup, matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cluster-runner-down
        # The composite reads env.CLUSTER_SSH_KEY to write the private
        # key for ansible. Scoped to this step (not the workflow) so no
        # other step's process tree ever sees the cluster key.
        env:
          CLUSTER_SSH_KEY: ${{ secrets.CLUSTER_SSH_KEY }}
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          gh-runner-pat:             ${{ secrets.RUNNER_PAT }}
