name: Weekend Soak

# Weekend matrix-mode soak: every refapp × every engine, 24h budget.
# The full-matrix soak the nightly tier doesn't have time for —
# exercises the heap-trajectory / goroutine-stability / FD-leak
# invariants that need overnight volume on the production engine
# path.
#
# Three-stage flow with cluster-runner bootstrap (see
# matrix-pr-tier.yml for the architecture comment).

on:
  # PAUSED 2026-09-15 for the v1.6.0 release: the cluster is reserved
  # for release validation, and a scheduled run would evict or delay it
  # (every tier shares the matrix-tier-cluster concurrency group, which
  # keeps only ONE pending run). workflow_dispatch is deliberately left
  # working so the release sequence can still drive each tier by hand.
  # RESTORE by uncommenting the schedule block below.
  #schedule:
  #  # Sunday 02:00, and the nightly is deliberately Mon-Sat so nothing
  #  # contends for `concurrency: matrix-tier-cluster` on this slot. Before
  #  # that split the two crons were both "0 2" and the group's one-pending-run
  #  # rule cancelled whichever queued first — the soak, every Sunday.
  #  - cron: "0 2 * * 0"

  workflow_dispatch:
    inputs:
      resume_from:
        description: >-
          Resume an interrupted run instead of starting a fresh matrix.
          Pass the PATH the teardown's "Resume candidates" job summary
          printed (the rescued copy under /var/lib/celeris-rescue, not the
          tmpfs original, which the purge removes). The cells already final
          there are skipped and carried into this run's document, so the
          gate still judges the whole matrix. A missing, truncated or
          wrong-arch document aborts the run in the first seconds rather
          than quietly re-running everything (probatorium#376).
          "auto" is KNOWN BROKEN (probatorium#377) — it selects the empty
          directory the run has just created, and now fails loudly instead
          of silently running the full matrix. Empty (default) runs the
          full matrix.
        required: false
        default: ""
        type: string
      duration:
        description: per-tier-total duration (default 24h)
        required: false
        type: string
        default: 24h

permissions:
  contents: read

concurrency:
  group: matrix-tier-cluster
  cancel-in-progress: false

jobs:
  setup:
    name: bootstrap cluster runners
    runs-on: ubuntu-latest
    # 25, not 15: the bootstrap fetches a 215 MiB actions-runner
    # tarball per host on a cold cache, and a slow-network day took
    # 13m05s of a 15-minute budget and cancelled the nightly
    # (probatorium#387). The cache added there removes the fetch from
    # every later run; this is the headroom for the first one.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cluster-runner-up
        # The composite reads env.CLUSTER_SSH_KEY to write the private
        # key for ansible. Scoped to this step (not the workflow) so no
        # other step's process tree ever sees the cluster key.
        env:
          CLUSTER_SSH_KEY: ${{ secrets.CLUSTER_SSH_KEY }}
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          gh-runner-pat:             ${{ secrets.RUNNER_PAT }}
          wait-for-manifest-clear:   "true"
          wait-timeout-seconds:      "1800"

  matrix:
    name: matrix soak (weekend tier)
    needs: setup
    runs-on: [self-hosted, celeris-cluster]
    timeout-minutes: 1740
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache: true

      - name: Install mage
        # mage isn't in the root go.mod; install it into GOPATH/bin
        # ahead of every mage invocation. Cheap (~5s) and avoids
        # `go run github.com/magefile/mage` which needs mage in
        # go.mod.
        run: |
          go install github.com/magefile/mage@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Use bootstrap-provisioned ansible
        # runner-setup.yml provisioned an ansible-core venv at
        # /tmp/actions-runner-<host>/ansible-venv/ and a collections
        # path with ansible.posix at .../ansible-collections/. The
        # runner-side env exports in nohup ./run.sh cover both, but
        # writing GITHUB_PATH + GITHUB_ENV here is the explicit
        # belt-and-braces guarantee that subsequent steps' shells
        # find ansible-playbook + the collections it needs.
        run: |
          RUNNER_ROOT="/tmp/actions-runner-$(hostname -s)"
          echo "${RUNNER_ROOT}/ansible-venv/bin" >> "$GITHUB_PATH"
          echo "ANSIBLE_COLLECTIONS_PATH=${RUNNER_ROOT}/ansible-collections" >> "$GITHUB_ENV"

      - name: Configure cluster SSH
        # See matrix-pr-tier.yml for the full rationale. tl;dr:
        # CLUSTER_USE_LAN=1 routes through the LACP fabric, the
        # CLUSTER_SSH_KEY private half lets ansible reach peer hosts,
        # PROBATORIUM_LOCAL_HOST switches inventory_hostname == self
        # to ansible_connection=local.
        env:
          CLUSTER_SSH_KEY: ${{ secrets.CLUSTER_SSH_KEY }}
        run: |
          RUNNER_ROOT="/tmp/actions-runner-$(hostname -s)"
          mkdir -p "${RUNNER_ROOT}/.ssh"
          chmod 700 "${RUNNER_ROOT}/.ssh"
          printf '%s\n' "$CLUSTER_SSH_KEY" > "${RUNNER_ROOT}/.ssh/id_ed25519"
          chmod 600 "${RUNNER_ROOT}/.ssh/id_ed25519"
          {
            echo "ANSIBLE_PRIVATE_KEY_FILE=${RUNNER_ROOT}/.ssh/id_ed25519"
            echo "PROBATORIUM_LOCAL_HOST=$(hostname -s)"
            echo "CLUSTER_USE_LAN=1"
            echo "CLUSTER_KNOWN_HOSTS=${RUNNER_ROOT}/.ssh/known_hosts"
          } >> "$GITHUB_ENV"
          # Rebuild the cluster host-key file for THIS run. Without it, a node
          # that has been reinstalled presents a new key, accept-new refuses the
          # change, and ansible reports UNREACHABLE — a healthy machine that
          # looks dead. See the script header.
          bash .github/scripts/refresh-cluster-known-hosts.sh \
            ansible/inventory.yml "${RUNNER_ROOT}/.ssh/known_hosts"

      # A 24 h soak died at 20 h 05 m with "the self-hosted runner lost
      # communication with the server" and left nothing behind that could
      # tell memory pressure from a reboot from a network event
      # (probatorium#354). This starts a strictly read-only per-host sampler
      # for the whole run so the next loss has an approach instead of a
      # cliff: available memory, load, runner RSS, the monotonic OOM and
      # link-flap counters, and the boot id that settles "did the host
      # reboot" outright.
      #
      # Safe to run during a measurement: it never signals, kills or
      # restarts anything (see ansible/host-sampler.yml), it self-terminates
      # on a hard deadline, and it costs a measured ~24 ms of CPU per sample
      # — 0.04-0.06% of one core at this cadence, against a harness whose own
      # property loop samples sixty times more often.
      #
      # Best-effort by design: the playbook warns and continues if a host
      # will not take it. Instrumentation that can fail a 24 h soak would be
      # worse than no instrumentation.
      - name: Start the host sampler (read-only, 1/min)
        continue-on-error: true
        env:
          SOAK_DURATION: ${{ inputs.duration || '24h' }}
          SAMPLER_TAG: weekend-${{ github.run_id }}
        run: mage HostSamplerStart

      - name: mage Deploy (stage refapps + validator)
        env:
          DEPLOY_COMPETITORS: none
          # Pull postgres/redis/memcached images so the soak step can
          # start them for driver_* refapps.
          DEPLOY_NEEDS_DBSERVICES: "1"
        run: mage Deploy

      - name: mage Soak (matrix mode, both archs)
        env:
          SOAK_DURATION: ${{ inputs.duration || '24h' }}
          VALIDATE_TARGET: both
          VALIDATE_MATRIX: "1"
          VALIDATE_RESUME_FROM: ${{ inputs.resume_from || '' }}
          # See matrix-nightly-tier.yml. Parallel msa2-server +
          # msr1 keeps wall-clock at inputs.duration instead of 2× it.
          VALIDATE_PARALLEL: "1"
          # 24h / 32 cells = ~45 min per cell. Bump concurrency to 50 so
          # the WS / SSE slices (thresholds 20) get plenty of walkers
          # and we exercise the full long-soak workload mix.
          VALIDATE_CONCURRENCY: "50"
          # Start dbservice containers so driver_* cells validate
          # against real postgres/redis/memcached backends.
          VALIDATE_DBSERVICES: "1"
          # Abort the matrix after 8 failed cells instead of the validator's
          # default of half the plan (probatorium#359). This tier is the one
          # where the count cap's worst case is expensive: at a 45-minute
          # cell budget, 16 failed cells is 12 hours of the 24-hour window,
          # and a run that has lost 16 cells cannot satisfy
          # VALIDATE_GATE_EXPECT_CELLS anyway -- so those 12 hours buy a
          # verdict that was already decided. Eight caps the waste at ~6
          # hours and leaves ~18 hours of runway: enough to fix the cause
          # and re-dispatch inside the same weekend. Learning the same fact
          # at hour 12 leaves none. The asymmetry is the argument -- too
          # early costs one re-dispatch, too late costs the week.
          #
          # The other tiers stay on the default: their windows are short
          # enough (80m nightly, 10m PR) that the difference is minutes, and
          # a second policy number per tier is not worth the confusion.
          PROBATORIUM_MATRIX_MAX_FAILED_CELLS: "8"
        run: mage Soak

      - name: mage ValidateGate (absolute zero-signal gate)
        # Fails on ANY nonzero true-signal counter in ANY cell (unexpected 5xx,
        # transport errors, invariant hits, h2c hangs/crashes, adversarial
        # wrong-accepts, WS bad frames/hangs, SSE failures, tier-3 seed
        # failures, soak leaks) and on any dead or missing cell. ValidateDiff
        # below is RELATIVE (cross-engine/arch) and cannot see a defect that
        # is present on every engine; this gate can. probatorium#274.
        # NOT success(): the runs worth judging are the ones that found
        # something. mage Validate exits non-zero when any cell failed, and
        # gating the judges on success() skipped them exactly then --
        # nightly 34818888908 produced 64 complete cells, 8 of them bad, and
        # adjudicated none of it (probatorium#359). A skipped step cannot
        # turn a red run green: the failed Validate step already fails the
        # job, and this gate fails it again on the cells themselves.
        if: '!cancelled()'
        env:
          VALIDATE_GATE_EXPECT_CELLS: "64" # 8 refapps x 4 engines x 2 archs
          # Every adaptive cell must promote epoll -> io_uring at least once;
          # the matrix sizes those cells so the controller's threshold is
          # reachable, and this proves it was (celeris#580).
          VALIDATE_GATE_EXPECT_ADAPTIVE_SWITCH: "1"
          VALIDATE_GATE_REQUIRE_SOAK: "1" # every cell must carry its soak block (probatorium#281)
          # 1 h cells idle the refapp twice, so every cell must have declared and
          # judged I-MEM-2; the waiver that excuses the 150 s nightly must not
          # be able to excuse the soak.
          VALIDATE_GATE_EXPECT_INSTRUMENTED: "I-MEM-2"
        run: mage ValidateGate

      - name: mage ValidateDiff (cross-engine + cross-arch gate)
        # NOT success(): the runs worth judging are the ones that found
        # something. mage Validate exits non-zero when any cell failed, and
        # gating the judges on success() skipped them exactly then --
        # nightly 34818888908 produced 64 complete cells, 8 of them bad, and
        # adjudicated none of it (probatorium#359). A skipped step cannot
        # turn a red run green: the failed Validate step already fails the
        # job, and this gate fails it again on the cells themselves.
        if: '!cancelled()'
        env:
          # MED divergences fail too. Without this the severity is permanently
          # advisory: 3 of the 7 invariant counters are MED and 1 is LOW, so
          # over half the table could never fail a build (probatorium#259).
          # This gate is the arch-parity check -- arm64 and x86 are required to
          # behave identically -- and a parity check that cannot fail is not a
          # check.
          VALIDATE_DIFF_STRICT: "1"
        run: mage ValidateDiff

      # Before the upload, so the series travels with the run's own results.
      # `continue-on-error` rather than `|| true`: a failure here is visible
      # as a failed step but cannot turn a gate verdict into a teardown
      # failure. On the path this exists for — the runner died — this step
      # never runs at all, and the teardown job's forensics collection
      # retrieves the same files instead.
      - name: Stop the host sampler and collect its series
        if: always()
        continue-on-error: true
        run: mage HostSamplerStop

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: matrix-weekend-results-${{ github.run_id }}
          path: results/
          retention-days: 90

      - name: mage Cleanup
        if: always()
        run: mage Cleanup

  teardown:
    name: teardown cluster runners
    needs: [setup, matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cluster-runner-down
        # The composite reads env.CLUSTER_SSH_KEY to write the private
        # key for ansible. Scoped to this step (not the workflow) so no
        # other step's process tree ever sees the cluster key.
        env:
          CLUSTER_SSH_KEY: ${{ secrets.CLUSTER_SSH_KEY }}
        with:
          tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          gh-runner-pat:             ${{ secrets.RUNNER_PAT }}
          # The composite collects host forensics BEFORE it reclaims
          # anything, and labels the capture with how the matrix job ended.
          # `failure` here with no matrix results artifact is the lost-runner
          # signature the whole capture exists for (probatorium#354).
          forensics-reason:          "matrix=${{ needs.matrix.result }}"
