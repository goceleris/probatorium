name: Poll celeris release

# Polls the Go module proxy every 15 minutes for new
# github.com/goceleris/celeris versions. When a new version is
# observed the workflow fires a `celeris-release` repository_dispatch
# carrying the version string — the validate.yml workflow listens
# for that event.
#
# State is stored on an orphan `state` branch in
# .state/last-seen-celeris.txt. First-run behaviour: if the branch or
# file is missing/empty, treat the current proxy tip as "seen" without
# dispatching — the loop primes itself and only fires on the NEXT new
# version.
#
# Manual run with a `version` input bypasses the proxy poll entirely
# and dispatches directly, for testing the downstream pipeline.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Force-dispatch this celeris version (bypasses proxy poll)
        required: false
        type: string

permissions:
  contents: write

jobs:
  poll:
    name: Poll proxy.golang.org
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve target version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL_VERSION}" ]; then
            echo "Manual dispatch: bypassing proxy, version=${MANUAL_VERSION}"
            echo "version=${MANUAL_VERSION}" >> "$GITHUB_OUTPUT"
            echo "dispatch=true" >> "$GITHUB_OUTPUT"
            echo "update_state=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(gh api -H 'Accept: text/plain' \
              "/repos/goceleris/celeris/git/refs/tags" \
              --jq '.[].ref' 2>/dev/null \
            | sed 's|refs/tags/||' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n1 || true)
          if [ -z "${latest}" ]; then
            echo "Falling back to proxy.golang.org list"
            latest=$(curl -fsSL \
              "https://proxy.golang.org/github.com/goceleris/celeris/@v/list" \
              | sort -V | tail -n1)
          fi
          if [ -z "${latest}" ]; then
            echo "::error::Could not resolve latest celeris version"
            exit 1
          fi
          echo "version=${latest}" >> "$GITHUB_OUTPUT"
          echo "update_state=true" >> "$GITHUB_OUTPUT"
          echo "Latest celeris version: ${latest}"

      - name: Read last-seen version
        id: lastseen
        run: |
          set -euo pipefail
          mkdir -p .state
          if git fetch origin state --depth=1 2>/dev/null; then
            git checkout origin/state -- .state/last-seen-celeris.txt 2>/dev/null \
              || echo "" > .state/last-seen-celeris.txt
          else
            echo "state branch missing — first run"
            echo "" > .state/last-seen-celeris.txt
          fi
          last=$(tr -d '[:space:]' < .state/last-seen-celeris.txt || true)
          echo "last=${last}" >> "$GITHUB_OUTPUT"
          echo "Last seen: '${last}'"

      - name: Decide dispatch
        id: decide
        env:
          NEW: ${{ steps.resolve.outputs.version }}
          LAST: ${{ steps.lastseen.outputs.last }}
          MANUAL: ${{ steps.resolve.outputs.dispatch }}
        run: |
          set -euo pipefail
          if [ "${MANUAL}" = "true" ]; then
            echo "dispatch=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${LAST}" ]; then
            echo "First run — prime state, do not dispatch"
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${NEW}" = "${LAST}" ]; then
            echo "No change (${NEW} == ${LAST})"
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "New version detected: ${LAST} -> ${NEW}"
          echo "dispatch=true" >> "$GITHUB_OUTPUT"

      - name: Update state branch
        if: steps.resolve.outputs.update_state == 'true'
        env:
          NEW: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          tmp=$(mktemp -d)
          mkdir -p "${tmp}/.state"
          echo "${NEW}" > "${tmp}/.state/last-seen-celeris.txt"
          (
            cd "${tmp}"
            git init -q -b state
            git add .state/last-seen-celeris.txt
            git commit -q -m "state: last-seen celeris ${NEW}"
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push -f origin state
          )
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Dispatch celeris-release
        if: steps.decide.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type=celeris-release \
            -f "client_payload[version]=${NEW}"
          echo "Dispatched celeris-release for ${NEW}"
