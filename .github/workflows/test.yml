name: Test

# Runs `go test -race` against the root module and every per-adapter
# go.mod under servers/. The rust / bun / fastapi conformance tests
# live in the root module (servers/rust_test.go etc.) and SKIP
# gracefully when their toolchain isn't installed — so a vanilla
# GitHub-hosted runner needs no special handling.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  root:
    name: root module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache: true
      - name: go test
        run: go test -count=1 -race -timeout=5m ./...

  # Every Go module under servers/ belongs in this list. `go test ./...`
  # loads the module and compiles every package, test files or not, so a
  # leg is also the adapter's build check. The bench builds each adapter
  # with a plain `go build` in its own directory, and the adapters that
  # `replace` the root module inherit its requirements: a root bump that
  # dependabot does not carry into one of them leaves it untidy and
  # unbuildable. gnet was missing from this list, which let that happen
  # twice (b9ebe57, then #356 -> probatorium#399), with nbio the second time.
  adapters:
    name: servers/${{ matrix.adapter }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter:
          - celeris
          - chi
          - echo
          - fasthttp
          - fiber
          - gin
          - gnet
          - gorilla_ws
          - hertz
          - iris
          - nbio
          - stdhttp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache: true
          cache-dependency-path: servers/${{ matrix.adapter }}/go.sum
      - name: go test
        working-directory: servers/${{ matrix.adapter }}
        run: go test -count=1 -race -timeout=5m ./...

  # The validation refapps are separate modules too. The shared
  # /debug/vars helper has real tests (it boots a celeris server); each
  # refapp is built + vetted so a helper API change cannot ship broken.
  refapps:
    name: validation/refapp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache: true
          cache-dependency-path: validation/refapp/internal/debugvars/go.sum
      - name: go test (internal/debugvars)
        working-directory: validation/refapp/internal/debugvars
        run: go test -count=1 -race -timeout=5m ./...
      # The shared SIGTERM/SIGINT exit helper (probatorium#473): the real-signal
      # and source-scan tests live in its own module, which every refapp and
      # servers/celeris link. It needs a Linux runner for the process tests.
      - name: go test (internal/exitguard)
        working-directory: internal/exitguard
        run: go test -count=1 -race -timeout=5m ./...
      - name: go build + vet (every refapp)
        run: |
          for d in validation/refapp/*/; do
            case "$d" in */internal/) continue ;; esac
            echo "== $d"
            (cd "$d" && go build ./... && go vet ./...)
          done

  # The mage build tag hides an entire layer from `go test ./...`: eleven
  # source files (the bench driver, the release gate, the cluster
  # orchestration, publish, the validate targets) and the 50-odd tests
  # written against them. Lint only *compiles* the magefiles, so the
  # tests never executed anywhere -- including the ones that pin the
  # report schema version, which is exactly the constant a rebase has
  # already auto-merged wrong once. Runs over ./... rather than the two
  # packages that carry mage files today, so a mage-tagged test added to
  # any other package is covered the moment it lands.
  mage:
    name: mage-tagged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache: true
      - name: go test -tags mage
        run: go test -count=1 -race -tags mage -timeout=10m ./...

  # The zombie guard (probatorium#415), the tests that hold the Tier 3
  # refapp teardown to reaping, and the local driver's tests that it signals
  # only processes it has not reaped, run with -v so the log names each of
  # them and carries the guard's verdict line. The root module job runs them
  # too, but without -v, and a passing package prints only "ok": it cannot
  # show that the tests ran rather than skipped, that the Linux-only test
  # (TestLocal_StopSweepRunsBeforeTheReap) ran at all, or that the guard
  # counted this binary's children through /proc, the Linux path. So green
  # here must mean: no FAIL, no SKIP (a skipped control is an absent one),
  # every required test printed a PASS line, and the guard passed via /proc.
  zombieguard:
    name: validation zombie guard (Linux /proc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache: true
      - name: go test -race -v, tallied
        run: |
          out="$RUNNER_TEMP/zombieguard.out"
          rc=0
          go test -count=1 -race -v -timeout=10m \
            -run '^(TestZombieGuard_.*|TestReplayOneSeed_.*|TestDriveTier3_PassingSeeds|TestDriveTier3_TeardownIsTallied|TestLocal_SignalReachesForkedChildren|TestLocal_NoSignalOnceTheExitIsRecorded|TestLocal_WaitAfterACancelledWaitSendsNothing|TestLocal_OverlappingWaitsGetOneResult|TestLocal_StopSweepRunsBeforeTheReap|TestSSH_SignalIsBounded)$' \
            ./validation/ ./validation/remote/ > "$out" 2>&1 || rc=$?
          cat "$out"
          pass=$(grep -c -- '--- PASS: ' "$out" || true)
          fail=$(grep -c -- '--- FAIL: ' "$out" || true)
          skip=$(grep -c -- '--- SKIP: ' "$out" || true)
          echo "zombie guard tally: PASS=$pass FAIL=$fail SKIP=$skip go-test-rc=$rc"
          bad=0
          if [ "$rc" -ne 0 ]; then echo "::error::go test exited $rc"; bad=1; fi
          if [ "$fail" -ne 0 ]; then echo "::error::$fail FAIL line(s)"; bad=1; fi
          if [ "$skip" -ne 0 ]; then echo "::error::$skip SKIP line(s): a skipped control proves nothing"; bad=1; fi
          for t in \
            TestZombieGuard_ParsesProcStat \
            TestZombieGuard_ParsesPS \
            TestZombieGuard_Verdicts \
            TestZombieGuard_Verdicts/children_cannot_be_listed \
            TestZombieGuard_Verdicts/a_zombie_outlasts_the_settle_window \
            TestZombieGuard_Verdicts/a_zombie_is_reaped_inside_the_settle_window \
            TestZombieGuard_Verdicts/no_children_at_all \
            TestZombieGuard_Verdicts/a_child_still_running_at_the_first_sample_exits_unreaped \
            TestZombieGuard_Verdicts/a_child_is_still_running_at_the_end_of_the_settle_window \
            TestZombieGuard_Verdicts/a_running_child_is_reaped_inside_the_settle_window \
            TestZombieGuard_SeesAnUnreapedChild \
            TestZombieGuard_SeesAnUnreapedChild/proc \
            TestZombieGuard_SeesAnUnreapedChild/ps \
            TestReplayOneSeed_ReapsTheRefapp \
            TestReplayOneSeed_StopEscalatesToSIGKILL \
            TestReplayOneSeed_StopEscalatesToSIGKILL/refapp_that_exits_on_SIGTERM \
            TestReplayOneSeed_StopEscalatesToSIGKILL/refapp_that_ignores_SIGTERM \
            TestReplayOneSeed_UnknownPIDFailsAtOnce \
            TestReplayOneSeed_TeardownFailureIsReported \
            TestReplayOneSeed_TeardownFailureIsReported/passing_replay_becomes_errored \
            TestReplayOneSeed_TeardownFailureIsReported/failing_replay_keeps_its_exit_code \
            TestDriveTier3_PassingSeeds \
            TestDriveTier3_TeardownIsTallied \
            TestLocal_SignalReachesForkedChildren \
            TestLocal_SignalReachesForkedChildren/foreground_child \
            TestLocal_SignalReachesForkedChildren/background_child \
            TestLocal_SignalReachesForkedChildren/child_that_ignores_SIGTERM \
            TestLocal_NoSignalOnceTheExitIsRecorded \
            TestLocal_NoSignalOnceTheExitIsRecorded/a_Wait_timed_out_then_the_process_exited_on_its_own \
            TestLocal_NoSignalOnceTheExitIsRecorded/the_run_context_ended_as_at_the_end_of_a_Tier_1_cell \
            TestLocal_WaitAfterACancelledWaitSendsNothing \
            TestLocal_OverlappingWaitsGetOneResult \
            TestLocal_StopSweepRunsBeforeTheReap \
            TestSSH_SignalIsBounded
          do
            if ! grep -q -F -- "--- PASS: $t (" "$out"; then
              echo "::error::$t did not PASS (removed, renamed or not run)"
              bad=1
            fi
          done
          if ! grep -q -F 'zombie guard (probatorium#415): PASS, 0 unreaped children of this test binary' "$out" \
            || ! grep -q -F 'listed via /proc after' "$out"; then
            echo "::error::the zombie guard did not print a PASS verdict counted through /proc"
            bad=1
          fi
          exit "$bad"

  # The Snapshot field guard (probatorium#395): every properties.Snapshot
  # field the root module reads must be written somewhere in it, or the
  # predicate reading it compares zero with zero and cannot fail. It needs
  # golang.org/x/tools for full type information, so it is a module of its
  # own -- a requirement of the root module would reach all twelve adapter
  # modules through their replace lines -- and it type-checks the ROOT
  # module's packages from source. Its tests are the guard and the guard's
  # own controls, so green must mean each of them ran and passed: the tally
  # fails on any FAIL, on any SKIP (a skipped control is an absent one), and
  # on a required test that never printed a PASS line because it was
  # removed, renamed or not run.
  fieldguard:
    name: validation/properties/fieldguard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache: true
          cache-dependency-path: |
            go.sum
            validation/properties/fieldguard/go.sum
      - name: go test -v, tallied
        working-directory: validation/properties/fieldguard
        run: |
          out="$RUNNER_TEMP/fieldguard.out"
          rc=0
          go test -count=1 -v -timeout=10m ./... > "$out" 2>&1 || rc=$?
          cat "$out"
          pass=$(grep -c -- '--- PASS: ' "$out" || true)
          fail=$(grep -c -- '--- FAIL: ' "$out" || true)
          skip=$(grep -c -- '--- SKIP: ' "$out" || true)
          echo "fieldguard tally: PASS=$pass FAIL=$fail SKIP=$skip go-test-rc=$rc"
          bad=0
          if [ "$rc" -ne 0 ]; then echo "::error::go test exited $rc"; bad=1; fi
          if [ "$fail" -ne 0 ]; then echo "::error::$fail FAIL line(s)"; bad=1; fi
          if [ "$skip" -ne 0 ]; then echo "::error::$skip SKIP line(s): a skipped control proves nothing"; bad=1; fi
          for t in \
            TestEveryFieldReadFromASnapshotHasAWriter \
            TestGuardControlVacuity \
            TestGuardControlVacuity/blind_to_reads_in_validation_properties \
            TestGuardControlVacuity/blind_to_reads_in_validation_checker \
            TestGuardControlVacuity/blind_to_reads_in_validation \
            TestGuardControlVacuity/blind_to_writes_in_validation_checker \
            TestGuardControlVacuity/blind_to_writes_in_validation \
            TestGuardControlVacuity/a_positive_control_loses_its_writer \
            TestGuardControlVacuity/a_tree_that_does_not_type_check_is_refused \
            TestGuardControlWriteSide \
            TestGuardControlWriteSide/writer_removed \
            TestGuardControlWriteSide/writer_moved_to_a_lookalike_struct \
            TestGuardControlWriteSide/writer_stores_a_constant_zero \
            TestGuardControlReadSide \
            TestGuardControlReadSide/read_by_range_over_ctx_History \
            TestGuardControlReadSide/read_by_index_into_ctx_History \
            TestGuardControlReadSide/read_through_a_struct_field_chain \
            TestGuardControlReadSide/read_through_a_slice_parameter \
            TestGuardControlReadSide/read_through_a_map_of_pointers \
            TestGuardControlReadSide/read_as_a_promoted_field \
            TestGuardControlReadSide/read_through_atomic_Load_of_its_address \
            TestGuardControlReadSide/read_in_a_mage_tagged_file \
            TestGuardControlReadSide/fed_only_by_a_test_file \
            TestGuardControlReadSide/set_only_to_a_constant_zero \
            TestGuardControlReadSide/fed_by_an_assignment_into_History \
            TestGuardControlReadSide/fed_by_an_increment \
            TestGuardControlReadSide/fed_by_the_second_operand_of_a_tuple_assignment \
            TestGuardControlReadSide/fed_by_a_composite_literal \
            TestGuardControlReadSide/fed_by_atomic_Add \
            TestGuardControlReadSide/a_lookalike_read_is_not_a_Snapshot_read
          do
            if ! grep -q -F -- "--- PASS: $t (" "$out"; then
              echo "::error::$t did not PASS (removed, renamed or not run)"
              bad=1
            fi
          done
          exit "$bad"

  # govulncheck over every module whose code is ours: the root module,
  # the celeris adapter, and the validation refapps with their shared
  # debugvars helper. It fails only when that code can reach a vulnerable
  # symbol. The competitor adapters under servers/ are not scanned: their
  # code and dependency choices belong to other projects, dependabot
  # already bumps their pins weekly, and a verdict on them would gate this
  # repo on advisories it cannot fix. The testdata demo modules exist only
  # to be broken on purpose. Each module is scanned even after one fails,
  # so one run reports all of them. The scanner is pinned to a release;
  # the vulnerability database is fetched live on every run.
  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: govulncheck (every module of ours)
        run: |
          fail=0
          n=0
          for d in . servers/celeris internal/exitguard validation/refapp/internal/debugvars validation/refapp/*/; do
            case "$d" in */internal/) continue ;; esac
            test -f "$d/go.mod" || { echo "::error::$d has no go.mod"; fail=1; continue; }
            n=$((n + 1))
            echo "::group::govulncheck $d"
            (cd "$d" && govulncheck ./...) || { echo "::error::govulncheck failed in $d"; fail=1; }
            echo "::endgroup::"
          done
          echo "scanned $n modules"
          exit "$fail"

  # ansible/load-check.sh loads every playbook, tasks file and role task
  # list the way ansible-playbook does on the cluster. include_tasks and
  # include_role are dynamic, so `--syntax-check bench.yml` never opens
  # tasks/run_bench_cell.yml: an apostrophe in a comment inside that file's
  # free-form shell block failed every Benchmark Tier dispatch at its first
  # cell (probatorium#411; runs 36306263697 and 36306273363) while every job
  # here stayed green. The script imports each tasks file statically, so
  # ansible parses every task in it. ansible-core and ansible.posix are the
  # versions ansible/runner-setup.yml pins on the cluster
  # (workflow_ansible_load_test.go keeps them equal).
  ansible:
    name: ansible loads every playbook and tasks file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ansible-core and ansible.posix (the cluster pins)
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install --quiet "ansible-core==2.21.4"
          # Galaxy first, bounded and retried; then the collection's GitHub
          # source at the commit runner-setup.yml pins, as the cluster does.
          ok=0
          for i in 1 2 3; do
            if timeout 120 "$RUNNER_TEMP/ansible/bin/ansible-galaxy" collection install --timeout 30 \
                -p "$RUNNER_TEMP/collections" "ansible.posix:==2.2.2"; then
              ok=1
              break
            fi
            echo "galaxy attempt $i failed"
            sleep 10
          done
          if [ "$ok" != 1 ]; then
            timeout 300 "$RUNNER_TEMP/ansible/bin/ansible-galaxy" collection install --force \
              -p "$RUNNER_TEMP/collections" \
              "git+https://github.com/ansible-collections/ansible.posix.git,e98d9a0756458be1ac710988498000973889075c"
          fi
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"
      - name: ansible/load-check.sh
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/collections
        run: bash ansible/load-check.sh

  # Fan-in over every job above so branch protection can require ONE
  # stable check name ("ci-ok") instead of enumerating the adapter
  # matrix — adding or removing an adapter then never silently drops a
  # required check. `if: always()` makes this job run (and fail) when an
  # upstream job failed or was cancelled instead of being skipped along
  # with it. A skipped upstream job would pass this check, so every job
  # listed in needs must stay unconditional on push + pull_request.
  ci-ok:
    name: ci-ok
    needs: [root, adapters, refapps, mage, zombieguard, fieldguard, vulncheck, ansible]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All Test jobs succeeded
        run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
