---
# Distributed bench: server (celeris OR competitor) on bench_target, the
# Go runner (driving loadgen in-process) on msa2-client, traffic over the
# 20G LACP fabric (lan_ip, NEVER tailnet/Tailscale). Loops over every
# entry in competitor_set, interleaving the launches so a transient
# cluster blip does not bias one framework over another. Each cell runs
# the runner once (-runs 1) and the runner expands the scenario catalogue
# against the remote SUT.
#
# Each cell drives the Go runner (cmd/runner) once against the remote
# SUT; the runner expands the full scenario catalogue itself (method /
# path / protocol / connections / body are derived per scenario), so the
# old single-scenario loadgen knobs (bench_url_path / bench_h2 /
# bench_h2c_upgrade / bench_connections) no longer apply on the bench
# path and have been dropped.
#
# Required extra-vars:
#   bench_target          single host name from [bench_targets]
#                         (msa2-server | msr1) — for both archs, run
#                         the playbook twice with different bench_target.
#   competitor_set        comma-separated list of competitor slugs to
#                         exercise this bench. Each slug must already be
#                         staged under {{ bench_root }}/competitors/<slug>
#                         by `ansible-playbook deploy.yml`.
#   bench_port            port the server binds (default: 8080)
#   bench_duration_seconds  runner -duration per scenario, INTEGER seconds
#                         (default: 30). All durations cross the mage→
#                         ansible boundary as integer seconds — the old
#                         Go-duration strings needed a unit-stripping
#                         regex that read "1m30s" as 130.
#   bench_warmup_seconds  runner -warmup per scenario, integer seconds
#                         (default: 5)
#   bench_cells           cell glob forwarded to runner -cells over
#                         "<scenario>/<competitor>" (default: *). The
#                         server half is the competitor slug.
#   bench_rated           when true (1), the runner also drives a Gil-Tene
#                         rated (closed-loop, CO-corrected) sweep per cell and
#                         emits latency_at_slo for the regression gate. Default
#                         false; opt-in via BENCH_RATED=1 (budget issue #166).
#   bench_rated_duration_seconds  measurement window per rated pass,
#                         integer seconds (default: 30).
#   bench_scenario_count  realized scenario count of the busiest column
#                         (mage derives it from the runner's dry-run
#                         schedule); sizes the per-cell budget fallback
#                         (default: 40, covering the full catalogue).
#   bench_cell_budget_seconds  projected wall-clock of one full column
#                         pass (budget.ColumnWallClock: saturation +
#                         rated sweep + cooldown/overhead, x scenario
#                         count). run_bench_cell.yml derives the mpstat
#                         window and the runner hang-guard timeout from
#                         it. When absent (direct playbook invocation)
#                         the cell task recomputes the same formula from
#                         the *_seconds vars above.
#   results_local_dir     where to fetch outputs back to on the Mac
#
# Single-pass: the bench runs exactly ONE pass over the competitor set
# (run_index 0 only). The multi-run outer loop (range(0, bench_runs) x
# competitors with the 00-/01-/... cell-dir prefixes) was removed — if
# more passes are wanted, more benchmarks are scheduled. Within the one
# pass the competitors are still cycled [A,B,C,...,Z] so each sees the
# same coarse-grained slice of cluster state (kernel cache warmth,
# port-pool depletion, neighbour interference). The runner is invoked
# with -runs 1 per cell; it adds only the scenario inner loop within
# each cell.

- name: Stage bench-run state
  hosts: cluster
  gather_facts: true
  tags: stage
  tasks:
    - name: Filter to selected hosts
      ansible.builtin.meta: end_host
      when: >
        (inventory_hostname != bench_target) and
        (inventory_hostname != "msa2-client")

    - name: Ensure transient dirs
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ bench_root }}"
        - "{{ results_root }}"

    - name: Resolve effective competitor list
      ansible.builtin.set_fact:
        bench_competitors: "{{ competitor_set.split(',') | map('trim') | list }}"

    - name: Per-run output dir (one per playbook invocation)
      ansible.builtin.set_fact:
        bench_run_dir: "{{ results_root }}/{{ lookup('pipe', 'date +%Y%m%dT%H%M%S') }}-bench-{{ bench_target }}"

    - name: Create per-run output dir
      ansible.builtin.file:
        path: "{{ bench_run_dir }}"
        state: directory
        mode: '0755'

    - name: Resolve bench target LAN IP from inventory (loadgen side only)
      # lan_ip is the DHCP-pinned 20G fabric address. Using a hostname
      # here would resolve via Tailscale MagicDNS to the tailnet IP and
      # route over WireGuard, defeating the cluster fabric. NEVER use
      # the inventory hostname here.
      ansible.builtin.set_fact:
        target_ip: "{{ hostvars[bench_target].lan_ip }}"
      when: inventory_hostname == "msa2-client"

    # ---------- driver-backend services (bench target only) ----------
    # Driver-* scenarios (driver-pg-read / driver-redis-get / driver-mc-get /
    # driver-session-rw) need pg/redis/mc reachable from the SUT, which runs on
    # the bench target. The dbservices role (deploy.yml) only INSTALLS docker +
    # pulls images; nobody starts the containers on the bench path (the runner
    # is invoked with -services none because it lives on the loadgen host, which
    # has no docker). So start + seed them here, on the bench target, mirroring
    # validate.yml's fixed-port containers. The SUT env (run_bench_cell.yml)
    # points the driver clients at these same ports.
    #
    # Gated on bench_needs_dbservices (mage Bench sets it when a driver-* cell
    # is in scope) so a Go-only / non-driver bench stays docker-free. Fixed
    # ports match validate.yml + the driver refapp defaults:
    #   postgres 127.0.0.1:54321  redis 127.0.0.1:63791  memcached 127.0.0.1:21211
    - name: dbservices | open docker socket for the bench user
      become: true
      ansible.builtin.file:
        path: /var/run/docker.sock
        mode: '0666'
      when:
        - inventory_hostname == bench_target
        - bench_needs_dbservices | default(false) | bool

    - name: dbservices | start postgres + redis + memcached (fixed ports)
      ansible.builtin.shell: |
        docker rm -f -v probatorium-pg probatorium-redis probatorium-mc 2>/dev/null
        docker run -d --rm --name probatorium-pg -p 127.0.0.1:54321:5432 \
          -e POSTGRES_USER=bench -e POSTGRES_PASSWORD=bench -e POSTGRES_DB=bench \
          postgres:17-alpine -c synchronous_commit=off
        docker run -d --rm --name probatorium-redis -p 127.0.0.1:63791:6379 redis:8.2-alpine
        docker run -d --rm --name probatorium-mc -p 127.0.0.1:21211:11211 memcached:1.6.41-alpine
      args:
        executable: /bin/bash
      changed_when: true
      when:
        - inventory_hostname == bench_target
        - bench_needs_dbservices | default(false) | bool

    - name: dbservices | wait for postgres ready
      ansible.builtin.shell: |
        for i in $(seq 1 30); do
          docker exec probatorium-pg pg_isready -U bench -d bench >/dev/null 2>&1 && exit 0
          sleep 1
        done
        echo "postgres not ready in 30s" >&2
        exit 1
      args:
        executable: /bin/bash
      changed_when: false
      when:
        - inventory_hostname == bench_target
        - bench_needs_dbservices | default(false) | bool

    - name: dbservices | seed the driver fixture set (runner one-shot mode)
      # Reuses the EXACT services.Seed fixtures (10k-row users table, demo-key,
      # per-user sessions) via the runner's -seed-services mode, so remote
      # driver cells hit byte-identical data to a local in-process run. Runs on
      # the bench target where both the containers and the staged runner live.
      #
      # Retried: pg_isready (the wait step above) reports ready as soon as the
      # postmaster accepts connections, but a freshly-initialised postgres
      # RESTARTS once after running its init scripts, so the first real auth
      # connection can get "connection reset by peer" — especially on the slower
      # arm64 box where that init window is wider. Retrying the actual seed
      # connection (not just the probe) closes that gap deterministically.
      ansible.builtin.shell: |
        cd {{ bench_root }}
        ./runner -seed-services \
          "postgres=postgres://bench:bench@127.0.0.1:54321/bench?sslmode=disable,redis=127.0.0.1:63791,memcached=127.0.0.1:21211"
      args:
        executable: /bin/bash
      register: seed_result
      until: seed_result.rc == 0
      retries: 10
      delay: 3
      changed_when: true
      when:
        - inventory_hostname == bench_target
        - bench_needs_dbservices | default(false) | bool

# Outer loop over [run_index × competitor] cycles is driven from the
# control node via include_tasks. This block runs once per (run, comp)
# pair — server starts on bench_target, mpstat samplers spin up on both
# sides, loadgen runs to completion on msa2-client, then everything
# winds down before the next pair begins.
- name: Run interleaved bench (per-iteration server lifecycle)
  hosts: cluster
  gather_facts: false
  tags: run
  # A bench without its bench target is meaningless — and worse than a
  # failure: when ansible drops an UNREACHABLE host it keeps running the
  # play on the survivors, every bench_target-conditioned task silently
  # skips, and the loadgen-side runner gates on STALE hostvars (2026-06-12:
  # a become-prompt timeout dropped msa2-server after the axum column; its
  # orphaned SUT was then benched under five other columns' labels). Abort
  # the whole play the moment any host drops.
  any_errors_fatal: true
  max_fail_percentage: 0
  tasks:
    - name: Filter to selected hosts
      ansible.builtin.meta: end_host
      when: >
        (inventory_hostname != bench_target) and
        (inventory_hostname != "msa2-client")

    - name: Build single-pass schedule (run_index 0 x competitor)
      ansible.builtin.set_fact:
        # The bench ALWAYS runs exactly one pass. The multi-run outer loop
        # (range(0, bench_runs) x competitors, producing the 00-/01-/...
        # cell-dir prefixes) was removed — if more passes are wanted, more
        # benchmarks are scheduled. run_index is hard-pinned to 0 so the
        # cell-dir prefix stays "00-" for every cell.
        # [(0,A),(0,B),...,(0,Z)]
        bench_schedule: >-
          {{ [0] | product(bench_competitors) | list }}

    - name: Iterate bench cells
      ansible.builtin.include_tasks: tasks/run_bench_cell.yml
      loop: "{{ bench_schedule }}"
      loop_control:
        loop_var: cell
        label: "run={{ cell.0 }} comp={{ cell.1 }}"

- name: Collect bench artefacts
  hosts: cluster
  gather_facts: false
  tags: cleanup
  tasks:
    - name: Filter to selected hosts
      ansible.builtin.meta: end_host
      when: >
        (inventory_hostname != bench_target) and
        (inventory_hostname != "msa2-client")

    - name: Stop any leftover bench processes (both hosts)
      become: true
      # Leak guard, not the primary teardown: it runs on BOTH selected
      # hosts (server/observer on the bench target; runner/loadgen on
      # msa2-client) strictly AFTER the run play, when every per-cell
      # `timeout --foreground` has already TERM-then-KILLed its runner —
      # so the name-pkills below only ever reach processes that escaped
      # their cell (an aborted play, an orphaned sampler). They send one
      # TERM per process; a leaked runner handles it by flushing its
      # results best-effort. Do NOT add a second kill pass for the
      # runner here: a TERM landing on a runner that already absorbed
      # its hang-guard TERM trips its second-signal force-exit and can
      # truncate the final results write (the v3.8 double-signal bug).
      #
      # CRITICAL: every literal occurrence of the staging dir name in
      # this script must be BRACKET-PROTECTED. `pkill -f` matches each
      # process's full argv, and the bash session running this pkill
      # carries the script body in its own argv. A plain mention of
      # the substring (even in a comment) self-matches and SIGTERMs
      # the wrapper before `true` runs (rc=-15).
      ansible.builtin.shell: |
        for name in server runner loadgen observer; do
          pkill -x "$name" 2>/dev/null
        done
        pkill -f "[c]ompetitors/" 2>/dev/null
        pkill -KILL -f "[u]vicorn" 2>/dev/null
        pkill -KILL -f "[g]unicorn" 2>/dev/null
        # Final port-holder sweep: kill EVERY pid still bound to the bench port,
        # repeat until free. The respawning [u]vicorn/[g]unicorn master is handled
        # by the name-pkill above (matches master + all workers). Bracket form is
        # deliberate: the whole script sits in the shell argv, so a bare process
        # name in a comment would be matched by its own pkill -f. We do NOT kill
        # the parents of holders: an ansible-started server can be reparented to
        # the ansible session, and killing that parent SIGKILLs this task (rc=-9).
        for i in $(seq 1 6); do
          pids=$(ss -ltnp "sport = :{{ bench_port | default(8080) }}" 2>/dev/null | tail -n +2 | grep -oE 'pid=[0-9]+' | cut -d= -f2 | sort -u)
          [ -z "$pids" ] && break
          for p in $pids; do kill -KILL "$p" 2>/dev/null; done
          sleep 0.5
        done
        true
      args:
        executable: /bin/bash
      changed_when: false
      register: stop_result
      until: stop_result is succeeded
      retries: 3
      delay: 5

    - name: dbservices | stop fixture containers (bench target only)
      # Symmetric teardown for the start step in the Stage play. `-v` reaps each
      # container's ANONYMOUS data volume — `--rm` does NOT remove it on a
      # force-rm, which is how the 925GB volume pile accumulated. Never fail the
      # cleanup play on this — a missing container (Go-only bench, or an earlier
      # crash) is fine. NOTE: this play is skipped when `any_errors_fatal` aborts
      # the run play on a host drop; the off-cluster teardown job's cleanup.yml
      # (volume prune) is the resilient safety net for that abort path.
      ansible.builtin.shell: |
        docker rm -f -v probatorium-pg probatorium-redis probatorium-mc 2>/dev/null
        true
      args:
        executable: /bin/bash
      changed_when: false
      when:
        - inventory_hostname == bench_target
        - bench_needs_dbservices | default(false) | bool

    - name: Wait for mpstat samplers to finish writing
      # Glob covers both sampler pid files: mpstat.pid (server side) and
      # mpstat.loadgen.pid (loadgen side — renamed so the two hosts'
      # tarballs can't clobber each other's cpu.log in results_local_dir).
      ansible.builtin.shell: |
        for pidfile in {{ bench_run_dir }}/*/mpstat*.pid; do
          [ -f "$pidfile" ] || continue
          pid=$(cat "$pidfile")
          for i in $(seq 1 10); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.5
          done
        done
        true
      args:
        executable: /bin/bash
      changed_when: false

    # We avoid `ansible.builtin.synchronize` here because it requires
    # rsync on both ends and the cluster nodes ship without it. tar +
    # fetch + local extract works with just `tar` (always present) plus
    # ansible's stock sftp-based fetch — no apt install needed, nothing
    # to track in the manifest.
    - name: Tar bench artefacts on remote
      ansible.builtin.shell: |
        cd {{ bench_run_dir | dirname }}
        tar czf /tmp/bench-{{ inventory_hostname }}.tgz {{ bench_run_dir | basename }}/
      args:
        executable: /bin/bash
      changed_when: true

    - name: Fetch bench tarball back to dev machine
      ansible.builtin.fetch:
        src: "/tmp/bench-{{ inventory_hostname }}.tgz"
        dest: "{{ results_local_dir }}/{{ inventory_hostname }}.tgz"
        flat: true
      register: fetch_result
      until: fetch_result is succeeded
      retries: 3
      delay: 5

    - name: Remove remote tarball after fetch
      ansible.builtin.file:
        path: "/tmp/bench-{{ inventory_hostname }}.tgz"
        state: absent

    # macOS ships BSD tar, which extracts tar.gz cleanly but
    # ansible's `unarchive` module rejects it ("GNU tar required").
    # Drive tar directly through a shell command instead — no toolchain
    # assumption beyond /usr/bin/tar.
    - name: Extract fetched tarball locally
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        cmd: tar xzf {{ results_local_dir }}/{{ inventory_hostname }}.tgz -C {{ results_local_dir }}/
      changed_when: true

    - name: Drop the local tarball
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: "{{ results_local_dir }}/{{ inventory_hostname }}.tgz"
        state: absent
