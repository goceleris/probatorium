---
# Force teardown of all probatorium state on cluster nodes.
#
# Idempotent — safe to run any number of times. Reverses every change
# the deploy/bench/validate/fuzz playbooks recorded in the manifest:
#   1. apt-purge any packages WE installed (manifest.installed_packages)
#   2. restore sysctl values WE snapshotted (manifest.prior_sysctl)
#   3. rm -rf each toolchain dir WE installed (manifest.installed_toolchains)
#   4. stop any docker containers we spawned (only if WE installed docker)
#   5. rm -rf {{ bench_root }} entirely
#   6. drop the manifest file itself
#
# `purge_results=true` extra-var ALSO removes {{ results_root }} (default
# is to leave it so the user can re-fetch local artefacts after the fact).

- name: Force cleanup of probatorium state on cluster nodes
  hosts: cluster
  gather_facts: false
  # Reclaim reachable hosts even when one is wedged/unreachable — this
  # playbook is now also driven from the off-cluster teardown job as the
  # host-failure-survivable reclamation path (2026-07-11 incident).
  ignore_unreachable: true
  tasks:
    # ---------- kill processes first ----------
    # Match by exact process name to avoid pkill self-killing
    # (pkill -f matches argv, including its own command line).
    - name: Stop any lingering probatorium processes
      become: true
      # Native competitor processes (rust/bun/python) live under
      # {{ bench_root }}/competitors/ — match them by absolute path
      # via pkill -f so no other workload on the host is touched.
      #
      # CRITICAL: `pkill -f` matches every process's full command line,
      # INCLUDING the bash session running this very pkill. The
      # literal path appears in our own argv, so a naïve `pkill -f`
      # self-terminates (rc=-15). The `[/]tmp/...` regex-character-
      # class idiom solves this: the pattern matches real processes
      # whose argv contains `/tmp/...`, but doesn't match its own
      # argv (which begins with `[`, not `/`).
      ansible.builtin.shell: |
        for name in runner loadgen observer validator validator-checker validator-replay conformance server; do
          pkill -x "$name" 2>/dev/null
        done
        pkill -f "[c]ompetitors/" 2>/dev/null
        pkill -f "[/]tmp/celeris-bench/competitors-src/" 2>/dev/null
        true
      changed_when: false

    # ---------- read manifest ----------
    - name: Read dep manifest if present
      ansible.builtin.slurp:
        src: "{{ manifest_path }}"
      register: cleanup_manifest
      failed_when: false

    - name: Decode manifest
      ansible.builtin.set_fact:
        to_remove: "{{ (cleanup_manifest.content | b64decode | from_json).installed_packages | default([]) }}"
        sysctl_to_restore: "{{ (cleanup_manifest.content | b64decode | from_json).prior_sysctl | default({}) }}"
        prior_limits_conf: "{{ (cleanup_manifest.content | b64decode | from_json).prior_limits_conf | default('') }}"
        toolchains_to_remove: "{{ (cleanup_manifest.content | b64decode | from_json).installed_toolchains | default([]) }}"
      when: cleanup_manifest is defined and cleanup_manifest.content is defined
      # A truncated/corrupt manifest (b64decode|from_json throws) must not abort
      # the play before the docker reap + filesystem sweep + manifest drop below.
      # On failure the facts stay unset and downstream `... is defined` gates skip
      # the apt/sysctl restores — the reclamation tasks still run.
      ignore_errors: true

    # ---------- docker state teardown (ungated: dedicated bench cluster) ----------
    # Reclaim ALL probatorium docker state whenever docker is present. This was
    # previously gated on `'docker.io' in to_remove`, which self-disabled on any
    # host where docker was pre-installed OR whose manifest was lost — so the
    # fixture DB containers' ANONYMOUS data volumes accumulated unbounded (275
    # volumes = 925GB filled the SUT root disk and wedged the whole cluster,
    # 2026-07-11). Two defects fixed: (a) ungate — guard only on docker being
    # present, not on our having installed it; (b) `-v` on the force-rm reaps
    # each container's anon volume, and `docker volume prune -af` reclaims any
    # that already leaked (`container prune` alone never touches volumes).
    - name: Reap probatorium docker state (containers + their anonymous volumes)
      become: true
      ansible.builtin.shell: |
        command -v docker >/dev/null 2>&1 || exit 0
        docker rm -f -v probatorium-pg probatorium-redis probatorium-mc 2>/dev/null || true
        ids=$(docker ps -q 2>/dev/null); [ -n "$ids" ] && docker kill $ids 2>/dev/null || true
        docker container prune -f 2>/dev/null || true
        docker volume prune -af 2>/dev/null || true
        docker image prune -f 2>/dev/null || true
        true
      args:
        executable: /bin/bash
      changed_when: false

    # ---------- toolchain teardown ----------
    # rm -rf each toolchain dir we installed. The role-recorded entries
    # have shape: { lang: rust|bun|python, path: <abs path>, apt_pkgs: [...] }
    # We rm -rf the path here; apt_pkgs are folded into to_remove so the
    # apt-purge step below catches them.
    - name: Remove installed toolchain directories
      become: true
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ toolchains_to_remove | default([]) }}"
      loop_control:
        label: "{{ item.lang }}@{{ item.path }}"
      when: toolchains_to_remove is defined and toolchains_to_remove | length > 0

    # ---------- sysctl restore ----------
    # Every bench-tuning sysctl that bench_tuning.yml applies is also
    # listed here so a cleanup run restores the host's pristine state.
    # The deploy step snapshots each value into deploy_manifest.prior_sysctl
    # (the "restore manifest" we read on cleanup), so we apply the saved
    # value verbatim and skip the sysctl if it was never set on this host.
    - name: Restore prior sysctl values
      become: true
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_set: true
        state: present
        reload: false
      loop: "{{ sysctl_restore_pairs | default([]) }}"
      vars:
        sysctl_restore_pairs:
          - name: net.ipv4.ip_local_port_range
            value: "{{ sysctl_to_restore.ip_local_port_range | default('') }}"
          - name: net.ipv4.tcp_tw_reuse
            value: "{{ sysctl_to_restore.tcp_tw_reuse | default('') }}"
          - name: net.ipv4.tcp_fin_timeout
            value: "{{ sysctl_to_restore.tcp_fin_timeout | default('') }}"
          - name: net.ipv4.tcp_max_tw_buckets
            value: "{{ sysctl_to_restore.tcp_max_tw_buckets | default('') }}"
          - name: net.core.somaxconn
            value: "{{ sysctl_to_restore.somaxconn | default('') }}"
          - name: net.ipv4.tcp_max_syn_backlog
            value: "{{ sysctl_to_restore.tcp_max_syn_backlog | default('') }}"
          - name: net.ipv4.tcp_slow_start_after_idle
            value: "{{ sysctl_to_restore.tcp_slow_start_after_idle | default('') }}"
          - name: net.ipv4.tcp_no_metrics_save
            value: "{{ sysctl_to_restore.tcp_no_metrics_save | default('') }}"
          - name: fs.file-max
            value: "{{ sysctl_to_restore.file_max | default('') }}"
          - name: net.netfilter.nf_conntrack_max
            value: "{{ sysctl_to_restore.nf_conntrack_max | default('') }}"
      when:
        - sysctl_to_restore is defined
        - sysctl_to_restore | length > 0
        - item.value != ''

    # ---------- /etc/security/limits.conf restore ----------
    # The deploy step adds memlock=unlimited lines for the io_uring
    # engine (probatorium#1). A new login session is required for the
    # changes to take effect, so we restore the snapshot from the
    # manifest rather than re-applying the original lines. If the
    # manifest is empty (first deploy), we leave the file as-is.
    - name: Restore prior /etc/security/limits.conf (drop the memlock=unlimited lines)
      become: true
      ansible.builtin.copy:
        content: "{{ prior_limits_conf | b64decode }}"
        dest: /etc/security/limits.conf
        mode: '0644'
      when:
        - prior_limits_conf is defined
        - prior_limits_conf | length > 0

    # ---------- apt teardown ----------
    - name: Stop docker daemon before purge
      become: true
      ansible.builtin.service:
        name: docker
        state: stopped
      when: to_remove is defined and ('docker.io' in to_remove)
      failed_when: false

    - name: Apt-purge packages we installed
      become: true
      ansible.builtin.apt:
        name: "{{ to_remove }}"
        state: absent
        purge: true
        autoremove: true
      when: to_remove is defined and to_remove | length > 0
      # A transient dpkg/apt lock (e.g. unattended-upgrades) must not abort the
      # play before the filesystem sweep + manifest drop below — the packages
      # will be re-purged on the next cleanup. Disk reclamation is the priority.
      ignore_errors: true

    # ---------- final filesystem sweep ----------
    - name: Drop bench staging dir (rm -rf {{ bench_root }})
      become: true
      ansible.builtin.shell: |
        chmod -R u+w {{ bench_root }} 2>/dev/null || true
        rm -rf {{ bench_root }}
      args:
        executable: /bin/bash
      changed_when: true

    - name: Remove manifest file
      become: true
      ansible.builtin.file:
        path: "{{ manifest_path }}"
        state: absent

    # results_root holds ROOT-owned per-cell run dirs (the validator launches
    # refapps under become for io_uring memlock), so a non-root `file: absent`
    # fails with EPERM. Use the same become + chmod -R u+w + rm -rf pattern as
    # the bench_root drop above so purge_results actually reclaims it.
    - name: Optionally remove results dir (set --extra-vars purge_results=true)
      become: true
      ansible.builtin.shell: |
        chmod -R u+w {{ results_root }} 2>/dev/null || true
        rm -rf {{ results_root }}
      args:
        executable: /bin/bash
      changed_when: true
      when: purge_results | default(false) | bool
