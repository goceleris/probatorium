---
# Build one bun-on-TS competitor adapter into a runnable launcher
# under {{ bench_root }}/competitors/<competitor_name>.
#
# Inputs (set by the caller via include_tasks vars):
#   competitor_name   the slug used by servers.Registry (e.g. "hono",
#                     "elysia"). Becomes the symlink filename under
#                     {{ bench_root }}/competitors/.
#   competitor_src    absolute path to the extracted source dir on the
#                     bench host — the directory containing
#                     package.json + src/server.ts. The shared
#                     ansible/tasks/build_native_competitor.yml passes
#                     {{ bench_root }}/competitors-src/<slug> here.
#
# What we do, in order:
#
#   1. bun install --production --frozen-lockfile. Installs EXACTLY the
#      versions in the committed bun.lock and fails if package.json and
#      the lock disagree — no fresh resolution at deploy time. Upstream
#      bumps arrive only via a reviewed Dependabot PR. (Until 2026-08-12
#      this was an unpinned `bun install` against registry HEAD, i.e.
#      unreviewed third-party code executing on the bench hosts.)
#      --production drops devDependencies (typescript, @types/bun) since
#      the build output is plain JS.
#   2. bun build --target=bun --minify --sourcemap=none src/server.ts
#      --outfile=dist/server. Produces a single-file bundle Bun can
#      execute directly. --target=bun keeps Bun built-ins (Bun.serve,
#      Bun.write, ...) external; --minify shaves bytes; sourcemaps are
#      off because we're benching, not debugging.
#   3. Write a small POSIX-sh launcher next to dist/server that execs
#      the local Bun binary on the bundle, forwarding argv. The
#      launcher is what gets symlinked into competitors/<name> by the
#      shared build_native_competitor.yml — servers.StartAdapter then
#      treats it like any other native binary.
#
# Idempotency: each task is rerun-safe. `bun install` is a no-op when
# node_modules is already populated; `bun build` always rewrites
# dist/server; the launcher write is content-driven so unchanged input
# = unchanged output.
#
# PATH wiring: {{ bench_root }}/bun/bin is prepended so `bun` resolves
# to the bench-installed bun, not whatever the host's apt repo or the
# operator's ~/.bun shipped. Other env vars (BUN_INSTALL, XDG_*) come
# from the calling task in build_native_competitor.yml.

- name: "bun | {{ competitor_name }} | install dependencies (frozen lockfile)"
  environment:
    PATH: "{{ bench_root }}/bun/bin:{{ ansible_env.PATH }}"
    BUN_INSTALL: "{{ bench_root }}/bun"
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ competitor_src }}"
    test -f bun.lock || { echo "bun.lock missing for {{ competitor_name }} — refusing to resolve deps unpinned"; exit 1; }
    bun install --production --frozen-lockfile
  args:
    executable: /bin/bash

- name: "bun | {{ competitor_name }} | bundle src/server.ts -> dist/server"
  environment:
    PATH: "{{ bench_root }}/bun/bin:{{ ansible_env.PATH }}"
    BUN_INSTALL: "{{ bench_root }}/bun"
    NODE_ENV: production
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ competitor_src }}"
    bun build --target=bun --minify --sourcemap=none ./src/server.ts --outfile=./dist/server
  args:
    executable: /bin/bash

# The "binary" the runner exec's is this launcher. It MUST be the file
# competitor_sources[<slug>].binary_rel points at — set the registry's
# RunCmd to invoke ./<name> directly so this script's argv handling
# transparently forwards the runner's `-bind <addr>` flag.
- name: "bun | {{ competitor_name }} | write bun launcher script"
  ansible.builtin.copy:
    dest: "{{ competitor_src }}/server"
    mode: '0755'
    content: |
      #!/bin/sh
      # Auto-generated by ansible/roles/bun/tasks/build_competitor.yml.
      # Exec the bench-installed Bun on the bundled JS, forwarding all
      # CLI args. NODE_ENV=production at exec time mirrors what the
      # build was bundled with — Bun's built-in conditionals (e.g.
      # framework dev-mode toggles) honour it at runtime, not just at
      # bundle time.
      #
      # readlink -f resolves the symlink in {{ bench_root }}/competitors/
      # so dirname lands on the source dir (where dist/server actually
      # exists), not the symlink's parent dir (which has no dist/).
      SCRIPT_DIR="$(dirname "$(readlink -f "$0")")"
      exec "{{ bench_root }}/bun/bin/bun" run "$SCRIPT_DIR/dist/server" "$@"
