---
# Native bun runtime via the official installer, into
# {{ bench_root }}/bun. Always-latest stable at deploy time.
#
# Manifest contract: appends to installed_toolchains an entry of
#   { lang: 'bun', path: <abs path>, apt_pkgs: [<pkgs we apt-installed>] }
# and records the resolved bun version into fetched_versions.
#
# ----------------------------------------------------------------------
# Bun-on-TS competitor adapters (wave 4b: hono, elysia, ...).
# ----------------------------------------------------------------------
# This role only INSTALLS bun. The per-competitor bundling step lives
# in tasks/build_competitor.yml — included by the shared
# tasks/build_native_competitor.yml when competitor_sources[<slug>].lang
# is "bun". The canonical competitor_sources entry shape is:
#
#   competitor_sources:
#     hono:
#       lang: bun
#       tarball: /local/path/servers-hono.tar.gz
#       # build_cmd is invoked inside competitors-src/hono/ with PATH
#       # containing {{ bench_root }}/bun/bin and NODE_ENV=production.
#       # The command must produce a launcher at ./server that the
#       # shared symlink step can target.
#       build_cmd: >-
#         bun install --production &&
#         bun build --target=bun --minify --sourcemap=none
#                   ./src/server.ts --outfile=./dist/server &&
#         printf '%s\n' '#!/bin/sh'
#                       'exec "{{ bench_root }}/bun/bin/bun" run
#                              "$(dirname "$0")/dist/server" "$@"'
#         > server &&
#         chmod +x server
#       binary_rel: server
#     elysia:
#       lang: bun
#       tarball: /local/path/servers-elysia.tar.gz
#       build_cmd: <same as hono>
#       binary_rel: server
#
# Operators preferring the structured task-list path can replace
# build_cmd with a `bun build_competitor` include — see
# tasks/build_competitor.yml for the parameterised version.

- name: bun | ensure bun install root exists
  ansible.builtin.file:
    path: "{{ bench_root }}/bun"
    state: directory
    mode: '0755'

# bun installer needs curl + unzip; ca-certificates is pulled in
# transitively by curl on Debian/Ubuntu so we don't list it explicitly.
- name: bun | detect missing system packages (curl + unzip)
  ansible.builtin.shell: |
    for pkg in curl unzip; do
      dpkg -s "$pkg" >/dev/null 2>&1 || echo "$pkg"
    done
  register: bun_missing_pkgs
  changed_when: false

- name: bun | install missing apt packages
  become: true
  ansible.builtin.apt:
    name: "{{ bun_missing_pkgs.stdout_lines }}"
    state: present
    update_cache: true
  when: bun_missing_pkgs.stdout_lines | length > 0

- name: bun | append apt packages to manifest fact
  ansible.builtin.set_fact:
    installed_packages: "{{ installed_packages + bun_missing_pkgs.stdout_lines }}"
  when: bun_missing_pkgs.stdout_lines | length > 0

# BUN_INSTALL is the only knob the installer respects; everything bun
# downloads (the binary, the cache, the registry index) lands under it.
# The installer is idempotent — re-running upgrades to latest in place.
- name: bun | install bun (always-latest)
  environment:
    BUN_INSTALL: "{{ bench_root }}/bun"
  ansible.builtin.shell: |
    set -euo pipefail
    if [ ! -x "{{ bench_root }}/bun/bin/bun" ]; then
      curl -fsSL https://bun.sh/install | bash
    else
      "{{ bench_root }}/bun/bin/bun" upgrade
    fi
  args:
    executable: /bin/bash

- name: bun | resolve installed bun version
  environment:
    BUN_INSTALL: "{{ bench_root }}/bun"
  ansible.builtin.command: "{{ bench_root }}/bun/bin/bun --version"
  register: bun_version
  changed_when: false

- name: bun | append toolchain entry to manifest
  ansible.builtin.set_fact:
    installed_toolchains: >-
      {{ installed_toolchains
         + [{ 'lang': 'bun',
              'path': bench_root + '/bun',
              'apt_pkgs': bun_missing_pkgs.stdout_lines }] }}
    fetched_versions: >-
      {{ fetched_versions
         | combine({ 'bun': bun_version.stdout | trim }) }}
