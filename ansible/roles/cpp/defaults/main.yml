---
# Pinned upstream revisions for the C++ competitor toolchain.
#
# These were resolved at deploy time until 2026-08-13 (`git ls-remote --tags`
# picking the newest stable tag), which is the same unreviewed-upstream policy
# that put a broken ntex-server on the bench hosts on 2026-08-12. Pinning here
# means a libdrogon bump is a reviewed commit to this file, not something that
# happens silently on the next deploy.
#
# Dependabot has no ecosystem for a git clone inside an ansible task, so these
# are bumped MANUALLY. To bump:
#
#   tag=$(git ls-remote --tags --refs https://github.com/drogonframework/drogon.git \
#         | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
#   git ls-remote https://github.com/drogonframework/drogon.git "refs/tags/$tag"
#
# and update BOTH values below (the version string is what names the source
# dir + the build marker; the commit is what is actually checked out).
drogon_version: "v1.9.13"
drogon_commit: "4c5430757ea5451a7c38fbbef4b4bef7dbb47f2f"
