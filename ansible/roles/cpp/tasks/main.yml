---
# Native C++ toolchain + libdrogon, for the drogon adapter. Unlike the
# rust/zig/dotnet roles there is no single relocatable tarball: a C++
# framework links against system libraries, so the cluster's own
# gcc/g++ + apt build-deps are the toolchain, and libdrogon is compiled
# from source into a pristine prefix under {{ bench_root }}/drogon.
#
# Pristine accounting (what cleanup.yml reverses):
#   - apt build-deps WE installed → installed_packages (apt-purge).
#     We probe each with dpkg -s and only request the missing ones, so a
#     node that already ships e.g. cmake/libssl-dev keeps them on cleanup.
#   - the libdrogon build tree + install prefix → installed_toolchains
#     entry { lang: 'cpp-drogon', path: {{ bench_root }}/drogon }
#     (rm -rf). The adapter's own build/ dir lives under
#     competitors-src/drogon and is wiped by the bench_root sweep.
#
# Why build libdrogon from source (not apt libdrogon-dev): drogon is not
# in Ubuntu's default repos on the cluster's release, and the few PPAs
# that carry it would add an apt source to /etc — a permanent mutation
# the pristine rule forbids. A from-source build into a bench_root prefix
# is the minimally-invasive path: only the (already-tracked) generic C++
# apt deps touch the system, everything drogon-specific stays under
# bench_root. Always-latest stable is the newest libdrogon git tag at
# deploy time (mirrors the always-latest policy of the other roles).
#
# CMAKE_PREFIX_PATH / drogon_DIR (exported by build_native_competitor.yml
# for cpp adapters) point the adapter's own `cmake -S . -B build` at this
# prefix so find_package(Drogon) resolves the bench-built libdrogon.

- name: cpp | ensure drogon prefix root exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ bench_root }}/drogon"
    - "{{ bench_root }}/drogon/src"
    - "{{ bench_root }}/drogon/prefix"

# drogon's hard build deps: a C++17 compiler (build-essential → g++),
# cmake, git (to fetch the source), and the libraries drogon links:
#   jsoncpp (JSON), libuuid (request ids), zlib (gzip), OpenSSL (TLS +
#   hashing), c-ares (async DNS), brotli (optional compression). pkg-config
#   lets drogon's CMake locate them. Probe each so we only apt-install —
#   and therefore only later apt-purge — the genuinely-missing ones.
#   lithium (the second cpp adapter) is header-only but its http_backend
#   links Boost.Context (fiber stacks); libboost-context-dev + libboost-dev
#   satisfy find_package(Boost COMPONENTS context).
- name: cpp | detect missing system packages (compiler + cmake + drogon/lithium libs)
  ansible.builtin.shell: |
    for pkg in build-essential cmake git pkg-config ca-certificates \
               libjsoncpp-dev uuid-dev zlib1g-dev libssl-dev \
               libc-ares-dev libbrotli-dev \
               libboost-context-dev libboost-dev; do
      dpkg -s "$pkg" >/dev/null 2>&1 || echo "$pkg"
    done
  register: cpp_missing_pkgs
  changed_when: false

- name: cpp | install missing apt packages
  become: true
  ansible.builtin.apt:
    name: "{{ cpp_missing_pkgs.stdout_lines }}"
    state: present
    update_cache: true
  when: cpp_missing_pkgs.stdout_lines | length > 0

- name: cpp | append apt packages to manifest fact
  ansible.builtin.set_fact:
    installed_packages: "{{ installed_packages + cpp_missing_pkgs.stdout_lines }}"
  when: cpp_missing_pkgs.stdout_lines | length > 0

# Resolve always-latest stable libdrogon: the newest semver tag in the
# upstream repo (tags are vN.M.P; we sort by the numeric tuple and take
# (Until 2026-08-13 the newest stable tag was resolved here at deploy time via
# ls-remote. It is now pinned in defaults/main.yml — see the fetch task below.)
# libdrogon is PINNED (drogon_version / drogon_commit in defaults/main.yml),
# not resolved from upstream at deploy time. See that file for the rationale
# and the bump procedure.

# Idempotency marker. MUST be commit-stamped: DrogonConfig.cmake alone is
# version-agnostic, so a warm bench_root carrying a prefix built from the old
# always-latest policy would satisfy it and skip the clone+build entirely —
# a green deploy running an UNPINNED library. The stamp file records which
# commit produced the prefix, so changing the pin invalidates it.
- name: cpp | check whether the PINNED libdrogon is already built
  ansible.builtin.stat:
    path: "{{ bench_root }}/drogon/prefix/.pin-{{ drogon_commit }}"
  register: drogon_built

- name: cpp | fetch libdrogon at the pinned commit (with submodules)
  ansible.builtin.shell: |
    set -euo pipefail
    dest="{{ bench_root }}/drogon/src/drogon-{{ drogon_version }}"
    rm -rf "$dest"
    mkdir -p "$dest"
    cd "$dest"
    git init -q
    git remote add origin https://github.com/drogonframework/drogon.git
    git fetch -q --depth 1 origin "{{ drogon_commit }}"
    git checkout -q FETCH_HEAD
    git submodule update -q --init --recursive --depth 1
    # Assert we got the commit we asked for. Never use `creates:` on this task:
    # it would skip the assertion, which is the entire enforcement.
    got="$(git rev-parse HEAD)"
    if [ "$got" != "{{ drogon_commit }}" ]; then
      echo "drogon: expected {{ drogon_commit }}, got $got" >&2
      exit 1
    fi
  args:
    executable: /bin/bash
  when: not drogon_built.stat.exists

# Configure + build + install libdrogon into the bench_root prefix.
# -DCMAKE_BUILD_TYPE=Release matches the adapter's own build type. We
# disable drogon's ORM backends (postgres/mysql/sqlite) and its test/ctl
# suites: the drogon adapter is benched on the static + JSON columns only
# (Capabilities{Static:true}), so the ORM deps would add build cost +
# extra apt packages for nothing.
- name: cpp | configure + build + install libdrogon into bench_root prefix
  environment:
    CMAKE_BUILD_PARALLEL_LEVEL: "{{ ansible_processor_vcpus | default(ansible_processor_count) | default(4) }}"
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ bench_root }}/drogon/src/drogon-{{ drogon_version }}"
    cmake -S . -B build \
      -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_INSTALL_PREFIX="{{ bench_root }}/drogon/prefix" \
      -DBUILD_CTL=OFF \
      -DBUILD_EXAMPLES=OFF \
      -DBUILD_TESTING=OFF \
      -DBUILD_POSTGRESQL=OFF \
      -DBUILD_MYSQL=OFF \
      -DBUILD_SQLITE=OFF \
      -DBUILD_REDIS=OFF
    cmake --build build -j
    cmake --install build
    # Commit-stamp the prefix so the next deploy can tell WHICH revision built
    # it. Written last so a partial build never looks complete.
    touch "{{ bench_root }}/drogon/prefix/.pin-{{ drogon_commit }}"
  args:
    executable: /bin/bash
    creates: "{{ bench_root }}/drogon/prefix/.pin-{{ drogon_commit }}"
  when: not drogon_built.stat.exists

- name: cpp | resolve installed g++ + cmake versions
  ansible.builtin.shell: |
    g++ --version 2>/dev/null | head -1 || true
    cmake --version 2>/dev/null | head -1 || true
  register: cpp_versions
  changed_when: false

- name: cpp | append toolchain entry to manifest
  ansible.builtin.set_fact:
    installed_toolchains: >-
      {{ installed_toolchains
         + [{ 'lang': 'cpp-drogon',
              'path': bench_root + '/drogon',
              'apt_pkgs': cpp_missing_pkgs.stdout_lines }] }}
    fetched_versions: >-
      {{ fetched_versions
         | combine({ 'cpp': (cpp_versions.stdout_lines | join(' / ')) + ' / libdrogon ' + drogon_version }) }}
