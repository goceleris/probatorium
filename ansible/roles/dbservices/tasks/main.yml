---
# Database services: postgres / redis / memcached run as docker
# containers — the ONLY place docker is used in probatorium. Framework
# binaries always run natively (see deploy.yml).
#
# Contract:
#   - install docker.io if missing (manifest-tracked → cleanup apt-purges)
#   - chmod 666 /var/run/docker.sock so the bench user can `docker run`
#     without group membership (avoids the reset_connection sudo race
#     documented in cluster-go-gate.yml's preflight).
#   - pull the three images we need (always-latest tag-suffixed pins
#     so a quiet upstream rebuild doesn't change the bench under us
#     mid-run; tags are the latest stable as of authoring).
#
# Containers themselves are NOT started here — the runner spins them up
# per-cell so each scenario gets a clean DB. Cleanup playbook docker-
# kills any containers we left running.

- name: dbservices | detect whether docker.io is installed
  ansible.builtin.shell: |
    dpkg -s docker.io >/dev/null 2>&1 && echo present || echo missing
  register: docker_check
  changed_when: false

- name: dbservices | install docker.io
  become: true
  ansible.builtin.apt:
    name:
      - docker.io
    state: present
    update_cache: true
  when: docker_check.stdout == 'missing'

- name: dbservices | append docker.io to manifest
  ansible.builtin.set_fact:
    installed_packages: "{{ installed_packages + ['docker.io'] }}"
  when: docker_check.stdout == 'missing'

- name: dbservices | ensure docker daemon is running
  become: true
  ansible.builtin.service:
    name: docker
    state: started
    enabled: false

# Group membership only takes effect on NEXT login — forcing
# `meta: reset_connection` here would race against ansible's privilege-
# escalation timeout under SSH ControlMaster (12s). chmod 666 the
# socket on this run only — systemd recreates it with default mode
# (660) when docker restarts, so no permanent mutation.
# Cluster bench targets are dedicated; world-writable docker.sock for
# the duration of the run is benign.
- name: dbservices | open docker socket for the bench user (no group / no reconnect)
  become: true
  ansible.builtin.file:
    path: /var/run/docker.sock
    mode: '0666'

# Always-latest stable images, but pinned to a major-minor so a daemon
# restart can't pull a breaking upstream change between deploy and bench.
# Update these as upstream majors land (postgres 18, redis 9, ...).
# Docker Hub fronts image blobs via Cloudflare R2 at the host
# `docker-images-prod.<id>.r2.cloudflarestorage.com`. The cluster's
# upstream routing has a persistent black-hole on 172.64.66.1 and
# 172.64.66.2 — the only two IPs the R2 host's DNS A-record currently
# returns (verified May 2026). 172.64.66.3 + 172.64.66.4 are reachable
# and serve the same blobs (any Cloudflare edge can serve any signed
# blob URL). Pin the host to 172.64.66.3 via /etc/hosts so `docker
# pull` doesn't hit the dead IPs. The cleanup task below removes the
# pin so the host file goes back to vanilla.
#
# Why not switch registries: the rest of the deploy expects
# vanilla docker.io image names. Pinning is the minimally-invasive
# fix that keeps the role's contract identical.
- name: dbservices | pin R2 host to a reachable IP (cluster routing blackhole workaround)
  become: true
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "172.64.66.3 docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com"
    state: present
    create: false
    backup: false
    insertafter: EOF

- name: dbservices | pull database images (postgres + redis + memcached)
  # Three attempts with 10 s backoff covers a real-but-transient hiccup
  # without making a stale-route outage hang the deploy for minutes.
  ansible.builtin.command: "docker pull {{ item }}"
  loop:
    - "postgres:17-alpine"
    - "redis:8.2-alpine"
    - "memcached:1.6.41-alpine"
  register: docker_pull
  changed_when: "'Downloaded newer image' in docker_pull.stdout or 'Pull complete' in docker_pull.stdout"
  retries: 3
  delay: 10
  until: docker_pull is succeeded

# Remove the /etc/hosts pin immediately after the pulls — the rest of
# the deploy / validate flow doesn't need it, and leaving the
# override risks masking a legitimate Cloudflare reshuffle later.
# (cleanup.yml's manifest-driven teardown does NOT cover /etc/hosts
# edits, which is why this is local-scoped here.)
- name: dbservices | remove R2 host pin after pull
  become: true
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "172.64.66.3 docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com"
    state: absent

- name: dbservices | record fetched image digests
  ansible.builtin.shell: |
    for img in postgres:17-alpine redis:8.2-alpine memcached:1.6.41-alpine; do
      docker image inspect --format '{{ "{{" }} index .RepoDigests 0 {{ "}}" }}' "$img" 2>/dev/null || echo "$img:unknown"
    done
  register: db_image_digests
  changed_when: false

- name: dbservices | append digests to fetched_versions
  ansible.builtin.set_fact:
    fetched_versions: >-
      {{ fetched_versions
         | combine({ 'db_images': db_image_digests.stdout_lines }) }}
