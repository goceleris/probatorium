---
# Build one java competitor adapter (vert.x / netty) into a runnable
# launcher under {{ bench_root }}/competitors/<competitor_name>. Mirrors
# the bun role: build the artifact, render a POSIX-sh launcher, and let
# build_native_competitor.yml's java branch symlink it into competitors/.
#
# Inputs (set by the caller via include_role vars):
#   competitor_name   the slug used by servers.Registry ("vertx", "netty").
#   competitor_src    absolute path to the extracted source dir on the
#                     bench host — the directory containing pom.xml + src/.
#
# Maven emits a shaded fat jar under target/. We do NOT hard-code its
# name (vertx vs netty use different finalNames): the launcher globs the
# non-"original-" jar in target/ at runtime, which is the shaded artifact.
#
# Per-arch netty epoll: the vert.x pom hard-codes the epoll native
# classifier (linux-x86_64) unless -Dnetty.epoll.classifier overrides it;
# on the arm64 node that would bundle the wrong .so and silently degrade
# to NIO. We pass the arch-correct classifier; netty's pom (os-maven-
# plugin) auto-detects and simply ignores the unused property.
#
# The dep cache lives at {{ bench_root }}/maven-repo (-Dmaven.repo.local),
# NOT ~/.m2, so pristine cleanup wipes it with the rest of bench_root.

- name: "java | {{ competitor_name }} | resolve netty epoll classifier"
  ansible.builtin.set_fact:
    netty_epoll_classifier: "{{ 'linux-x86_64' if ansible_architecture == 'x86_64' else ('linux-aarch_64' if ansible_architecture == 'aarch64' else 'linux-x86_64') }}"

- name: "java | {{ competitor_name }} | mvn package (shaded fat jar)"
  environment:
    JAVA_HOME: "{{ bench_root }}/java/jdk"
    PATH: "{{ bench_root }}/java/jdk/bin:{{ bench_root }}/java/maven/bin:{{ ansible_env.PATH }}"
    XDG_CACHE_HOME: "{{ bench_root }}/xdg-cache"
    XDG_CONFIG_HOME: "{{ bench_root }}/xdg-config"
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ competitor_src }}"
    mvn -B -DskipTests \
      -Dmaven.repo.local="{{ bench_root }}/maven-repo" \
      -Dnetty.epoll.classifier="{{ netty_epoll_classifier }}" \
      package
  args:
    executable: /bin/bash

# Launcher: exec the bench JDK on the shaded jar, forwarding argv. The
# absolute java path means no JAVA_HOME is needed at run time. `exec`
# makes the JVM the direct process-group member so the runner's group-
# SIGTERM reaches the JVM shutdown hook. The jar glob skips the
# shade-plugin's "original-*.jar" sidecar and picks the fat jar.
- name: "java | {{ competitor_name }} | write java launcher script"
  ansible.builtin.copy:
    dest: "{{ competitor_src }}/server"
    mode: '0755'
    content: |
      #!/bin/sh
      # Auto-generated by ansible/roles/java/tasks/build_competitor.yml.
      SCRIPT_DIR="$(dirname "$(readlink -f "$0")")"
      JAR="$(ls "$SCRIPT_DIR"/target/*.jar 2>/dev/null | grep -v '/original-' | head -n1)"
      exec "{{ bench_root }}/java/jdk/bin/java" -jar "$JAR" "$@"
