---
# Native JVM toolchain for the java competitor adapters (vert.x, netty):
# Eclipse Temurin 21 LTS (Adoptium) + Apache Maven, both as pristine
# tarballs under {{ bench_root }}/java, mirroring the dotnet/bun pattern.
# Nothing touches $HOME, /etc/apt sources, or the system openjdk —
# pristine cleanup wipes {{ bench_root }}/java entirely.
#
# Temurin HotSpot is self-contained (bundles its own ICU/zlib) so the
# only apt deps are curl + ca-certificates for the HTTPS fetch.
#
# Manifest contract: appends to installed_toolchains an entry
#   { lang: 'java', path: {{ bench_root }}/java, apt_pkgs: [...] }
# and records the resolved jdk + maven versions into fetched_versions.
# The maven dep cache lives at {{ bench_root }}/maven-repo (build step),
# which sits under the same path so cleanup removes it too.

- name: java | ensure java install root exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ bench_root }}/java"
    - "{{ bench_root }}/java/jdk"
    - "{{ bench_root }}/java/maven"

- name: java | detect missing system packages (curl + ca-certificates)
  ansible.builtin.shell: |
    for pkg in curl ca-certificates; do
      dpkg -s "$pkg" >/dev/null 2>&1 || echo "$pkg"
    done
  register: java_missing_pkgs
  changed_when: false

- name: java | install missing apt packages
  become: true
  ansible.builtin.apt:
    name: "{{ java_missing_pkgs.stdout_lines }}"
    state: present
    update_cache: true
  when: java_missing_pkgs.stdout_lines | length > 0

- name: java | append apt packages to manifest fact
  ansible.builtin.set_fact:
    installed_packages: "{{ installed_packages + java_missing_pkgs.stdout_lines }}"
  when: java_missing_pkgs.stdout_lines | length > 0

# Adoptium's binary API uses x64 / aarch64.
- name: java | resolve jdk arch token
  ansible.builtin.set_fact:
    jdk_arch: "{{ 'x64' if ansible_architecture == 'x86_64' else ('aarch64' if ansible_architecture == 'aarch64' else ansible_architecture) }}"

- name: java | check whether the JDK is already installed
  ansible.builtin.stat:
    path: "{{ bench_root }}/java/jdk/bin/java"
  register: jdk_installed

# Adoptium's latest-binary endpoint 302-redirects to the newest Temurin
# 21 GA tarball; -L follows it. --strip 1 flattens jdk-21.../{bin,lib,...}
# into {{ bench_root }}/java/jdk.
- name: java | download + extract Temurin 21 (always-latest GA)
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ bench_root }}/java/jdk"
    curl -fsSL "https://api.adoptium.net/v3/binary/latest/21/ga/linux/{{ jdk_arch }}/jdk/hotspot/normal/eclipse" -o jdk.tar.gz
    tar -xzf jdk.tar.gz --strip-components=1
    rm -f jdk.tar.gz
  args:
    executable: /bin/bash
    creates: "{{ bench_root }}/java/jdk/bin/java"
  when: not jdk_installed.stat.exists

- name: java | check whether maven is already installed
  ansible.builtin.stat:
    path: "{{ bench_root }}/java/maven/bin/mvn"
  register: maven_installed

# Resolve the latest Maven 3.9.x from the Apache dist listing (arch-
# independent — Maven is pure Java).
- name: java | resolve latest maven 3.9.x version
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL https://dlcdn.apache.org/maven/maven-3/ \
      | grep -oE '3\.9\.[0-9]+/' | tr -d '/' | sort -V | tail -1
  register: maven_ver
  changed_when: false
  when: not maven_installed.stat.exists

- name: java | download + extract Apache Maven
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ bench_root }}/java/maven"
    V="{{ maven_ver.stdout | trim }}"
    curl -fsSL "https://dlcdn.apache.org/maven/maven-3/${V}/binaries/apache-maven-${V}-bin.tar.gz" -o maven.tar.gz
    tar -xzf maven.tar.gz --strip-components=1
    rm -f maven.tar.gz
  args:
    executable: /bin/bash
    creates: "{{ bench_root }}/java/maven/bin/mvn"
  when: not maven_installed.stat.exists

- name: java | resolve installed jdk + maven versions
  environment:
    JAVA_HOME: "{{ bench_root }}/java/jdk"
    PATH: "{{ bench_root }}/java/jdk/bin:{{ bench_root }}/java/maven/bin:{{ ansible_env.PATH }}"
  ansible.builtin.shell: |
    "{{ bench_root }}/java/jdk/bin/java" -version 2>&1 | head -1
    "{{ bench_root }}/java/maven/bin/mvn" -v 2>/dev/null | head -1 || true
  register: java_versions
  changed_when: false

- name: java | append toolchain entry to manifest
  ansible.builtin.set_fact:
    installed_toolchains: >-
      {{ installed_toolchains
         + [{ 'lang': 'java',
              'path': bench_root + '/java',
              'apt_pkgs': java_missing_pkgs.stdout_lines }] }}
    fetched_versions: >-
      {{ fetched_versions
         | combine({ 'java': java_versions.stdout_lines | join(' / ') }) }}
