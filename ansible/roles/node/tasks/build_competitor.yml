---
# Build one node competitor adapter into a runnable launcher under
# {{ bench_root }}/competitors/<competitor_name>. Mirrors the bun role.
#
# Inputs (set by the caller via include_role vars):
#   competitor_name   the slug used by servers.Registry (e.g. "uws",
#                     "fastify", "express"). Becomes the symlink filename
#                     under {{ bench_root }}/competitors/.
#   competitor_src    absolute path to the extracted source dir on the
#                     bench host — the directory containing package.json
#                     + src/server.js. The shared
#                     ansible/tasks/build_native_competitor.yml passes
#                     {{ bench_root }}/competitors-src/<slug> here.
#
# Node adapters run src/server.js directly (no transpile/bundle) — pure
# JS or prebuilt N-API addons (uWebSockets.js). So the only build step is
# `npm install`; the launcher execs node on src/server.js, forwarding argv.
#
# Caches stay under bench_root (npm_config_cache) so pristine cleanup
# wipes everything — no $HOME writes.

- name: "node | {{ competitor_name }} | npm install (always-latest)"
  environment:
    PATH: "{{ bench_root }}/node/bin:{{ ansible_env.PATH }}"
    npm_config_cache: "{{ bench_root }}/npm-cache"
    NODE_ENV: production
    XDG_CACHE_HOME: "{{ bench_root }}/xdg-cache"
    XDG_CONFIG_HOME: "{{ bench_root }}/xdg-config"
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ competitor_src }}"
    "{{ bench_root }}/node/bin/npm" install --no-audit --no-fund
  args:
    executable: /bin/bash

# The "binary" the runner execs is this launcher, symlinked into
# competitors/<name> by build_native_competitor.yml's node branch. It
# execs the bench-installed node on src/server.js, forwarding the
# runner's -bind/-engine flags. readlink -f resolves the
# competitors/<slug> symlink so dirname lands on the source dir (where
# src/ + node_modules actually live), not the symlink's parent.
- name: "node | {{ competitor_name }} | write node launcher script"
  ansible.builtin.copy:
    dest: "{{ competitor_src }}/server"
    mode: '0755'
    content: |
      #!/bin/sh
      # Auto-generated by ansible/roles/node/tasks/build_competitor.yml.
      SCRIPT_DIR="$(dirname "$(readlink -f "$0")")"
      exec "{{ bench_root }}/node/bin/node" "$SCRIPT_DIR/src/server.js" "$@"
