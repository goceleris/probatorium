---
# Native Node.js runtime via the official nodejs.org standalone tarball,
# into {{ bench_root }}/node. Pinned to the latest v24 LTS at deploy time
# (always-latest within the 24.x line). Mirrors the bun/dotnet pristine
# tarball pattern: nothing touches $HOME or the apt nodejs package.
#
# Why v24: uWebSockets.js ships prebuilt N-API addons only for Node
# 22/24/26 (ABI 127/137/147); the loader does a literal
# require('uws_<plat>_<arch>_<process.versions.modules>.node'), so the
# bench Node major MUST be one of those or uWS throws at startup. 24 LTS
# (ABI 137) is the safe middle. fastify/express are pure JS and version-
# agnostic, so one shared node serves all three node adapters.
#
# Manifest contract: appends to installed_toolchains an entry
#   { lang: 'node', path: <abs path>, apt_pkgs: [<pkgs we apt-installed>] }
# and records the resolved node version into fetched_versions.

- name: node | ensure node install root exists
  ansible.builtin.file:
    path: "{{ bench_root }}/node"
    state: directory
    mode: '0755'

# curl to fetch the tarball, xz-utils to extract the .tar.xz.
- name: node | detect missing system packages (curl + xz-utils)
  ansible.builtin.shell: |
    for pkg in curl xz-utils ca-certificates; do
      dpkg -s "$pkg" >/dev/null 2>&1 || echo "$pkg"
    done
  register: node_missing_pkgs
  changed_when: false

- name: node | install missing apt packages
  become: true
  ansible.builtin.apt:
    name: "{{ node_missing_pkgs.stdout_lines }}"
    state: present
    update_cache: true
  when: node_missing_pkgs.stdout_lines | length > 0

- name: node | append apt packages to manifest fact
  ansible.builtin.set_fact:
    installed_packages: "{{ installed_packages + node_missing_pkgs.stdout_lines }}"
  when: node_missing_pkgs.stdout_lines | length > 0

# nodejs.org names the tarball node-v<ver>-linux-<arch>.tar.xz with arch
# in node's own vocabulary (x64 / arm64), NOT uname's (x86_64 / aarch64).
- name: node | resolve node arch token
  ansible.builtin.set_fact:
    node_arch: "{{ 'x64' if ansible_architecture == 'x86_64' else ('arm64' if ansible_architecture == 'aarch64' else ansible_architecture) }}"

# Resolve the latest v24 tarball filename from the dist directory listing
# (the latest-v24.x/ alias always points at the newest 24.x). Parsing the
# listing avoids needing jq on the bench host.
- name: node | resolve latest v24 tarball name
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL https://nodejs.org/dist/latest-v24.x/ \
      | grep -oE "node-v24\.[0-9]+\.[0-9]+-linux-{{ node_arch }}\.tar\.xz" \
      | head -1
  register: node_tarball
  changed_when: false

- name: node | fail if no v24 tarball resolved
  ansible.builtin.fail:
    msg: "node role: could not resolve a node-v24.x linux-{{ node_arch }} tarball from nodejs.org/dist/latest-v24.x/"
  when: node_tarball.stdout | trim | length == 0

- name: node | record resolved node tarball
  ansible.builtin.set_fact:
    node_tarball_name: "{{ node_tarball.stdout | trim }}"

# Idempotency: skip the download+extract when node/bin/node already exists.
- name: node | check whether node is already installed
  ansible.builtin.stat:
    path: "{{ bench_root }}/node/bin/node"
  register: node_installed

# Download + extract in one shell so the tarball never lingers. --strip 1
# flattens node-v.../{bin,lib,...} straight into {{ bench_root }}/node.
- name: node | download + extract node (always-latest v24)
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ bench_root }}/node"
    curl -fsSL "https://nodejs.org/dist/latest-v24.x/{{ node_tarball_name }}" -o node.tar.xz
    tar -xJf node.tar.xz --strip-components=1
    rm -f node.tar.xz
  args:
    executable: /bin/bash
    creates: "{{ bench_root }}/node/bin/node"
  when: not node_installed.stat.exists

- name: node | resolve installed node version
  environment:
    PATH: "{{ bench_root }}/node/bin:{{ ansible_env.PATH }}"
  ansible.builtin.command: "{{ bench_root }}/node/bin/node --version"
  register: node_version
  changed_when: false

- name: node | append toolchain entry to manifest
  ansible.builtin.set_fact:
    installed_toolchains: >-
      {{ installed_toolchains
         + [{ 'lang': 'node',
              'path': bench_root + '/node',
              'apt_pkgs': node_missing_pkgs.stdout_lines }] }}
    fetched_versions: >-
      {{ fetched_versions
         | combine({ 'node': node_version.stdout | trim }) }}
