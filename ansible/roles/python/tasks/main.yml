---
# Native python runtime + uv package manager.
#
# Two installs are tracked SEPARATELY in the manifest because their
# undo paths differ:
#
#   1. apt: python3.13 + python3.13-venv + python3.13-dev. Tracked in
#      installed_packages (cleanup apt-purges them). On Ubuntu 22.04 /
#      24.04 stable, python3.13 lives in the deadsnakes PPA; we also
#      track that PPA as `installed_apt_repos` so cleanup can drop it.
#      On a host that already has python3.13 (e.g. Ubuntu 25.04+) we
#      do NOT add the PPA and do NOT install via apt — we just record
#      the system python version.
#
#   2. uv: pulled via the official installer into {{ bench_root }}/uv.
#      Tracked as a separate installed_toolchains entry; cleanup rm -rf's
#      its path. Independent of #1 because uv can manage its OWN python
#      installs under UV_PYTHON_INSTALL_DIR — the apt python is the
#      "system" python, while uv's pythons are the per-project pythons.

# ---------- step 1: ensure python3.13 is on PATH ----------

- name: python | check whether python3.13 is already installed
  ansible.builtin.shell: |
    command -v python3.13 >/dev/null 2>&1 && echo present || echo missing
  register: py313_check
  changed_when: false

- name: python | detect codename for deadsnakes PPA
  ansible.builtin.shell: |
    . /etc/os-release && echo "$VERSION_CODENAME"
  register: ubuntu_codename
  changed_when: false
  when: py313_check.stdout == 'missing'

- name: python | add deadsnakes PPA (only if python3.13 missing AND we're on Ubuntu)
  become: true
  ansible.builtin.apt_repository:
    repo: "ppa:deadsnakes/ppa"
    state: present
    update_cache: true
  register: deadsnakes_added
  when:
    - py313_check.stdout == 'missing'
    - ubuntu_codename.stdout | length > 0

- name: python | track deadsnakes PPA in manifest (cleanup will remove it)
  ansible.builtin.set_fact:
    installed_apt_repos: "{{ (installed_apt_repos | default([])) + ['ppa:deadsnakes/ppa'] }}"
  when:
    - deadsnakes_added is defined
    - deadsnakes_added.changed | default(false)

- name: python | install python3.13 + venv + dev headers
  become: true
  ansible.builtin.apt:
    name:
      - python3.13
      - python3.13-venv
      - python3.13-dev
    state: present
    update_cache: true
  register: py_apt_install
  when: py313_check.stdout == 'missing'

- name: python | append apt packages to manifest fact
  ansible.builtin.set_fact:
    installed_packages: >-
      {{ installed_packages + ['python3.13', 'python3.13-venv', 'python3.13-dev'] }}
  when:
    - py313_check.stdout == 'missing'
    - py_apt_install is defined
    - py_apt_install.changed | default(false)

# ---------- step 2: install uv pristinely under {{ bench_root }}/uv ----------

- name: python | ensure uv install root exists
  ansible.builtin.file:
    path: "{{ bench_root }}/uv"
    state: directory
    mode: '0755'

# uv installer needs curl. ca-certificates assumed transitively (every
# Ubuntu base image ships it). UV_INSTALL_DIR is the documented knob
# for redirecting the binary; UV_NO_MODIFY_PATH stops it editing
# ~/.bashrc — a critical pristine-violation guard.
- name: python | detect missing system packages (curl)
  ansible.builtin.shell: |
    for pkg in curl; do
      dpkg -s "$pkg" >/dev/null 2>&1 || echo "$pkg"
    done
  register: uv_missing_pkgs
  changed_when: false

- name: python | install missing apt packages for uv installer
  become: true
  ansible.builtin.apt:
    name: "{{ uv_missing_pkgs.stdout_lines }}"
    state: present
    update_cache: true
  when: uv_missing_pkgs.stdout_lines | length > 0

- name: python | append apt packages to manifest fact (uv prereqs)
  ansible.builtin.set_fact:
    installed_packages: "{{ installed_packages + uv_missing_pkgs.stdout_lines }}"
  when: uv_missing_pkgs.stdout_lines | length > 0

- name: python | install uv (always-latest)
  environment:
    UV_INSTALL_DIR: "{{ bench_root }}/uv/bin"
    UV_NO_MODIFY_PATH: "1"
    UV_UNMANAGED_INSTALL: "{{ bench_root }}/uv/bin"
  ansible.builtin.shell: |
    set -euo pipefail
    if [ ! -x "{{ bench_root }}/uv/bin/uv" ]; then
      curl -fsSL https://astral.sh/uv/install.sh | sh
    else
      "{{ bench_root }}/uv/bin/uv" self update
    fi
  args:
    executable: /bin/bash

- name: python | resolve installed python + uv versions
  ansible.builtin.shell: |
    python3.13 --version 2>&1 || true
    "{{ bench_root }}/uv/bin/uv" --version 2>&1 || true
  register: py_versions
  changed_when: false

- name: python | append toolchain entries to manifest (apt python + uv)
  ansible.builtin.set_fact:
    installed_toolchains: >-
      {{ installed_toolchains
         + [{ 'lang': 'python-uv',
              'path': bench_root + '/uv',
              'apt_pkgs': uv_missing_pkgs.stdout_lines }] }}
    fetched_versions: >-
      {{ fetched_versions
         | combine({ 'python': py_versions.stdout_lines | join(' / ') }) }}
