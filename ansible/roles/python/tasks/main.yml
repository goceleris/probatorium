---
# Native python runtime via uv. No apt / no deadsnakes PPA — that path
# depends on the hkp://keyserver.ubuntu.com:80 gpg fetch, which is
# flaky enough to break ~20% of cluster deploys. uv ships standalone
# pythons (built by indygreg/python-build-standalone, pinned to
# 3.13.x) that drop into UV_PYTHON_INSTALL_DIR under bench_root with
# zero system-package side-effects.
#
# Side-effects we track in the manifest:
#
#   1. apt curl (only if not already present). Pristine cleanup
#      apt-purges it.
#   2. uv binary at {{ bench_root }}/uv. installed_toolchains entry;
#      cleanup rm -rf's the path.
#   3. uv-managed python install under {{ bench_root }}/uv-python.
#      Same toolchain entry covers it (cleanup wipes bench_root).

# ---------- install uv pristinely under {{ bench_root }}/uv ----------

- name: python | ensure uv install root exists
  ansible.builtin.file:
    path: "{{ bench_root }}/uv"
    state: directory
    mode: '0755'

# uv installer needs curl. ca-certificates assumed transitively (every
# Ubuntu base image ships it). UV_INSTALL_DIR is the documented knob
# for redirecting the binary; UV_NO_MODIFY_PATH stops it editing
# ~/.bashrc — a critical pristine-violation guard.
- name: python | detect missing system packages (curl)
  ansible.builtin.shell: |
    for pkg in curl; do
      dpkg -s "$pkg" >/dev/null 2>&1 || echo "$pkg"
    done
  register: uv_missing_pkgs
  changed_when: false

- name: python | install missing apt packages for uv installer
  become: true
  ansible.builtin.apt:
    name: "{{ uv_missing_pkgs.stdout_lines }}"
    state: present
    update_cache: true
  when: uv_missing_pkgs.stdout_lines | length > 0

- name: python | append apt packages to manifest fact (uv prereqs)
  ansible.builtin.set_fact:
    installed_packages: "{{ installed_packages + uv_missing_pkgs.stdout_lines }}"
  when: uv_missing_pkgs.stdout_lines | length > 0

- name: python | install uv (always-latest)
  environment:
    UV_INSTALL_DIR: "{{ bench_root }}/uv/bin"
    UV_NO_MODIFY_PATH: "1"
    UV_UNMANAGED_INSTALL: "{{ bench_root }}/uv/bin"
  ansible.builtin.shell: |
    set -euo pipefail
    if [ ! -x "{{ bench_root }}/uv/bin/uv" ]; then
      curl -fsSL https://astral.sh/uv/install.sh | sh
    else
      "{{ bench_root }}/uv/bin/uv" self update
    fi
  args:
    executable: /bin/bash

# uv ships standalone python builds; UV_PYTHON_INSTALL_DIR redirects
# them under bench_root so cleanup wipes everything. The 3.13 version
# string is unpinned — uv resolves to the latest stable 3.13.x at this
# point ("always-latest" policy). Re-running is cheap (uv noops when
# the requested python is already installed).
- name: python | install standalone python 3.13 under bench_root
  environment:
    UV_PYTHON_INSTALL_DIR: "{{ bench_root }}/uv-python"
    UV_NO_MODIFY_PATH: "1"
  ansible.builtin.shell: |
    set -euo pipefail
    "{{ bench_root }}/uv/bin/uv" python install 3.13
  args:
    executable: /bin/bash

- name: python | resolve installed python + uv versions
  environment:
    UV_PYTHON_INSTALL_DIR: "{{ bench_root }}/uv-python"
  ansible.builtin.shell: |
    "{{ bench_root }}/uv/bin/uv" python list --only-installed 2>&1 | head -3 || true
    "{{ bench_root }}/uv/bin/uv" --version 2>&1 || true
  register: py_versions
  changed_when: false

- name: python | append toolchain entries to manifest (uv + uv-python)
  ansible.builtin.set_fact:
    installed_toolchains: >-
      {{ installed_toolchains
         + [{ 'lang': 'python-uv',
              'path': bench_root + '/uv',
              'apt_pkgs': uv_missing_pkgs.stdout_lines }]
         + [{ 'lang': 'python-uv-python',
              'path': bench_root + '/uv-python',
              'apt_pkgs': [] }] }}
    fetched_versions: >-
      {{ fetched_versions
         | combine({ 'python': py_versions.stdout_lines | join(' / ') }) }}
