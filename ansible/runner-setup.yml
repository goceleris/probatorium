---
# Provisions a per-host GitHub Actions self-hosted runner under
# /tmp/actions-runner-<host>/. Pristine-by-design: nothing lands
# outside /tmp, no system packages installed, no user shell rc
# changes. The companion runner-teardown.yml wipes the directory and
# de-registers from GitHub.
#
# One thing persists by design: the version-keyed tool cache under
# /tmp/celeris-runner-tarballs -- the runner tarball, uv, a python build,
# the ansible venv and ansible.posix. Teardown leaves it. A reboot clears it,
# and so does AGE: systemd-tmpfiles-clean runs daily with `q /tmp ... 10d`
# (the stock /usr/lib/tmpfiles.d/tmp.conf) and deletes, file by file, whatever
# nothing has read, written or changed for ten days -- including from the
# middle of a tree that is otherwise in daily use. A python's stdlib sources,
# which the interpreter stats but never reads once its bytecode exists, are the
# first to go. Every cached unit is therefore trusted only after READING all of
# it (see the ansible-core task), and an unreadable one is rebuilt from nothing.
#
# This playbook follows the cluster-pristine rule: the runner ships
# its own runtime tarball + supervises itself with `nohup ./run.sh`
# (no systemd unit, no user lingering). When teardown runs the
# process is killed by name and the dir is rm -rf'd; reboot would
# clear /tmp anyway.
#
# Required extra-vars:
#   gh_repo_url           e.g. https://github.com/goceleris/probatorium
#   gh_runner_token       repo-scoped registration token, obtained
#                         from GH API just before the run via
#                         POST /repos/<owner>/<repo>/actions/runners/registration-token
#   runner_version        actions-runner release tag, e.g. "2.335.1" —
#                         keep current; a stale pin triggers a mandatory
#                         self-update on connect that can outrun the
#                         wait-for-listening poll below (see
#                         cluster-runner-up/action.yml's runner-version input)
#   runner_labels         comma-separated labels added to self-hosted,
#                         e.g. "celeris-cluster,msa2-client"
#
# Optional extra-vars:
#   runner_name           override runner display name; default
#                         celeris-cluster-<hostname>
#   runner_group          runner-group; default "Default"
#
# Per probatorium#103 / wave-12 ladder bootstrap.

- name: Provision actions-runner per cluster host
  hosts: cluster
  gather_facts: true
  vars:
    runner_root: "/tmp/actions-runner-{{ inventory_hostname }}"
    # Deliberately OUTSIDE runner_root, which the wipe below deletes on
    # every run. The tarball is immutable and already content-addressed
    # by version in its filename, so it survives the wipe safely; the
    # pristine-by-design rule is about the runner CONFIGURATION (a stale
    # .runner pinning a deleted registration), not about 215 MiB of
    # bytes GitHub will hand back byte-identical. Still under /tmp, so
    # "nothing lands outside /tmp" holds and a reboot clears it.
    # Name chosen so it cannot collide with runner_root for any
    # inventory_hostname: "/tmp/actions-runner-cache" would BE
    # runner_root on a host called "cache", and the wipe would take
    # the cache with it.
    runner_cache_dir: "/tmp/celeris-runner-tarballs"
    # probatorium#392: every tool the bootstrap fetches is pinned and cached
    # outside runner_root, keyed by its pin. Pinning has to come first --
    # caching an unpinned install silently freezes whichever version happened
    # to install first, with nothing recording which -- and keying each cache
    # directory by its pin is what makes a bump install fresh instead of
    # reusing a stale copy. All four pins were field-proven by the
    # 2026-09-15 14:29Z bootstrap on all three hosts.
    uv_version: "0.12.15"
    # An exact patch release, not "3.13", AND the python-build-standalone
    # release it is built from. A bare minor lets uv take whichever 3.13.x it
    # knows, or reuse one already on disk. The patch alone still leaves the
    # build to the uv pin: a later uv can map 3.13.15 to a rebuilt standalone
    # release, and no cache key would change. So the installed tree's BUILD
    # file (the release tag, written by uv) is compared with python_build
    # right after the install, and a mismatch fails the bootstrap.
    # uv 0.12.15 resolves 3.13.15 to release 20260901:
    # https://releases.astral.sh/github/python-build-standalone/releases/
    # download/20260901/cpython-3.13.15+20260901-<arch>-unknown-linux-gnu-
    # install_only_stripped.tar.gz
    python_version: "3.13.15"
    python_build: "20260901"
    ansible_core_version: "2.21.4"
    ansible_posix_version: "2.2.2"
    tool_cache_dir: "{{ runner_cache_dir }}/tools"
    uv_dir: "{{ tool_cache_dir }}/uv-{{ uv_version }}"
    # uv otherwise puts its python under $HOME/.local/share/uv/python and its
    # cache under $HOME/.cache/uv, and ansible-galaxy puts its download temp
    # dirs and API cache under $HOME/.ansible -- all outside /tmp, which quietly
    # broke this playbook's own "nothing lands outside /tmp" rule. All three
    # live under the tool cache now.
    uv_python_install_dir: "{{ tool_cache_dir }}/uv-python"
    uv_cache_dir: "{{ tool_cache_dir }}/uv-cache"
    ansible_home_dir: "{{ tool_cache_dir }}/ansible-home"
    # ansible-core is pinned; its dependencies (jinja2, PyYAML, cryptography,
    # packaging, resolvelib) are frozen by resolving only what PyPI held at this
    # cutoff. ansible-core 2.21.4 was uploaded 2026-09-08T16:51:47Z. The cutoff
    # is part of the venv's directory name, so moving it builds a fresh venv
    # instead of trusting one resolved under a different cutoff.
    ansible_deps_exclude_newer: "2026-09-15T00:00:00Z"
    ansible_venv_dir: "{{ tool_cache_dir }}/ansible-venv-py{{ python_version }}-core{{ ansible_core_version }}-deps{{ ansible_deps_exclude_newer | regex_replace('[^0-9]', '') }}"
    ansible_collections_dir: "{{ tool_cache_dir }}/ansible-collections-posix{{ ansible_posix_version }}"
    # The GitHub-source fallback installs this COMMIT, not the 2.2.2 tag: a tag
    # can be moved or deleted upstream, and the manifest check after the install
    # reads its version from the same repository, so a moved tag would pass it.
    # 2.2.2 is a lightweight tag on exactly this commit.
    ansible_posix_commit: "e98d9a0756458be1ac710988498000973889075c"
    # Every Galaxy attempt is bounded. retries never bound a stalled transfer:
    # at the 2m29s stall that failed nightly 34981852841, four unbounded
    # attempts would spend ~11 minutes of a 25-minute bootstrap before the
    # GitHub fallback ran. The fallback clones and builds, so it gets its own.
    galaxy_attempt_timeout: 120
    galaxy_git_fallback_timeout: 300
    runner_arch_map:
      x86_64: x64
      aarch64: arm64
    runner_arch: "{{ runner_arch_map[ansible_architecture] }}"
    runner_tarball: "actions-runner-linux-{{ runner_arch }}-{{ runner_version }}.tar.gz"
    runner_tarball_url: "https://github.com/actions/runner/releases/download/v{{ runner_version }}/{{ runner_tarball }}"
    effective_runner_name: "{{ runner_name | default('celeris-' + inventory_hostname) }}"
    effective_runner_group: "{{ runner_group | default('Default') }}"
  tasks:
    # Always start from a fully pristine runner dir. The previous
    # idempotent-skip-on-.runner-marker scheme is unsafe: a prior
    # failed run leaves a .runner config that pins the runner to a
    # registration ID GitHub has since deleted, and the subsequent
    # run.sh exits with "Failed to create a session. The runner
    # registration has been deleted from the server, please
    # re-configure." Wiping the dir up-front guarantees every run
    # re-downloads + re-registers with a fresh token.
    #
    # Kill any leftover Runner.Listener / run.sh before the rm so a
    # ghost listener doesn't hold open file descriptors that block
    # the wipe.
    - name: Kill any leftover runner process
      # pkill -f matches against the full argv of every process —
      # which includes the bash shell that's running the pkill
      # command. Using -f with the runner path therefore SIGKILLs
      # this very task (observed: rc=-9 on every host). Match by
      # exact process name instead.
      ansible.builtin.shell: |
        pkill -KILL -x Runner.Listener 2>/dev/null
        pkill -KILL -x run.sh 2>/dev/null
        true
      changed_when: false

    - name: Wipe stale runner dir
      ansible.builtin.file:
        path: "{{ runner_root }}"
        state: absent

    - name: Ensure runner root dir
      ansible.builtin.file:
        path: "{{ runner_root }}"
        state: directory
        mode: '0755'

    - name: Ensure runner tarball cache dir
      ansible.builtin.file:
        path: "{{ runner_cache_dir }}"
        state: directory
        mode: '0755'
        owner: "{{ ansible_user_id }}"

    # 215 MiB per host. Pointing dest inside runner_root made force:false
    # dead code -- the wipe above had just deleted the file it was meant
    # to find -- so every cluster run re-fetched the whole tarball on all
    # three hosts. On 2026-09-15 that took 13m05s and timed out the
    # nightly's 15-minute bootstrap job (probatorium#387); the historical
    # norm for the entire bootstrap is under three minutes, so the
    # download is the variable and nothing else is.
    #
    # get_url's `timeout` is the URL-OPEN timeout, not a transfer cap, so
    # retries never fire on a slow-but-progressing transfer -- it simply
    # runs until the job is killed. Caching removes the transfer instead
    # of trying to bound it.
    - name: Download actions-runner tarball (cached across runs)
      ansible.builtin.get_url:
        url: "{{ runner_tarball_url }}"
        dest: "{{ runner_cache_dir }}/{{ runner_tarball }}"
        mode: '0644'
        force: false
        timeout: 60
      register: runner_tarball_dl
      retries: 5
      delay: 10
      until: runner_tarball_dl is succeeded

    # A cache turns one bad download into every future run's problem, so
    # the extract is the integrity check: if the cached tarball will not
    # unpack, throw it away and fetch it once more. Without this, a
    # corrupt cache file looks like a successful skip forever.
    - name: Extract tarball, re-fetching once if the cached copy is bad
      block:
        - name: Extract tarball
          ansible.builtin.unarchive:
            src: "{{ runner_cache_dir }}/{{ runner_tarball }}"
            dest: "{{ runner_root }}"
            remote_src: true
            creates: "{{ runner_root }}/config.sh"
      rescue:
        - name: Discard the unusable cached tarball
          ansible.builtin.file:
            path: "{{ runner_cache_dir }}/{{ runner_tarball }}"
            state: absent

        - name: Re-download actions-runner tarball
          ansible.builtin.get_url:
            url: "{{ runner_tarball_url }}"
            dest: "{{ runner_cache_dir }}/{{ runner_tarball }}"
            mode: '0644'
            force: true
            timeout: 60
          register: runner_tarball_redl
          retries: 5
          delay: 10
          until: runner_tarball_redl is succeeded

        - name: Extract re-downloaded tarball
          ansible.builtin.unarchive:
            src: "{{ runner_cache_dir }}/{{ runner_tarball }}"
            dest: "{{ runner_root }}"
            remote_src: true
            creates: "{{ runner_root }}/config.sh"

    - name: Register runner with GitHub (config.sh --unattended)
      # Note: NOT using --ephemeral.
      # --ephemeral asks GitHub to auto-delete the registration after
      # one job. In practice that has a tight heartbeat window: if
      # the runner is registered but doesn't enter "Listening for
      # Jobs" within ~30s, GH considers the registration stale and
      # deletes it, after which run.sh exits with "registration has
      # been deleted from the server, please re-configure." Observed
      # on every cluster boot pre-fix.
      #
      # Instead the runner stays a normal long-lived registration;
      # the companion runner-teardown.yml de-registers explicitly
      # at end-of-workflow. --replace lets re-runs cleanly replace
      # a stale registration with the same name.
      ansible.builtin.command:
        cmd: >-
          ./config.sh
          --unattended
          --replace
          --url {{ gh_repo_url }}
          --token {{ gh_runner_token }}
          --name {{ effective_runner_name }}
          --runnergroup {{ effective_runner_group }}
          --labels self-hosted,{{ runner_labels }},{{ inventory_hostname }}
          --work _work
        chdir: "{{ runner_root }}"
      changed_when: true
      register: configure_result
      # config.sh leaks the token to stdout in some failure modes;
      # suppress logging unless this task actually fails. The token
      # is short-lived (1h) so it's not catastrophic, but treat it
      # as a secret regardless.
      no_log: true

    - name: Ensure tool cache dir
      # owner: the cache is under world-writable /tmp and the playbook executes
      # what it finds there. On a directory another local user created first a
      # non-root chown fails and the play stops, instead of trusting it.
      ansible.builtin.file:
        path: "{{ tool_cache_dir }}"
        state: directory
        mode: '0755'
        owner: "{{ ansible_user_id }}"

    - name: Install uv (pinned, cached across runs)
      # mage Deploy / Validate / Soak shell out to ansible-playbook.
      # The cluster hosts don't have ansible system-installed (the
      # pristine rule forbids). Plain `python3 -m venv` fails on the
      # cluster because Ubuntu 26.04 ships python3.14 without
      # python3.14-venv / ensurepip, and there's no system pip either.
      #
      # Use uv instead -- single static binary that bootstraps its own
      # python + venv without depending on system python-venv. The
      # installer drops uv + uvx directly into UV_INSTALL_DIR (NOT a
      # bin/ subdir), so the binary lives at <UV_INSTALL_DIR>/uv.
      #
      # The versioned installer URL really pins: its script sets
      # APP_VERSION to that release. A cached uv is only trusted if it
      # reports the pinned version, so a partial install re-fetches
      # instead of being skipped as present.
      ansible.builtin.shell: |
        set -e
        if [ -x "{{ uv_dir }}/uv" ] && "{{ uv_dir }}/uv" --version | grep -qF "uv {{ uv_version }}"; then
          echo "uv {{ uv_version }} already cached"
          exit 0
        fi
        rm -rf "{{ uv_dir }}"
        curl -LsSf "https://astral.sh/uv/{{ uv_version }}/install.sh" \
          | env UV_INSTALL_DIR="{{ uv_dir }}" \
                UV_NO_MODIFY_PATH=1 \
                INSTALLER_NO_MODIFY_PATH=1 \
                sh
        "{{ uv_dir }}/uv" --version | grep -qF "uv {{ uv_version }}"
      args:
        executable: /bin/bash
      register: uv_install
      changed_when: "'already cached' not in (uv_install.stdout | default(''))"
      retries: 5
      delay: 10
      until: uv_install is succeeded

    - name: Install ansible-core into a uv venv (pinned python, core and dependencies; cached across runs)
      # mage Deploy / Validate / Soak shell out to ansible-playbook, and the
      # cluster hosts have no system ansible (the pristine rule forbids it).
      #
      # The cached unit is the venv AND the managed python it runs on: bin/python
      # is a symlink into uv-python/, so a venv is only as intact as that tree.
      # It is trusted only when ALL of these hold (probatorium#393 review, and
      # the 2026-10-09 bootstrap failure below):
      #  - a completion stamp, written last, exists and is READ;
      #  - every file of the venv and of its python matches the sha256 recorded
      #    when the install was verified (.celeris-manifest);
      #  - ansible-playbook actually runs and reports the pinned core.
      # A presence check is not enough, three times over:
      #  - Ansible's `creates:` checks with glob.glob, which counts a DANGLING
      #    bin/python symlink as present, so a venv whose interpreter was
      #    deleted would be skipped and fail later inside a job.
      #  - uv writes a wheel's entry-point scripts before its package data,
      #    metadata and RECORD, so bin/ansible-playbook can exist over an
      #    install the bootstrap timeout killed half way.
      #  - systemd-tmpfiles ages /tmp (see the header): on 2026-10-09 the first
      #    bootstrap after the 2026-10-06 outage found the managed python of
      #    2026-09-26 with only the 184 bytecode files and 4 sources that the
      #    last run had touched left of its ~4,500. uv treats an existing
      #    cpython-3.13.15-* directory as installed, so every `uv venv` died with
      #    "Python installation is missing a `_sysconfigdata_` file" (msa2) or
      #    "Failed to import encodings module" (msr1), five times, on all three
      #    hosts (celeris-stress run 37934646717). A probe that runs
      #    ansible-playbook cannot see a hole in a file nothing imports.
      #
      # The hash check is also what keeps the cache alive. The kernel stamps a
      # file's access time when it is read, so reading every file of the venv
      # and its python on each run resets the age clock on all of them
      # (ansible.posix survived for the same reason: `collection verify` reads
      # every file). Neither a stat nor running the interpreter does, since
      # Python loads bytecode and merely stats the source beside it. The stamp
      # is read with cat for the same reason; `test -f` left it to be aged out
      # ten days after it was written even on a host that ran every day.
      #
      # A miss rebuilds from nothing: the venv, the whole uv-python tree (an
      # existing but damaged cpython directory, its minor-version symlink and
      # uv's .temp included) and the uv cache, whose archive-v0 entries are
      # hardlinks to inodes aged the same way and would put a venv with
      # missing modules past an ansible-playbook probe. The python is the exact
      # patch release and standalone build pinned above and is probed (it must
      # import the modules a broken tree loses, report that version and carry
      # that build) before a venv is built on it.
      #
      # --managed-python is what keeps that python inside the cache. Without it
      # uv prefers any matching python already on PATH over downloading into
      # UV_PYTHON_INSTALL_DIR, and the "cached" venv then depends on a python
      # that lives somewhere else entirely. An end-to-end run caught exactly
      # that: the venv linked to the test controller's python, and a fresh
      # container could not execute it. The cluster only escapes today because
      # its system python is 3.14. `python install --no-bin` keeps uv from
      # also linking python executables into ~/.local/bin.
      ansible.builtin.shell: |
        set -e
        venv="{{ ansible_venv_dir }}"
        stamp="{{ ansible_venv_dir }}/.celeris-installed"
        manifest="{{ ansible_venv_dir }}/.celeris-manifest"
        cache_ok() {
          [ -s "$stamp" ] && [ -s "$manifest" ] || return 1
          grep -qF "uv {{ uv_version }} " "$stamp" || return 1
          sha256sum --check --quiet --strict "$manifest" > /dev/null 2>&1 || return 1
          "$venv/bin/ansible-playbook" --version 2>/dev/null | head -1 | grep -qF "[core {{ ansible_core_version }}]"
        }
        if cache_ok; then
          echo "ansible-core {{ ansible_core_version }} already cached"
          exit 0
        fi
        rm -rf "$venv" "{{ uv_python_install_dir }}" "{{ uv_cache_dir }}"
        {{ uv_dir }}/uv python install --no-bin {{ python_version }}
        managed="$({{ uv_dir }}/uv python find --managed-python {{ python_version }})"
        "$managed" -I -c 'import encodings, sys, sysconfig, ssl, ctypes, sqlite3, venv, ensurepip; assert "%d.%d.%d" % sys.version_info[:3] == sys.argv[1], sys.version' {{ python_version }}
        build="$(cat "$(dirname "$(dirname "$managed")")/BUILD")"
        if [ "$build" != "{{ python_build }}" ]; then
          echo "uv installed python-build-standalone release $build, not the pinned {{ python_build }}: bump python_build with uv_version, or pin uv" >&2
          exit 1
        fi
        {{ uv_dir }}/uv venv --clear --managed-python --python {{ python_version }} {{ ansible_venv_dir }}
        {{ uv_dir }}/uv pip install --python {{ ansible_venv_dir }}/bin/python --exclude-newer {{ ansible_deps_exclude_newer }} ansible-core=={{ ansible_core_version }}
        "$venv/bin/ansible-playbook" --version | head -1 | grep -qF "[core {{ ansible_core_version }}]"
        # Record what a complete install holds. realpath: base_prefix is the
        # minor-version symlink, and find lists only the link itself if it is
        # not told to descend. The count guards that: a manifest of a few
        # entries would verify nothing. A symlink to a directory (lib64) cannot
        # be hashed, so only links to files are listed; a dangling one fails the
        # hashing here, as it would fail the check later.
        home="$("$venv/bin/python" -c 'import os, sys; print(os.path.realpath(sys.base_prefix))')"
        # pipefail only around this pipeline: a find error (EACCES, a vanished
        # directory) must not leave a truncated manifest that is then trusted.
        set -o pipefail
        find "$venv" "$home/" \( -type f -o -type l \) ! -xtype d ! -path '*/__pycache__/*' ! -name '.celeris-*' \
          | LC_ALL=C sort | xargs -d '\n' sha256sum > "$manifest.new"
        set +o pipefail
        entries="$(wc -l < "$manifest.new")"
        if [ "$entries" -lt 1000 ]; then
          echo "manifest of $venv and $home has only $entries entries: refusing to trust it" >&2
          exit 1
        fi
        mv "$manifest.new" "$manifest"
        echo "ansible-core {{ ansible_core_version }} python {{ python_version }} uv {{ uv_version }} $(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$stamp"
      args:
        executable: /bin/bash
      environment:
        UV_PYTHON_INSTALL_DIR: "{{ uv_python_install_dir }}"
        UV_CACHE_DIR: "{{ uv_cache_dir }}"
      register: ansible_core_install
      changed_when: "'already cached' not in (ansible_core_install.stdout | default(''))"
      retries: 5
      delay: 10
      until: ansible_core_install is succeeded

    # cleanup.yml + deploy.yml reference ansible.posix.sysctl /
    # ansible.posix.synchronize, and ansible-core ships without bundled
    # collections. On 2026-09-15 galaxy.ansible.com gave one host nothing
    # for 2m29s (API time-to-first-byte 23s, while GitHub on the same host
    # did 48 MB/s) and that one host failed the whole bootstrap.
    #
    # The cache is trusted only when a completion stamp written after a
    # verified install exists AND `ansible-galaxy collection verify --offline`
    # finds every file matching its recorded hash. The manifest alone proves
    # nothing: ansible-galaxy writes MANIFEST.json BEFORE any other collection
    # file, so an install killed half way leaves a manifest naming the pin over
    # a partial collection.
    #
    # A miss fetches from Galaxy, and if Galaxy will not serve it, builds the
    # collection from its GitHub source at a pinned COMMIT. ansible.posix
    # publishes no release assets, so its git source is the only non-Galaxy
    # route; git is present on every cluster host. Each attempt is bounded by
    # coreutils timeout, because retries never bound a stall. ANSIBLE_HOME keeps
    # ansible-galaxy's download temp dirs and API cache inside the tool cache.
    - name: Install ansible.posix (pinned; Galaxy, then GitHub source; cached across runs)
      environment:
        ANSIBLE_HOME: "{{ ansible_home_dir }}"
      block:
        - name: Check the cached ansible.posix is complete and the pinned version
          ansible.builtin.shell: |
            set -e
            # cat, not test -f: only a read resets the age of the stamp (see the ansible-core task).
            cat "{{ ansible_collections_dir }}/.celeris-installed-posix{{ ansible_posix_version }}" > /dev/null
            # verify --offline hashes every file but not MANIFEST.json itself, so a
            # manifest whose version was altered passes it (measured end to end).
            "{{ ansible_venv_dir }}/bin/python" -c 'import json, sys; sys.exit(json.load(open(sys.argv[1]))["collection_info"]["version"] != sys.argv[2])' \
              "{{ ansible_collections_dir }}/ansible_collections/ansible/posix/MANIFEST.json" "{{ ansible_posix_version }}"
            "{{ ansible_venv_dir }}/bin/ansible-galaxy" collection verify --offline \
              --collections-path "{{ ansible_collections_dir }}" \
              "ansible.posix:=={{ ansible_posix_version }}"
          args:
            executable: /bin/bash
          changed_when: false
      rescue:
        - name: Discard any partial or mismatched ansible.posix
          ansible.builtin.file:
            path: "{{ ansible_collections_dir }}"
            state: absent

        - name: Fetch ansible.posix, from Galaxy or its GitHub source
          block:
            - name: Install ansible.posix from Galaxy
              ansible.builtin.command:
                cmd: >-
                  timeout {{ galaxy_attempt_timeout }}
                  {{ ansible_venv_dir }}/bin/ansible-galaxy collection install
                  --timeout 30
                  --collections-path {{ ansible_collections_dir }}
                  ansible.posix:=={{ ansible_posix_version }}
              register: ansible_posix_galaxy
              retries: 1
              delay: 15
              until: ansible_posix_galaxy is succeeded
          rescue:
            - name: Install ansible.posix from its GitHub source commit
              ansible.builtin.command:
                cmd: >-
                  timeout {{ galaxy_git_fallback_timeout }}
                  {{ ansible_venv_dir }}/bin/ansible-galaxy collection install --force
                  --collections-path {{ ansible_collections_dir }}
                  git+https://github.com/ansible-collections/ansible.posix.git,{{ ansible_posix_commit }}
              register: ansible_posix_git
              retries: 2
              delay: 15
              until: ansible_posix_git is succeeded

        - name: Read the installed ansible.posix manifest
          ansible.builtin.slurp:
            src: "{{ ansible_collections_dir }}/ansible_collections/ansible/posix/MANIFEST.json"
          register: ansible_posix_manifest

        - name: Check the installed ansible.posix is the pinned version
          ansible.builtin.assert:
            that:
              - (ansible_posix_manifest.content | b64decode | from_json).collection_info.version == ansible_posix_version
            fail_msg: "ansible.posix installed but its MANIFEST.json does not name {{ ansible_posix_version }}"

        - name: Verify every installed ansible.posix file against its recorded hash
          ansible.builtin.command:
            cmd: >-
              {{ ansible_venv_dir }}/bin/ansible-galaxy collection verify --offline
              --collections-path {{ ansible_collections_dir }}
              ansible.posix:=={{ ansible_posix_version }}
          changed_when: false

        - name: Stamp ansible.posix as completely installed
          ansible.builtin.file:
            path: "{{ ansible_collections_dir }}/.celeris-installed-posix{{ ansible_posix_version }}"
            state: touch
            mode: '0644'

    - name: Confirm the cached tool directories exist before linking to them
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ ansible_venv_dir }}"
        - "{{ ansible_collections_dir }}"
      register: cached_tool_dir
      failed_when: not (cached_tool_dir.stat.isdir | default(false))

    - name: Point the legacy runner_root tool paths at the cache
      # Six cluster workflows (nightly, weekend, benchmark, checkptr,
      # race, pr-tier) never read the exports in "Start runner": each
      # re-derives RUNNER_ROOT=/tmp/actions-runner-$(hostname -s) and puts
      # ${RUNNER_ROOT}/ansible-venv/bin on GITHUB_PATH and
      # ${RUNNER_ROOT}/ansible-collections into ANSIBLE_COLLECTIONS_PATH.
      # Keeping those two paths alive as symlinks into the cache leaves
      # all six untouched. Teardown's "Wipe runner dir" is
      # ansible.builtin.file state=absent, which for a directory is
      # shutil.rmtree -- that unlinks a symlink and never follows it
      # (measured on Linux CPython 3.13: avoids_symlink_attacks=True and
      # the target survives), so the wipe drops the links, not the cache.
      #
      # No force: true. The wipe above leaves both paths absent, replacing a
      # stale link needs no force anyway, and force would switch off ansible's
      # only check that the target exists: a missing cache dir would become a
      # dangling link and a WARNING instead of a failure.
      ansible.builtin.file:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        state: link
      loop:
        - { src: "{{ ansible_venv_dir }}", dest: "{{ runner_root }}/ansible-venv" }
        - { src: "{{ ansible_collections_dir }}", dest: "{{ runner_root }}/ansible-collections" }

    - name: Start runner (nohup)
      # Prepend the ansible venv to PATH so any job
      # that lands on this runner finds ansible-playbook without
      # needing an explicit per-job install step. The export goes
      # into the runner's process environment because run.sh
      # inherits the shell's PATH.
      #
      # ANSIBLE_COLLECTIONS_PATH points ansible-playbook at the
      # collections dir (ansible.posix lives there) —
      # without it ansible-galaxy's collection install is invisible
      # to ansible-playbook at runtime.
      #
      # Both paths are symlinks into the host's version-keyed tool cache;
      # see "Point the legacy runner_root tool paths at the cache".
      #
      # Signals: the `&` below runs in a non-interactive shell, so the runner
      # starts with SIGINT and SIGQUIT ignored (nohup adds SIGHUP), and every
      # step it runs inherits that. A cancel's SIGINT is lost on a step that
      # does not reset it, and a bash step cannot even trap it: the step then
      # ends only on the runner's SIGTERM, 7.5 s later (probatorium#435, P6b
      # run 36338683576). celeris-stress-cluster.yml's host step resets them
      # with env --default-signal.
      ansible.builtin.shell: |
        cd {{ runner_root }}
        export PATH="{{ runner_root }}/ansible-venv/bin:$PATH"
        export ANSIBLE_COLLECTIONS_PATH="{{ runner_root }}/ansible-collections"
        nohup ./run.sh > runner.stdout 2> runner.stderr < /dev/null &
        echo $!
      changed_when: true
      register: runner_pid_result

    - name: Persist PID to runner.pid for teardown
      ansible.builtin.copy:
        dest: "{{ runner_root }}/runner.pid"
        content: "{{ runner_pid_result.stdout | default('') }}\n"
        mode: '0644'
      when: runner_pid_result.stdout is defined and runner_pid_result.stdout | length > 0

    - name: Wait for runner to register and start listening
      # The runner registers with GitHub immediately after starting,
      # then enters its job-pull loop. We tail runner.stdout for the
      # canonical "Listening for Jobs" line so the dispatching
      # workflow knows the runner is ready before it queues jobs.
      ansible.builtin.shell: |
        for i in $(seq 1 30); do
          if grep -q "Listening for Jobs" {{ runner_root }}/runner.stdout 2>/dev/null; then
            echo ready
            exit 0
          fi
          sleep 2
        done
        echo "runner.stdout tail:"
        tail -20 {{ runner_root }}/runner.stdout 2>/dev/null || true
        echo "runner.stderr tail:"
        tail -20 {{ runner_root }}/runner.stderr 2>/dev/null || true
        exit 1
      args:
        executable: /bin/bash
      changed_when: false
      register: ready_check

    - name: Summarise runner state
      # Note: don't use `lookup('file', ...)` for runner.pid here —
      # ansible lookups run on the controller, not the remote host,
      # and the controller doesn't have the per-host PID file
      # mounted. The PID was already echoed by the "Start runner"
      # task above; use the registered result instead, which falls
      # back to "n/a" if the runner was idempotently skipped.
      ansible.builtin.debug:
        msg: |
          Runner provisioned on {{ inventory_hostname }}:
            dir:    {{ runner_root }}
            name:   {{ effective_runner_name }}
            labels: self-hosted,{{ runner_labels }},{{ inventory_hostname }}
            pid:    {{ runner_pid_result.stdout | default('n/a (idempotent re-run)') }}
            ready:  {{ ready_check.stdout }}
