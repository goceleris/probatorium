---
# Tears down whatever runner-setup.yml provisioned. Idempotent —
# missing runner_root or dead PID is treated as success. The
# `--ephemeral` registration means GitHub auto-removes a runner that
# has completed its single job, so the de-register call here is a
# safety net for runners that started but never got dispatched a job
# (e.g. workflow cancelled).
#
# Required extra-vars:
#   gh_repo_url           same as runner-setup.yml
#   gh_runner_remove_token   repo-scoped removal token, obtained from
#                            POST /repos/<owner>/<repo>/actions/runners/remove-token
#
# Per probatorium#103 / wave-12 ladder bootstrap.

- name: Tear down actions-runner per cluster host
  hosts: cluster
  gather_facts: false
  # A wedged/unreachable SUT host must NOT abort teardown of the others.
  # Without this, one dead host (the 2026-07-11 incident) fails the play and
  # skips the GitHub-side orphan-runner sweep + manifest drop on the healthy
  # hosts, re-wedging the cluster. Reachable hosts clean fully; rc stays 0.
  ignore_unreachable: true
  vars:
    runner_root: "/tmp/actions-runner-{{ inventory_hostname }}"
  tasks:
    - name: Probe for runner dir
      ansible.builtin.stat:
        path: "{{ runner_root }}"
      register: runner_dir

    - block:
        - name: Kill Runner.Listener if still alive
          # The common teardown case is the dir exists but the
          # listener already exited (job completed). Belt and braces
          # SIGTERM → wait 5s → SIGKILL the PID, then sweep by name.
          #
          # All {{ runner_root }} interpolations are explicitly
          # double-quoted: unquoted Jinja-inside-bash trips
          # ansible 2.18+'s argument splitter with "failed at
          # splitting arguments, either an unbalanced jinja2 block
          # or quotes."
          #
          # pkill uses -x (exact name) not -f (full argv); -f would
          # SIGKILL this very shell because the pattern appears in
          # the script being executed.
          ansible.builtin.shell: |
            PIDFILE="{{ runner_root }}/runner.pid"
            if [ -f "$PIDFILE" ]; then
              PID=$(cat "$PIDFILE")
              if kill -0 "$PID" 2>/dev/null; then
                kill -TERM "$PID" 2>/dev/null || true
                for i in $(seq 1 5); do
                  if ! kill -0 "$PID" 2>/dev/null; then break; fi
                  sleep 1
                done
                kill -KILL "$PID" 2>/dev/null || true
              fi
            fi
            pkill -KILL -x Runner.Listener 2>/dev/null
            pkill -KILL -x run.sh          2>/dev/null
            true
          args:
            executable: /bin/bash
          changed_when: true

        - name: De-register runner from GitHub
          # config.sh remove --unattended needs the removal-token.
          # If --ephemeral already self-de-registered (the runner
          # completed a job) this exits 0 with a "not found" message,
          # which we accept. Any other failure isn't fatal — the
          # teardown still runs.
          ansible.builtin.command:
            cmd: ./config.sh remove --unattended --token {{ gh_runner_remove_token }}
            chdir: "{{ runner_root }}"
          register: deregister_result
          failed_when: false
          changed_when: deregister_result.rc == 0
          no_log: true

        - name: Wipe runner dir
          ansible.builtin.file:
            path: "{{ runner_root }}"
            state: absent

      when: runner_dir.stat.exists

    # Unconditionally drop the bench manifest — the cluster ownership lock that
    # `wait-for-manifest-clear` serialises every tier on. It is normally removed
    # by `mage Cleanup`, an in-band step that DIES WITH THE RUNNER on a host
    # wedge / SIGBUS / hard-cancel, stranding the lock and blocking every future
    # cluster job until a human rm's it (2026-07-11 incident). This off-cluster,
    # always-run teardown job is the only reliable place to drop it. Runs on
    # every reachable host regardless of runner-dir state.
    - name: Drop stale bench manifest (cluster ownership lock)
      become: true
      ansible.builtin.file:
        path: "{{ manifest_path | default('/tmp/celeris-bench-manifest.json') }}"
        state: absent

    - name: Confirm pristine state
      ansible.builtin.stat:
        path: "{{ runner_root }}"
      register: post_teardown
      failed_when: post_teardown.stat.exists

    - name: Summarise teardown
      ansible.builtin.debug:
        msg: "Runner removed from {{ inventory_hostname }} (dir wiped, registration cleared)."
