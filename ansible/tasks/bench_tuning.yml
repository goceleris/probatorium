# Stage 1: Apply bench-tuning kernel sysctls to the loadgen host and
# all bench targets. The bench sustains 500-800k RPS × 256 concurrent
# connections × 40s per cell — at that rate, the kernel's default
# ephemeral-port range (28k ports) and TIME_WAIT timeout (60s) saturate
# the port pool within a few cells, sshd can't allocate a port for new
# sessions, and the host TCP wedges for tens of minutes (probatorium
# bug #184: 7h+ SSH/ICMP wedge on msa2-server during a 31-cell
# back-to-back run, while port 8080 and Tailscale UDP stayed up).
#
# Idempotent. Applies on every run; the prior values get snapshotted
# into deploy_manifest.prior_sysctl so cleanup.yml can restore the
# host's pristine state on teardown.
#
# Specifically NOT setting (deprecated / dangerous on modern kernels):
#   net.ipv4.tcp_tw_recycle  - removed in kernel 4.12, breaks NAT
#
# Setting (all are safe on Linux 4.x+, default-on on most distros but
# the defaults are too small for a 28k-conns/s sustained load):
#   net.ipv4.ip_local_port_range    1024 65535   (was 32768 60999 = 28k)
#   net.ipv4.tcp_tw_reuse           1            (was 0; safe for outbound)
#   net.ipv4.tcp_fin_timeout        15           (was 60; Linux 4.12+)
#   net.ipv4.tcp_max_tw_buckets     2000000      (was 262144)
#   net.core.somaxconn              65535        (was 4096)
#   net.ipv4.tcp_max_syn_backlog    65535        (was 128-512)
#   net.ipv4.tcp_slow_start_after_idle 0         (bench's burst pattern)
#   net.ipv4.tcp_no_metrics_save    1            (less cache pressure)
#   fs.file-max                     2000000      (was ~1M)
#   net.netfilter.nf_conntrack_max  1000000      (only if NAT active;
#                                                 default 65536 too small)

- name: Apply bench-tuning kernel sysctls (loadgen host + bench targets)
  become: true
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: false
  loop:
    - { name: "net.ipv4.ip_local_port_range",         value: "1024 65535" }
    - { name: "net.ipv4.tcp_tw_reuse",                value: "1" }
    - { name: "net.ipv4.tcp_fin_timeout",             value: "15" }
    - { name: "net.ipv4.tcp_max_tw_buckets",          value: "2000000" }
    - { name: "net.core.somaxconn",                   value: "65535" }
    - { name: "net.ipv4.tcp_max_syn_backlog",         value: "65535" }
    - { name: "net.ipv4.tcp_slow_start_after_idle",   value: "0" }
    - { name: "net.ipv4.tcp_no_metrics_save",         value: "1" }
    - { name: "fs.file-max",                          value: "2000000" }
    - { name: "net.netfilter.nf_conntrack_max",       value: "1000000" }
  when:
    - inventory_hostname in groups['bench_targets'] or
      inventory_hostname == "msa2-client"

- name: Verify bench-tuning sysctls landed
  become: true
  ansible.builtin.command: "sysctl -n {{ item }}"
  register: bench_sysctl_verify
  changed_when: false
  failed_when: bench_sysctl_verify.rc != 0
  loop:
    - "net.ipv4.ip_local_port_range"
    - "net.ipv4.tcp_tw_reuse"
    - "net.ipv4.tcp_fin_timeout"
    - "net.ipv4.tcp_max_tw_buckets"
    - "net.core.somaxconn"
    - "net.ipv4.tcp_max_syn_backlog"
    - "fs.file-max"
    - "net.netfilter.nf_conntrack_max"
  when:
    - inventory_hostname in groups['bench_targets'] or
      inventory_hostname == "msa2-client"

# ---------- memlock raise (celeris iouring engine) ----------
# probatorium#1: celeris v1.4.15 io_uring engine needs ~12MB RLIMIT_MEMLOCK
# per worker × 16 workers = 192MB on the bench target. The Ubuntu
# default is 8MB which caps the engine to 1 worker ("io_uring workers
# capped by RLIMIT_MEMLOCK requested=16 capped_to=1"); that single
# worker then crashes with stack pool corruption under the bench's
# 200-conns × 8-deep load.
#
# The fix is layered: (a) defaults in systemd for FUTURE logins, (b)
# an sshd drop-in so NEW sshd-spawned sessions inherit unlimited,
# and (c) explicit user entries in limits.conf as a belt-and-suspenders.
# All three are needed because the limit is enforced at process
# creation — any of the three alone is insufficient. The (a)+(b)
# combo takes full effect on the NEXT system boot (systemd reads
# DefaultLimitMEMLOCK at pid 1 startup; sshd reads LimitMEMLOCK when
# it itself starts, which only happens at boot). The bench is
# intended to run on hosts that have been booted at least once with
# this deploy's systemd.conf in place.
#
# Three things make this layer-defence complete:
#   1. /etc/systemd/system.conf: DefaultLimitMEMLOCK=infinity
#      → sets the system-wide default for new processes
#   2. /etc/systemd/system/ssh.service.d/memlock.conf: LimitMEMLOCK=infinity
#      → forces sshd to inherit unlimited even if (1) is missing
#   3. /etc/security/limits.conf: explicit memlock=unlimited for *,
#      root, and mini (the wildcard does NOT apply to root per
#      limits.conf(5) — both must be listed)
# → future SSH logins read (3) and inherit unlimited memlock
# → sshd children (the SUT shell) inherit the raised limit
- name: Snapshot prior /etc/security/limits.conf (so cleanup can restore)
  become: true
  ansible.builtin.slurp:
    src: /etc/security/limits.conf
  register: limits_conf_slurp
  failed_when: false
  changed_when: false
  when:
    - inventory_hostname in groups['bench_targets'] or
      inventory_hostname == "msa2-client"

- name: Record prior limits.conf in deploy manifest
  ansible.builtin.set_fact:
    prior_limits_conf: "{{ limits_conf_slurp.content | default('') }}"
  when: limits_conf_slurp is defined

- name: Add memlock=unlimited lines to /etc/security/limits.conf
  # Per limits.conf(5): "group and wildcard limits are not applied to
  # the root user. To set a limit for the root user, this field must
  # contain the literal username root." We list BOTH the wildcard and
  # explicit root/mini so the limit applies regardless of which user
  # the bench runs as (ansible become: true = root; ssh login = mini).
  become: true
  ansible.builtin.lineinfile:
    path: /etc/security/limits.conf
    line: "{{ item }}"
    insertbefore: "# End of file"
    state: present
    create: false
  loop:
    - "*    soft    memlock    unlimited"
    - "*    hard    memlock    unlimited"
    - "root  soft    memlock    unlimited"
    - "root  hard    memlock    unlimited"
    - "mini  soft    memlock    unlimited"
    - "mini  hard    memlock    unlimited"
  when:
    - inventory_hostname in groups['bench_targets'] or
      inventory_hostname == "msa2-client"

- name: Set DefaultLimitMEMLOCK=infinity in /etc/systemd/system.conf
  # Takes effect on the NEXT system boot. The bench is intended to
  # run on hosts that have been rebooted at least once with this
  # deploy's systemd.conf in place, so sshd inherits the unlimited
  # limit at boot.
  become: true
  ansible.builtin.lineinfile:
    path: /etc/systemd/system.conf
    line: "DefaultLimitMEMLOCK=infinity"
    regexp: "^#?DefaultLimitMEMLOCK="
    state: present
    create: false
  when:
    - inventory_hostname in groups['bench_targets'] or
      inventory_hostname == "msa2-client"

- name: Ensure the sshd drop-in directory exists
  # ansible.builtin.copy does NOT create parent directories. This dir happened
  # to exist on the two hand-built cluster hosts, so the deploy had a silent
  # dependency on state no freshly-installed node has — msa2-client's rebuild
  # (2026-08-18) failed here with "Destination directory ... does not exist"
  # while the other two passed.
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/ssh.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - inventory_hostname in groups['bench_targets'] or
      inventory_hostname == "msa2-client"

- name: Drop-in LimitMEMLOCK=infinity for the sshd service
  # Belt-and-suspenders: the sshd service drop-in overrides the
  # system default for the sshd process itself, so even if
  # /etc/systemd/system.conf is missing the line, sshd is started
  # with unlimited memlock. Requires `systemctl daemon-reload` and
  # a subsequent sshd restart to take effect.
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/ssh.service.d/memlock.conf
    content: |
      [Service]
      LimitMEMLOCK=infinity
    mode: '0644'
  when:
    - inventory_hostname in groups['bench_targets'] or
      inventory_hostname == "msa2-client"

- name: systemctl daemon-reload (picks up the sshd drop-in)
  become: true
  ansible.builtin.command: systemctl daemon-reload
  changed_when: false
  when:
    - inventory_hostname in groups['bench_targets'] or
      inventory_hostname == "msa2-client"

- name: Schedule a delayed sshd restart (so the issuing session survives)
  # Restarting sshd directly would kill the ansible connection that
  # issued the command. Instead, kick off a 5-second nohup background
  # job that does the restart, then return. By the time the next SSH
  # session lands, sshd has been restarted and reads the new limit.
  become: true
  ansible.builtin.shell: |
    nohup bash -c 'sleep 5 && systemctl restart ssh' > /var/log/probatorium-sshd-restart.log 2>&1 &
    disown
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - inventory_hostname in groups['bench_targets'] or
      inventory_hostname == "msa2-client"

- name: Verify memlock=unlimited landed in /etc/security/limits.conf
  become: true
  ansible.builtin.shell: grep -E '^((\*|root|mini)\s+(soft|hard)\s+memlock\s+unlimited)' /etc/security/limits.conf
  register: limits_conf_verify
  changed_when: false
  failed_when: limits_conf_verify.stdout_lines | length < 6
  when:
    - inventory_hostname in groups['bench_targets'] or
      inventory_hostname == "msa2-client"

- name: Verify DefaultLimitMEMLOCK=infinity landed in /etc/systemd/system.conf
  become: true
  ansible.builtin.shell: grep -E '^DefaultLimitMEMLOCK=infinity' /etc/systemd/system.conf
  register: systemd_verify
  changed_when: false
  failed_when: systemd_verify.stdout_lines | length != 1
  when:
    - inventory_hostname in groups['bench_targets'] or
      inventory_hostname == "msa2-client"

- name: Report memlock fix status
  ansible.builtin.debug:
    msg: >-
      memlock fix applied to {{ inventory_hostname }}:
      limits.conf has {{ limits_conf_verify.stdout_lines | length }} memlock=unlimited entries;
      systemd DefaultLimitMEMLOCK=infinity set;
      sshd drop-in installed at /etc/systemd/system/ssh.service.d/memlock.conf;
      sshd restart scheduled. A subsequent boot is needed for the
      full effect; until then, the bench may still cap iouring to 1
      worker (logs will show 'capped_to=1').
  when:
    - inventory_hostname in groups['bench_targets'] or
      inventory_hostname == "msa2-client"
