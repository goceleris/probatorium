# Stage 1: Apply bench-tuning kernel sysctls to the loadgen host and
# all bench targets. The bench sustains 500-800k RPS × 256 concurrent
# connections × 40s per cell — at that rate, the kernel's default
# ephemeral-port range (28k ports) and TIME_WAIT timeout (60s) saturate
# the port pool within a few cells, sshd can't allocate a port for new
# sessions, and the host TCP wedges for tens of minutes (probatorium
# bug #184: 7h+ SSH/ICMP wedge on msa2-server during a 31-cell
# back-to-back run, while port 8080 and Tailscale UDP stayed up).
#
# Idempotent. Applies on every run; the prior values get snapshotted
# into deploy_manifest.prior_sysctl so cleanup.yml can restore the
# host's pristine state on teardown.
#
# Specifically NOT setting (deprecated / dangerous on modern kernels):
#   net.ipv4.tcp_tw_recycle  - removed in kernel 4.12, breaks NAT
#
# Setting (all are safe on Linux 4.x+, default-on on most distros but
# the defaults are too small for a 28k-conns/s sustained load):
#   net.ipv4.ip_local_port_range    1024 65535   (was 32768 60999 = 28k)
#   net.ipv4.tcp_tw_reuse           1            (was 0; safe for outbound)
#   net.ipv4.tcp_fin_timeout        15           (was 60; Linux 4.12+)
#   net.ipv4.tcp_max_tw_buckets     2000000      (was 262144)
#   net.core.somaxconn              65535        (was 4096)
#   net.ipv4.tcp_max_syn_backlog    65535        (was 128-512)
#   net.ipv4.tcp_slow_start_after_idle 0         (bench's burst pattern)
#   net.ipv4.tcp_no_metrics_save    1            (less cache pressure)
#   fs.file-max                     2000000      (was ~1M)
#   net.netfilter.nf_conntrack_max  1000000      (only if NAT active;
#                                                 default 65536 too small)

- name: Apply bench-tuning kernel sysctls (loadgen host + bench targets)
  become: true
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: false
  loop:
    - { name: "net.ipv4.ip_local_port_range",         value: "1024 65535" }
    - { name: "net.ipv4.tcp_tw_reuse",                value: "1" }
    - { name: "net.ipv4.tcp_fin_timeout",             value: "15" }
    - { name: "net.ipv4.tcp_max_tw_buckets",          value: "2000000" }
    - { name: "net.core.somaxconn",                   value: "65535" }
    - { name: "net.ipv4.tcp_max_syn_backlog",         value: "65535" }
    - { name: "net.ipv4.tcp_slow_start_after_idle",   value: "0" }
    - { name: "net.ipv4.tcp_no_metrics_save",         value: "1" }
    - { name: "fs.file-max",                          value: "2000000" }
    - { name: "net.netfilter.nf_conntrack_max",       value: "1000000" }
  when:
    - inventory_hostname in groups['bench_targets'] or
      inventory_hostname == "msa2-client"

- name: Verify bench-tuning sysctls landed
  become: true
  ansible.builtin.command: "sysctl -n {{ item }}"
  register: bench_sysctl_verify
  changed_when: false
  failed_when: bench_sysctl_verify.rc != 0
  loop:
    - "net.ipv4.ip_local_port_range"
    - "net.ipv4.tcp_tw_reuse"
    - "net.ipv4.tcp_fin_timeout"
    - "net.ipv4.tcp_max_tw_buckets"
    - "net.core.somaxconn"
    - "net.ipv4.tcp_max_syn_backlog"
    - "fs.file-max"
    - "net.netfilter.nf_conntrack_max"
  when:
    - inventory_hostname in groups['bench_targets'] or
      inventory_hostname == "msa2-client"

# ---------- memlock raise (celeris iouring engine) ----------
# probatorium#1: celeris v1.4.15 io_uring engine needs ~12MB RLIMIT_MEMLOCK
# per worker × 16 workers = 192MB on the bench target. The Ubuntu
# default is 8MB which caps the engine to 1 worker ("io_uring workers
# capped by RLIMIT_MEMLOCK requested=16 capped_to=1"); that single
# worker then crashes with stack pool corruption under the bench's
# 200-conns × 8-deep load. Three layers of fix, all idempotent:
#
#   1. /etc/security/limits.conf: persistent entry so future login
#      sessions inherit the new limit. Survives across deploys.
#   2. prlimit --memlock=unlimited on the CURRENT shell: raises the
#      limit immediately (no re-login required) for any process
#      spawned from this ansible task onwards. This is the load-bearing
#      fix — limits.conf changes only take effect on next login.
#   3. Snapshot the prior limits.conf state into prior_limits_conf so
#      cleanup.yml can restore the host's pristine state on teardown
#      (the same pattern as prior_sysctl).
- name: Snapshot prior /etc/security/limits.conf (so cleanup can restore)
  become: true
  ansible.builtin.slurp:
    src: /etc/security/limits.conf
  register: limits_conf_slurp
  failed_when: false
  changed_when: false
  when:
    - inventory_hostname in groups['bench_targets'] or
      inventory_hostname == "msa2-client"

- name: Record prior limits.conf in deploy manifest
  ansible.builtin.set_fact:
    prior_limits_conf: "{{ limits_conf_slurp.content | default('') }}"
  when: limits_conf_slurp is defined

- name: Add memlock=unlimited to /etc/security/limits.conf
  become: true
  ansible.builtin.lineinfile:
    path: /etc/security/limits.conf
    line: "*    soft    memlock    unlimited"
    insertbefore: "# End of file"
    state: present
    create: false
  when:
    - inventory_hostname in groups['bench_targets'] or
      inventory_hostname == "msa2-client"

- name: Add memlock=unlimited hard limit to /etc/security/limits.conf
  become: true
  ansible.builtin.lineinfile:
    path: /etc/security/limits.conf
    line: "*    hard    memlock    unlimited"
    insertbefore: "# End of file"
    state: present
    create: false
  when:
    - inventory_hostname in groups['bench_targets'] or
      inventory_hostname == "msa2-client"

- name: Raise RLIMIT_MEMLOCK on the current shell (prlimit) for immediate effect
  become: true
  ansible.builtin.shell: |
    # prlimit can raise the hard limit only if the kernel allows it
    # (CONFIG_SECURITY_CAPABILITIES or root-in-init_user); on a stock
    # Ubuntu 26.04 host, root-in-user_ns CAN raise its own memlock.
    # The change applies to this shell + children. The SUT is spawned
    # from this ansible task, so it inherits the raised limit.
    prlimit --memlock=unlimited --pid=$$ --output=RESOURCE,SOFT,HARD 2>&1 || true
    echo "current memlock limit: $(ulimit -l)"
  register: prlimit_raise
  changed_when: false
  when:
    - inventory_hostname in groups['bench_targets'] or
      inventory_hostname == "msa2-client"

- name: Verify memlock is raised on the bench target
  become: true
  ansible.builtin.shell: ulimit -l
  register: memlock_verify
  changed_when: false
  failed_when: memlock_verify.stdout | trim == "8192"
  when:
    - inventory_hostname in groups['bench_targets'] or
      inventory_hostname == "msa2-client"

- name: Report memlock raise
  ansible.builtin.debug:
    msg: "memlock: {{ memlock_verify.stdout | trim }} (was 8192 / 8MB before fix; needs >= 200MB for 16 iouring workers)"
  when:
    - inventory_hostname in groups['bench_targets'] or
      inventory_hostname == "msa2-client"
