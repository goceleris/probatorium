---
# Build a single non-Go competitor adapter natively on the bench host.
#
# Loop var: comp = { key: <slug>, value: {
#                      lang: rust|bun|python,
#                      tarball: <local path to .tar.gz on dev Mac>,
#                      build_cmd: <shell command to run in extracted dir>,
#                      binary_rel: <path to the produced binary, relative
#                                   to the extracted source root>,
#                      module_target: <python only — uvicorn import target
#                                       like "app.server:app"; defaults
#                                       to that exact string in the role> } }
#
# Stages everything under {{ bench_root }}/competitors-src/<slug>/ and
# symlinks the produced binary into {{ bench_root }}/competitors/<slug>
# so the bench playbook can launch it identically to Go competitors.
#
# Python adapters are special-cased: the python role's build_competitor.yml
# owns venv creation, dep install, and launcher rendering. For python we
# skip both the generic build_cmd shell and the binary_rel symlink — the
# launcher is written directly at competitors/<slug>/server by the role.

- name: "{{ comp.key }} | ensure source dir exists"
  ansible.builtin.file:
    path: "{{ bench_root }}/competitors-src/{{ comp.key }}"
    state: directory
    mode: '0755'

- name: "{{ comp.key }} | push source tarball"
  ansible.builtin.copy:
    src: "{{ comp.value.tarball }}"
    dest: "{{ bench_root }}/competitors-src/{{ comp.key }}.tar.gz"
    mode: '0644'

- name: "{{ comp.key }} | extract source"
  ansible.builtin.unarchive:
    src: "{{ bench_root }}/competitors-src/{{ comp.key }}.tar.gz"
    dest: "{{ bench_root }}/competitors-src/{{ comp.key }}/"
    remote_src: true

# Each language gets its toolchain dir on PATH plus the env vars its
# package manager expects. We do NOT touch HOME — every cache must
# resolve under {{ bench_root }} so cleanup wipes it cleanly.
#
# Rust competitors compile with RUSTFLAGS="-C target-cpu=native" so the
# bench measures the codegen the framework's authors intended for the
# host CPU (AVX2 / NEON intrinsics, branch-prediction tuning, etc.).
# CARGO_TARGET_DIR pins the build output under {{ bench_root }} so
# cleanup wipes every byte cargo wrote. Other languages don't read
# RUSTFLAGS / CARGO_TARGET_DIR so leaving them set unconditionally is a
# no-op for them.
# Rust path: run the generic build_cmd shell (cargo build ...) under
# the right env and symlink the produced binary. Bun/python adapters
# skip this — their language-specific role takes over below.
- name: "{{ comp.key }} | run rust build command"
  environment:
    PATH: >-
      {{ bench_root }}/rustup/cargo/bin:{{ bench_root }}/bun/bin:{{ bench_root }}/uv/bin:{{ ansible_env.PATH }}
    CARGO_HOME: "{{ bench_root }}/rustup/cargo"
    RUSTUP_HOME: "{{ bench_root }}/rustup/rustup"
    CARGO_TARGET_DIR: "{{ bench_root }}/competitors-src/{{ comp.key }}/target"
    RUSTFLAGS: "-C target-cpu=native"
    XDG_CACHE_HOME: "{{ bench_root }}/xdg-cache"
    XDG_CONFIG_HOME: "{{ bench_root }}/xdg-config"
  ansible.builtin.shell: |
    set -euo pipefail
    cd {{ bench_root }}/competitors-src/{{ comp.key }}
    {{ comp.value.build_cmd | default('true') }}
  args:
    executable: /bin/bash
  when: comp.value.lang == 'rust'

- name: "{{ comp.key }} | symlink built rust binary into competitors/"
  ansible.builtin.file:
    src: "{{ bench_root }}/competitors-src/{{ comp.key }}/{{ comp.value.binary_rel }}"
    dest: "{{ bench_root }}/competitors/{{ comp.key }}"
    state: link
    force: true
  when: comp.value.lang == 'rust'

# Bun adapters: dispatch to the bun role's parameterized
# build_competitor task list. It runs `bun install --production`,
# `bun build --target=bun --minify` to produce dist/server (a single-file
# bundle), and writes a POSIX-sh launcher next to it. The shared
# build_native_competitor.yml then symlinks the launcher into
# competitors/<slug>.
- name: "{{ comp.key }} | build bun competitor (deps + bundle + launcher)"
  ansible.builtin.include_role:
    name: bun
    tasks_from: build_competitor.yml
  vars:
    competitor_name: "{{ comp.key }}"
    competitor_src: "{{ bench_root }}/competitors-src/{{ comp.key }}"
  when: comp.value.lang == 'bun'

- name: "{{ comp.key }} | symlink bun launcher into competitors/"
  ansible.builtin.file:
    src: "{{ bench_root }}/competitors-src/{{ comp.key }}/server"
    dest: "{{ bench_root }}/competitors/{{ comp.key }}"
    state: link
    force: true
  when: comp.value.lang == 'bun'

# Python adapters: dispatch to the python role's parameterized
# build_competitor task list. It creates the venv, installs deps via uv,
# and renders the launcher script — no symlink needed (the launcher
# lives directly at competitors/<slug>/server).
- name: "{{ comp.key }} | build python competitor (venv + launcher)"
  ansible.builtin.include_role:
    name: python
    tasks_from: build_competitor.yml
  vars:
    competitor_name: "{{ comp.key }}"
    competitor_src_dir: "{{ bench_root }}/competitors-src/{{ comp.key }}"
    competitor_module: "{{ comp.value.module_target | default('app.server:app') }}"
  when: comp.value.lang == 'python'
