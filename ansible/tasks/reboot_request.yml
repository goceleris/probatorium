---
# The request of ansible/reboot.yml, validated. Imported by the first two plays: a failed play does not by itself
# stop the plays after it, and the host pattern of the third is the very variable checked here.
- name: Reboot | the request is well formed
  ansible.builtin.assert:
    that:
      - reboot_host is defined
      - reboot_host in ['msr1', 'msa2-server']
      - reboot_confirm is defined
      - reboot_confirm == 'REBOOT-' ~ reboot_host
      - reboot_reason is defined
      - reboot_reason | trim | length > 0
      - reboot_reason | length <= 200
      - "'\n' not in reboot_reason"
      - reboot_run_id is defined
      - reboot_run_id | string is match('^[0-9]+$')
      - reboot_out_dir is defined
      - reboot_out_dir is match('^/')
    fail_msg: >-
      refused: reboot_host must be msr1 or msa2-server (msa2-client drives both and is never rebooted here),
      reboot_confirm must be exactly REBOOT-<host>, reboot_reason one line of 1-200 characters,
      reboot_run_id digits, reboot_out_dir absolute.
    quiet: true

- name: Reboot | the host is a bench target of the inventory
  ansible.builtin.assert:
    that: reboot_host in groups['bench_targets']
    fail_msg: "refused: {{ reboot_host }} is not a bench target of the inventory"
    quiet: true
