---
# One bench cell: (run_index, competitor_slug). Wraps a server start +
# mpstat samplers on both sides + a single runner invocation + clean
# teardown.
#
# Loop var: cell = [run_index, competitor_slug]
#
# Since #152 the bench path drives the Go runner (not the bare loadgen
# binary): the runner is invoked once per cell on msa2-client with
# -runs 1 and expands the full scenario catalogue itself against the
# already-running remote SUT. So a single cell now runs N_scenarios
# back-to-back rather than one "/" GET. Ansible keeps the outer
# (run_index x competitor) interleaving (see bench.yml); the runner adds
# the scenario inner loop and writes run0/<scenario>/<server>.json under
# the cell dir.
#
# Two-host coordinated. Tasks gate themselves with `when: inventory_hostname ...`
# rather than re-running the same playbook on a smaller `hosts:` set,
# because that would lose the fact context (target_ip, bench_run_dir).

# HOST-DROP GUARD. When ansible marks a host UNREACHABLE it removes it
# from ansible_play_hosts and keeps running the play on the survivors:
# every bench_target-conditioned task below then silently skips while
# the loadgen side keeps benching whatever still listens on the port,
# gated by STALE hostvars from the last column that ran (2026-06-12:
# a become-prompt timeout dropped msa2-server after the axum column and
# its orphaned SUT got benched under five other columns' labels). The
# play sets any_errors_fatal, but unreachable handling varies across
# ansible versions — assert explicitly, from a host that is still in
# the play, that the bench target is too.
- name: "{{ cell.1 }} run={{ cell.0 }} | assert bench target still in play"
  ansible.builtin.assert:
    that:
      - bench_target in ansible_play_hosts
    fail_msg: >-
      {{ bench_target }} dropped out of the play (unreachable?) — aborting
      the bench instead of measuring an orphaned server under wrong labels.
  any_errors_fatal: true

- name: "{{ cell.1 }} run={{ cell.0 }} | per-cell output dir"
  ansible.builtin.set_fact:
    cell_dir: "{{ bench_run_dir }}/{{ '%02d' | format(cell.0 | int) }}-{{ cell.1 }}"
    # Reset per-column so a column whose server-side tasks never ran can
    # never inherit the previous column's bind verdict.
    cell_bound: false

# Resolve the matrix column slug (cell.1, e.g. "gin-h2" /
# "celeris-epoll-h1-sync") to the staged binary dir it runs from and the
# -engine flag the binary needs. competitor_columns is the slug→{bin,engine}
# map mage Bench passes (built from servers.Registry). A single binary backs
# several columns (gin → gin-h1/gin-h2), so the binary half is NOT the same
# as the column slug. Falls back to the bare slug + no engine when the map is
# absent (a direct ansible-playbook invocation without mage), preserving the
# pre-mode-matrix behaviour for ad-hoc single-binary runs.
- name: "{{ cell.1 }} run={{ cell.0 }} | resolve column → binary + engine"
  ansible.builtin.set_fact:
    cell_bin: "{{ competitor_columns[cell.1].bin if (competitor_columns is defined and cell.1 in competitor_columns) else cell.1 }}"
    cell_engine: "{{ competitor_columns[cell.1].engine if (competitor_columns is defined and cell.1 in competitor_columns) else '' }}"
    # The column's own runtime env (servers.Adapter.SUTEnv, celeris#585):
    # empty for every registry column today; an A/B branch uses it to give
    # two columns of one binary + -engine different runtime knobs.
    cell_col_env: "{{ (competitor_columns[cell.1].env | default({})) if (competitor_columns is defined and cell.1 in competitor_columns) else {} }}"

# PRIVILEGE GATE. Only the celeris SUT is launched as root; every
# third-party competitor runs as the unprivileged bench user.
#
# Why: competitor binaries are built from upstream source we do not
# review line-by-line. Until 2026-08-13 every one of them was started
# with `become: true`, so any compromised or broken upstream release
# executed as root on the bench hosts — which also carry the Tailnet
# membership, the self-hosted runner and its secrets. The 2026-08-12
# ntex-server 3.11.0 breakage showed how easily an unreviewed upstream
# cut reaches these machines.
#
# Fairness: this does NOT advantage celeris. Both rlimits that matter
# are already equalised for the unprivileged user on every cluster host
# — memlock is `unlimited` via /etc/security/limits.conf, and nofile's
# hard limit is 524288, so the `ulimit -n 65535` in the launch task
# succeeds without root. Verified on msa2-server + msa2-client
# (2026-08-13). Running celeris unprivileged too is the end state, but
# that changes how the measured SUT starts, so it needs its own A/B —
# tracked separately rather than folded into a security fix.
# NOTHING on the bench hosts runs as root any more, including the SUT.
#
# The default flipped to `false` on 2026-08-14 once probatorium#231's A/B
# showed dropping root costs nothing measurable. Six interleaved runs (3 per
# arm) over celeris-epoll-h1-async + celeris-iouring-h1-async:
#
#   within-arm noise (same config, different rounds, n=324): |Δ| p90 = 1.97%
#   between-arm effect (unprivileged vs root,        n=54 ): median = -0.23%
#
# The effect is ~8x smaller than the run-to-run noise, and the between-arm
# spread (stdev 0.68%) is NARROWER than two runs of the same config differ
# from each other — i.e. the arms are indistinguishable. io_uring, the case
# where privilege could plausibly matter (memlock, ring setup), came out at
# -0.09%. Both rlimits that motivated root are already available unprivileged:
# memlock is unlimited via /etc/security/limits.conf and nofile's hard limit
# is 524288, so `ulimit -n 65535` below succeeds either way.
#
# Set `--extra-vars celeris_needs_root=true` to put the SUT back on root.
- name: "{{ cell.1 }} run={{ cell.0 }} | resolve privilege for this column"
  ansible.builtin.set_fact:
    cell_needs_root: "{{ cell_bin == 'celeris' and (celeris_needs_root | default(false) | bool) }}"

- name: "{{ cell.1 }} run={{ cell.0 }} | mkdir per-cell output"
  ansible.builtin.file:
    path: "{{ cell_dir }}"
    state: directory
    mode: '0755'

- name: "{{ cell.1 }} run={{ cell.0 }} | derive per-cell wall-clock budget"
  # The runner runs N scenarios back-to-back inside one cell; each costs
  # warmup + duration on the saturation pass PLUS — in rated mode — 4
  # closed-loop passes of warmup + rated-duration each (every rated pass
  # re-runs the FULL warmup), plus the runner's 5s inter-cell cooldown
  # and ~12s fixed overhead. mage Bench computes that projection from
  # the ACTUAL config via budget.ColumnWallClock and passes it as
  # bench_cell_budget_seconds — the single source of truth — along with
  # the realized bench_scenario_count from the runner's own dry-run
  # schedule. The Jinja fallback below mirrors the same formula for a
  # direct ansible-playbook invocation without mage (17 = runner
  # cooldown 5s + budget.PerCellOverhead 12s; 4 = the runner's default
  # rated fraction count; 40 covers the full catalogue's busiest column,
  # 38 cells today). All duration vars are INTEGER SECONDS — the old
  # regex_replace unit-stripping read "1m30s" as 130. The v3.8 sizing
  # also ignored the rated sweep entirely: every healthy rated column
  # blew its 2h22m guard at cell 28/33 and was SIGTERMed mid-run.
  ansible.builtin.set_fact:
    cell_budget_seconds: >-
      {{ bench_cell_budget_seconds | default(
           (bench_scenario_count | default(40) | int)
           * ((bench_warmup_seconds | default(5) | int)
              + (bench_duration_seconds | default(30) | int)
              + 17
              + ((bench_rated | default(false) | bool) | ternary(
                   4 * ((bench_warmup_seconds | default(5) | int)
                        + (bench_rated_duration_seconds | default(30) | int)),
                   0)))) | int }}

- name: "{{ cell.1 }} run={{ cell.0 }} | size hang guard + samplers from the budget"
  # Guard = budget + 25% slack + 300s fixed headroom. ONE number drives
  # both the runner `timeout` and the mpstat sample counts, so the
  # samplers always outlive the runner — and teardown kills them as soon
  # as the runner returns, so the over-sized window can never leak the
  # next cell's load into this cell's cpu.log mean.
  ansible.builtin.set_fact:
    cell_guard_seconds: "{{ ((cell_budget_seconds | int) * 5) // 4 + 300 }}"

# ---------- bench target side: start server + mpstat ----------
- name: "{{ cell.1 }} run={{ cell.0 }} | stop any prior server + wait for bench port free"
  # The previous column's teardown is best-effort (failed_when:false) and its
  # port sweep is time-boxed (~3s), so a server that drains slowly (graceful
  # http.Server.Shutdown keeps the listen socket bound for up to 10s) can still
  # own the bench port when the next column launches → "bind: address already
  # in use" → the new server dies and the readiness gate below would otherwise
  # lock onto the LINGERING predecessor (e.g. the column's own -h1 sibling,
  # which serves H1 fine but RESETS an H2 preface — the documented cause of the
  # H2 + WS/SSE wrong-process benches). Reap every holder of the bench port
  # (SIGKILL each pass) and wait until it is genuinely free before starting.
  # Best-effort (always exits 0): if the port still can't be freed, the
  # process-identity readiness gate records the cell as a clean skip and the
  # grid continues, so per-column failure isolation is preserved.
  # become: the SUTs are launched under root (ulimit -l/-n in their start
  # shell), so an unprivileged sweep can neither signal them nor even SEE
  # their pids (`ss -ltnp` omits users:() for other users' sockets — the
  # sweep would read an empty pid list and conclude the port is free).
  become: true
  ansible.builtin.shell: |
    bp={{ bench_port | default(8080) }}
    # Kill the prior respawn supervisor FIRST (pid at a fixed path) so it
    # cannot relaunch the SUT we are about to reap. Without this the bounded
    # loop would re-bind the port after every sweep pass.
    # NB: keep this free-form shell block free of apostrophes and unpaired
    # quote chars. ansible split_args tokenizes the entire string (it does
    # not honor the leading hash as a comment), so a stray quote anywhere
    # fails task loading with an unbalanced-quotes error.
    sup_pidfile={{ bench_root }}/.sut-supervisor.pid
    if [ -f "$sup_pidfile" ]; then
      sup=$(cat "$sup_pidfile" 2>/dev/null)
      if [ -n "$sup" ]; then
        pkill -TERM -P "$sup" 2>/dev/null; kill -TERM "$sup" 2>/dev/null
        sleep 0.3
        pkill -KILL -P "$sup" 2>/dev/null; kill -KILL "$sup" 2>/dev/null
      fi
      rm -f "$sup_pidfile"
    fi
    pkill -TERM -f "[c]ompetitors/" 2>/dev/null
    pkill -x server 2>/dev/null
    for i in $(seq 1 40); do
      pids=$(ss -ltnp "sport = :${bp}" 2>/dev/null | tail -n +2 | grep -oE 'pid=[0-9]+' | cut -d= -f2 | sort -u)
      [ -z "$pids" ] && break
      for p in $pids; do kill -KILL "$p" 2>/dev/null; done
      sleep 0.5
    done
    true
  args:
    executable: /bin/bash
  changed_when: false
  when: inventory_hostname == bench_target

# ---------- IRQPLACE (THROWAWAY ab/irqplace-v1, celeris#1036; needs the maintainer approval of 2026-10-18) ----------
# A column whose SUTEnv carries AB_IRQ_VECTOR_CPU moves the standing-pinned enp1s0-8 TX-completion vector to that CPU
# BEFORE the server starts (celeris plans its loops once, at Listen, from the vector CPU it reads then) and puts it back on the
# explicit standing CPU after the server stops. Only the CPUs 4 (probe) and 1 (standing) are allowed, only on msr1. Every move goes through
# files/nic_irq_pin.sh and is verified by the effective_affinity_list readback; a mismatch fails the column loudly. Restore layers:
# the cell restore at the end of this file, the always block around the cell loop in bench.yml, the cleanup.yml task (cancelled run), and
# a per-apply watchdog started by irqplace.sh apply.
- name: "{{ cell.1 }} run={{ cell.0 }} | IRQPLACE column probe CPU (empty = not an IRQPLACE column)"
  ansible.builtin.set_fact:
    irq_probe_cpu: "{{ (cell_col_env.AB_IRQ_VECTOR_CPU | default('')) | string }}"
  when: inventory_hostname == bench_target

- name: "{{ cell.1 }} run={{ cell.0 }} | IRQPLACE refuse anything but msr1, CPUs 4 and 1, and the standing CPU 1"
  ansible.builtin.assert:
    that:
      - bench_target == 'msr1'
      - irq_probe_cpu in ['1', '4']
      - nic_irq_placement is defined
      - nic_irq_placement.iface is defined
      - nic_irq_placement.vector is defined
      - nic_irq_placement.cpu | string == '1'
    fail_msg: >-
      IRQPLACE needs bench_target msr1, AB_IRQ_VECTOR_CPU 1 or 4 and the standing placement nic_irq_placement (cpu 1)
      from inventory.yml; got target={{ bench_target }} cpu={{ irq_probe_cpu }}.
    quiet: true
  when:
    - inventory_hostname == bench_target
    - irq_probe_cpu != ''

- name: "{{ cell.1 }} run={{ cell.0 }} | IRQPLACE stage the pin helpers on the bench target"
  become: true
  ansible.builtin.file:
    path: /tmp/celeris-irqplace
    state: directory
    mode: '0755'
  when:
    - inventory_hostname == bench_target
    - irq_probe_cpu != ''

- name: "{{ cell.1 }} run={{ cell.0 }} | IRQPLACE copy nic_irq_pin.sh and irqplace.sh"
  become: true
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/{{ item }}"
    dest: "/tmp/celeris-irqplace/{{ item }}"
    mode: '0755'
  loop:
    - nic_irq_pin.sh
    - irqplace.sh
  when:
    - inventory_hostname == bench_target
    - irq_probe_cpu != ''

- name: "{{ cell.1 }} run={{ cell.0 }} | IRQPLACE record whether irqbalance is active"
  ansible.builtin.shell: |
    {
      echo "irqbalance is-active: $(systemctl is-active irqbalance 2>&1 | head -1)"
      echo "irqbalance is-enabled: $(systemctl is-enabled irqbalance 2>&1 | head -1)"
      if pgrep -x irqbalance > /dev/null 2>&1; then echo "irqbalance process: running"; else echo "irqbalance process: none"; fi
    } > {{ cell_dir }}/irqbalance.txt 2>&1
    true
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - inventory_hostname == bench_target
    - irq_probe_cpu != ''

- name: "{{ cell.1 }} run={{ cell.0 }} | IRQPLACE pin the vector to {{ irq_probe_cpu | default('') }} and verify by readback (before the server starts)"
  become: true
  ansible.builtin.shell: >-
    bash /tmp/celeris-irqplace/irqplace.sh apply
    {{ nic_irq_placement.iface | string | quote }}
    {{ nic_irq_placement.vector | string | quote }}
    {{ irq_probe_cpu | quote }}
    {{ nic_irq_placement.cpu | string | quote }}
    {{ (cell_guard_seconds | int) + 300 }}
    {{ cell_dir | quote }}
  args:
    executable: /bin/bash
  register: irq_apply
  changed_when: false
  failed_when: irq_apply.rc | default(0) != 0
  when:
    - inventory_hostname == bench_target
    - irq_probe_cpu != ''

- name: "{{ cell.1 }} run={{ cell.0 }} | start competitor server in background"
  # Root ONLY for the celeris SUT — see the privilege-gate fact above.
  become: "{{ cell_needs_root | bool }}"
  # The binary is {{ cell_bin }} (the dir under competitors/), launched with
  # the column's -engine when one applies. gorilla_ws + native adapters carry
  # an empty cell_engine, so the `-engine` arg is omitted entirely — passing
  # it to a binary that doesn't define the flag would abort with "flag
  # provided but not defined". One-line nohup (no backslash continuations) so
  # the conditional engine arg can't leave a dangling line-continuation.
  #
  # SUT ENVIRONMENT = sut_base_env (the harness's own knobs below) merged
  # with bench_sut_env, the caller's KEY=VALUE overrides (celeris#585: mage
  # Bench forwards BENCH_SUT_ENV as a JSON extra-var so an A/B arm such as
  # CELERIS_IOURING_SEND_ZC=off is dispatchable without a code change).
  # combine() lets an override win over the base, and the column's own
  # cell_col_env (servers.Adapter.SUTEnv) wins over both: it is the most
  # specific. The merged mapping is
  # echoed as the FIRST line of server.log ('[sut-env] {...}') so the arm
  # is recorded next to the engine's own 'send_zc=' line and can be
  # asserted per cell. mage validates keys/values to a shell-safe charset
  # (no quotes/whitespace/metacharacters) before they reach this file.
  vars:
    sut_base_env:
      # Driver-* backends live in loopback containers on the bench host,
      # started + seeded by bench.yml's "dbservices | start …" stage step (the
      # dbservices role only installs docker + pulls images; it never runs a
      # container). Every driver-capable competitor reads its backend address
      # from these PROBATORIUM_* vars; an unset var leaves that client nil and
      # the driver cell 404s (→ capability-lie hard error). Every adapter reads
      # PROBATORIUM_MEMCACHED_ADDR (standardized in v1.5.4 — fasthttp/echo/iris
      # used to read PROBATORIUM_MC_ADDR). Harmless for static-only competitors
      # (they ignore them).
      # Ports MUST match bench.yml's container -p mappings AND validate.yml:
      #   postgres 54321  redis 63791  memcached 21211  (remapped off the
      # defaults so a stray system postgres/redis on the bench host can't shadow
      # the fixture containers). Mismatch here = every driver-* cell silently
      # connects nowhere and 404s.
      PROBATORIUM_PG_DSN: "postgres://bench:bench@127.0.0.1:54321/bench?sslmode=disable"
      PROBATORIUM_REDIS_ADDR: "127.0.0.1:63791"
      PROBATORIUM_MEMCACHED_ADDR: "127.0.0.1:21211"
      # aspnet (.NET) is a FRAMEWORK-DEPENDENT publish: the native apphost
      # (competitors/aspnet) must locate the shared .NET runtime at launch. We
      # installed the SDK (which carries the runtime) pristinely under
      # {{ bench_root }}/dotnet, NOT system-wide, so without DOTNET_ROOT the
      # apphost aborts with "You must install .NET to run this application" and
      # never binds. DOTNET_ROOT is the documented runtime-discovery knob.
      # Globalization-invariant belt-and-suspenders (the csproj already sets it,
      # but the env override skips the ICU probe unconditionally on a minimal
      # host). Both inert for every non-.NET binary.
      DOTNET_ROOT: "{{ bench_root }}/dotnet"
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
      # The celeris bench server's /debug/vars SIDE listener
      # (servers/celeris/debugvars.go, celeris#585): runtime + engine
      # counters for the observer below, served off the benched engine so
      # the scrape adds no route and no connection to what is measured.
      # Loopback only. bench_tuning widens ip_local_port_range to
      # 1024-65535, so no fixed port is guaranteed free of an outbound
      # connection's local port; a bind failure is tolerated by the server
      # (it logs and runs without the sidecar) and shows up as absent
      # engine counters, never as a wrong reading. Inert for every other
      # binary.
      PROBATORIUM_DEBUG_ADDR: "127.0.0.1:{{ bench_debug_port | default(18089) }}"
    cell_sut_env: "{{ sut_base_env | combine(bench_sut_env | default({})) | combine(cell_col_env | default({})) }}"
  environment: "{{ cell_sut_env }}"
  ansible.builtin.shell:
    cmd: |
      cd {{ bench_root }}
      ulimit -l unlimited 2>/dev/null || true
      # No core dumps: a SUT that crashes mid-column (the respawn supervisor
      # below exists precisely because they do) would otherwise write a
      # multi-hundred-MB core to /var each time — same disk-fill class as the
      # leaked volumes. Best-effort like the limits above.
      ulimit -c 0 2>/dev/null || true
      # nofile: the default 1024 soft limit is below a single
      # 1024-connection cell (sse-fanout-1024 / ws-hub-broadcast-1024 /
      # get-simple-1024c) before counting the listener, logs and backend
      # client sockets — and churn-close's dial storms park hundreds more
      # in TIME_WAIT/accept queues. Root raises soft+hard; unprivileged
      # competitors raise the soft limit within the host's 524288 hard
      # ceiling, which clears 65535 either way. Best-effort like -l above.
      ulimit -n 65535 2>/dev/null || true
      # Bounded respawn supervisor (max 5). A SUT that crashes mid-column
      # (e.g. http.zig hitting an unreachable under churn-close) self-heals
      # within ~0.5s, so only the crashing scenario is lost — NOT the rest of
      # the column (httpzig previously cascaded one crash into 16 server-down
      # cells). The cap means a true crash-loop still lands as server-down for
      # the runner to record rather than spinning forever. The supervisor pid
      # (the subshell) is what teardown kills FIRST — see the stop task — so
      # the loop can never re-bind after the column ends.
      ENGINE_ARG="{{ ('-engine ' + cell_engine) if cell_engine else '' }}"
      (
        # Record the merged SUT environment as the first line of server.log
        # (celeris#585): the A/B arm must be provable per cell, next to the
        # engine's own 'send_zc=' line. Values are mage-validated to contain
        # no quotes, so the single-quoted literal cannot break.
        echo '[sut-env] {{ cell_sut_env | to_json }}'
        n=0
        while [ "$n" -lt 5 ]; do
          ./competitors/{{ cell_bin }} -bind 0.0.0.0:{{ bench_port | default(8080) }} $ENGINE_ARG
          echo "[respawn] SUT exited rc=$? (attempt $n) at $(date -u +%H:%M:%S)"
          n=$((n + 1))
          sleep 0.5
        done
      ) > {{ cell_dir }}/server.log 2>&1 &
      # Fixed location (not cell_dir) so the NEXT column's generic stop task can
      # find + kill this supervisor without knowing this column's cell_dir.
      echo $! > {{ bench_root }}/.sut-supervisor.pid
      disown
    executable: /bin/bash
  args:
    executable: /bin/bash
  when: inventory_hostname == bench_target

- name: "{{ cell.1 }} run={{ cell.0 }} | wait for OUR server to own the bench port"
  # FAILURE ISOLATION + CORRECT-PROCESS GATE. Two jobs:
  #   1. A competitor that fails to bind (crash on start, missing dep, bad flag)
  #      must NOT abort the whole 31-column grid — captured via failed_when:false
  #      and gated on cell_bound, so one flaky adapter costs only its own column.
  #   2. We must never bench a LINGERING previous server that still holds the
  #      port. The old probe accepted ANY listener on :PORT, so a slow-draining
  #      predecessor satisfied it and the cell was silently measured against the
  #      wrong process (the H2 cells against an H1-only sibling that resets the
  #      h2c preface; gorilla_ws against gnet-h1 with no /ws routes). Now we
  #      require the listener to be the process WE launched: the right binary,
  #      and the right -engine when one applies.
  # become:true so `ss -ltnp` + /proc/<pid>/cmdline can see every process.
  # Language-runtime adapters (bun/python: hono, elysia, fastapi) listen under a
  # runtime argv ("bun run dist/server", "python -m uvicorn ...") that never
  # contains competitors/, so the shared-binary/-engine wrong-process hazard
  # cannot apply to them — accept any listener for those (the port-free reap
  # above already cleared any lingering predecessor).
  become: true
  ansible.builtin.shell: |
    bp={{ bench_port | default(8080) }}
    want_bin="competitors/{{ cell_bin }}"
    want_engine="{{ cell_engine | default('') }}"
    # The SUT env overrides (celeris#585) must be in the listener environ:
    # two columns may share binary and -engine and differ only in the
    # column env, and two dispatches only in bench_sut_env, so the binary +
    # engine match alone cannot tell an A arm from a B arm. The expected set
    # is the merge the launch used minus sut_base_env (bench_sut_env, then the
    # column env winning), so a leftover listener from a dispatch with other
    # overrides is refused too. Values are mage-validated to a charset
    # without whitespace or quotes.
    # NB: no apostrophes or unpaired quote chars anywhere in this free-form
    # block, comments included (see the port-free task above); CI loads
    # every tasks file with ansible/load-check.sh, which fails on one.
    want_env="{% for k, v in ((bench_sut_env | default({})) | combine(cell_col_env | default({}))).items() %}{{ k }}={{ v }} {% endfor %}"
    env_ok() {
      for kv in $want_env; do
        tr '\0' '\n' < /proc/$1/environ 2>/dev/null | grep -qxF -- "$kv" || return 1
      done
      return 0
    }
    for i in $(seq 1 40); do
      pids=$(ss -ltnp "sport = :${bp}" 2>/dev/null | tail -n +2 | grep -oE 'pid=[0-9]+' | cut -d= -f2 | sort -u)
      for holder in $pids; do
        cmd=$(tr '\0' ' ' < /proc/$holder/cmdline 2>/dev/null)
        case "$cmd" in
          *competitors/*)
            # Go competitor launched directly from competitors/: require the
            # exact binary, and the exact -engine when the column carries one
            # (trailing space pins it to a whole argv token, so -engine h1 is
            # never accepted for an -engine h2c column).
            if printf '%s' "$cmd" | grep -qF -- "$want_bin"; then
              if [ -z "$want_engine" ] || printf '%s' "$cmd" | grep -qF -- "-engine $want_engine "; then
                if env_ok "$holder"; then
                  exit 0
                fi
              fi
            fi
            ;;
          ?*)
            # Non-competitors/ listener = language-runtime adapter; accept.
            exit 0
            ;;
        esac
      done
      sleep 0.25
    done
    echo "our server ({{ cell.1 }}: $want_bin${want_engine:+ -engine $want_engine}${want_env:+ env $want_env}) did not own :${bp} within 10s" >&2
    tail -50 {{ cell_dir }}/server.log >&2
    exit 1
  args:
    executable: /bin/bash
  changed_when: false
  register: bind_probe
  failed_when: false
  when: inventory_hostname == bench_target

- name: "{{ cell.1 }} run={{ cell.0 }} | record bind status"
  ansible.builtin.set_fact:
    cell_bound: "{{ (bind_probe.rc | default(1)) == 0 }}"
  when: inventory_hostname == bench_target

- name: "{{ cell.1 }} run={{ cell.0 }} | WARN unbound column (skipped; grid continues)"
  ansible.builtin.debug:
    msg: >-
      CELL SKIPPED — {{ cell.1 }} failed to bind on {{ bench_target }};
      this column is ABSENT from the results, grid continues with the next.
  when:
    - inventory_hostname == bench_target
    - not (cell_bound | bool)

- name: "{{ cell.1 }} run={{ cell.0 }} | resolve real server PID"
  # `echo $!` in the previous task captures the bash subshell that
  # backgrounded nohup, NOT the competitor binary itself, AND for
  # bun / python adapters the launcher script execs into a language
  # runtime whose argv doesn't match the launcher path at all
  # (the bun process is `bun run dist/server`, not
  # `./competitors/hono`). server.pid would be wrong for any of
  # those reasons.
  #
  # Use `ss -ltnp` instead: who's listening on the bench port? That's
  # the actual server regardless of language. Parse out the PID from
  # the users:(("name",pid=N,fd=...)) field.
  become: true
  ansible.builtin.shell: |
    pid_line=$(ss -ltnp "sport = :{{ bench_port | default(8080) }}" 2>/dev/null | tail -n +2 | head -1)
    if [ -z "$pid_line" ]; then
      echo "no listener on port {{ bench_port | default(8080) }}" >&2
      tail -50 {{ cell_dir }}/server.log >&2
      exit 1
    fi
    real_pid=$(echo "$pid_line" | grep -oE 'pid=[0-9]+' | head -1 | cut -d= -f2)
    if [ -z "$real_pid" ]; then
      echo "could not extract pid from ss output: $pid_line" >&2
      exit 1
    fi
    echo "$real_pid" > {{ cell_dir }}/server.pid
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - inventory_hostname == bench_target
    - cell_bound | bool

- name: "{{ cell.1 }} run={{ cell.0 }} | start mpstat sampler (server side)"
  # S_TIME_FORMAT=ISO + TZ=UTC pin the log's wall-clock to an unambiguous
  # ISO banner date and 24 h UTC row times, so report.ParseMPStat can
  # place every row on the runner's UTC started_at/completed_at axis and
  # slice the column-wide log per scenario (schema v5.9, celeris#585).
  # Without them sysstat prints the host locale's %x date (MM/DD/YY vs
  # DD/MM/YY) and local time, which the parser can only guess at.
  ansible.builtin.shell: |
    S_TIME_FORMAT=ISO TZ=UTC nohup mpstat -P ALL 1 {{ cell_guard_seconds }} \
      > {{ cell_dir }}/cpu.log 2>&1 &
    disown
    echo $! > {{ cell_dir }}/mpstat.pid
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - inventory_hostname == bench_target
    - cell_bound | bool

- name: "{{ cell.1 }} run={{ cell.0 }} | start kernel-counter sampler (server side, A/B)"
  # Read-only. For the A/Bs of celeris#1036 and #1037, plus threads.log: every
  # SUT thread (tid, last CPU psr, state, cumulative CPU time, comm) every 1 s.
  # Also: per-CPU softirq counters
  # (NET_RX, NET_TX) every 5 s and the full /proc/interrupts every 30 s,
  # with epoch seconds, so the column-wide logs can be sliced per scenario
  # like cpu.log. Also once at cell start: the NIC irq affinities, the bond
  # and port carrier_changes, and every SUT thread with its allowed CPUs
  # and the CPU it last ran on. Written next to cpu.log; it dies with the
  # guard timeout like the mpstat sampler and is killed by the stop task.
  ansible.builtin.shell: |
    d={{ cell_dir }}
    pid=$(cat $d/server.pid 2>/dev/null)
    {
      echo "== carrier_changes"; grep -H . /sys/class/net/*/carrier_changes 2>/dev/null
      echo "== bond0"; head -40 /proc/net/bonding/bond0 2>/dev/null
      echo "== irq smp_affinity_list"; grep -H . /proc/irq/*/smp_affinity_list 2>/dev/null
    } > $d/host-net.pre 2>&1
    if [ -n "$pid" ]; then
      for t in /proc/$pid/task/*; do
        echo "$(basename $t) $(awk "/Cpus_allowed_list/{print \$2}" $t/status 2>/dev/null) psr=$(awk "{print \$39}" $t/stat 2>/dev/null) $(cat $t/comm 2>/dev/null)"
      done > $d/sut-threads.pre 2>&1
      # PINPLAN4 supplementary capture (additive; separate files, sut-threads.* keeps its format): per-thread schedstat
      # (tid run_ns run_delay_ns timeslices comm) and one snapshot of the /debug/vars side listener of the SUT (NumGC), taken here
      # (server up, before the load) and in the stop task (after the load). Best effort: a missing /proc schedstat or a closed
      # listener leaves an empty or error file and never fails the cell.
      for t in /proc/$pid/task/*; do
        echo "$(basename $t) $(cat $t/schedstat 2>/dev/null) $(cat $t/comm 2>/dev/null)"
      done > $d/sut-schedstat.pre 2>&1
      { echo "== $(date +%s.%N)"; timeout 4 bash -c 'exec 3<>/dev/tcp/127.0.0.1/{{ bench_debug_port | default(18089) }}; printf "GET /debug/vars HTTP/1.0\r\nHost: debug\r\n\r\n" >&3; cat <&3' 2>&1; } > $d/debugvars.pre 2>&1
    fi
    nohup bash -c "end=\$((\$(date +%s) + {{ cell_guard_seconds }})); n=0; while [ \$(date +%s) -lt \$end ]; do echo \"== \$(date +%s.%N)\"; grep -E \"CPU|NET_RX|NET_TX\" /proc/softirqs; if [ \$((n % 6)) -eq 0 ]; then echo \"== interrupts\"; cat /proc/interrupts; fi; n=\$((n+1)); sleep 5; done" \
      > $d/kcounters.log 2>&1 &
    disown
    echo $! > $d/kcounters.pid
    if [ -n "$pid" ]; then
      nohup bash -c "end=\$((\$(date +%s) + {{ cell_guard_seconds }})); while [ \$(date +%s) -lt \$end ]; do echo \"== \$(date +%s.%N)\"; ps -L -o tid=,psr=,stat=,time=,comm= -p $pid; sleep 1; done" \
        > $d/threads.log 2>&1 &
      disown
      echo $! > $d/threads.pid
    fi
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false
  when:
    - inventory_hostname == bench_target
    - cell_bound | bool

- name: "{{ cell.1 }} run={{ cell.0 }} | start net-counter sampler (server side, confirmation A/B)"
  # Read-only. TCP retransmit and timeout counters (TcpExt TCPTimeouts,
  # TcpRetransSegs ...) and softnet_stat per CPU every second, so a per-cell
  # delta is read between the runner timestamps of the cell. Files net.log and
  # softnet.log next to cpu.log; the sampler stops with the guard timeout and
  # in the stop task below.
  ansible.builtin.shell: |
    d={{ cell_dir }}
    cat > $d/netctr.sh <<"EOS"
    #!/bin/bash
    # usage: netctr.sh SECONDS SUFFIX. Appends, every second, the TCP and IP
    # SNMP counters, the TcpExt and IpExt netstat counters (retransmits,
    # timeouts) and the per-CPU softnet_stat, each block stamped with epoch.
    end=$(( $(date +%s) + $1 ))
    while [ $(date +%s) -lt $end ]; do
      t=$(date +%s.%N)
      { echo "== $t"; grep -E "^(Tcp|Ip):" /proc/net/snmp; grep -E "^(TcpExt|IpExt):" /proc/net/netstat; } >> net$2.log
      { echo "== $t"; cat /proc/net/softnet_stat; } >> softnet$2.log
      sleep 1
    done
    EOS
    cd $d
    nohup bash netctr.sh {{ cell_guard_seconds }} "" > /dev/null 2>&1 &
    disown
    echo $! > $d/netctr.pid
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false
  when:
    - inventory_hostname == bench_target
    - cell_bound | bool

- name: "{{ cell.1 }} run={{ cell.0 }} | NIC and steering state (server side, once per column)"
  # Read-only. ethtool -i -k -n -l -x -c -g of every physical NIC and bond0,
  # ethtool -S before the column (here) and after it (stop task), the RPS and
  # XPS masks, rps_flow_cnt, rps_sock_flow_entries and a few TCP sysctls, ip
  # -s link. ethtool needs root for some queries; become is used for this task
  # only and nothing is written outside the cell dir.
  ansible.builtin.shell: |
    d={{ cell_dir }}
    nics="$(for n in /sys/class/net/*; do [ -e $n/device ] && basename $n; done) bond0"
    {
      for n in $nics; do
        echo "=== $n"
        for o in -i -k -n -l -x -c -g; do echo "--- ethtool $o $n"; ethtool $o $n 2>&1; done
        echo "--- ethtool -S $n"; ethtool -S $n 2>&1
      done
    } > $d/ethtool.pre 2>&1
    {
      echo "== rps_cpus, rps_flow_cnt, xps_cpus"
      grep -H . /sys/class/net/*/queues/rx-*/rps_cpus /sys/class/net/*/queues/rx-*/rps_flow_cnt /sys/class/net/*/queues/tx-*/xps_cpus 2>/dev/null
      echo "== sysctl"
      for k in net.core.rps_sock_flow_entries net.core.netdev_budget net.core.netdev_max_backlog net.core.busy_poll net.core.somaxconn net.ipv4.tcp_congestion_control net.ipv4.tcp_syn_retries net.ipv4.tcp_retries2 net.ipv4.tcp_rmem net.ipv4.tcp_wmem; do echo "$k = $(sysctl -n $k 2>&1)"; done
      echo "== ip -s link"; ip -s link 2>&1
    } > $d/steering.pre 2>&1
    true
  args:
    executable: /bin/bash
  become: true
  changed_when: false
  failed_when: false
  when:
    - inventory_hostname == bench_target
    - cell_bound | bool

- name: "{{ cell.1 }} run={{ cell.0 }} | start observer sampler (server side)"
  # The observer sidecars the server during the cell and emits a 1Hz
  # SQLite time series of FD count, RSS, goroutine count, GC pause,
  # accept/close totals and (schema v5.17) the engine egress counters
  # a SEND_ZC A/B needs. /proc-derived fields (RSS, FDs, CPU ticks)
  # carry the signal for EVERY adapter; the Go-runtime and engine fields
  # come from -metrics-url scraping the celeris SUT's /debug/vars. Until
  # celeris#585 the bench server served no such route and this URL
  # answered 404 for every celeris cell; it is now the server's side
  # listener on PROBATORIUM_DEBUG_ADDR (see the start task), NOT the
  # bench port. The bench-cell playbook only knows the competitor slug
  # (cell.1), not the adapter language, so we gate the metrics URL on
  # the celeris-* name prefix, and every non-celeris cell keeps an empty
  # -metrics-url so no non-Go competitor is asked for Go expvar it
  # doesn't serve. The observer refuses a document whose "pid" is not
  # the -pid it samples.
  #
  # Runs as root (`become: true`) because the bench server above is
  # started under root (it needs `ulimit -l unlimited` to lift
  # memlock for io_uring). Without root, /proc/<pid>/fd is read-
  # protected against the cross-user reader and countFDs silently
  # returns 0.
  become: true
  ansible.builtin.shell: |
    cd {{ bench_root }}
    nohup ./observer \
      -pid $(cat {{ cell_dir }}/server.pid) \
      -metrics-url '{{ ("http://127.0.0.1:" ~ (bench_debug_port | default(18089)) ~ "/debug/vars") if (cell.1 | regex_search("^celeris")) else "" }}' \
      -out {{ cell_dir }}/observer.sqlite \
      -interval 1s \
      > {{ cell_dir }}/observer.log 2>&1 &
    disown
    echo $! > {{ cell_dir }}/observer.pid
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - inventory_hostname == bench_target
    - cell_bound | bool

# ---------- loadgen side: mpstat + runner ----------
- name: "{{ cell.1 }} run={{ cell.0 }} | start net-counter sampler (loadgen side, confirmation A/B)"
  # Same counters on the loadgen host (a request lost on the way in shows as a
  # retransmit there), distinct file names for the reason given above.
  ansible.builtin.shell: |
    d={{ cell_dir }}
    cat > $d/netctr.sh <<"EOS"
    #!/bin/bash
    # usage: netctr.sh SECONDS SUFFIX. Appends, every second, the TCP and IP
    # SNMP counters, the TcpExt and IpExt netstat counters (retransmits,
    # timeouts) and the per-CPU softnet_stat, each block stamped with epoch.
    end=$(( $(date +%s) + $1 ))
    while [ $(date +%s) -lt $end ]; do
      t=$(date +%s.%N)
      { echo "== $t"; grep -E "^(Tcp|Ip):" /proc/net/snmp; grep -E "^(TcpExt|IpExt):" /proc/net/netstat; } >> net$2.log
      { echo "== $t"; cat /proc/net/softnet_stat; } >> softnet$2.log
      sleep 1
    done
    EOS
    cd $d
    nohup bash netctr.sh {{ cell_guard_seconds }} ".loadgen" > /dev/null 2>&1 &
    disown
    echo $! > $d/netctr.loadgen.pid
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false
  when:
    - inventory_hostname == "msa2-client"
    - hostvars[bench_target].cell_bound | default(false) | bool

- name: "{{ cell.1 }} run={{ cell.0 }} | start mpstat sampler (loadgen side)"
  # Distinct filenames from the server-side sampler ON PURPOSE. bench.yml
  # tars bench_run_dir on BOTH hosts and extracts both into the same
  # results_local_dir, so a loadgen-side cpu.log/mpstat.pid would clobber
  # the server-side files of the same cell dir — readCellResources then
  # parses LOADGEN-box CPU as the SUT's Resources.MeanCPUPct (observed in
  # v3.8). The server-side names are a reader contract (report.ParseMPStat
  # + readCellResources look for cpu.log) and must NOT change; nothing
  # parses the loadgen-side log today, it is operator forensics only.
  ansible.builtin.shell: |
    nohup mpstat -P ALL 1 {{ cell_guard_seconds }} \
      > {{ cell_dir }}/cpu.loadgen.log 2>&1 &
    disown
    echo $! > {{ cell_dir }}/mpstat.loadgen.pid
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - inventory_hostname == "msa2-client"
    - hostvars[bench_target].cell_bound | default(false) | bool

- name: "{{ cell.1 }} run={{ cell.0 }} | start stall captures (both hosts, read-only, celeris#1036 investigation)"
  # Per-port packet counters at 20 Hz, qdisc, NIC vectors and per-connection TCP
  # state at 1 Hz, per-cell ethtool, qdisc, cpuidle and IRQ affinity brackets
  # taken at the saturation window start and end, and a 0.7 s header-only
  # capture in the middle of the window on the SUT slaves and on the loadgen
  # port. The script rendezvouses on the first 64 established connections, so
  # both hosts time the window from the same event. Everything is bounded by the
  # hang guard and read-only; a missing tool is noted in the output file. Needs
  # root for ethtool and tcpdump; output redirections are opened by the shell.
  ansible.builtin.shell: |
    d={{ cell_dir }}
    cat > $d/stallcap.sh <<'EOSTALL'
    #!/bin/bash
    # stallcap.sh ROLE DIR PORT WARM DUR GUARD TARGET_IP   (v2, after the X1 read)
    # Read-only captures for the 200 ms stall investigation (celeris#1036). ROLE is sut or lg.
    # Everything is bounded by GUARD seconds. Files go into DIR; the loadgen role adds the suffix .loadgen.
    role=$1; d=$2; port=$3; warm=$4; dur=$5; guard=$6; tip=$7
    cd "$d" || exit 1
    sfx=""; [ "$role" = lg ] && sfx=".loadgen"
    [ -n "$EPOCHREALTIME" ] || { echo "bash without EPOCHREALTIME (needs bash 5): no stall captures" > stallcap.error$sfx; exit 0; }
    now_us() { local t=${EPOCHREALTIME/./}; echo "$t"; }
    wait_until() { local t=$1 n; n=$(now_us); [ "$t" -gt "$n" ] || return 0; local dl=$((t - n)); sleep "$((dl / 1000000)).$(printf %06d $((dl % 1000000)))"; }
    endsec=$(( ${EPOCHREALTIME%.*} + guard ))
    nics=""; capnic=""
    if [ "$role" = sut ]; then
      nics="$(cat /sys/class/net/bond0/bonding/slaves 2>/dev/null)"
      [ -n "$nics" ] || nics="$(for n in /sys/class/net/*; do [ -e $n/device ] && basename $n; done)"
      nics="${STALL_NICS:-$nics}"   # test override only
      capnic="${STALL_CAPNIC:-enp1s0}"
      case " $nics " in *" $capnic "*) ;; *) capnic=$(echo $nics | cut -d" " -f1);; esac
    fi
    echo "$$" > stallcap$sfx.pid
    echo "v2 role=$role port=$port warm=$warm dur=$dur guard=$guard nics=$nics capnic=$capnic" > stallcap$sfx.meta

    # awk: one line per connection from ss -tinoH (two physical lines per socket)
    cat > ssc$sfx.awk <<"EOA"
    /^[ \t]/ {
      rto=""; rtt=""; un=""; re=""; ns=""; ba=""; so=""; ls=""; lr=""; la=""; cw=""; bo=""
      for (i = 1; i <= NF; i++) {
        k = $i; sub(/:.*/, "", k); v = substr($i, length(k) + 2)
        if (k == "rto") rto = v; else if (k == "rtt") rtt = v; else if (k == "unacked") un = v
        else if (k == "retrans") re = v; else if (k == "notsent") ns = v; else if (k == "bytes_acked") ba = v
        else if (k == "segs_out") so = v; else if (k == "lastsnd") ls = v; else if (k == "lastrcv") lr = v
        else if (k == "lastack") la = v; else if (k == "cwnd") cw = v; else if (k == "backoff") bo = v
      }
      print ts, loc, peer, "sq=" sq, "rq=" rq, timer, "rto=" rto, "rtt=" rtt, "unacked=" un, "retrans=" re, "notsent=" ns, "bytes_acked=" ba, "segs_out=" so, "lastsnd=" ls, "lastrcv=" lr, "lastack=" la, "cwnd=" cw, "backoff=" bo
      next
    }
    { rq = $1; sq = $2; loc = $3; peer = $4; timer = "timer:-"; for (i = 5; i <= NF; i++) if ($i ~ /^timer:/) timer = $i }
    EOA

    # 20 Hz sampler (sut only): a deadline-scheduled python helper; the old bash loop is the fallback when python3 is missing
    if [ "$role" = sut ]; then
      if command -v python3 >/dev/null 2>&1; then
        cat > sampler20.py <<"EOP"
    #!/usr/bin/env python3
    # sampler20.py DIR GUARD_SECONDS "NIC1 NIC2" [HZ]
    # 20 Hz read-only sampler for the stall investigation (SUT only). Deadline-scheduled on CLOCK_MONOTONIC (no drift from the work of a tick),
    # runs at nice -10 when started by root, reports the achieved rate and interval percentiles in sampler20.stats (rewritten every 5 s and on TERM).
    #   txq20.log      one line per tick: epoch, then per NIC (and bond0) <nic>.<counter>=<value>: tx/rx packets and bytes, tx_dropped, tx_errors,
    #                  BQL inflight/limit/hold_time/stall_cnt/stall_max/stall_thrs, tx-0 tx_timeout (the netdev watchdog counter), carrier_changes
    #   softirq20.log  one line per tick: epoch TX <12 per-CPU counts> RX <12 per-CPU counts> (/proc/softirqs NET_TX, NET_RX)
    #   tc20.log       per tick `== epoch` and the `tc -s qdisc show` lines of the NICs (backlog, requeues, drops), when tc exists
    #   irq1.log       once per second `== epoch` and the NIC vector lines of /proc/interrupts (per-CPU counts)
    import os, sys, time, signal, subprocess, shutil, statistics

    d, guard, nics = sys.argv[1], int(sys.argv[2]), sys.argv[3].split()
    hz = float(sys.argv[4]) if len(sys.argv) > 4 else 20.0
    period = 1.0 / hz
    os.chdir(d)
    try: os.nice(-10)
    except OSError: pass
    S = '/sys/class/net/'
    devs = nics + ['bond0']
    attrs = []
    for n in devs:
        b = S + n
        q = b + '/queues/tx-0/'
        for k in ('tx_packets', 'tx_bytes', 'rx_packets', 'tx_dropped', 'tx_errors'):
            attrs.append((n + '.' + k, b + '/statistics/' + k))
        for k in ('inflight', 'limit', 'hold_time', 'stall_cnt', 'stall_max', 'stall_thrs'):
            attrs.append((n + '.bql_' + k, q + 'byte_queue_limits/' + k))
        attrs.append((n + '.tx_timeout', q + 'tx_timeout'))
        attrs.append((n + '.carrier_changes', b + '/carrier_changes'))
    fds = {}
    def reopen():
        for lab, p in attrs:
            try: fds[lab] = os.open(p, os.O_RDONLY)
            except OSError: fds[lab] = None
    reopen()
    def rd(lab):
        fd = fds.get(lab)
        if fd is None: return '-'
        try:
            os.lseek(fd, 0, 0); return os.read(fd, 64).strip().decode() or '-'
        except OSError: return '-'
    tcbin = shutil.which('tc')
    f_txq = open('txq20.log', 'a', buffering=1 << 16); f_sirq = open('softirq20.log', 'a', buffering=1 << 16)
    f_tc = open('tc20.log', 'a', buffering=1 << 16) if tcbin else None; f_irq = open('irq1.log', 'a', buffering=1 << 16)
    f_softirqs = os.open('/proc/softirqs', os.O_RDONLY); f_ints = '/proc/interrupts'
    stamps = []; stop = False; last_stats = 0.0; skipped = 0
    def write_stats(final=False):
        iv = [(b - a) * 1e3 for a, b in zip(stamps, stamps[1:])]
        with open('sampler20.stats.tmp', 'w') as f:
            if iv:
                s = sorted(iv)
                f.write('ticks=%d span_s=%.2f achieved_hz=%.2f target_hz=%.1f interval_ms median=%.1f p90=%.1f p99=%.1f max=%.1f skipped_deadlines=%d final=%s\n' % (
                    len(stamps), stamps[-1] - stamps[0], (len(stamps) - 1) / max(stamps[-1] - stamps[0], 1e-9), hz, statistics.median(s),
                    s[int(0.9 * (len(s) - 1))], s[int(0.99 * (len(s) - 1))], s[-1], skipped, final))
            else: f.write('ticks=0\n')
        os.replace('sampler20.stats.tmp', 'sampler20.stats')
    def term(*_):
        global stop; stop = True
    signal.signal(signal.SIGTERM, term); signal.signal(signal.SIGINT, term)
    labels = [l for l, _ in attrs]
    f_txq.write('# fields: ' + ' '.join(labels) + '\n')
    mono0 = time.monotonic(); real0 = time.time() - mono0
    end = time.time() + guard; n = 0
    while not stop and time.time() < end:
        deadline = mono0 + n * period
        now = time.monotonic()
        if now < deadline: time.sleep(deadline - now)
        elif now - deadline > 4 * period:      # fell behind (CPU contention): skip the missed deadlines, count them
            missed = int((now - mono0) / period) - n; skipped += max(missed, 0); n += max(missed, 0)
        t = time.monotonic() + real0; stamps.append(t)
        f_txq.write('%.6f ' % t + ' '.join('%s=%s' % (lab, rd(lab)) for lab in labels) + '\n')
        try:
            os.lseek(f_softirqs, 0, 0); raw = os.read(f_softirqs, 8192).decode()
            row = {}
            for ln in raw.splitlines():
                p = ln.split()
                if p and p[0] in ('NET_TX:', 'NET_RX:'): row[p[0][:6]] = p[1:]
            f_sirq.write('%.6f TX %s RX %s\n' % (t, ' '.join(row.get('NET_TX', [])), ' '.join(row.get('NET_RX', []))))
        except OSError: pass
        if tcbin:
            try:
                out = subprocess.run([tcbin, '-s', 'qdisc', 'show'], capture_output=True, timeout=1.0).stdout.decode(errors='replace')
                keep = []; on = False
                for ln in out.splitlines():
                    if ln.startswith('qdisc'): on = any((' dev %s ' % dv) in (ln + ' ') for dv in devs)
                    if on: keep.append(ln)
                f_tc.write('== %.6f\n' % t + '\n'.join(keep) + '\n')
            except (subprocess.SubprocessError, OSError): pass
        if n % int(hz) == 0:
            try:
                with open(f_ints) as fi: lines = [l for l in fi if ('enp' in l or 'IPI0' in l or 'IPI1' in l)]
                f_irq.write('== %.6f\n' % t + ''.join(lines))
            except OSError: pass
        n += 1
        if time.time() - last_stats > 5:
            last_stats = time.time(); write_stats()
            for f in (f_txq, f_sirq, f_irq): f.flush()
            if f_tc: f_tc.flush()
    for f in (f_txq, f_sirq, f_irq): f.flush()
    if f_tc: f_tc.flush()
    write_stats(True)
    EOP
        nohup python3 sampler20.py "$d" "$guard" "$nics" 20 > sampler20.out 2>&1 &
      else
        echo "python3 missing: bash fallback at about 16 Hz" > sampler20.missing
        ( while [ "${EPOCHREALTIME%.*}" -lt "$endsec" ]; do
            line="$EPOCHREALTIME"
            for n in $nics bond0; do
              s=/sys/class/net/$n/statistics; q=/sys/class/net/$n/queues/tx-0/byte_queue_limits
              tp=-; tb=-; rp=-; bi=-; bl=-
              { read -r tp < $s/tx_packets; read -r tb < $s/tx_bytes; read -r rp < $s/rx_packets; } 2>/dev/null
              { read -r bi < $q/inflight; read -r bl < $q/limit; } 2>/dev/null
              line="$line $n.tx_packets=$tp $n.tx_bytes=$tb $n.rx_packets=$rp $n.bql_inflight=$bi $n.bql_limit=$bl"
            done
            echo "$line" >> txq20.log
            sleep 0.05
          done ) &
      fi
    fi

    # 1 Hz: per-connection TCP state
    ( while [ "${EPOCHREALTIME%.*}" -lt "$endsec" ]; do
        ts="$EPOCHREALTIME"
        if [ "$role" = sut ]; then
          ss -tinoH state established "( sport = :$port )" 2>/dev/null | awk -v ts="$ts" -f ssc.awk >> ss.log
        else
          ss -tinoH state established "( dport = :$port )" 2>/dev/null | awk -v ts="$ts" -f ssc.loadgen.awk >> ss.loadgen.log
        fi
        sleep 1
      done ) &

    # cell snapshots. Written to a temporary file and moved into place only when complete, then a .done marker; the stop task waits for the
    # marker before it kills anything. Cheap reads first, the slow ethtool -S last, so a late kill still leaves the useful part in the .tmp.
    snap() {
      local tag=$1 out=cell.$1$sfx.txt
      {
        echo "== $EPOCHREALTIME"
        echo "== ip -s -s link"; ip -s -s link 2>&1
        echo "== /proc/net/dev"; cat /proc/net/dev
        echo "== cpuidle name usage time"; grep -H . /sys/devices/system/cpu/cpu*/cpuidle/state*/name /sys/devices/system/cpu/cpu*/cpuidle/state*/usage /sys/devices/system/cpu/cpu*/cpuidle/state*/time 2>/dev/null
        if [ "$role" = sut ]; then
          echo "== irq"; grep -E "enp|IPI0|IPI1" /proc/interrupts
          echo "== irq effective_affinity_list smp_affinity_list"
          for i in $(awk "/enp/{sub(\":\",\"\",\$1);print \$1}" /proc/interrupts); do echo "$i $(cat /proc/irq/$i/effective_affinity_list 2>&1) $(cat /proc/irq/$i/smp_affinity_list 2>&1)"; done
          echo "== tc"; for n in $nics bond0; do tc -s qdisc show dev $n 2>&1; done
          echo "== tx queue sysfs"; grep -H . /sys/class/net/*/queues/tx-*/tx_timeout /sys/class/net/*/queues/tx-*/byte_queue_limits/* 2>/dev/null
          for n in $nics bond0; do echo "=== ethtool -S $n"; ethtool -S $n 2>&1; done
        fi
        echo "== end of snapshot $tag $EPOCHREALTIME"
      } > $out.tmp 2>&1
      mv $out.tmp $out && : > cell.$tag$sfx.done
    }

    capture() {
      if ! command -v tcpdump >/dev/null 2>&1; then echo "tcpdump not installed" > tcpdump.missing$sfx; return; fi
      # one connection in four (destination port multiple of 4 on both sides), header only, 5.6 s around the middle of the window
      if [ "$role" = sut ]; then
        ( timeout -s INT 5.6 tcpdump -i $capnic -Q out -nn -s 66 -c 600000 -w - "tcp src port $port and (tcp[2:2] & 3) = 0" 2> cap.$capnic.err | gzip -1 > pcap.$capnic.out.gz ) &
      else
        dev=$(ip route get "$tip" 2>/dev/null | grep -o "dev [^ ]*" | head -1 | cut -d" " -f2)
        ( timeout -s INT 5.6 tcpdump -i "${dev:-any}" -Q in -nn -s 66 -c 900000 -w - "tcp src port $port and (tcp[2:2] & 3) = 0" 2> cap.loadgen.err | gzip -1 > pcap.loadgen.in.gz ) &
      fi
      wait
    }

    # rendezvous on the load: both hosts see the first >= 64 established connections within milliseconds
    ( dirf=sport; [ "$role" = lg ] && dirf=dport
      i=0; n=0
      while [ $i -lt 900 ]; do
        n=$(ss -tnH state established "( $dirf = :$port )" 2>/dev/null | wc -l)
        [ "$n" -ge 64 ] && break
        i=$((i + 1)); sleep 0.2
      done
      [ "$n" -ge 64 ] || exit 0
      tr=$(now_us); echo "$tr" > rendezvous$sfx.us
      start=$((tr + warm * 1000000)); mid=$((start + dur * 500000 - 2800000)); fin=$((start + dur * 1000000 - 300000))
      [ "$mid" -gt "$start" ] || mid=$start
      wait_until $start; snap start
      wait_until $mid; capture
      wait_until $fin; snap end
    ) &

    # driver and host facts, once
    {
      echo "== uname"; uname -a
      echo "== /proc/cmdline"; cat /proc/cmdline
      echo "== cpuidle driver governor"; grep -H . /sys/devices/system/cpu/cpuidle/current_driver /sys/devices/system/cpu/cpuidle/current_governor 2>&1
      echo "== sysctl"
      for k in net.ipv4.tcp_autocorking net.ipv4.tcp_limit_output_bytes net.core.busy_read net.core.busy_poll net.core.dev_weight net.core.default_qdisc net.core.rps_sock_flow_entries; do echo "$k = $(sysctl -n $k 2>&1)"; done
      if [ "$role" = sut ]; then
        for n in $nics bond0; do
          echo "=== $n"
          for o in -i -l -g --show-priv-flags; do echo "--- ethtool $o"; ethtool $o $n 2>&1; done
          echo "queues: $(ls /sys/class/net/$n/queues 2>&1 | tr "\n" " ")"
          grep -H . /sys/class/net/$n/threaded /sys/class/net/$n/gro_flush_timeout /sys/class/net/$n/napi_defer_hard_irqs /sys/class/net/$n/tx_queue_len 2>&1
        done
        drv=$(ethtool -i $(echo $nics | cut -d" " -f1) 2>/dev/null | sed -n "s/^driver: //p")
        echo "== modinfo $drv"; modinfo ${drv:-r8127} 2>&1 | head -30
        echo "== /proc/net/bonding/bond0"; cat /proc/net/bonding/bond0 2>&1
      else
        dev=$(ip route get "$tip" 2>/dev/null | grep -o "dev [^ ]*" | head -1 | cut -d" " -f2)
        echo "route dev: $dev"
        for n in $dev $(cat /sys/class/net/$dev/bonding/slaves 2>/dev/null); do
          echo "=== $n"
          for o in -i -l; do echo "--- ethtool $o"; ethtool $o $n 2>&1; done
        done
        drv=$(ethtool -i $(echo $dev $(cat /sys/class/net/$dev/bonding/slaves 2>/dev/null) | awk "{print \$NF}") 2>/dev/null | sed -n "s/^driver: //p")
        echo "== modinfo $drv"; modinfo ${drv:-bond} 2>&1 | head -30
        echo "== irq placement of NIC vectors"; grep -E "eth|enp|eno|ens|mlx|ixgbe|i40e|ice" /proc/interrupts | head -80
      fi
    } > driverfacts$sfx.txt 2>&1

    wait
    EOSTALL
    cd $d
    setsid nohup bash stallcap.sh {{ 'sut' if inventory_hostname == bench_target else 'lg' }} $d {{ bench_port | default(8080) }} {{ bench_warmup_seconds | default(5) }} {{ bench_duration_seconds | default(30) }} {{ cell_guard_seconds }} {{ hostvars[bench_target].lan_ip }} > stallcap.out 2>&1 &
    disown
    true
  args:
    executable: /bin/bash
  become: true
  changed_when: false
  failed_when: false
  when:
    - (inventory_hostname == bench_target and (cell_bound | bool)) or (inventory_hostname == "msa2-client" and (hostvars[bench_target].cell_bound | default(false) | bool))

- name: "{{ cell.1 }} run={{ cell.0 }} | run runner against bench target"
  # Flag names must match the runner CLI in cmd/runner/main.go:
  #   -target / -server-name / -runs / -duration / -warmup /
  #   -cells / -services / -out
  # The runner expands the full scenario catalogue (filtered by -cells)
  # for THIS one (run_index, competitor) cell, driving loadgen in-process
  # against the remote SUT over the 20G fabric. -runs 1 keeps run
  # repetition in ansible's outer loop so the cross-competitor x run
  # interleaving is preserved. -services none because the loadgen box has
  # no docker; driver/chain backends are wired on the SUT side. The
  # runner writes run0/<scenario>/<server>.json plus its own
  # results.json/report.md under the cell dir; mage_bench.go ingests the
  # per-scenario JSON.
  #
  # NOTE: there is intentionally no -connections flag — connection count
  # is a per-scenario property (each scenario's Workload() sets it, e.g.
  # 128 for get-json, 32 for the H2 variants, 1 for single-conn). The
  # legacy bench_connections knob applied only to the old single-scenario
  # loadgen path and no longer maps onto the runner's per-scenario model.
  #
  # The -cells server-half matches the competitor slug (the runner's
  # synthetic remote server is named via -server-name), so e.g.
  # BENCH_CELLS='get-*/*' or '*/celeris-*' both work.
  # RATED SCOPE: -rated-cells takes bench_rated_cells (the rated glob mage
  # Bench forwards, the same syntax). Only the matching cells get the rated
  # sweep. Without it the runner rates every clean cell (probatorium#418).
  # HANG GUARD: a bound-but-wedged SUT (a competitor that accepts the
  # connection but never completes responses — e.g. an event-loop server that
  # deadlocks under concurrency) makes loadgen's workers block on socket reads
  # the runner's own per-cell context timeout can't always interrupt (a
  # blocked read syscall isn't ctx-cancellable). An unguarded runner then
  # wedges the WHOLE 31-column grid on one bad adapter. `timeout` caps the
  # whole runner invocation at cell_guard_seconds — the rated-aware
  # per-column budget (budget.ColumnWallClock) + 25% slack + 300s headroom.
  # SIGNAL HYGIENE: --foreground is load-bearing. Backgrounded (default)
  # coreutils timeout signals the monitored pid DIRECTLY and then the
  # process group it shares with it — the runner receives TWO SIGTERMs per
  # expiry. The runner's handler treats a second signal as "force exit
  # now"; usually the kernel coalesces the back-to-back TERMs, but when
  # both land (v3.8, celeris-epoll-h1-sync) the runner force-exited before
  # its final results.json write and the whole column was lost.
  # --foreground sends exactly ONE signal, to the runner alone (it spawns
  # no children, so group delivery buys nothing). --kill-after=60 then
  # SIGKILLs if the graceful path wedges; 60s comfortably covers the
  # runner's interrupt path (cancel + mark remaining cells interrupted +
  # atomic results.json/manifest writes — seconds, not tens) while the old
  # 30s left no margin over a slow in-flight cell unwind. A timed-out cell
  # (exit 124) is recorded + skipped via failed_when:false below; the grid
  # continues.
  # QUOTING: ansible's free-form arg splitter counts every single/double
  # quote across the WHOLE block below — shell comments included — and
  # refuses to load the task on odd parity ("unbalanced jinja2 block or
  # quotes"). No contractions or possessives inside the scalar.
  ansible.builtin.shell: |
    cd {{ bench_root }}
    # nofile: the msa2-client soft limit is 1024 (hard 524288) and the
    # runner is NOT launched under become — raise the soft limit within
    # the hard ceiling or the 1024-stream cells (sse-fanout-1024 /
    # ws-hub-broadcast-1024, now that the fanout fix maps Connections
    # onto Workers) exhaust FDs before opening their last streams.
    ulimit -n 65535 2>/dev/null || true
    timeout --foreground --kill-after=60 {{ cell_guard_seconds }} ./runner \
      -target http://{{ target_ip }}:{{ bench_port | default(8080) }} \
      -target-arch {{ hostvars[bench_target].arch }} \
      -server-name {{ cell.1 }} \
      -runs 1 \
      -duration {{ bench_duration_seconds | default(30) }}s \
      -warmup {{ bench_warmup_seconds | default(5) }}s \
      -cells '{{ bench_cells | default("*") }}' \
      {% if bench_rated | default(false) | bool %}-rated -rated-duration {{ bench_rated_duration_seconds | default(30) }}s {% if bench_rated_cells is defined and bench_rated_cells %}-rated-cells '{{ bench_rated_cells }}' {% endif %}{% endif %}\
      -services none \
      -out {{ cell_dir }} \
      2> {{ cell_dir }}/runner.stderr
  args:
    executable: /bin/bash
  register: runner_run
  failed_when: false
  when:
    - inventory_hostname == "msa2-client"
    - hostvars[bench_target].cell_bound | default(false) | bool

- name: "{{ cell.1 }} run={{ cell.0 }} | WARN runner timed out / errored (cell skipped)"
  ansible.builtin.debug:
    msg: >-
      RUNNER {{ 'TIMED OUT' if (runner_run.rc | default(0)) == 124 else 'ERRORED (rc=' + (runner_run.rc | default(0) | string) + ')' }}
      for {{ cell.1 }} — likely a hung/broken SUT; this cell's data is partial
      or absent, grid continues.
  when:
    - inventory_hostname == "msa2-client"
    - hostvars[bench_target].cell_bound | default(false) | bool
    - (runner_run.rc | default(0)) != 0

# ---------- teardown for this cell ----------
- name: "{{ cell.1 }} run={{ cell.0 }} | stop stall captures (both hosts)"
  # The window-end snapshot is written to a temporary file and moved into place when complete, then a .done marker is
  # created. Wait for that marker (at most 45 s, only when the rendezvous happened) BEFORE anything is killed: X1 lost the end
  # snapshot of every SUT cell because this task killed the writer mid-write.
  ansible.builtin.shell: |
    d={{ cell_dir }}
    for sfx in "" ".loadgen"; do
      if [ -f $d/rendezvous$sfx.us ]; then
        i=0
        while [ ! -f $d/cell.end$sfx.done ] && [ $i -lt 90 ] && [ -f $d/stallcap$sfx.pid ] && kill -0 "$(cat $d/stallcap$sfx.pid)" 2>/dev/null; do sleep 0.5; i=$((i + 1)); done
      fi
    done
    for f in $d/stallcap.pid $d/stallcap.loadgen.pid; do
      [ -f $f ] && kill -TERM -- -"$(cat $f)" 2>/dev/null
    done
    sleep 2
    for f in $d/stallcap.pid $d/stallcap.loadgen.pid; do
      [ -f $f ] && kill -KILL -- -"$(cat $f)" 2>/dev/null
    done
    true
  args:
    executable: /bin/bash
  become: true
  changed_when: false
  failed_when: false
  when: inventory_hostname == bench_target or inventory_hostname == "msa2-client"

- name: "{{ cell.1 }} run={{ cell.0 }} | stop net-counter sampler (loadgen side)"
  ansible.builtin.shell: |
    if [ -f {{ cell_dir }}/netctr.loadgen.pid ]; then
      kill -TERM "$(cat {{ cell_dir }}/netctr.loadgen.pid)" 2>/dev/null
    fi
    true
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false
  when: inventory_hostname == "msa2-client"

- name: "{{ cell.1 }} run={{ cell.0 }} | stop mpstat sampler (loadgen side)"
  # The sampler window is sized to the hang guard so it always outlives
  # the runner; without this kill a healthy (much shorter) cell would
  # leave it sampling well into the NEXT cells. mpstat flushes each 1Hz
  # sample as it goes, so a TERM mid-run loses nothing but the trailing
  # Average block (which report.ParseMPStat skips anyway).
  ansible.builtin.shell: |
    if [ -f {{ cell_dir }}/mpstat.loadgen.pid ]; then
      kill -TERM "$(cat {{ cell_dir }}/mpstat.loadgen.pid)" 2>/dev/null
    fi
    true
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false
  when: inventory_hostname == "msa2-client"

- name: "{{ cell.1 }} run={{ cell.0 }} | stop observer (server side)"
  # Drain the observer's SQLite write buffer before killing it. The
  # pid file was written when nohup forked the sampler under root
  # (so the observer can read /proc/<pid>/fd cross-user). The kill
  # must also run under root to deliver the signal.
  become: true
  ansible.builtin.shell: |
    if [ -f {{ cell_dir }}/observer.pid ]; then
      pid=$(cat {{ cell_dir }}/observer.pid)
      kill -TERM "$pid" 2>/dev/null
      for i in $(seq 1 10); do
        kill -0 "$pid" 2>/dev/null || break
        sleep 0.5
      done
      kill -KILL "$pid" 2>/dev/null
    fi
    true
  args:
    executable: /bin/bash
  changed_when: false
  when: inventory_hostname == bench_target

- name: "{{ cell.1 }} run={{ cell.0 }} | stop kernel-counter sampler (server side, A/B)"
  ansible.builtin.shell: |
    d={{ cell_dir }}
    if [ -f $d/kcounters.pid ]; then
      kill -TERM "$(cat $d/kcounters.pid)" 2>/dev/null
    fi
    if [ -f $d/threads.pid ]; then
      kill -TERM "$(cat $d/threads.pid)" 2>/dev/null
    fi
    pid=$(cat $d/server.pid 2>/dev/null)
    if [ -n "$pid" ]; then
      for t in /proc/$pid/task/*; do
        echo "$(basename $t) $(awk "/Cpus_allowed_list/{print \$2}" $t/status 2>/dev/null) psr=$(awk "{print \$39}" $t/stat 2>/dev/null) $(cat $t/comm 2>/dev/null)"
      done > $d/sut-threads.post 2>&1
      for t in /proc/$pid/task/*; do
        echo "$(basename $t) $(cat $t/schedstat 2>/dev/null) $(cat $t/comm 2>/dev/null)"
      done > $d/sut-schedstat.post 2>&1
      { echo "== $(date +%s.%N)"; timeout 4 bash -c 'exec 3<>/dev/tcp/127.0.0.1/{{ bench_debug_port | default(18089) }}; printf "GET /debug/vars HTTP/1.0\r\nHost: debug\r\n\r\n" >&3; cat <&3' 2>&1; } > $d/debugvars.post 2>&1
    fi
    { echo "== carrier_changes"; grep -H . /sys/class/net/*/carrier_changes 2>/dev/null; } > $d/host-net.post 2>&1
    true
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false
  when: inventory_hostname == bench_target

- name: "{{ cell.1 }} run={{ cell.0 }} | stop net-counter sampler and NIC counters after (server side)"
  ansible.builtin.shell: |
    d={{ cell_dir }}
    if [ -f $d/netctr.pid ]; then
      kill -TERM "$(cat $d/netctr.pid)" 2>/dev/null
    fi
    nics="$(for n in /sys/class/net/*; do [ -e $n/device ] && basename $n; done) bond0"
    { for n in $nics; do echo "=== $n"; ethtool -S $n 2>&1; done; echo "== ip -s link"; ip -s link 2>&1; } > $d/ethtool.post 2>&1
    true
  args:
    executable: /bin/bash
  become: true
  changed_when: false
  failed_when: false
  when: inventory_hostname == bench_target

- name: "{{ cell.1 }} run={{ cell.0 }} | stop mpstat sampler (server side)"
  # Same rationale as the loadgen-side kill: the guard-sized sampler must
  # not keep writing this cell's cpu.log while the NEXT cell's server is
  # under load — readCellResources reads that log as THIS cell's CPU.
  ansible.builtin.shell: |
    if [ -f {{ cell_dir }}/mpstat.pid ]; then
      kill -TERM "$(cat {{ cell_dir }}/mpstat.pid)" 2>/dev/null
    fi
    true
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false
  when: inventory_hostname == bench_target

- name: "{{ cell.1 }} run={{ cell.0 }} | stop server"
  # Three-layer teardown — argv-pattern pkill alone is NOT enough. bun/python
  # adapters exec into a language runtime whose argv is e.g. "bun run
  # dist/server", matching neither "competitors/" nor the launcher path, and on
  # exit the runtime reparents to PID 1 and keeps holding the bench port. A
  # leaked listener makes the NEXT cell fail to bind → silently recorded as an
  # absent column → grid data loss. So we kill defensively, by three independent
  # handles, ending with a port-holder sweep that doesn't care about argv or
  # process lineage at all:
  #   1. the RESOLVED listener PID (server.pid, set via `ss -ltnp` above) and its
  #      child group — correct for bun/python where the launcher != the runtime;
  #   2. the classic "[c]ompetitors/" argv sweep — correct for the Go binaries;
  #   3. whatever STILL holds :{{ bench_port | default(8080) }} — the definitive
  #      guard, catching any orphan that reparented to init regardless of name.
  # The layer-3 sweep must kill ALL holders + their PARENTS each pass: fastapi/
  # uvicorn (and gunicorn) run a supervisor master that RESPAWNS killed workers,
  # so killing one worker per pass never converges (observed: 17 uvicorn workers
  # holding :8080 survived a one-pid sweep). Killing each holder's parent takes
  # out the respawning master; the ppid>1 guard avoids ever signalling init.
  become: true
  ansible.builtin.shell: |
    bench_port={{ bench_port | default(8080) }}
    # 1) resolved listener pid + its immediate children (runtime launchers fork)
    if [ -f {{ cell_dir }}/server.pid ]; then
      spid=$(cat {{ cell_dir }}/server.pid 2>/dev/null)
      if [ -n "$spid" ] && kill -0 "$spid" 2>/dev/null; then
        pkill -TERM -P "$spid" 2>/dev/null
        kill -TERM "$spid" 2>/dev/null
        for i in $(seq 1 10); do kill -0 "$spid" 2>/dev/null || break; sleep 0.3; done
        pkill -KILL -P "$spid" 2>/dev/null
        kill -KILL "$spid" 2>/dev/null
      fi
    fi
    # 2) classic argv sweep for the Go competitors + the python/bun supervisors
    #    (bracket-protected so this pkill cannot match the shell running it).
    pkill -TERM -f "[c]ompetitors/" 2>/dev/null
    pkill -KILL -f "[u]vicorn" 2>/dev/null
    pkill -KILL -f "[g]unicorn" 2>/dev/null
    sleep 1
    pkill -KILL -f "[c]ompetitors/" 2>/dev/null
    # 3) port-holder sweep — kill EVERY pid still bound to the bench port, repeat
    #    until free. The respawning [u]vicorn/[g]unicorn master is already handled
    #    by the name-pkill in step 2 (it matches the master AND every worker). The
    #    bracket form in comments is deliberate: ansible runs the block via sh -c,
    #    so the whole script (comments included) sits in the shell argv, and a
    #    bare process name here would be matched by its own pkill -f and SIGKILL
    #    this task (rc=-9). We also do NOT kill the parents of holders: a server
    #    started by ansible can reparent to the ansible session, so killing that
    #    parent SIGKILLs the playbook connection (rc=-9) and corrupts every
    #    subsequent column.
    for i in $(seq 1 6); do
      pids=$(ss -ltnp "sport = :${bench_port}" 2>/dev/null | tail -n +2 | grep -oE 'pid=[0-9]+' | cut -d= -f2 | sort -u)
      [ -z "$pids" ] && break
      for p in $pids; do kill -KILL "$p" 2>/dev/null; done
      sleep 0.5
    done
    true
  args:
    executable: /bin/bash
  changed_when: false
  # Teardown is best-effort: a non-zero rc here (e.g. a pkill quirk) must NEVER
  # fail the task, because a failed per-cell task drops the bench target from
  # the play and silently zeros every subsequent column. The next cell's
  # "stop any prior server" + bind-failure isolation handle any leftover.
  failed_when: false
  when: inventory_hostname == bench_target

# ---------- IRQPLACE restore (layer 1 of 4): the explicit standing CPU, verified, after the server has stopped ----------
- name: "{{ cell.1 }} run={{ cell.0 }} | IRQPLACE restore the explicit standing CPU and verify by readback (fails the run loudly)"
  become: true
  ansible.builtin.shell: >-
    bash /tmp/celeris-irqplace/irqplace.sh restore cell
    {{ nic_irq_placement.iface | string | quote }}
    {{ nic_irq_placement.vector | string | quote }}
    {{ nic_irq_placement.cpu | string | quote }}
    0
    {{ cell_dir | quote }}
  args:
    executable: /bin/bash
  register: irq_restore
  changed_when: false
  failed_when: irq_restore.rc | default(0) != 0
  when:
    - inventory_hostname == bench_target
    - irq_probe_cpu | default('') != ''

- name: "{{ cell.1 }} run={{ cell.0 }} | IRQPLACE keep the celeris plan line, the loop count and the NIC vector warning of this column (also the amd64 columns)"
  ansible.builtin.shell: |
    grep -hiE "capability-aware CPU pinning|NIC interrupt vectors are serviced|loops could not pin|listening" {{ cell_dir }}/server.log > {{ cell_dir }}/plan-line.txt 2>&1
    true
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - inventory_hostname == bench_target
    - cell_bin is match('^irq')
