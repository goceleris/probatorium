---
# Validation tier orchestration. Runs the validator binary on the
# chosen bench_target, driving a refapp it manages itself via the
# remote.Local driver (validation/remote/local.go). The validator
# handles tier-1 traffic + tier-3 replay + forensics capture
# internally; this playbook's job is binary placement + lifecycle
# bracketing + result fetch.
#
# Single-host execution: validator + refapp + validator-checker all
# run on bench_target. msa2-client doesn't host any validator state.
# The cross-host SSH driver lands in a separate playbook
# (validate-ssh.yml) once issue #54 cluster integration ships.
#
# Required extra-vars (mage Validate normally sets these):
#   bench_target              msa2-server | msr1
#   refapp                    slug of the refapp to run (default
#                             "auth_session_ratelimit")
#   validate_duration_seconds soak window, INTEGER seconds
#                             (default 600)
#   validate_property_tier    -property-tier filter (default
#                             "core,middleware")
#   validate_seed             reserved for future per-run seed knob
#   bench_port                refapp bind port (default 8080)
#   celeris_version           recorded in incident dossiers
#   results_local_dir         where to fetch outputs back to dev Mac

- name: Validation soak
  hosts: cluster
  gather_facts: true
  tasks:
    - name: Filter to selected host (bench_target only)
      ansible.builtin.meta: end_host
      when: inventory_hostname != bench_target

    - name: Ensure transient dirs
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ bench_root }}"
        - "{{ results_root }}"

    - name: Drop validate-start marker for mtime diff
      ansible.builtin.file:
        path: "{{ bench_root }}/validate-start.marker"
        state: touch
        mode: '0644'

    - name: Per-run output dir
      ansible.builtin.set_fact:
        validate_run_dir: "{{ results_root }}/{{ lookup('pipe', 'date +%Y%m%dT%H%M%S') }}-validate-{{ bench_target }}-{{ refapp | default('auth_session_ratelimit') }}"

    - name: Create per-run output dir
      ansible.builtin.file:
        path: "{{ validate_run_dir }}"
        state: directory
        mode: '0755'

    # ansible's async timeout MUST be greater than the validator's
    # natural exit window or we lose the final results fetch. mage passes
    # the soak window as INTEGER SECONDS (validate_duration_seconds) —
    # the old unit-suffix conversion mis-parsed compound Go durations
    # ("1h30m" read as 90 hours).
    - name: Compute timeout-seconds for the validate run
      ansible.builtin.set_fact:
        validate_seconds: "{{ (validate_duration_seconds | default(600) | int) + 300 }}"

    - block:
        - name: Confirm refapp binary is staged
          ansible.builtin.stat:
            path: "{{ bench_root }}/refapps/{{ refapp | default('auth_session_ratelimit') }}"
          register: refapp_stat
          failed_when: not refapp_stat.stat.exists

        # ---------- driver dbservices (start containers) ----------
        # The dbservices role in deploy.yml installs docker.io + pulls
        # the postgres/redis/memcached images but doesn't start them
        # (bench runs spawn containers per-cell). For matrix-mode
        # validate runs we need long-lived containers on fixed ports
        # so the driver_* refapps can reach their backends. Containers
        # bind to the same ports the driver refapps default to:
        #   postgres 127.0.0.1:54321 (bench/bench/bench)
        #   redis    127.0.0.1:63791
        #   memcached 127.0.0.1:21211
        # cleanup.yml stops any docker containers we leave running.
        # Same fixture-container treatment as bench.yml's dbservices block —
        # see the rationale there and in inventory.yml (bench_db_ephemeral).
        # Validation runs far shorter than a bench, but it runs NIGHTLY, so
        # its share of the NVMe write budget is not negligible.
        - name: dbservices | resolve fixture-container storage + durability flags
          ansible.builtin.set_fact:
            db_log_caps: "--log-opt max-size=10m --log-opt max-file=1"
            db_pg_store: >-
              {{ '--tmpfs /var/lib/postgresql/data:rw,size=4g -e PGDATA=/var/lib/postgresql/data/pgdata'
                 if (bench_db_ephemeral | default(true) | bool) else '' }}
            db_pg_args: >-
              {{ '-c synchronous_commit=off -c fsync=off -c full_page_writes=off'
                 if (bench_db_ephemeral | default(true) | bool) else '-c synchronous_commit=off' }}
            db_redis_store: >-
              {{ '--tmpfs /data:rw,size=1g' if (bench_db_ephemeral | default(true) | bool) else '' }}
            db_redis_args: >-
              {{ 'redis-server --save "" --appendonly no'
                 if (bench_db_ephemeral | default(true) | bool) else '' }}
          when: validate_dbservices | default('') == '1'

        - name: dbservices | start postgres
          ansible.builtin.shell: |
            docker rm -f -v probatorium-pg 2>/dev/null
            docker run -d --rm --name probatorium-pg \
              -p 127.0.0.1:54321:5432 \
              {{ db_log_caps }} {{ db_pg_store }} \
              -e POSTGRES_USER=bench -e POSTGRES_PASSWORD=bench -e POSTGRES_DB=bench \
              postgres:17-alpine {{ db_pg_args }}
          register: dbsvc_pg
          changed_when: dbsvc_pg.rc == 0
          failed_when: false
          when: validate_dbservices | default('') == '1'

        - name: dbservices | start redis
          ansible.builtin.shell: |
            docker rm -f -v probatorium-redis 2>/dev/null
            docker run -d --rm --name probatorium-redis -p 127.0.0.1:63791:6379 \
              {{ db_log_caps }} {{ db_redis_store }} \
              redis:8.2-alpine {{ db_redis_args }}
          register: dbsvc_redis
          changed_when: dbsvc_redis.rc == 0
          failed_when: false
          when: validate_dbservices | default('') == '1'

        - name: dbservices | start memcached
          ansible.builtin.shell: |
            docker rm -f -v probatorium-mc 2>/dev/null
            docker run -d --rm --name probatorium-mc -p 127.0.0.1:21211:11211 \
              {{ db_log_caps }} memcached:1.6.41-alpine
          register: dbsvc_mc
          changed_when: dbsvc_mc.rc == 0
          failed_when: false
          when: validate_dbservices | default('') == '1'

        # Postgres takes ~3-5s to finish initdb + accept connections.
        # Wait via pg_isready (in-container) so the validator's
        # driver_postgres refapp doesn't error on its first dial.
        - name: dbservices | wait for postgres ready
          ansible.builtin.shell: |
            for i in $(seq 1 30); do
              docker exec probatorium-pg pg_isready -U bench -d bench >/dev/null 2>&1 && exit 0
              sleep 1
            done
            exit 1
          register: pg_wait
          changed_when: false
          failed_when: false
          when: validate_dbservices | default('') == '1'

        - name: Run validator (drives refapp + Tier 1 + Tier 3)
          # Validator manages the refapp lifecycle internally via
          # remote.Local. The refapp binds 127.0.0.1:<port> so the
          # validator can drive it without going through the LAN
          # fabric (Tier 1's Markov walker fires HTTP requests from
          # the same host the refapp runs on; we're benchmarking
          # validation predicates, not loadgen throughput).
          #
          # become: true because the refapp / celeris validation build
          # needs `ulimit -l unlimited` for io_uring memlock. The
          # validator passes that through to its Driver child.
          become: true
          environment:
            # VALIDATE_CONCURRENCY is read by validation/runner.go at
            # orchestrator init. Propagated via the ansible task env
            # because env vars set in the mage / GH-Actions outer
            # processes don't otherwise cross the SSH boundary into
            # the remote validator. Without this, the duration-tiered
            # default (concurrency=1 for cells under 5min) leaves the
            # h2c / WS / SSE walker slices dormant on every cell.
            VALIDATE_CONCURRENCY: "{{ validate_concurrency | default('') }}"
            # Driver-refapp backend addresses. The driver_postgres /
            # driver_redis / driver_memcached refapps look up these env
            # vars (or their -postgres-dsn / -redis-addr / -mc-addr
            # flags) to connect to the docker-spawned services started
            # above. Matching the refapp defaults so a non-dbservices
            # run is a no-op.
            PROBATORIUM_PG_DSN: "postgres://bench:bench@127.0.0.1:54321/bench?sslmode=disable"
            PROBATORIUM_REDIS_ADDR: "127.0.0.1:63791"
            PROBATORIUM_MEMCACHED_ADDR: "127.0.0.1:21211"
          ansible.builtin.shell: |
            cd {{ bench_root }}
            ulimit -l unlimited
            # No core dumps: the validator drives refapps that intentionally
            # crash under soak load; unbounded cores fill /var (same disk-fill
            # class as the volume leak). Inherited by all refapp children.
            ulimit -c 0 2>/dev/null || true
            ./validator \
              -target=localhost \
              -duration={{ validate_duration_seconds | default(600) }}s \
              {% if validate_matrix | default('') == '1' %}-matrix -matrix-refapp-root={{ bench_root }}/validation/refapp -matrix-bin-dir={{ bench_root }}/refapps -markov={{ bench_root }}/markov/auth_session_ratelimit.yaml {% if validate_matrix_refapps | default('') %}-matrix-refapps={{ validate_matrix_refapps }}{% endif %} {% if validate_matrix_engines | default('') %}-matrix-engines={{ validate_matrix_engines }}{% endif %} {% if validate_refapp_workers | default('') %}-refapp-workers={{ validate_refapp_workers }}{% endif %} \
              {% else %}-celeris-bin={{ bench_root }}/refapps/{{ refapp | default('auth_session_ratelimit') }} -celeris-addr=127.0.0.1:{{ bench_port | default(8080) }} -markov={{ bench_root }}/markov/{{ refapp | default('auth_session_ratelimit') }}.yaml {% if validate_refapp_engine | default('') %}-refapp-engine={{ validate_refapp_engine }}{% endif %} {% if validate_refapp_async | default('') %}-refapp-async-handlers={{ validate_refapp_async }}{% endif %} {% if validate_refapp_workers | default('') %}-refapp-workers={{ validate_refapp_workers }}{% endif %} \
              {% endif %}
              {% if validate_dbservices | default('') == '1' %}-seed-services="postgres=postgres://bench:bench@127.0.0.1:54321/bench?sslmode=disable,redis=127.0.0.1:63791,memcached=127.0.0.1:21211" {% endif %}\
              -replay-bin={{ bench_root }}/validator-replay \
              -property-tier={{ validate_property_tier | default('core,middleware') }} \
              -celeris-commit={{ celeris_version | default('') }} \
              -out={{ validate_run_dir }} \
              {% if validate_soak_mode | default('') == '1' %}-soak-mode {% endif %}\
              {% if validate_pprof_addr | default('') %}-pprof-addr={{ validate_pprof_addr }} \{% endif %}
              > {{ validate_run_dir }}/validator.stdout \
              2> {{ validate_run_dir }}/validator.stderr
          args:
            executable: /bin/bash
          async: "{{ validate_seconds | int }}"
          poll: 30
          register: validator_result

      always:
        # Reap the fixture DB containers + their ANONYMOUS data volumes on the
        # failure path too. Previously nothing stopped them here, so every soak
        # left pg/redis/mc running and leaked their anon volumes (the 925GB
        # pile). Inside `always:`, so a SIGBUS / validator crash still reaps them.
        - name: dbservices | stop fixture containers (with anonymous volumes)
          become: true
          ansible.builtin.shell: |
            docker rm -f -v probatorium-pg probatorium-redis probatorium-mc 2>/dev/null || true
            true
          args:
            executable: /bin/bash
          changed_when: false
          when: validate_dbservices | default('') == '1'

        - name: Stop any leftover validator / refapp processes
          become: true
          ansible.builtin.shell: |
            pkill -x validator 2>/dev/null
            pkill -x validator-checker 2>/dev/null
            pkill -x validator-replay 2>/dev/null
            pkill -f "[/]refapps/" 2>/dev/null
            true
          changed_when: false

        - name: Snapshot directory contents for the postmortem
          ansible.builtin.shell: |
            ls -la {{ validate_run_dir }} > {{ validate_run_dir }}/dir.txt 2>&1
            echo "validator exit: {{ validator_result.rc | default('n/a') }}" >> {{ validate_run_dir }}/dir.txt
            true
          changed_when: false

        - name: Tar validation artefacts on remote
          ansible.builtin.shell: |
            cd {{ validate_run_dir | dirname }}
            tar czf /tmp/validate-{{ inventory_hostname }}.tgz {{ validate_run_dir | basename }}/
          args:
            executable: /bin/bash
          changed_when: true

        - name: Fetch tarball back to dev machine
          ansible.builtin.fetch:
            src: "/tmp/validate-{{ inventory_hostname }}.tgz"
            dest: "{{ results_local_dir }}/{{ inventory_hostname }}.tgz"
            flat: true
          register: fetch_result
          until: fetch_result is succeeded
          retries: 3
          delay: 5

        - name: Remove remote tarball after fetch
          ansible.builtin.file:
            path: "/tmp/validate-{{ inventory_hostname }}.tgz"
            state: absent

        # NOTE: the remote per-run dir (validate_run_dir, under results_root) is
        # reclaimed by the teardown job's cleanup.yml (purge_results). It holds
        # ROOT-owned cell subdirs — the validator launches refapps under become
        # for io_uring memlock — so it can only be removed as root; do NOT add a
        # non-root removal task here (it fails with EPERM and aborts the run).

        - name: Extract fetched tarball locally
          delegate_to: localhost
          become: false
          ansible.builtin.command:
            cmd: tar xzf {{ results_local_dir }}/{{ inventory_hostname }}.tgz -C {{ results_local_dir }}/
          changed_when: true

        - name: Drop the local tarball
          delegate_to: localhost
          become: false
          ansible.builtin.file:
            path: "{{ results_local_dir }}/{{ inventory_hostname }}.tgz"
            state: absent

        # mtime-based ~ leak check (matches bench.yml + cluster-go-gate.yml).
        # Non-fatal — we want the trace + any leak warning side-by-side.
        - name: Find paths in ~ created/modified during the run
          ansible.builtin.shell: |
            find ~ -maxdepth 4 \
              -newer {{ bench_root }}/validate-start.marker \
              -not -path "${HOME}/.bash_history*" \
              -not -path "${HOME}/.viminfo*" \
              -not -path "${HOME}/.lesshst*" \
              -not -path "${HOME}/.cache/ansible*" \
              -not -path "${HOME}/.ansible*" \
              -not -path "${HOME}/.ansible_async*" \
              -not -path "${HOME}/.ssh/known_hosts*" \
              -not -path "${HOME}/.magefile*" \
              2>/dev/null \
              || true
          register: mtime_diff
          changed_when: false

        - name: Warn if anything leaked into ~ (informational)
          ansible.builtin.debug:
            msg: |
              Pristine warning — files in ~ newer than the validate-start marker:
              {{ mtime_diff.stdout }}
          when: mtime_diff.stdout is defined and mtime_diff.stdout | trim | length > 0

        # Validator exit policy:
        #
        #   rc == 0 → clean soak (no hard-fail predicate fired).
        #   rc == 1 → a hard-fail predicate fired. The incident
        #             dossier is already in the run dir — but we
        #             want the playbook to fail loudly so CI flags
        #             the run.
        #
        # We deliberately do NOT fail the playbook on T3-DRIVE
        # incidents (infra-flake exit from a too-short ctx); those
        # show up in incidents/ as evidence but the soak as a whole
        # still passed. The validator exits 0 in that case — only
        # genuine I-* violations bubble rc=1.
        - name: Surface non-zero validator exit as a playbook failure
          ansible.builtin.fail:
            msg: |
              validator exited non-zero (rc={{ validator_result.rc | default('n/a') }}). Check
                {{ results_local_dir }}/{{ validate_run_dir | basename }}/validator.stderr
              for the cause.
          when: >
            validator_result is defined
            and validator_result.rc is defined
            and validator_result.rc != 0
