---
# Long-running validation soak. Runs the validator harness against the
# server-under-test for `validate_duration` (default 6h) on a chosen
# bench target. Two-host coordinated:
#
#   bench_target (msa2-server | msr1) — runs the celeris (or competitor)
#                                       server under test.
#   msa2-client                       — runs the validator + checker.
#
# Block/always wraps everything so the always-block fires regardless of
# how the soak terminates: validator failure, ansible timeout, ssh drop,
# kernel panic on the target. Always-block fetches logs back, kills any
# leftover validator/server processes, drops the staging dir, and runs
# the same mtime-based ~ leak check as cluster-go-gate.yml.
#
# Required extra-vars (typically `mage Validate`):
#   bench_target              single host name from [bench_targets]
#   competitor                slug of the server-under-test (default: celeris)
#   validate_duration         total soak length, e.g. "6h" / "24h" /
#                             "10d" (default: "6h")
#   validate_concurrency      validator -concurrency (default: 32)
#   validate_seed             RNG seed for reproducibility (default: 1)
#   bench_port                port the server binds (default: 8080)
#   results_local_dir         where to fetch outputs back to on the Mac

- name: Long-running validation soak
  hosts: cluster
  gather_facts: true
  tasks:
    - name: Filter to selected hosts
      ansible.builtin.meta: end_host
      when: >
        (inventory_hostname != bench_target) and
        (inventory_hostname != "msa2-client")

    - name: Ensure transient dirs
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ bench_root }}"
        - "{{ results_root }}"

    - name: Drop validate-start marker for mtime diff
      ansible.builtin.file:
        path: "{{ bench_root }}/validate-start.marker"
        state: touch
        mode: '0644'

    - name: Per-run output dir
      ansible.builtin.set_fact:
        validate_run_dir: "{{ results_root }}/{{ lookup('pipe', 'date +%Y%m%dT%H%M%S') }}-validate-{{ bench_target }}-{{ competitor | default('celeris') }}"

    - name: Create per-run output dir
      ansible.builtin.file:
        path: "{{ validate_run_dir }}"
        state: directory
        mode: '0755'

    - name: Resolve bench target LAN IP from inventory (loadgen side only)
      ansible.builtin.set_fact:
        target_ip: "{{ hostvars[bench_target].lan_ip }}"
      when: inventory_hostname == "msa2-client"

    - name: Compute timeout-seconds for the validate run
      # Convert a duration string ("6h", "30m", "10d") into seconds, plus
      # 300s slack so ansible's async deadline is always ahead of the
      # validator's natural exit. Without slack a 6h validator and a
      # 6h ansible deadline race; ansible wins ~50% of the time and we
      # lose the final results pickup.
      ansible.builtin.set_fact:
        validate_seconds: >-
          {{ ((validate_duration | default('6h') | regex_replace('[^0-9]', '') | int)
              * (
                86400 if 'd' in (validate_duration | default('6h')) else
                3600  if 'h' in (validate_duration | default('6h')) else
                60    if 'm' in (validate_duration | default('6h')) else
                1
              )) + 300 }}

    - block:
        # ---------- bench target: server-under-test ----------
        - name: Stop any prior server-under-test
          become: true
          ansible.builtin.shell: |
            pkill -f "{{ bench_root }}/competitors/" 2>/dev/null
            pkill -x server 2>/dev/null
            true
          changed_when: false
          when: inventory_hostname == bench_target

        - name: Start server-under-test in background
          become: true
          ansible.builtin.shell: |
            cd {{ bench_root }}
            ulimit -l unlimited
            nohup ./competitors/{{ competitor | default('celeris') }} \
              -bind 0.0.0.0:{{ bench_port | default(8080) }} \
              > {{ validate_run_dir }}/server.log 2>&1 &
            echo $! > {{ validate_run_dir }}/server.pid
            disown
          args:
            executable: /bin/bash
          when: inventory_hostname == bench_target

        - name: Wait for server-under-test to bind
          ansible.builtin.shell: |
            for i in $(seq 1 40); do
              ss -ltn 2>/dev/null | grep -q ':{{ bench_port | default(8080) }} ' && exit 0
              sleep 0.25
            done
            echo "server did not bind in 10s" >&2
            tail -100 {{ validate_run_dir }}/server.log >&2
            exit 1
          args:
            executable: /bin/bash
          changed_when: false
          when: inventory_hostname == bench_target

        # ---------- loadgen host: validator + checker ----------
        - name: Run validator (writes events to validator.jsonl)
          ansible.builtin.shell: |
            cd {{ bench_root }}
            ./validator \
              -url http://{{ target_ip }}:{{ bench_port | default(8080) }} \
              -duration {{ validate_duration | default('6h') }} \
              -concurrency {{ validate_concurrency | default(32) }} \
              -seed {{ validate_seed | default(1) }} \
              -out {{ validate_run_dir }}/validator.jsonl \
              > {{ validate_run_dir }}/validator.stdout \
              2> {{ validate_run_dir }}/validator.stderr
          args:
            executable: /bin/bash
          async: "{{ validate_seconds | int }}"
          poll: 30
          register: validator_result
          when: inventory_hostname == "msa2-client"

        - name: Run validator-checker offline against the captured trace
          ansible.builtin.shell: |
            cd {{ bench_root }}
            ./validator-checker \
              -in {{ validate_run_dir }}/validator.jsonl \
              -out {{ validate_run_dir }}/checker.report.json \
              > {{ validate_run_dir }}/checker.stdout \
              2> {{ validate_run_dir }}/checker.stderr
          args:
            executable: /bin/bash
          when: inventory_hostname == "msa2-client"

      always:
        - name: Stop server-under-test
          become: true
          ansible.builtin.shell: |
            pkill -TERM -f "{{ bench_root }}/competitors/" 2>/dev/null
            sleep 2
            pkill -KILL -f "{{ bench_root }}/competitors/" 2>/dev/null
            pkill -x server 2>/dev/null
            pkill -x validator 2>/dev/null
            pkill -x validator-checker 2>/dev/null
            true
          changed_when: false

        - name: Fetch validation artefacts
          ansible.builtin.synchronize:
            mode: pull
            src: "{{ validate_run_dir }}/"
            dest: "{{ results_local_dir }}/{{ inventory_hostname }}/"
            recursive: true
            rsync_opts:
              - "--prune-empty-dirs"
          register: fetch_result
          until: fetch_result is succeeded
          retries: 3
          delay: 5

        # mtime-based leak check — anything in ~ newer than the marker
        # we dropped at validate-start is something we (or a child of
        # the server) created. Same exclusions as cluster-go-gate.yml.
        - name: Find paths in ~ created/modified during the run
          ansible.builtin.shell: |
            find ~ -maxdepth 4 \
              -newer {{ bench_root }}/validate-start.marker \
              -not -path "${HOME}/.bash_history*" \
              -not -path "${HOME}/.viminfo*" \
              -not -path "${HOME}/.lesshst*" \
              -not -path "${HOME}/.cache/ansible*" \
              -not -path "${HOME}/.ansible*" \
              -not -path "${HOME}/.ansible_async*" \
              -not -path "${HOME}/.ssh/known_hosts*" \
              -not -path "${HOME}/.magefile*" \
              2>/dev/null \
              || true
          register: mtime_diff
          changed_when: false

        - name: Warn if anything leaked into ~ (validate is non-fatal — we want the trace)
          ansible.builtin.debug:
            msg: |
              Pristine warning — files in ~ newer than the validate-start marker:
              {{ mtime_diff.stdout }}
          when: mtime_diff.stdout is defined and mtime_diff.stdout | trim | length > 0
