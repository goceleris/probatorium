---
# Validation tier orchestration. Runs the validator binary on the
# chosen bench_target, driving a refapp it manages itself via the
# remote.Local driver (validation/remote/local.go). The validator
# handles tier-1 traffic + tier-3 replay + forensics capture
# internally; this playbook's job is binary placement + lifecycle
# bracketing + result fetch.
#
# Single-host execution: validator + refapp + validator-checker all
# run on bench_target. msa2-client doesn't host any validator state.
# The cross-host SSH driver lands in a separate playbook
# (validate-ssh.yml) once issue #54 cluster integration ships.
#
# Required extra-vars (mage Validate normally sets these):
#   bench_target              msa2-server | msr1
#   refapp                    slug of the refapp to run (default
#                             "auth_session_ratelimit")
#   validate_duration         soak window, e.g. "10m" / "6h"
#                             (default "10m")
#   validate_property_tier    -property-tier filter (default
#                             "core,middleware")
#   validate_seed             reserved for future per-run seed knob
#   bench_port                refapp bind port (default 8080)
#   celeris_version           recorded in incident dossiers
#   results_local_dir         where to fetch outputs back to dev Mac

- name: Validation soak
  hosts: cluster
  gather_facts: true
  tasks:
    - name: Filter to selected host (bench_target only)
      ansible.builtin.meta: end_host
      when: inventory_hostname != bench_target

    - name: Ensure transient dirs
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ bench_root }}"
        - "{{ results_root }}"

    - name: Drop validate-start marker for mtime diff
      ansible.builtin.file:
        path: "{{ bench_root }}/validate-start.marker"
        state: touch
        mode: '0644'

    - name: Per-run output dir
      ansible.builtin.set_fact:
        validate_run_dir: "{{ results_root }}/{{ lookup('pipe', 'date +%Y%m%dT%H%M%S') }}-validate-{{ bench_target }}-{{ refapp | default('auth_session_ratelimit') }}"

    - name: Create per-run output dir
      ansible.builtin.file:
        path: "{{ validate_run_dir }}"
        state: directory
        mode: '0755'

    # Convert "10m" / "6h" / "1d" → seconds + 300s slack. ansible's
    # async timeout MUST be greater than the validator's natural exit
    # window or we lose the final results fetch.
    - name: Compute timeout-seconds for the validate run
      ansible.builtin.set_fact:
        validate_seconds: >-
          {{ ((validate_duration | default('10m') | regex_replace('[^0-9]', '') | int)
              * (
                86400 if 'd' in (validate_duration | default('10m')) else
                3600  if 'h' in (validate_duration | default('10m')) else
                60    if 'm' in (validate_duration | default('10m')) else
                1
              )) + 300 }}

    - block:
        - name: Confirm refapp binary is staged
          ansible.builtin.stat:
            path: "{{ bench_root }}/refapps/{{ refapp | default('auth_session_ratelimit') }}"
          register: refapp_stat
          failed_when: not refapp_stat.stat.exists

        - name: Run validator (drives refapp + Tier 1 + Tier 3)
          # Validator manages the refapp lifecycle internally via
          # remote.Local. The refapp binds 127.0.0.1:<port> so the
          # validator can drive it without going through the LAN
          # fabric (Tier 1's Markov walker fires HTTP requests from
          # the same host the refapp runs on; we're benchmarking
          # validation predicates, not loadgen throughput).
          #
          # become: true because the refapp / celeris validation build
          # needs `ulimit -l unlimited` for io_uring memlock. The
          # validator passes that through to its Driver child.
          become: true
          ansible.builtin.shell: |
            cd {{ bench_root }}
            ulimit -l unlimited
            ./validator \
              -target=localhost \
              -duration={{ validate_duration | default('10m') }} \
              -celeris-bin={{ bench_root }}/refapps/{{ refapp | default('auth_session_ratelimit') }} \
              -celeris-addr=127.0.0.1:{{ bench_port | default(8080) }} \
              -markov={{ bench_root }}/markov/{{ refapp | default('auth_session_ratelimit') }}.yaml \
              -replay-bin={{ bench_root }}/validator-replay \
              -property-tier={{ validate_property_tier | default('core,middleware') }} \
              -celeris-commit={{ celeris_version | default('') }} \
              -out={{ validate_run_dir }} \
              {% if validate_pprof_addr | default('') %}-pprof-addr={{ validate_pprof_addr }} \{% endif %}
              > {{ validate_run_dir }}/validator.stdout \
              2> {{ validate_run_dir }}/validator.stderr
          args:
            executable: /bin/bash
          async: "{{ validate_seconds | int }}"
          poll: 30
          register: validator_result

      always:
        - name: Stop any leftover validator / refapp processes
          become: true
          ansible.builtin.shell: |
            pkill -x validator 2>/dev/null
            pkill -x validator-checker 2>/dev/null
            pkill -x validator-replay 2>/dev/null
            pkill -f "[/]refapps/" 2>/dev/null
            true
          changed_when: false

        - name: Snapshot directory contents for the postmortem
          ansible.builtin.shell: |
            ls -la {{ validate_run_dir }} > {{ validate_run_dir }}/dir.txt 2>&1
            echo "validator exit: {{ validator_result.rc | default('n/a') }}" >> {{ validate_run_dir }}/dir.txt
            true
          changed_when: false

        - name: Tar validation artefacts on remote
          ansible.builtin.shell: |
            cd {{ validate_run_dir | dirname }}
            tar czf /tmp/validate-{{ inventory_hostname }}.tgz {{ validate_run_dir | basename }}/
          args:
            executable: /bin/bash
          changed_when: true

        - name: Fetch tarball back to dev machine
          ansible.builtin.fetch:
            src: "/tmp/validate-{{ inventory_hostname }}.tgz"
            dest: "{{ results_local_dir }}/{{ inventory_hostname }}.tgz"
            flat: true
          register: fetch_result
          until: fetch_result is succeeded
          retries: 3
          delay: 5

        - name: Remove remote tarball after fetch
          ansible.builtin.file:
            path: "/tmp/validate-{{ inventory_hostname }}.tgz"
            state: absent

        - name: Extract fetched tarball locally
          delegate_to: localhost
          become: false
          ansible.builtin.command:
            cmd: tar xzf {{ results_local_dir }}/{{ inventory_hostname }}.tgz -C {{ results_local_dir }}/
          changed_when: true

        - name: Drop the local tarball
          delegate_to: localhost
          become: false
          ansible.builtin.file:
            path: "{{ results_local_dir }}/{{ inventory_hostname }}.tgz"
            state: absent

        # mtime-based ~ leak check (matches bench.yml + cluster-go-gate.yml).
        # Non-fatal — we want the trace + any leak warning side-by-side.
        - name: Find paths in ~ created/modified during the run
          ansible.builtin.shell: |
            find ~ -maxdepth 4 \
              -newer {{ bench_root }}/validate-start.marker \
              -not -path "${HOME}/.bash_history*" \
              -not -path "${HOME}/.viminfo*" \
              -not -path "${HOME}/.lesshst*" \
              -not -path "${HOME}/.cache/ansible*" \
              -not -path "${HOME}/.ansible*" \
              -not -path "${HOME}/.ansible_async*" \
              -not -path "${HOME}/.ssh/known_hosts*" \
              -not -path "${HOME}/.magefile*" \
              2>/dev/null \
              || true
          register: mtime_diff
          changed_when: false

        - name: Warn if anything leaked into ~ (informational)
          ansible.builtin.debug:
            msg: |
              Pristine warning — files in ~ newer than the validate-start marker:
              {{ mtime_diff.stdout }}
          when: mtime_diff.stdout is defined and mtime_diff.stdout | trim | length > 0

        # Validator exit policy:
        #
        #   rc == 0 → clean soak (no hard-fail predicate fired).
        #   rc == 1 → a hard-fail predicate fired. The incident
        #             dossier is already in the run dir — but we
        #             want the playbook to fail loudly so CI flags
        #             the run.
        #
        # We deliberately do NOT fail the playbook on T3-DRIVE
        # incidents (infra-flake exit from a too-short ctx); those
        # show up in incidents/ as evidence but the soak as a whole
        # still passed. The validator exits 0 in that case — only
        # genuine I-* violations bubble rc=1.
        - name: Surface non-zero validator exit as a playbook failure
          ansible.builtin.fail:
            msg: |
              validator exited non-zero (rc={{ validator_result.rc | default('n/a') }}). Check
                {{ results_local_dir }}/{{ validate_run_dir | basename }}/validator.stderr
              for the cause.
          when: >
            validator_result is defined
            and validator_result.rc is defined
            and validator_result.rc != 0
