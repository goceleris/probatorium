# probatorium actix-web adapter — wave 4a (rust-actix).
#
# Build / run / lifecycle reference (no markdown docs; everything the
# operator needs lives here or in the source).
#
#   build (cluster, ansible-driven, RUSTFLAGS="-C target-cpu=native"):
#       cargo build --profile release-fat
#
#   produced binary:
#       target/release-fat/probatorium-actix-server
#       (ansible/tasks/build_native_competitor.yml symlinks this to
#        ${bench_root}/competitors/actix so servers.StartAdapter resolves
#        it via the standard staging path.)
#
#   run (the runner invokes the symlink with):
#       probatorium-actix-server -bind 127.0.0.1:8080
#       The binary prints `ready addr=<final-bind-addr>` on stdout once
#       the listener is up; SIGTERM triggers graceful shutdown within 5s.
#
# Always-latest version policy: every dependency is expressed as a `>=`
# floor with no upper bound so `cargo update` resolves the newest
# compatible release at deploy time. Do NOT pin to exact versions — the
# whole probatorium contract is to bench whatever stable cuts the upstream
# world has at the moment the cluster runs.

[package]
name = "probatorium-actix-server"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "probatorium-actix-server"
path = "src/main.rs"

[dependencies]
# actix-web — the actix-rt / tokio HTTP framework. The "http2" feature
# pulls in the auto-h2c listener (HttpServer::listen_auto_h2c) the
# -engine h2c mode uses; "macros" provides #[actix_web::main]. We disable
# default features we don't need (compression codecs, cookies) to keep the
# static fast path lean, then re-add macros + http2 explicitly.
actix-web = { version = ">=4", default-features = false, features = ["macros", "http2"] }

[profile.release]
opt-level = 3
lto = "thin"

# release-fat is the profile the cluster uses for benching. It trades
# compile time for the tightest codegen (full LTO, single codegen unit,
# panic=abort, strip). Cargo command at deploy time:
#     cargo build --profile release-fat
# with RUSTFLAGS="-C target-cpu=native" set by the ansible role.
[profile.release-fat]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
