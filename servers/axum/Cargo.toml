# probatorium axum adapter — wave 4a (rust-tower).
#
# Build / run / lifecycle reference (no markdown docs; everything the
# operator needs lives here or in the source).
#
#   build (cluster, ansible-driven, RUSTFLAGS="-C target-cpu=native"):
#       cargo build --profile release-fat
#
#   produced binary:
#       target/release-fat/probatorium-axum-server
#       (ansible/tasks/build_native_competitor.yml symlinks this to
#        ${bench_root}/competitors/axum so servers.StartAdapter resolves
#        it via the standard staging path.)
#
#   run (the runner invokes the symlink with):
#       probatorium-axum-server -bind 127.0.0.1:8080
#       The binary prints `ready addr=<final-bind-addr>` on stdout once
#       the listener is up; SIGTERM triggers graceful shutdown within 5s.
#
# Always-latest version policy: every dependency is expressed as a `>=`
# floor with no upper bound so `cargo update` resolves the newest
# compatible release at deploy time. Do NOT pin to exact versions — the
# whole probatorium contract is to bench whatever stable cuts the
# upstream world has at the moment the cluster runs.

[package]
name = "probatorium-axum-server"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "probatorium-axum-server"
path = "src/main.rs"

[dependencies]
# axum — tower-stack HTTP framework. Pulls hyper transitively.
axum = ">=0.7"
# tokio — async runtime. multi-thread + signal + macros (#[tokio::main]).
tokio = { version = ">=1", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "sync"] }
# serde_json — only needed for one tiny ad-hoc map encoding; the
# deterministic 1k/64k payloads are emitted by hand to guarantee
# byte-identical output to the Go reference (see src/payload.rs).
serde_json = ">=1"
# tower — Service trait re-exports already pulled by axum, declared
# explicitly so the dependency graph is legible.
tower = ">=0.4"

[profile.release]
opt-level = 3
lto = "thin"

# release-fat is the profile the cluster uses for benching. It trades
# compile time for the tightest codegen (full LTO, single codegen unit,
# panic=abort, strip). Cargo command at deploy time:
#     cargo build --profile release-fat
# with RUSTFLAGS="-C target-cpu=native" set by the ansible role.
[profile.release-fat]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
