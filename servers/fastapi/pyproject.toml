# FastAPI competitor adapter for probatorium.
#
# Always-latest version policy: every dep uses a `>=` floor only — `uv lock`
# resolves at deploy time so each cluster run picks up the freshest stable
# wheel from PyPI. NEVER pin upper bounds here; the bench is intentionally
# a moving target.
#
# The blessed FastAPI fast-path:
#   * `default_response_class=ORJSONResponse` — the FastAPI README itself
#     endorses orjson for performance and stable byte-output.
#   * `uvicorn[standard]` — pulls in uvloop, httptools, watchfiles,
#     websockets in one extra so we never hand-list the C accelerators.
#   * `async def` handlers — FastAPI's recommended path; sync handlers
#     get shoved through a threadpool which would distort the cell.
#
# NO docker. The ansible role builds a venv natively under
# {{ bench_root }}/competitors/fastapi/.venv via `uv venv` + `uv pip install`.
#
# Run command (the launcher script in this directory wraps it):
#   uvicorn app.server:app --host 127.0.0.1 --port <p> \
#       --workers $(nproc) --loop uvloop --http httptools \
#       --no-access-log --log-level warning
#
# `--workers` only takes effect outside reload mode (which we never enable),
# so the launcher hard-codes a non-reload uvicorn invocation.

[project]
name = "probatorium-fastapi-adapter"
version = "0.0.0"
description = "FastAPI/uvicorn/uvloop/httptools adapter for the probatorium contract."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "orjson>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
