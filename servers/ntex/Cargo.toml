# probatorium ntex adapter — wave 4a (rust-ntex).
#
# Build / run / lifecycle reference (no markdown docs):
#
#   build (cluster, ansible-driven, RUSTFLAGS="-C target-cpu=native"):
#       cargo build --profile release-fat
#
#   produced binary:
#       target/release-fat/probatorium-ntex-server
#       (ansible/tasks/build_native_competitor.yml symlinks this to
#        ${bench_root}/competitors/ntex so servers.StartAdapter resolves
#        it via the standard staging path.)
#
#   run (the runner invokes the symlink with):
#       probatorium-ntex-server -bind 127.0.0.1:8080
#       The binary prints `ready addr=<final-bind-addr>` on stdout once
#       the listener is up; SIGTERM triggers graceful shutdown within 5s.
#
# Dependency policy: the `>=` floors below are deliberately loose; the
# COMMITTED Cargo.lock is the source of truth and builds run with
# `cargo build --locked`. Versions move only through a reviewed
# Dependabot PR, never resolved fresh at deploy time.
#
# Runtime backend: we use the default tokio backend (the
# `ntex/tokio` feature set) for wave 4a. ntex also offers `compio` and
# `neon` runtimes — and, on linux, an io_uring-flavoured backend via
# the `compio` runtime — but their feature names and API have shifted
# across recent ntex releases, so we stay on the feature set that works
# on every stable ntex >= 3 rather than chasing per-release flags. Wave 4a lands the tokio backend
# (works on every stable ntex >= 3) and the io_uring backend lands
# as a follow-up behind a separate Cargo feature once the upstream
# API stabilises. The benchmark headline for ntex on tokio is still
# competitive with axum, so the wave 4a comparison remains meaningful.

[package]
name = "probatorium-ntex-server"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "probatorium-ntex-server"
path = "src/main.rs"

[dependencies]
# ntex — minimum version 3 so we get the stable post-2.x API (async
# closures in HttpServer::new, content_type() on HttpResponseBuilder).
# The `tokio` feature pulls the tokio runtime + the http stack we need.
ntex = { version = ">=3", features = ["tokio"] }
# serde_json — reserved for wave 6 driver responses; not used by the
# deterministic 1k/64k corpus (which is hand-emitted in src/payload.rs).
serde_json = ">=1"

[profile.release]
opt-level = 3
lto = "thin"

[profile.release-fat]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
