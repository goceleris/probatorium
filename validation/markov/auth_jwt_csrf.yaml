# Transition matrix for the auth_jwt_csrf refapp.
#
# States model a JWT-protected API + CSRF-protected form workflow.
# This refapp uses bearer-token / API-key auth (no cookie session) —
# the Tier 1 walker therefore has NO `login:` directive; the JWT
# rejection path is itself the validation goal.
#
# Routes verified against validation/refapp/auth_jwt_csrf/main.go:
#   GET  /public         — anon
#   GET  /api/me         — bearer required (apiGroup)
#   GET  /api/users      — bearer required (apiGroup)
#   GET  /key/whoami     — X-API-Key required (keyGroup)
#   GET  /csrf-token     — mint
#   POST /csrf-protected — CSRF-guarded mutation

start: public

states:
  # /public — anon. The vast majority of sessions immediately attempt
  # to authenticate via /api/* (needs Bearer, which we don't have →
  # 401 expected); a small slice fetches CSRF token or hits the API-key
  # endpoint directly.
  public:
    request: GET /public
    api_me:       6.0  # 60% try authenticated probe (→ 401)
    key_whoami:   2.0  # 20% try API-key path (→ 401)
    csrf_token:   2.0  # 20% start CSRF workflow

  # /api/me — JWT-protected. Without a bearer we get 401, which is
  # the validation we want (verifying the rejection path runs cleanly).
  api_me:
    request: GET /api/me
    api_users:    5.0
    csrf_token:   3.0
    api_me:       1.0
    public:       1.0  # back to anon — terminates cleanly via reset

  # /api/users — JWT-protected listing. Same rejection path.
  api_users:
    request: GET /api/users
    api_me:       3.0
    api_users:    2.0
    csrf_token:   3.0
    public:       2.0

  # /key/whoami — API-key auth. Returns 401 without X-API-Key header.
  key_whoami:
    request: GET /key/whoami
    key_whoami:   4.0
    api_me:       2.0
    public:       4.0

  # /csrf-token — GET that mints the CSRF cookie + token. Always
  # followed by an attempt at the protected POST.
  csrf_token:
    request: GET /csrf-token
    csrf_protected: 1.0

  # /csrf-protected — POST that the CSRF token gates. Without the
  # mint-then-submit flow this 403s; with the token-cookie flow this
  # 200s — the cookiejar carries the token forward.
  csrf_protected:
    request: POST /csrf-protected
    api_me:       4.0
    api_users:    3.0
    csrf_token:   2.0
    public:       1.0
