# Transition matrix for the auth_jwt_csrf refapp.
#
# States model a JWT-protected API + CSRF-protected form workflow.
# This refapp has no cookie session, so the walker has NO `login:`
# directive; it authenticates by fetching a short-lived JWT into its
# cookie jar at /jwt-token.
#
# Routes verified against validation/refapp/auth_jwt_csrf/main.go:
#   GET  /public         — anon
#   GET  /jwt-token      — mints a 5 s JWT into the cookie jar
#   GET  /api/me         — bearer/cookie JWT required (apiGroup)
#   GET  /api/users      — bearer/cookie JWT required (apiGroup)
#   GET  /key/whoami     — X-API-Key required (keyGroup)
#   GET  /csrf-token     — mint
#   POST /csrf-protected — CSRF-guarded mutation
#
# probatorium#297: before jwt_mint existed no walker ever presented a
# VALID token, so /api/* was a pure 401 path and I-MW-JWT ("rejects
# every token past its expiry") had nothing to judge — an admission
# past expiry cannot be observed where there are no admissions. The
# token's 5 s life is shorter than a walker's stay in the /api states,
# so both sides of the boundary are exercised continuously.

start: public

states:
  # /public — anon. The vast majority of sessions immediately attempt
  # to authenticate via /api/* (needs Bearer, which we don't have →
  # 401 expected); a small slice fetches CSRF token or hits the API-key
  # endpoint directly.
  public:
    request: GET /public
    jwt_mint:     3.0  # 30% authenticate first, then probe /api/* as a valid caller
    api_me:       3.0  # 30% probe unauthenticated (→ 401)
    key_whoami:   2.0  # 20% try API-key path (→ 401)
    csrf_token:   2.0  # 20% start CSRF workflow

  # /jwt-token — mints a 5 s JWT into the cookie jar. Always followed by
  # an /api/* call, so the middleware's ACCEPT path runs; the walker then
  # loops in /api/* long past the 5 s life, so the reject-after-expiry
  # path runs too. Both are needed for I-MW-JWT to mean anything.
  jwt_mint:
    request: GET /jwt-token
    api_me:       6.0
    api_users:    4.0

  # /api/me — JWT-protected. 200 while the minted cookie is alive, 401
  # once it expires or when the walker never minted one; both paths are
  # validation targets.
  api_me:
    request: GET /api/me
    api_users:    5.0
    csrf_token:   2.0
    jwt_mint:     1.0  # re-mint mid-walk: exercises re-admission after expiry
    api_me:       1.0
    public:       1.0  # back to anon — terminates cleanly via reset

  # /api/users — JWT-protected listing. Same accept/reject split.
  api_users:
    request: GET /api/users
    api_me:       3.0
    api_users:    2.0
    csrf_token:   2.0
    jwt_mint:     1.0
    public:       2.0

  # /key/whoami — API-key auth. Returns 401 without X-API-Key header.
  key_whoami:
    request: GET /key/whoami
    key_whoami:   4.0
    api_me:       2.0
    public:       4.0

  # /csrf-token — GET that mints the CSRF cookie + token. Always
  # followed by an attempt at the protected POST.
  csrf_token:
    request: GET /csrf-token
    csrf_protected: 1.0

  # /csrf-protected — POST that the CSRF token gates. Without the
  # mint-then-submit flow this 403s; with the token-cookie flow this
  # 200s — the cookiejar carries the token forward.
  csrf_protected:
    request: POST /csrf-protected
    api_me:       4.0
    api_users:    3.0
    csrf_token:   2.0
    public:       1.0
