# Transition matrix for the auth_session_ratelimit refapp.
#
# States model a realistic user-facing app: hit /me to test session
# state, browse / mutate user records, log out, etc. The walker calls
# the configured `login:` endpoint before the chain starts (auto-
# bootstrapping the session cookie) and after any 401 mid-walk.
#
# Routes verified against validation/refapp/auth_session_ratelimit/main.go.

# Walker pre-walk login + 401-retry endpoint.
login: POST /login

start: me

states:
  # /me — session probe. Returns the authenticated user's id when the
  # walker has a valid cookie. Most arriving traffic hits this first
  # to confirm the session, then fans out to list_users or logs out.
  me:
    request: GET /me
    list_users:  7.0   # 70% start browsing
    me:          1.0   # 10% re-check session
    user_posts:  1.0   # 10% deep-link to posts
    logout:      1.0   # 10% terminate

  # /api/users — index. Self-loops moderately, drills into details
  # or creates a new row.
  list_users:
    request: GET /api/users
    user_detail: 6.0   # 60% open one record at a time
    list_users:  3.0   # 30% paginate
    create_user: 1.0   # 10% staff path

  # GET /api/users/:id — single record read. Mutate or move on.
  user_detail:
    request: GET /api/users/walker-u1
    update_user: 4.0
    list_users:  3.0
    user_detail: 1.0
    user_delete: 1.0
    logout:      1.0

  # POST /api/users — create. Refapp returns the row, natural next is
  # to read it back.
  create_user:
    request: POST /api/users
    user_detail: 7.0
    list_users:  2.0
    create_user: 1.0

  # PUT /api/users/:id — update. Read back or return to list.
  update_user:
    request: PUT /api/users/walker-u1
    user_detail: 6.0
    list_users:  3.0
    me:          1.0

  # DELETE /api/users/:id — destructive. Goes back to list.
  user_delete:
    request: DELETE /api/users/walker-u1
    list_users: 1.0

  # GET /api/users/:id/posts — auxiliary read. Returns to detail.
  user_posts:
    request: GET /api/users/walker-u1/posts
    user_detail: 6.0
    list_users:  3.0
    logout:      1.0

  # POST /logout — destroys session. Walker recovers via 401-retry
  # → walkerLogin re-fires (per `login:` directive above), then chain
  # continues from `me`.
  logout:
    request: POST /logout
