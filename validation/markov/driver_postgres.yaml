# Transition matrix for the driver_postgres refapp.
#
# States model a typical CRUD workflow against the PG-backed user
# store, plus the side-channel key/value store: probe health, create,
# read, update, occasional KV writes. Each non-terminal state declares
# the HTTP request the Tier 1 walker fires when entering it.
#
# Routes verified against validation/refapp/driver_postgres/main.go.
# No `list_users` state — the refapp doesn't expose GET /users (only
# GET /users/:id), so the chain reads a known id directly.

start: healthz

states:
  # /healthz — liveness probe.
  healthz:
    request: GET /healthz
    create_user:  6.0
    get_user:     3.0
    healthz:      1.0

  # POST /users — creation endpoint. Returns a row, naturally feeds
  # into a GET /users/:id.
  create_user:
    request: POST /users
    get_user:     7.0
    update_user:  2.0
    create_user:  1.0

  # GET /users/:id — single-row read. Mutate or store a side-channel
  # KV entry.
  get_user:
    request: GET /users/walker-u1
    update_user:  5.0
    get_user:     2.0
    create_user:  2.0
    store_kv:     1.0

  # PUT /users/:id — update endpoint. Verify the change or move on.
  update_user:
    request: PUT /users/walker-u1
    get_user:     6.0
    create_user:  2.0
    store_kv:     1.0
    done:         1.0

  # POST /store/:key — write to the KV side channel.
  store_kv:
    request: POST /store/walker-k1
    fetch_kv:     8.0
    store_kv:     1.0
    done:         1.0

  # GET /store/:key — KV read.
  fetch_kv:
    request: GET /store/walker-k1
    store_kv:     2.0
    get_user:     2.0
    done:         6.0

  # Terminal — silent.
  done: {}
