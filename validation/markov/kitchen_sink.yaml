# Transition matrix for the kitchen_sink refapp.
#
# kitchen_sink exercises a representative full middleware stack — the
# endpoints are intentionally generic so the workload is shaped by
# realistic call mixes rather than domain semantics.
#
# No auth in this refapp (basicauth gates /admin/* only, which Tier 1
# does NOT exercise). No `login:` directive.
#
# Routes verified against validation/refapp/kitchen_sink/main.go +
# the healthcheck middleware (registers /healthz and /livez):
#   GET  /healthz      — middleware-registered
#   GET  /livez        — middleware-registered
#   GET  /api/echo
#   GET  /api/short
#   POST /api/post

start: healthz

states:
  # /healthz — middleware-registered probe entry point.
  healthz:
    request: GET /healthz
    echo:         5.0  # 50% start with an echo round-trip
    short:        2.0  # 20% short-circuit endpoint (early-exit chain)
    post:         2.0  # 20% start with a body POST
    livez:        1.0  # 10% poke the other healthcheck path

  # /livez — second healthcheck path, exercises the same middleware.
  livez:
    request: GET /livez
    healthz:      4.0
    echo:         3.0
    post:         2.0
    done:         1.0

  # /api/echo — echo handler.
  echo:
    request: GET /api/echo
    echo:         4.0
    post:         3.0
    short:        2.0
    healthz:      1.0

  # /api/short — chain that short-circuits early.
  short:
    request: GET /api/short
    healthz:      4.0
    echo:         3.0
    post:         2.0
    done:         1.0

  # /api/post — body-carrying POST.
  post:
    request: POST /api/post
    echo:         5.0
    short:        2.0
    post:         2.0
    done:         1.0

  # Terminal — silent.
  done: {}
